entries:
- path: theoretical_primitives.constituents
  source_report: v2
  value: 'Arkan (four elements: fire, air, water, earth); akhlat (four humours: dam/blood hot-wet, balgham/phlegm
    cold-wet, safra/yellow bile hot-dry, sauda/black bile cold-dry); mizaj (temperament) across hot/cold
    and wet/dry axes; quwa (natural, vital, psychic faculties); arwah (pneuma/spirits); tabiat (innate
    self-regulating/healing power, equivalent to physis).'
  weak_citations:
  - source: none given in report
    type: unclear
    citation_strength: unclear
- path: theoretical_primitives.balance_logic
  source_report: v2
  value: Health is equilibrium of humours expressed as an individual's proper mizaj (unique to each person,
    organ, drug and food); therapy by contraries (cold disease treated with hot-quality drugs/regimen)
    and by supporting tabiat; hierarchy of regimen (ilaj bil-tadbir), diet (ilaj bil-ghiza), pharmacotherapy
    (ilaj bil-dawa), and last surgery (ilaj bil-yad).
  weak_citations:
  - source: none given in report
    type: unclear
    citation_strength: unclear
