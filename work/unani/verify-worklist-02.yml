- path: construct_debate.report_adjudication
  source_report: v2
  value: The report holds that the weight of specialist scholarship favours a 'reconstruction on a real
    foundation' position. The textual lineage is genuine and continuous, but the modern institutional
    form (colleges, standardized pharmacopoeias, scientized curricula incorporating anatomy and biomedicine)
    is 'substantially a late-19th/20th-century reconstruction', a point on which it says 'most serious
    historians (Attewell, Alavi, Liebeskind, Speziale) agree'. It recommends distinguishing 'the texts'
    from 'the modern system' and not accepting '1,000 years of unbroken practice exactly as today' claims
    uncritically.
  weak_citations:
  - source: none (report's own stance)
    type: unclear
    citation_strength: unclear
- path: theoretical_primitives.constituents
  source_report: v2
  value: 'Arkan (four elements: fire, air, water, earth); akhlat (four humours: dam/blood hot-wet, balgham/phlegm
    cold-wet, safra/yellow bile hot-dry, sauda/black bile cold-dry); quwa (faculties: natural, vital,
    psychic); arwah (pneuma/vital spirits); tabiat (innate self-regulating/healing power, equivalent to
    physis).'
  weak_citations:
  - source: none (uncited in report)
    type: unclear
    citation_strength: unclear
- path: theoretical_primitives.balance_logic
  source_report: v2
  value: 'Health is equilibrium of the four humours, expressed as the individual''s mizaj (temperament):
    a balance of qualities on the hot/cold and wet/dry axes, unique to each person, organ, drug and food.
    Health is the maintenance of one''s proper mizaj. Therapy works by contraries (a cold disease is treated
    with hot-quality drugs or regimen) and by supporting tabiat.'
  weak_citations:
  - source: none (uncited in report)
    type: unclear
    citation_strength: unclear
- path: theoretical_primitives.correspondence_system
  source_report: v2
  value: The qualities hot/cold and wet/dry underlie everything. Elements, humours, persons, organs, drugs
    and foods are all classified by these qualities (each humour is assigned a quality pair).
  weak_citations:
  - source: none (uncited in report)
    type: unclear
    citation_strength: unclear
- path: theoretical_primitives.etiology
  source_report: v2
  value: 'Disease is a disturbance of mizaj (su'' al-mizaj): simple (qualitative) or material (involving
    a morbid humour). Health is governed by asbab sitta daruriya, the six essential causes: air/environment;
    food and drink; movement and rest; sleep and wakefulness; retention and evacuation; psychic/emotional
    states.'
  weak_citations:
