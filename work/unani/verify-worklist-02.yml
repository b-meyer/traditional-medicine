- path: construct_debate.positions
  source_report: v2
  value:
  - scholar: Guy Attewell
    work: 'Refiguring Unani Tibb: Plural Healing in Late Colonial India'
    year: 2007
    position: Unani identity was 'reconstituted' around 1900 through biomedical concepts, nationalist/communitarian
      politics and colonial models of legitimacy; heterogeneous rather than a single 'traditional Muslim
      system'.
    evidence_base: 19th-20th c. print, institutional, legal and political archives
  - scholar: Seema Alavi
    work: 'Islam and Healing: Loss and Recovery of an Indo-Muslim Medical Tradition, 1600-1900; ''Unani
      Medicine in the Nineteenth-Century Public Sphere'' (IESHR)'
    year: 2007; 2005
    position: A 'new Unani and a new hakim' emerged in the 19th-century Urdu public sphere, with emphasis
      shifting from theory-mastery to practice.
    evidence_base: 19th c. Urdu print/public-sphere archives
  - scholar: Claudia Liebeskind
    work: '''Arguing Science: Unani Tibb, Hakims and Biomedicine in India, 1900-50'', in Ernst (ed.)'
    year: 2002
    position: Documents the biomedicine-vs-hakim contest.
    evidence_base: 20th c. archives (per report's general characterization of the reconstruction side)
  - scholar: David Hardiman (following Charles Leslie and Romila Thapar's 'syndication' concept)
    work: not named
    year: null
    position: Unani and Ayurveda were reinvented/syndicated in colonial India as a 'cogent medical system
      with a well-defined structure'.
    evidence_base: colonial-era archives (per report's general characterization)
  - scholar: Kavita Sivaramakrishnan
    work: 'Old Potions, New Bottles: Recasting Indigenous Medicine in Colonial Punjab'
    year: 2006
    position: Analogous recasting of indigenous medicine in colonial Punjab.
    evidence_base: colonial Punjab archives (per report's general characterization)
  - scholar: Neshat Quaiser
    work: not named
    year: null
    position: Listed among historians documenting colonial transformation of Unani into a public, professionalized
      system.
    evidence_base: not stated
  - scholar: Kira Schmidt Stiedenroth
    work: Unani Medicine in the Making
    year: 2020
    position: Extends the reconstruction analysis to 21st-century India.
    evidence_base: not stated
  - scholar: Unnamed critics of Iranian TPM
    work: not named
    year: null
    position: The Persian-medicine revival since 2007 is a substantially new, nationally branded construction
      layered onto medieval texts.
    evidence_base: not stated
  - scholar: 'Continuity defenders: CCRUM, Hamdard and TPM faculty members; the late Hakim Syed Zillur
      Rahman (bio-bibliographer)'
    work: not named
    year: null
    position: Genuine textual continuity; rejection of the invented-tradition framing.
    evidence_base: unbroken textual lineage (Galen -> Qanun -> Indian commentaries), continuous family/lineage
      practice (e.g. Azizi family of Lucknow), manuscript evidence
  - scholar: Fabrizio Speziale
    work: Culture persane et médecine ayurvédique en Asie du Sud (Brill); Perso-Indica project
    year: 2018
    position: 'Complicates both sides: pre-colonial dynamism (Persian-Ayurveda synthesis) undercuts the
      idea of a static ''pure'' tradition that was either simply preserved or simply invented.'
    evidence_base: pre-colonial Persian translations of Sanskrit Ayurvedic sources
