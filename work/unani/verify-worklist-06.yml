- path: safety.regulatory_actions_taken
  source_report: v2
  value:
  - 'India Department of AYUSH order F. No. K-11020/5/97-DCC, 14 October 2005: heavy-metal testing (As,
    Pb, Hg, Cd) of ASU drugs for export from 1 January 2006, labelling ''Heavy Metals within permissible
    limits'''
  - 'Permissible limits (Ayurvedic Pharmacopoeia of India Part-I Vol-VII, 2008): lead 10 ppm, arsenic
    3 ppm, mercury 1 ppm, cadmium 0.3 ppm for herbal products'
  - 'Loophole: intentionally metallic preparations assessed under separate criteria rather than against
    the 10 ppm ceiling'
  - National Pharmacovigilance Programme for ASU drugs launched 2008, lapsed, later reconstituted
  - '2023 comparison of nine pharmacopoeias: ASU pharmacopoeias sit outside mainstream harmonization'
  weak_citations:
