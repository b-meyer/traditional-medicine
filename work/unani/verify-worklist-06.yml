- path: literature_state.trial_counts
  source_report: v2
  value: 'No overall count. Cupping meta-analysis (Zhang et al. 2024): 11 trials, 921 participants. Post-COVID
    Unani review: ''only a handful of studies'' met inclusion, with samples of n=60-100. Example trials
    named: non-inferiority RCT of a Unani formulation vs PUVA for chronic plaque psoriasis (IJMR 2018);
    33-patient single-arm psoriasis trial at CRIUM Hyderabad (2018-19); rheumatoid-arthritis non-inferiority
    RCT vs celecoxib. The report describes volume as ''substantial''/''abundant''.'
  weak_citations:
  - source: Zhang, Pasapula, Wang, Edwards & Norrish, Complementary Therapies in Medicine 2024;80:103013
      (named inline; no bibliography entry)
    type: unclear
    citation_strength: unclear
