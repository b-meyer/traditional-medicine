- path: evidence_state.evidence_borrowed_from_other_traditions
  source_report: v2
  value:
  - item: 'Cupping systematic reviews: AlBedah 2011; Kim et al.; Cha et al. evidence map 2021'
    conclusion_as_reported: some low-to-moderate-quality positive signals for pain (low back pain, neck
      pain, knee osteoarthritis)
    why_borrowed: Reviews of cupping in general, not Unani hijama specifically. The report notes geographic
      clustering of cupping research in China.
  - item: Zhang, Pasapula, Wang, Edwards & Norrish, Complementary Therapies in Medicine 2024;80:103013
      (meta-analysis; 11 trials, 921 participants)
    conclusion_as_reported: '''high-quality evidence demonstrated cupping significantly improves pain
      at 2-8 weeks endpoint intervention (d=1.09, 95% CI: 0.35-1.83, p=0.004)''; no significant improvement
      at 1 month (d=0.11) or 3-6 months (d=0.39); reviewers uniformly note small trials, weak blinding
      (sham-cupping is hard) and heterogeneity'
    why_borrowed: Cupping meta-analysis not restricted to Unani practice; tradition of included trials
      not stated.
  weak_citations:
  - source: Zhang et al., Complementary Therapies in Medicine 2024 (named inline; no bibliography entry)
    type: unclear
    citation_strength: unclear
  - source: AlBedah 2011; Kim et al. (named inline; no bibliography entry)
    type: unclear
    citation_strength: unclear
- path: safety.adulteration_and_contamination
  source_report: v2
  value:
  - product: Kushtae Sadaf (National Institute of Unani Medicine, Bengaluru analysis)
    finding: lead 28.7 ppm in one marketed sample, above the WHO/India 10 ppm limit; another sample within
      limits (batch/manufacturer variability)
  - product: Unani and homeopathic samples (JPMA 1981)
    finding: 80% of 29 samples contained corticosteroids (cortisone, hydrocortisone, dexamethasone, prednisolone)
  - product: Jawarish Shahi (Discover Chemistry, 2026)
    finding: synthetic contaminants including an antibiotic prodrug; single-batch preliminary finding
  weak_citations:
