- path: evidence_state.reviews
  source_report: v2
  value:
  - modality: Unani interventions for post-COVID-19 symptom management
    best_available_review: 'Unani medicine in post-COVID-19 recovery: integrative perspectives and evidence
      mapping'
    type: systematic review / evidence mapping
    year: not stated (c. 2025)
    size: a handful of included studies; samples n=60-100
    conclusion: Evidence 'promising' but insufficient.
    certainty_rating: not reported
    methodological_limitations_noted: small samples, observational designs, 'high risk in allocation'
      bias on the Cochrane tool
  - modality: Wet cupping (al-hijama) for mental health
    best_available_review: 'Wet Cupping (al-hijama) for Mental Health: A Systematic Review'
    type: systematic review
    year: not stated
    size: not stated
    conclusion: Most trials 'of poor quality'.
    certainty_rating: not reported
    methodological_limitations_noted: poor trial quality
  - modality: Unani interventions overall (report's bottom line)
    best_available_review: report synthesis, no single review
    type: report synthesis
    year: null
    size: null
    conclusion: No Unani intervention currently rests on high-certainty, independently replicated evidence
      of clinically meaningful efficacy. Cupping for musculoskeletal pain is the 'least-weak case', and
      even there the benefit 'appears short-lived'. Most herbal formulations remain at the preliminary/hypothesis-generating
      stage.
    certainty_rating: not a reviewer rating
    methodological_limitations_noted: frequent single-arm, open-label or small non-inferiority designs;
      small samples; high/unclear risk of bias; weak blinding; heterogeneity; weak independent replication
  weak_citations:
  - source: '[S20] Wet Cupping (al-hijama) for Mental Health: A Systematic Review (catalog record, oalib-perpustakaan.upi.edu)
      — https://oalib-perpustakaan.upi.edu/Record/doaj_5547f749706d4f0cad37b2f54b38af92/Description'
