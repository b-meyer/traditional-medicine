- path: evidence_state.reviews
  source_report: v2
  value:
  - modality: Cupping / hijama for pain (low back, neck, knee osteoarthritis)
    best_available_review: Zhang, Pasapula, Wang, Edwards & Norrish, Complementary Therapies in Medicine
      2024;80:103013
    type: meta-analysis
    year: 2024
    size: 11 trials, 921 participants
    conclusion: 'Authors report ''high-quality evidence'' that cupping significantly improves pain at
      2-8 weeks (d=1.09, 95% CI 0.35-1.83, p=0.004); no significant improvement at 1 month (d=0.11) or
      3-6 months (d=0.39). Earlier reviews (AlBedah 2011; Kim et al.; Cha et al. 2021 evidence map) find
      some low-to-moderate-quality positive signals for pain. Report''s own bottom line: cupping for musculoskeletal
      pain is the least-weak case and the benefit appears short-lived.'
    certainty_rating: described by authors as high-quality evidence for the 2-8 week endpoint; low-to-moderate
      quality in earlier reviews
    methodological_limitations_noted: small trials, weak blinding (sham cupping hard), heterogeneity.
      Reviews cover cupping in general and cluster in India, Iran and China, not specifically Unani hijama.
  - modality: Wet cupping (al-hijama) for mental health
    best_available_review: 'Wet Cupping (al-hijama) for Mental Health: A Systematic Review'
    type: systematic-review
    year: null
    size: not given
    conclusion: Most trials 'of poor quality'.
    certainty_rating: not given
    methodological_limitations_noted: poor trial quality
  - modality: Unani interventions for post-COVID-19 symptom management
    best_available_review: 'Unani medicine in post-COVID-19 recovery: evidence mapping for symptom management'
    type: systematic-review
    year: null
    size: only a handful of eligible studies, n=60-100
    conclusion: Evidence described as 'promising' but insufficient.
    certainty_rating: not given; 'high risk in allocation' on Cochrane tool
    methodological_limitations_noted: small samples, observational designs, high risk of allocation bias
  - modality: Unani herbal formulations (general; psoriasis, rheumatoid arthritis)
    best_available_review: 'Individual trials only: non-inferiority RCT vs PUVA for chronic plaque psoriasis
      (IJMR 2018); 33-patient single-arm psoriasis trial (CRIUM Hyderabad 2018-19); RA non-inferiority
      RCT vs celecoxib'
    type: primary-study
    year: 2018
    size: 33 patients for the single-arm trial
    conclusion: Report says most herbal formulations remain preliminary/hypothesis-generating; no Unani
      intervention rests on high-certainty, independently replicated evidence of clinically meaningful
      efficacy.
    certainty_rating: not given
    methodological_limitations_noted: single-arm or open-label designs, small samples, high/unclear risk
      of bias, publication bias
  weak_citations:
