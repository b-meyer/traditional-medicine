  - path: modalities.items
    outcome: confirmed
    field:
      status: filled
      value:
        - name: Ilaj bil tadbeer (regimenal therapy)
          native_category: ilaj bil tadbeer
          tags: [regimenal, procedural, manual, thermal]
          description: "About 30 regimens in classical literature, including fasd (venesection), hijama (wet and dry cupping), ta'liq al-'alaq (leech therapy), ishal (purgation), qay' (emesis), idrar (diuresis), huqna (enema), ta'riq (diaphoresis), riyazat (exercise), dalk (massage), hammam (bath), natul (irrigation), inkibab (steam) and takmid (fomentation). The aim is to evacuate morbid humours and restore balance."
        - name: Ilaj bil ghiza (dietotherapy)
          native_category: ilaj bil ghiza
          tags: [dietary]
          description: "Considered the simplest and most natural approach. Diet is adjusted in quantity and quality to temperament and illness (e.g. a low-roughage, nutrient-rich diet for fever)."
        - name: Ilaj bil dawa (pharmacotherapy)
          native_category: ilaj bil dawa
          tags: [herbal, mineral-metal, animal-derived]
          description: "Over 2,000 medicines of herbal, mineral and animal origin, used singly (mufradat) or compounded (murakkabat). Graded by temperament and four degrees of potency. Includes kushta, incinerated metal powders."
        - name: Ilaj bil yad (surgery)
          native_category: ilaj bil yad
          tags: [surgical]
          description: "Historically a last resort and generally outside the hakim's routine practice. The medieval surgical heritage runs through al-Zahrawi."
      citations:
        - source: "Ansari AP, et al. 'Ilāj bi'l-Tadbīr (regimenal therapy): a core mode of Unani treatment. Journal of Complementary and Integrative Medicine 2021;18(3):449-458. doi:10.1515/jcim-2020-0048"
          type: tertiary-review
          citation_strength: direct
          claim_match: matches
        - source: "Encyclopaedia Britannica, 'Unani medicine' (https://www.britannica.com/science/Unani-medicine)"
          type: reference-work
          citation_strength: direct
          claim_match: matches
        - source: "CCRUM, Fundamentals of Unani Medicine (https://ccrum.res.in/writereaddata/UploadFile/Fundamentals%20of%20Unani%20Medicine%20637339132286554782.pdf)"
          type: institutional
          citation_strength: direct
        - source: "Encyclopaedia Britannica, 'Abu al-Qasim al-Zahrawi' (Al-Tasrif, section on surgery)"
          type: reference-work
          citation_strength: direct
      register: emic
      notes: "Ansari et al. 2021 confirms the four modes, 'nearly 30 regimens' in classical literature, the listed procedures and the evacuation/humoural-stability aim. Britannica confirms dietotherapy as the simplest and most natural course, over 2,000 medicines of herbal, mineral and animal origin, and surgery as a last resort typically beyond the hakim. CCRUM confirms temperament grading in four degrees, mufradat/murakkabat and kushta. The fever-diet example was not independently located. Pages were egress-blocked; verified from search-indexed text."
