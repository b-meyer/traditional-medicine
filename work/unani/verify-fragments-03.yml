  - path: materia_medica.pharmacological_framework
    outcome: corrected
    field:
      status: filled
      value: "Drugs are classified by temperament (mizaj/qualities), and therapy proceeds by contraries (hot-quality drugs for cold disease). Simple drugs and compound remedies are separate books of the Qanun (Book II simple drugs; Book V compound remedies). In India, the assimilation of Indian knowledge, in particular its pharmacology, was a major means of adapting Avicennian medicine to local conditions, generating 'a sensible renewal of the medical and pharmacological knowledge diffused among Indo-Muslim physicians', as Indian materia medica was incorporated."
      citations:
        - source: "Speziale F. 'INDIA xxxiii. INDO-MUSLIM PHYSICIANS', Encyclopaedia Iranica (online 2009) — https://www.iranicaonline.org/articles/india-xxxiii-indo-muslim-physicians/"
          type: reference-work
          citation_strength: direct
          claim_match: matches
        - source: "US National Library of Medicine, Islamic Medical Manuscripts catalogue, Encyclopedias (Ibn Sina, al-Qanun fi al-tibb) — https://www.nlm.nih.gov/hmd/arabic/E8.html"
          type: institutional
          citation_strength: direct
      register: historical-scholarship
      notes: "Verify pass. What changed: the quoted phrase 'the field in which the contacts with the local tradition determined the most sensible renewal' could not be found in any Speziale work reachable online, and the report cited only his academia.edu profile page. The value now carries the wording from Speziale's own Encyclopaedia Iranica entry, which makes the same substantive claim. The Iranica page returned 403, so its wording comes from search-index extracts. The Qanun's structure (Book II simple drugs, Book V compound remedies) is confirmed. The temperament and contraries principle is standard Unani doctrine, but no primary text for it was read in this pass. The indirect academia.edu profile citation is dropped."
    searches:
      - "Speziale \"the field in which the contacts with the local tradition determined the most sensible renewal\""
