  - path: disruption.loss_of_patronage
    outcome: corrected
    field:
      status: filled
      value: "The Nizams of Hyderabad (dynasty 1724-1948) were the princely state that gave the strongest support to Unani medical studies in the colonial period, building a large traditional-medicine hospital with a medical school attached (Nizamia Tibbi College); Hyderabad remains a research centre (Central Research Institute of Unani Medicine, established December 1971, now the National Research Institute of Unani Medicine for Skin Disorders). No account of loss of Mughal or princely-state patronage, and no dates."
      citations:
        - source: "Fabrizio Speziale, 'India xxxiii. Indo-Muslim Physicians', Encyclopaedia Iranica"
          type: reference-work
          citation_strength: direct
        - source: "National Research Institute of Unani Medicine for Skin Disorders (formerly CRIUM), Hyderabad, institutional website (CCRUM, Ministry of Ayush)"
          type: institutional
          citation_strength: direct
      register: historical-scholarship
      notes: "Corrected. Encyclopaedia Iranica confirms Nizam patronage and Hyderabad as the main centre of Muslim medical studies in the Deccan; the Nizamia Tibbi College name and 1926 founding were seen only on Wikipedia-type pages and are not directly confirmed. CRIUM's December 1971 founding and its 2019 renaming to NRIUMSD come from the institute's own site and a search summary. The 'no account of loss of patronage' clause describes the report's coverage, not a historical fact."
    searches:
      - "Nizamia Tibbi College Hyderabad founded Central Research Institute of Unani Medicine CRIUM established"
      - "Speziale Indo-Muslim physicians Nizams Hyderabad patronage"
