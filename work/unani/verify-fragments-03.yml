  - path: materia_medica.pharmacological_framework
    outcome: corrected
    field:
      status: filled
      value: "Drugs are classified by temperament (mizaj) and graded in four degrees of potency, with the drug's action (taseer) framed as adjustment of mizaj, not by pathophysiology or molecular mechanism. Per Speziale, assimilation of Indian knowledge, particularly its pharmacology, was stimulated mainly by practical needs such as finding local substitutes for drugs, and generated 'a sensible renewal of the medical and pharmacological knowledge' among Indo-Muslim physicians."
      citations:
        - source: "Mohd M, Sofi G, Jahan N, Baig Z. Approaches for preparation methods of Murakkab, an Unani formulation, 2018 (PMC6938876)"
          type: primary-study
          citation_strength: direct
        - source: "Fabrizio Speziale, 'India xxxiii. Indo-Muslim Physicians', Encyclopaedia Iranica"
          type: reference-work
          citation_strength: direct
      register: emic
      notes: "Corrected. The quoted phrase 'determined the most sensible renewal' was not found; the Speziale text in Encyclopaedia Iranica reads 'generating at the same time a sensible renewal of the medical and pharmacological knowledge', and gives the pharmacology point as stimulated by practical needs such as finding local substitutes of drugs. The claim that pharmacology was the field where contact 'determined the most sensible renewal' is not supported in that wording. Temperament-based classification with four degrees is supported by the Mohd et al. paper; the rejection of pathophysiological classification is an interpretive contrast, not a statement found in either source. The academia.edu profile originally cited was not accessible."
    searches:
      - "Fabrizio Speziale Indian materia medica Arabic Persian pharmacopoeias pharmacology most sensible renewal"
      - "Speziale determined the most sensible renewal pharmacology Indian"
      - "Unani drugs classified by mizaj temperament four degrees Unani Pharmacopoeia of India"
