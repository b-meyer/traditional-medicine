  - path: disruption.colonial_power
    outcome: corrected
    field:
      status: filled
      value:
        - power: Britain (British Raj)
          mode: colonial_rule
          period: 19th c. to 1947 (dates as implied by report)
          description: "Indian traditional medicines became the object of Western accusations of being unscientific, a criticism shared by part of the British-educated Indian elite. Muslim traditional physicians responded by assimilating Western knowledge in anatomy and surgery, opening madrasas of traditional medicine and using Urdu for medical literature and new journals."
      citations:
        - source: "Fabrizio Speziale, 'India xxxiii. Indo-Muslim Physicians', Encyclopaedia Iranica"
          type: reference-work
          citation_strength: direct
      register: historical-scholarship
      notes: "Corrected. Encyclopaedia Iranica supports the accusations of being unscientific, the modernizing reforms, the new madrasas and the use of Urdu and journals. It does not say that only Western medicine was recognized as legitimate or that indigenous systems were 'actively discouraged', nor does it describe print and the public sphere transforming Unani into a professionalized system; those clauses were removed as unsupported. The period field remains the report's own approximation."
    searches:
      - "Speziale Indo-Muslim physicians colonial period Urdu journals madrasa"
      - "Unani medicine British colonial rule marginalization"
