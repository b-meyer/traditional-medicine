          description: "Nearly 30 regimens in classical Unani literature, including fasd (venesection), hijama (cupping), ta'liq al-'alaq (leech therapy), ishal (purgation), qay' (emesis), idrar (diuresis), huqna (enema), ta'riq (diaphoresis), riyazat (exercise), dalk (massage), hammam (bath), natul (irrigation), inkibab (steam), takmid (fomentation). Aim is to disperse or excrete morbid matter and restore humoral balance."
        - name: Ilaj bil ghiza (dietotherapy)
          native_category: ilaj bil ghiza
          tags: [dietary]
          description: Specific diets recommended, considering both the amount and quality of food.
        - name: Ilaj bil dawa (pharmacotherapy)
          native_category: ilaj bil dawa
          tags: [herbal, animal-derived, mineral-metal]
          description: "Medicines from herbal, mineral and animal sources; a collection of over 2,000 medicines. Includes kushta (incinerated preparations), for example Kushta Sammulfar from arsenic trioxide."
        - name: Ilaj bil yad (surgery)
          native_category: ilaj bil yad
          tags: [surgical]
          description: Considered a last resort and typically beyond the expertise of a hakim.
