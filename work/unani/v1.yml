    relation_to_biomedical_anatomy:
      status: filled
      value: >-
        The report states that the humoral framework is scientifically obsolete. It was progressively
        dismantled by Vesalius's anatomy (1543), Harvey's demonstration of circulation (1628),
        microscopy and germ theory, and was largely abandoned by the 19th century, with endocrinology
        and biochemistry replacing humoral explanations. Mizaj and akhlat "have no correspondence to
        validated physiology". Within the tradition, Ibn al-Nafis (c. 1242) refuted Galen's porous
        interventricular septum. Nabz and baul are said to be "functionally analogous to (but far less
        precise than) modern vital-sign and urinalysis diagnostics".
      citations:
        - source: "AMA Journal of Ethics (unidentified item; named in report text; no bibliography entry)"
          type: unclear
          citation_strength: unclear
        - source: "Royal College of Physicians museum (named in report text; no bibliography entry)"
          type: institutional
