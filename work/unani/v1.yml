  theoretical_primitives:
    constituents:
      status: filled
      value: >-
        Seven naturals (al-umoor al-tabiya / umoor-e-tabiya): arkan (four elements: earth,
        water, air, fire); mizaj (temperament); akhlat (four humours: dam/blood,
        balgham/phlegm, safra/yellow bile, sauda/black bile, produced in digestion); aza
        (organs); arwah (vital spirits/pneuma); quwa (faculties/powers); afaal (functions).
      citations:
        - source: "Encyclopaedia Britannica, 'Unani medicine' and 'multiple scoping reviews' (named in text, no [Sn] marker)"
          type: unclear
          citation_strength: unclear
      register: emic
    balance_logic:
      status: filled
      value: >-
        Health is the balance (i'tidal) of the seven naturals, especially a person's normal
        mizaj; disease is their derangement. Tabiyat (vis medicatrix naturae) is the supreme
        agent maintaining physiological function: "the physician treats, but nature (tabiyat)
        heals"; the physician assists tabiyat. Health preservation depends on managing the
        six essential factors (asbab-e-sitta zaruriya): hawa (air), ma'kul wa mashrub (food and
        drink), harkat wa sukun-e-badani (bodily activity and rest), harkat wa sukun-e-nafsani
        (mental activity and rest), naum wa yaqza (sleep and wakefulness), ihtibas wa
        istifragh (retention and evacuation). Treatment aims to evacuate morbid humours and
        restore balance.
      citations:
        - source: "Uncited in report (sections 2 and 4)"
          type: unclear
          citation_strength: unclear
      register: emic
    correspondence_system:
      status: filled
      value: >-
        Humours possess paired qualities (hot/cold, wet/dry). Mizaj classifies individuals,
        foods and drugs into qualitative types: hot-dry/choleric, hot-wet/sanguine,
        cold-wet/phlegmatic, cold-dry/melancholic. Mizaj is described as second in importance
        only to arkan. Drugs are further graded by temperament (mizaj-e-advia) and four degrees
        of potency.
      citations:
        - source: "Scoping review in Journal of Innovations in Applied Pharmaceutical Science (named in text, no [Sn] marker)"
          type: unclear
          citation_strength: unclear
      register: emic
    etiology:
      status: partial
      value: >-
        Disease is the derangement of the naturals, particularly of the humoral balance and
        normal mizaj; a person's humoral balance determines constitution and, when deranged,
        disease.
      citations:
