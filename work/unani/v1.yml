    transmission_mode:
      status: partial
      value: >-
        Mixed. Textual transmission ran through translation from Greek into Arabic (the Graeco-Arabic
        translation movement, Hunayn ibn Ishaq's school), then through encyclopedic textbooks such as
        the Canon, and later Latin translations back into Europe. In South Asia there is hakim lineage
        transmission (for example the Sharif Manzil lineage of Delhi), and now institutional degree
        programs.
      citations:
