  modalities:
    items:
      status: filled
      value:
        - name: "Ilaj bil tadbeer (regimenal therapy)"
          native_category: "Ilaj bil tadbeer"
          tags: [procedural, manual, thermal, regimenal]
          description: "Nearly 30 regimens: fasd (venesection), hijama (cupping, wet and dry), ta'liq al-'alaq (leech therapy), ishal (purgation), qay' (emesis), idrar (diuresis), huqna (enema), ta'riq (diaphoresis), riyazat (exercise), dalk (massage), hammam (bath), natul (irrigation), inkibab (steam), takmid (fomentation). Aim is to evacuate morbid humours and restore balance."
        - name: "Ilaj bil ghiza (dietotherapy)"
          native_category: "Ilaj bil ghiza"
          tags: [dietary]
          description: "Diet adjusted in quantity and quality by temperament and illness; described as the simplest, most natural approach (Britannica cites a low-roughage nutrient-rich diet for fever)."
        - name: "Ilaj bil dawa (pharmacotherapy)"
          native_category: "Ilaj bil dawa"
          tags: [herbal, animal-derived, mineral-metal]
          description: "More than 2,000 medicines of herbal, mineral and animal origin, single (mufradat) or compound (murakkabat), graded by temperament and four degrees of potency. Includes kushta, incinerated powders of mercury (seemab), arsenic (sam al-far), mercuric chloride (sangraf) and iron."
        - name: "Ilaj bil yad (surgery)"
          native_category: "Ilaj bil yad"
          tags: [surgical]
          description: "Historically a last resort and generally outside the hakim's routine practice."
      citations:
        - {source: "Review in Journal of Complementary and Integrative Medicine (De Gruyter) on regimenal therapy (named in text)", type: tertiary-review, citation_strength: direct}
        - {source: "Encyclopaedia Britannica, Unani medicine (named in text)", type: reference-work, citation_strength: direct}
      register: emic
      notes: "Regimenal therapy is bundled under the tradition's own category, so it is kept as one item with all tags. Spiritual or mind-body practices are not described beyond mental activity/rest in the six factors."
