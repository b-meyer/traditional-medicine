  materia_medica:
    pharmacological_framework:
      status: incidental
      value: >-
        Drugs classified by temperament (mizaj-e-advia) and four degrees of potency.
        Third- and fourth-degree drugs are potentially toxic and require purification/processing
        (tadbir) before use; correctives (musleh) and substitutes (abdal) manage toxicity
        (islah-e-advia). Pharmacopoeia of "more than 2,000 medicines" of herbal, mineral and
        animal origin, single (mufradat) or compound (murakkabat).
      citations:
        - source: "Journal of Ethnopharmacology article on islah-e-advia (named in text, no [Sn] marker)"
          type: unclear
