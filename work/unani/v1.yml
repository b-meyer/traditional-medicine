  modalities:
    items:
      status: filled
      value:
        - name: "Ilaj bil tadbeer (regimenal therapy)"
          native_category: "ilaj bil tadbeer"
          tags: ["regimenal", "procedural", "manual", "thermal"]
          description: "About 30 regimens in classical literature, including fasd (venesection), hijama (wet and dry cupping), ta'liq al-'alaq (leech therapy), ishal (purgation), qay' (emesis), idrar (diuresis), huqna (enema), ta'riq (diaphoresis), riyazat (exercise), dalk (massage), hammam (bath), natul (irrigation), inkibab (steam) and takmid (fomentation). The aim is to evacuate morbid humours and restore balance."
        - name: "Ilaj bil ghiza (dietotherapy)"
          native_category: "ilaj bil ghiza"
          tags: ["dietary"]
          description: "Considered the simplest and most natural approach. Diet is adjusted in quantity and quality to temperament and illness (e.g. a low-roughage, nutrient-rich diet for fever)."
        - name: "Ilaj bil dawa (pharmacotherapy)"
