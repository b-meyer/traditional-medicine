    transmission_mode:
      status: partial
      value: >-
        Mixed. Textual transmission by translation: Greek medical works rendered into Arabic
        in Baghdad in the 8th-10th centuries under Abbasid patronage, centrally by Hunayn ibn
        Ishaq and his school; Arabic works later translated into Latin (Constantine the
        African's Liber Pantegni; Stephen of Antioch's 1127 translation of al-Majusi) and the
        Canon used as a standard textbook in European universities into the 17th century. In
        India, Mughal patronage of hakims, hospitals (dar-ul-shifa) and translation of medical
        texts; family lineage transmission is implied by Hakim Ajmal Khan's Sharif Manzil
        (Ballimaran, Delhi) lineage. Caveat per Gutas and Gutas & van Bladel (EI3, 2009): the
        "House of Wisdom" was more modestly a palace library/archive and the translation
        movement was broader than and largely independent of it.
      citations:
        - source: "Gutas D, Greek Thought, Arabic Culture (Routledge, 1998) (named in text, no [Sn] marker)"
          type: unclear
          citation_strength: unclear
        - source: "Gutas & van Bladel, 'Bayt al-ḥikma', Encyclopaedia of Islam THREE, 2009 (named in text, no [Sn] marker)"
          type: unclear
          citation_strength: unclear
        - source: "Strohmaier G, 'Ḥunayn b. Isḥāḳ', Encyclopaedia of Islam 2nd ed. (named in text, no [Sn] marker)"
          type: unclear
          citation_strength: unclear
