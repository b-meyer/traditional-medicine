  theoretical_primitives:
    constituents:
      status: filled
      value: "Seven naturals (umoor-e-tabiya): arkan (four elements: earth, water, air, fire), mizaj (temperament), akhlat (four humours: dam/blood, balgham/phlegm, safra/yellow bile, sauda/black bile), aza (organs), arwah (vital spirits/pneuma), quwa (faculties), afaal (functions). Tabiyat (medicatrix naturae) is the body's healing power."
      citations:
        - {source: "Encyclopaedia Britannica, Unani medicine (named in text; no [Sn])", type: reference-work, citation_strength: direct}
        - {source: "Scoping reviews on mizaj (named in text incl. J Innov Appl Pharm Sci)", type: tertiary-review, citation_strength: direct}
      register: emic
    balance_logic:
      status: filled
      value: "Health is balance (i'tidal) of the naturals, especially a person's normal mizaj; disease is derangement. Temperament classes: hot-dry/choleric, hot-wet/sanguine, cold-wet/phlegmatic, cold-dry/melancholic. Preventive management through the six essential factors (asbab-e-sitta zaruriya): air, food and drink, bodily activity/rest, mental activity/rest, sleep/wakefulness, retention/evacuation. Physician assists tabiyat."
      citations:
        - {source: "Encyclopaedia Britannica, Unani medicine; scoping reviews on mizaj (named in text)", type: reference-work, citation_strength: direct}
      register: emic
    correspondence_system:
      status: partial
      value: "Humours carry paired qualities (hot/cold, wet/dry); temperament classes map to humoral types; ten parameters (ajnas-e-ashara: touch, flesh/fat, hair, complexion, physique, sleep/wakefulness, functions, wastes, psychic reactions) assess temperament; drugs and foods are graded by temperament."
      citations:
        - {source: "Scoping review, J Innov Appl Pharm Sci (named in text)", type: tertiary-review, citation_strength: direct}
      register: emic
      notes: "No season, organ or colour correspondence table is given."
    etiology:
      status: partial
      value: "Disease is derangement of the naturals and humoral imbalance; the six factors govern prevention."
      citations:
        - {source: "Encyclopaedia Britannica; scoping reviews (named in text)", type: reference-work, citation_strength: direct}
      register: emic
      notes: "No specific etiological account (causes of particular diseases) is provided."
    nosology:
      status: absent
      value: null
      citations: []
      register: emic
      notes: "Report describes no Unani disease classification. Missing: Unani nosological categories (for example humoral and temperament-based classes of disease, classical disease-group scheme in the Canon)."
    relation_to_biomedical_anatomy:
      status: partial
      value: "Report states mizaj and akhlat have no correspondence to validated physiology; Vesalius (1543), Harvey (1628), microscopy and germ theory dismantled humoral theory; Ibn al-Nafis refuted Galen on the interventricular septum. Aza (organs) is one of the seven naturals. Pulse, urine and stool inspection are described as functionally analogous to but far less precise than vital signs and urinalysis."
      citations:
        - {source: "AMA Journal of Ethics; Royal College of Physicians museum (named in text)", type: institutional, citation_strength: direct}
        - {source: "West 2008 (S2)", type: tertiary-review, citation_strength: direct}
      register: biomedical-evidence
      notes: "Report presents the biomedical verdict rather than a map of where the tradition itself refuses biomedical anatomy."
    translation_programs:
      status: filled
      value: "Attempts in the Unani literature to map humours onto hormones, cytokines or autonomic tone: judged speculative analogies, not established science. Asbab-e-sitta zaruriya mapped by reviews onto lifestyle and preventive medicine for non-communicable diseases (maturity not graded by the report)."
      citations:
        - {source: "Unani literature and reviews (not identified in report)", type: unclear, citation_strength: unclear}
      register: biomedical-evidence
      notes: "Maturity: humoral-to-hormone mapping is 'speculative' in the report's words. The lifestyle mapping has no stated maturity."
