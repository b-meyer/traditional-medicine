    relation_to_biomedical_anatomy:
      status: filled
      value: >-
        The humoral model has no standing in modern biomedical physiology; mizaj/akhlat have
        no correspondence to validated physiology. The four-humour theory, shared by Unani,
        Galenic and Traditional Persian medicine, was dismantled by Vesalius's anatomy (1543),
        Harvey's demonstration of blood circulation (1628), microscopy and germ theory
        (Pasteur, Koch), and largely abandoned by the 19th century; endocrinology and
        biochemistry replaced humoral explanations. Within the tradition, Ibn al-Nafis (~1242)
        refuted Galen's porous interventricular septum and described pulmonary circulation.
        Diagnostic pulse and urine inspection are described as functionally analogous to (but
        far less precise than) vital-sign and urinalysis diagnostics.
      citations:
        - source: "AMA Journal of Ethics; Royal College of Physicians museum (named in text, no [Sn] marker)"
          type: unclear
          citation_strength: unclear
        - source: "West JB, Journal of Applied Physiology — https://journals.physiology.org/doi/full/10.1152/japplphysiol.91171.2008"
          type: tertiary-review
          citation_strength: direct
          claim_match: matches
      register: biomedical-evidence
      notes: >-
        The report gives the biomedical rejection, not where the tradition itself maps onto
        or explicitly refuses biomedical anatomy. The obsolescence argument rests on the
        European history of humoralism (see system_boundary).
    translation_programs:
      status: partial
      value:
        - program: Mapping humours onto hormones, cytokines or autonomic tone
          maturity: speculative
          basis: report's own characterization ("speculative analogies, not established science")
        - program: Mapping asbab-e-sitta zaruriya onto modern lifestyle/preventive medicine for non-communicable diseases
