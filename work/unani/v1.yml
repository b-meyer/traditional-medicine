        - source: "Strohmaier G, 'Ḥunayn b. Isḥāḳ', Encyclopaedia of Islam 2nd ed. (named in report text; no bibliography entry)"
          type: reference-work
          citation_strength: direct
      register: historical-scholarship
      notes: >-
        The report does not describe the transmission mode explicitly. It is assembled here from the
        report's history section. The report has no account of master-pupil or family transmission
        beyond the single mention of the Sharif Manzil lineage.
