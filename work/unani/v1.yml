  modalities:
    items:
      status: filled
      value:
        - name: "Ilaj bil tadbeer (regimenal therapy)"
          tag: regimenal
          description: "Nearly 30 regimens in classical literature, including fasd (venesection), hijama (wet and dry cupping), ta'liq al-'alaq (leech therapy), ishal (purgation), qay' (emesis), idrar (diuresis), huqna (enema), ta'riq (diaphoresis), riyazat (exercise), dalk (massage), hammam (bath), natul (irrigation), inkibab (steam), takmid (fomentation). Aim: evacuate morbid humours and restore balance."
        - name: "Ilaj bil ghiza (dietotherapy)"
          tag: dietary
          description: "Considered the simplest, most natural approach; diet adjusted in quantity and quality to temperament and illness (e.g., low-roughage, nutrient-rich diet for fever per Britannica)."
        - name: "Ilaj bil dawa (pharmacotherapy)"
          tag: herbal
          description: "More than 2,000 medicines of herbal, mineral and animal origin, used singly (mufradat) or compounded (murakkabat); classified by temperament and four degrees of potency."
        - name: "Kushta (incinerated metal/mineral powders)"
          tag: mineral-metal
          description: "Incinerated powders prepared from metals such as mercury (seemab), arsenic (sam al-far), mercuric chloride (sangraf) and iron; part of pharmacotherapy."
        - name: "Ilaj bil yad (surgery)"
          tag: surgical
          description: "Historically a last resort and generally outside the hakim's routine practice; medieval surgical heritage via al-Zahrawi."
      citations:
        - source: "Review, Journal of Complementary and Integrative Medicine (De Gruyter) (named in report text; no [Sn] marker)"
          type: unclear
          citation_strength: unclear
        - source: "Encyclopaedia Britannica, 'Unani medicine' (named in report text; no [Sn] marker on these spans)"
          type: unclear
          citation_strength: unclear
      register: emic
      notes: "The emic 'regimenal' category bundles practices that the codebook tag vocabulary would split (venesection/cupping/leeching procedural; dalk manual; hammam/inkibab/takmid thermal). Tagged as a single regimenal item to preserve the tradition's own four-modality scheme. Pharmacotherapy includes animal-origin drugs, which have no tag. Kushta split out as mineral-metal."
