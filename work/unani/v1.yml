          text: "Source-type note (per the user's requirement): The strongest tertiary/peer-reviewed anchors used here are the Encyclopædia Britannica entry on Unani medicine (tertiary encyclopedia); the Encyclopaedia Iranica entry on al-Majusi and Encyclopaedia of Islam entries on Hunayn ibn Ishaq and Bayt al-Hikma (peer-reviewed scholarly encyclopedias); Gutas's Greek Thought, Arabic Culture (scholarly monograph); West (2008, J. Appl. Physiol.) and Meyerhof (1935, Isis) on Ibn al-Nafis (peer-reviewed history-of-medicine articles); Iskandar in the Dictionary of Scientific Biography (scholarly reference); and multiple peer-reviewed review/systematic-review articles on mizaj, regimenal therapy, drug degrees, and efficacy. Where claims rest on non-tertiary or non-peer-reviewed sources—Indian government/AYUSH and WHO documents (primary/institutional, not peer-reviewed), news media (parliamentary statistics), practitioner websites, and predatory/low-impact journals—this has been flagged in-text."
