      notes: "The report covers theoretical foundations but gives no Unani classification of diseases. It names only single conditions (fever, smallpox/measles, vitiligo/baras). Search target: the Unani system of disease classification (categories of disease in classical texts and in the modern Unani curriculum or standard terminologies)."
    relation_to_biomedical_anatomy:
      status: filled
      value: "The report calls the humoral framework 'scientifically obsolete'. Mizaj and akhlat 'have no correspondence to validated physiology', and endocrinology and biochemistry replaced humoral explanations. Historically, Ibn al-Nafis rejected Galen's porous-septum anatomy c. 1242. Unani diagnostics are 'functionally analogous to (but far less precise than)' vital-sign and urinalysis diagnostics. The report treats the six essential factors as overlapping with mainstream preventive medicine."
      citations:
        - source: "AMA Journal of Ethics; Royal College of Physicians museum (named in report text; no bibliography entry)"
          type: unclear
          citation_strength: unclear
        - source: "S2 — West, Journal of Applied Physiology (2008) — https://journals.physiology.org/doi/full/10.1152/japplphysiol.91171.2008"
          type: tertiary-review
          citation_strength: direct
          claim_match: matches
      register: biomedical-evidence
      notes: "The report does not say where Unani itself explicitly refuses biomedical anatomy. This is the report's evaluation, not the tradition's own account."
