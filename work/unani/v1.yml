  modalities:
    items:
      status: filled
      value:
        - name: "Ilaj bil tadbeer"
          native_category: "regimenal therapy"
          tags: [regimenal, procedural, manual, thermal]
          description: >-
            Nearly 30 regimens are described in classical literature. They include fasd (venesection),
            hijama (wet and dry cupping), ta'liq al-'alaq (leech therapy), ishal (purgation), qay'
            (emesis), idrar (diuresis), huqna (enema), ta'riq (diaphoresis), riyazat (exercise), dalk
            (massage), hammam (bath), natul (irrigation), inkibab (steam) and takmid (fomentation). The
            aim is to evacuate morbid humours and restore balance.
        - name: "Ilaj bil ghiza"
          native_category: "dietotherapy"
          tags: [dietary]
          description: >-
            Considered the simplest and most natural approach. Diet is adjusted in quantity and
            quality to temperament and illness (for example a low-roughage, nutrient-rich diet in
            fever, per Britannica).
        - name: "Ilaj bil dawa"
          native_category: "pharmacotherapy"
          tags: [herbal, mineral-metal, animal-derived]
          description: >-
            More than 2,000 medicines of herbal, mineral and animal origin, used singly (mufradat) or
            in compounds (murakkabat), including kushta (incinerated metal and mineral powders). Drugs
            are graded by temperament and by four degrees of potency.
        - name: "Ilaj bil yad"
          native_category: "surgery"
          tags: [surgical]
          description: >-
            Historically a last resort and generally outside the hakim's routine practice. There is a
            rich medieval surgical heritage (al-Zahrawi).
      citations:
        - source: "Review of regimenal therapy in Journal of Complementary and Integrative Medicine (De Gruyter) (unidentified; described in report text; no bibliography entry)"
          type: tertiary-review
          citation_strength: unclear
        - source: "Encyclopaedia Britannica, 'Unani medicine' (S6) — https://britannica.com/science/Unani-medicine/Modes-of-treatment"
          type: reference-work
          citation_strength: direct
          claim_match: matches
      register: emic
      notes: >-
        The four-modality scheme is the tradition's own. Regimenal therapy is kept as one item with
        all its tags, following the codebook. Tag assignment: fasd, hijama, leeching, ishal, qay',
        huqna → procedural; dalk → manual; hammam, inkibab, takmid, ta'riq → thermal; riyazat →
        regimenal. The S6 Britannica URL is the 'Modes of treatment' page, which matches this content.
        The report attaches that marker only to the 1976 WHO claim.

  materia_medica:
    pharmacological_framework:
      status: incidental
      value: >-
        Drugs are classified by temperament (mizaj-e-advia) and by four degrees of potency. Third- and
        fourth-degree drugs are potentially toxic and need purification or processing (tadbir) before
        use. Correctives (musleh) and substitutes (abdal) manage toxicity (islah-e-advia). Drugs are
        used singly (mufradat) or compounded (murakkabat).
      citations:
        - source: "Journal of Ethnopharmacology article on islah-e-advia (unidentified; described in report text; no bibliography entry)"
          type: tertiary-review
          citation_strength: unclear
        - source: "Encyclopaedia Britannica, 'Unani medicine' (S6) — https://britannica.com/science/Unani-medicine/Modes-of-treatment"
          type: reference-work
          citation_strength: direct
      register: emic
      notes: >-
        The source prompt asked about treatment modalities, not materia medica as such. The report
        covers the framework within its pharmacotherapy section. Not a search target. The J
        Ethnopharmacol article's type is a guess from its description.
    flagship_agents:
      status: incidental
      value:
