      value:
        - "Seven naturals (umoor-e-tabiya / al-umoor al-tabiya): arkan (four elements: earth, water, air, fire); mizaj (temperament); akhlat (four humours); aza (organs); arwah (vital spirits/pneuma); quwa (faculties/powers); afaal (functions)"
        - "Four humours: dam (blood), balgham (phlegm), safra (yellow bile), sauda (black bile), produced in digestion, with paired qualities hot/cold, wet/dry"
      citations:
        - source: "Encyclopaedia Britannica, 'Unani medicine' (named in report text; no [Sn] marker on these spans)"
          type: unclear
          citation_strength: unclear
        - source: "unnamed 'multiple scoping reviews' (named generically in report text)"
          type: unclear
          citation_strength: unclear
      register: emic
      notes: null
    balance_logic:
      status: filled
      value: "Health is the balance (i'tidal) of the seven naturals, especially a person's normal mizaj; disease is their derangement. Healing is attributed to tabiyat (vis medicatrix naturae), 'the supreme agent maintaining physiological function'; 'the physician treats, but nature (tabiyat) heals'; the physician's role is to assist tabiyat. Therapy aims to evacuate morbid humours and restore balance."
      citations:
        - source: "Encyclopaedia Britannica, 'Unani medicine' (named in report text; no [Sn] marker)"
          type: unclear
          citation_strength: unclear
        - source: "none (tabiyat material uncited in report)"
          type: unclear
          citation_strength: unclear
      register: emic
      notes: null
    correspondence_system:
