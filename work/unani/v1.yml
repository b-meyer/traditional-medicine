      register: historical-scholarship
      notes: "The report never labels the mode and says nothing about oral or master-disciple teaching in hakim families beyond naming the Sharif Manzil lineage. Search target: how Unani was taught in South Asian hakim families (lineage or apprenticeship) before colonial-era colleges."
