    recommendations:
      status: filled
      value:
        - audience: general reader or patient
          text: >-
            Treat Unani as a lifestyle-and-preventive tradition with historical, not
            biomedical, validity; its dietary moderation, exercise, sleep hygiene and stress
            management are broadly consistent with preventive medicine and low-risk.
        - audience: general reader or patient
          text: >-
            Do not rely on Unani (or Ayurvedic) mineral/metal formulations (kushta/bhasma);
            buy only from regulated manufacturers, avoid internet-sourced products, tell your
            physician, especially if pregnant or with unexplained anemia or abdominal pain.
            Threshold to seek testing: unexplained anemia with basophilic stippling, or
            GI/neurological symptoms while taking such products, warrants a blood lead level.
        - audience: general reader or patient
          text: >-
            For serious, acute or infectious disease use evidence-based biomedicine; reserve
            Unani, if used at all, as an adjunct, not a replacement, after discussion with a
            qualified clinician.
        - audience: researchers and policymakers
          text: >-
            Prioritize rigorous, registered RCTs and standardized, contaminant-screened
            formulations; isolate and test specific constituents; fund pharmacovigilance and
            mandatory heavy-metal/aflatoxin/pesticide screening (ICP-MS) with enforced
            pharmacopoeial limits.
      citations:
        - source: "Report Recommendations section, items 1-4"
          type: unclear
          citation_strength: unclear
      register: biomedical-evidence
      notes: The report author's stance, not findings.
