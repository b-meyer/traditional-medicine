  theoretical_primitives:
    constituents:
      status: filled
      value: >-
        Seven naturals (umoor-e-tabiya / al-umoor al-tabiya): arkan (four elements: earth, water, air,
        fire); mizaj (temperament); akhlat (four humours: dam/blood, balgham/phlegm, safra/yellow bile,
        sauda/black bile, produced in digestion, with paired hot/cold and wet/dry qualities); aza
        (organs); arwah (vital spirits/pneuma); quwa (faculties); afaal (functions).
      citations:
        - source: "Encyclopaedia Britannica, 'Unani medicine' (S6) — https://britannica.com/science/Unani-medicine/Modes-of-treatment"
          type: reference-work
          citation_strength: direct
        - source: "'multiple scoping reviews' (unidentified; named generically in report text)"
          type: unclear
          citation_strength: unclear
      register: emic
      notes: null
    balance_logic:
      status: filled
      value: >-
        Health is the balance (i'tidal) of the seven naturals, especially a person's normal mizaj.
        Disease is their derangement. Tabiyat (the body's healing power, vis medicatrix naturae) is the
        supreme agent maintaining function, and the physician assists it ("the physician treats, but
        nature heals"). Health is preserved by managing the six essential factors (asbab-e-sitta
        zaruriya): hawa (air/environment); ma'kul wa mashrub (food and drink); harkat wa sukun-e-badani
        (bodily activity and rest); harkat wa sukun-e-nafsani (mental activity and rest); naum wa yaqza
        (sleep and wakefulness); ihtibas wa istifragh (retention and evacuation). Therapy evacuates
        morbid humours to restore balance.
      citations:
        - source: "Encyclopaedia Britannica, 'Unani medicine' (S6) — https://britannica.com/science/Unani-medicine/Modes-of-treatment"
          type: reference-work
          citation_strength: direct
        - source: "uncited in report (tabiyat, six essential factors)"
          type: unclear
          citation_strength: unclear
      register: emic
      notes: null
    correspondence_system:
      status: filled
      value: >-
        Mizaj is "second in importance only to arkan". It sorts individuals, foods and drugs into
        qualitative types: hot-dry (choleric), hot-wet (sanguine), cold-wet (phlegmatic), cold-dry
        (melancholic). Temperament is assessed through ten parameters (ajnas-e-ashara), including touch
        (malmas), flesh/fat, hair, complexion, physique, sleep and wakefulness, functions, wastes and
        psychic reactions. Drugs are graded by temperament (mizaj-e-advia) and by four degrees of
        potency.
      citations:
        - source: "Scoping review in Journal of Innovations in Applied Pharmaceutical Science (unidentified; described in report text; no bibliography entry)"
          type: tertiary-review
          citation_strength: unclear
      register: emic
      notes: "The source is described only by journal, with no author or year."
    etiology:
      status: partial
      value: >-
        Disease is derangement of the seven naturals, especially departure from a person's normal
        mizaj and humoral imbalance. Mismanagement of the six essential factors is implied as a cause,
        and morbid humours are the target of evacuative therapy.
      citations:
        - source: "Encyclopaedia Britannica, 'Unani medicine' (S6) — https://britannica.com/science/Unani-medicine/Modes-of-treatment"
          type: reference-work
          citation_strength: direct
      register: emic
      notes: >-
