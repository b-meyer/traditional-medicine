    etiology:
      status: partial
      value: "Disease is derangement of the naturals, especially of the humours and normal mizaj. Health preservation depends on six essential factors (asbab-e-sitta zaruriya): hawa (air/environment); ma'kul wa mashrub (food and drink); harkat wa sukun-e-badani (bodily activity and rest); harkat wa sukun-e-nafsani (mental activity and rest); naum wa yaqza (sleep and wakefulness); ihtibas wa istifragh (retention and evacuation)."
