  self_reported_gaps:
    inventory:
      status: filled
      value:
        - kind: source_caveat
          text: "Source-type note (per the user's requirement): The strongest tertiary/peer-reviewed anchors used here are the Encyclopædia Britannica entry on Unani medicine (tertiary encyclopedia); the Encyclopaedia Iranica entry on al-Majusi and Encyclopaedia of Islam entries on Hunayn ibn Ishaq and Bayt al-Hikma (peer-reviewed scholarly encyclopedias); Gutas's Greek Thought, Arabic Culture (scholarly monograph); West (2008, J. Appl. Physiol.) and Meyerhof (1935, Isis) on Ibn al-Nafis (peer-reviewed history-of-medicine articles); Iskandar in the Dictionary of Scientific Biography (scholarly reference); and multiple peer-reviewed review/systematic-review articles on mizaj, regimenal therapy, drug degrees, and efficacy."
        - kind: source_caveat
          text: "Where claims rest on non-tertiary or non-peer-reviewed sources—Indian government/AYUSH and WHO documents (primary/institutional, not peer-reviewed), news media (parliamentary statistics), practitioner websites, and predatory/low-impact journals—this has been flagged in-text."
        - kind: source_caveat
          text: "Practice statistics in particular derive from government/press sources (2015 parliamentary answers) and vary by year."
        - kind: source_caveat
          text: "Regulatory status and statistics are current as best available and may have changed after the cited dates."
        - kind: source_caveat
          text: "(Encyclopedia.com's \"The Medical Influence of Rhazes\" is a tertiary reference entry; peer-reviewed narrative reviews corroborate his clinical priority.)"
        - kind: contested_item
          text: "Historical \"firsts\" attributed to Islamic-era physicians (e.g., al-Zahrawi as \"father of surgery,\" al-Razi's smallpox priority) are widely repeated but sometimes hagiographic; the substantive, well-attested claims (Ibn al-Nafis on pulmonary circulation; the Canon's centuries-long influence) rest on solid scholarship."
        - kind: contested_item
          text: "Important scholarly caveat: specialist scholarship (Gutas; Gutas & van Bladel, \"Bayt al-ḥikma,\" Encyclopaedia of Islam THREE, 2009) cautions against the popular romanticized image of the \"House of Wisdom\" (Bayt al-Hikma) as a grand translation academy; the historical record supports a more modest palace library/archive, and the translation movement was broader than and largely independent of that single institution."
        - kind: contested_item
