          text: "Treat Unani as a lifestyle-and-preventive tradition with historical, not biomedical, validity. Its dietary moderation, exercise, sleep hygiene and stress management (asbab-e-sitta zaruriya) are broadly consistent with mainstream preventive medicine and low-risk."
        - audience: "general reader / patient"
          text: "Do not rely on Unani (or Ayurvedic) mineral/metal formulations (kushta/bhasma). If using any traditional product, buy only from regulated manufacturers, avoid internet-sourced products, and tell your physician, especially if pregnant or if you develop unexplained anemia or abdominal pain. Unexplained anemia with basophilic stippling, or GI/neurological symptoms while taking such products, warrants a blood lead level."
        - audience: "general reader / patient"
          text: "For serious, acute or infectious disease, use evidence-based biomedicine. Reserve Unani interventions, if used at all, as an adjunct and only after discussion with a qualified clinician."
        - audience: "researchers / policymakers"
          text: "Prioritize rigorous, registered RCTs and standardized, contaminant-screened formulations; isolate and test specific constituents (as with reserpine); fund pharmacovigilance and mandatory heavy-metal/aflatoxin/pesticide screening (ICP-MS) with enforced pharmacopoeial limits."
