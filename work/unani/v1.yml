  construct_debate:
    positions:
      status: not_requested
      value: null
      citations: []
      register: historical-scholarship
      notes: "The source prompt did not ask about the invented-tradition or continuity debate, and the report cites no scholars on whether modern Unani is a 19th–20th century construction. Not a search target."
    report_adjudication:
      status: incidental
      value: "In passing, the report treats Unani as continuous. Its heading reads 'Origins and lineage are well documented and non-controversial', and it says Europe abandoned the humoral model while 'Unani preserved and continued it'. It also mentions an Indian adaptation ('Indian hakims added local drugs, producing a distinctively Indian Unani') and an early-20th-century revival under Hakim Ajmal Khan, but does not ask whether the modern system was reconstructed."
      citations:
        - source: "Report Key Findings 1 and Details section 7 (no [Sn] marker)"
          type: unclear
          citation_strength: unclear
      register: historical-scholarship
      notes: "This is the report's own stance, stated without engaging any construction-debate literature. It is not a consensus finding. The topic was not requested, so this is not a search target."
  theoretical_primitives:
    constituents:
      status: filled
      value:
        seven_naturals: "al-umoor al-tabiya: arkan (four elements: earth, water, air, fire), mizaj (temperament), akhlat (humours), aza (organs), arwah (vital spirits/pneuma), quwa (faculties/powers), afaal (functions)"
        humours: "dam (blood), balgham (phlegm), safra (yellow bile), sauda (black bile). Produced in digestion; each has paired qualities (hot/cold, wet/dry)."
      citations:
        - source: "Encyclopaedia Britannica, 'Unani medicine' and 'multiple scoping reviews' (named in report text; no [Sn] marker)"
          type: unclear
          citation_strength: unclear
      register: emic
      notes: null
    balance_logic:
      status: filled
      value: "Health is the balance (i'tidal) of the seven naturals, above all a person's normal mizaj; disease is their derangement. Tabiyat (vis medicatrix naturae) is the body's supreme healing power ('the physician treats, but nature heals'), and the physician's job is to assist it. Treatment aims to evacuate morbid humours and restore balance."
      citations:
        - source: "Encyclopaedia Britannica, 'Unani medicine' (named in report text; no [Sn] marker)"
          type: unclear
          citation_strength: unclear
      register: emic
      notes: null
    correspondence_system:
      status: filled
      value: "Hot/cold and wet/dry qualities sort individuals, foods and drugs into four temperament types: hot-dry/choleric, hot-wet/sanguine, cold-wet/phlegmatic, cold-dry/melancholic. Temperament is assessed on ten parameters (ajnas-e-ashara): touch (malmas), flesh/fat, hair, complexion, physique, sleep/wakefulness, functions, wastes, psychic reactions. Drugs are graded by temperament (mizaj-e-advia) and by four degrees of potency."
      citations:
        - source: "Scoping review on mizaj, Journal of Innovations in Applied Pharmaceutical Science (named in report text without author or year; no bibliography entry)"
          type: unclear
          citation_strength: unclear
      register: emic
      notes: "The report calls this journal a peer-reviewed venue. Its caveats also flag 'predatory/low-impact journals' generally but do not say which ones."
    etiology:
      status: filled
      value: "Disease arises when the naturals, especially the humours and mizaj, are deranged. Health is kept by managing the six essential factors (asbab-e-sitta zaruriya): hawa (air/environment), ma'kul wa mashrub (food and drink), harkat wa sukun-e-badani (bodily activity and rest), harkat wa sukun-e-nafsani (mental activity and rest), naum wa yaqza (sleep and wakefulness), ihtibas wa istifragh (retention and evacuation)."
      citations:
        - source: "Report Details section 2 (no [Sn] marker)"
          type: unclear
          citation_strength: unclear
      register: emic
      notes: null
