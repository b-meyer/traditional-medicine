    relation_to_biomedical_anatomy:
      status: partial
      value:
        - "The four-humour theory was progressively dismantled by Vesalius's anatomy (1543), Harvey's circulation (1628), microscopy and germ theory (Pasteur, Koch), and largely abandoned by the 19th century; modern endocrinology and biochemistry replaced humoral explanations; 'mizaj/akhlat have no correspondence to validated physiology'."
        - "Historical point of anatomical revision within the tradition: Ibn al-Nafis (~1242) stated the interventricular septum is not porous and blood passes from right to left ventricle via the lungs, refuting Galen."
        - "Diagnostic pulse and uroscopy described as functionally analogous to (but far less precise than) vital-sign and urinalysis diagnostics."
      citations:
        - source: "AMA Journal of Ethics; Royal College of Physicians museum (named generically in report text; no [Sn] marker)"
          type: unclear
          citation_strength: unclear
        - source: "S2 — West JB, 'Ibn al-Nafis, the pulmonary circulation, and the Islamic Golden Age', Journal of Applied Physiology (2008) — https://journals.physiology.org/doi/full/10.1152/japplphysiol.91171.2008"
          type: tertiary-review
          citation_strength: direct
      register: biomedical-evidence
      notes: "The report states the biomedical verdict; it does not say where the Unani tradition itself maps onto biomedical anatomy or where it explicitly refuses such mapping. Missing: the tradition's own stance on reconciling aza/arwah/quwa with biomedical anatomy and physiology. The 'far less precise' comparison is uncited."
