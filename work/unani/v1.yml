  diagnostics:
    methods:
      status: filled
      value:
        - name: nabz (pulse)
          examines: >-
            Pulse under multiple parameters (rate, rhythm, force, volume), with enumerated
            influencing factors (age, sex, temperament, season, food, sleep, exercise, emotion,
            pregnancy); described by Ibn Sina, al-Razi, al-Tabari.
        - name: baul (urine inspection / uroscopy)
          examines: urine; prominent in Avicenna's Canon
        - name: baraz (stool inspection)
          examines: stool
        - name: history and physical examination
          examines: general clinical findings
        - name: ajnas-e-ashara (ten categories)
          examines: >-
            Temperament assessment via touch (malmas), flesh/fat, hair, complexion, physique,
            sleep/wakefulness, functions, wastes, psychic reactions.
      citations:
        - source: "Diagnosis | Unani & Ayurvedic Pharmacy (hakeemchichi.in) — http://www.hakeemchichi.in/diagnosis.html"
          type: practitioner-site
          citation_strength: indirect
