  theoretical_primitives:
    constituents:
      status: filled
      value: "Seven naturals (umoor-e-tabiya): arkan (four elements: earth, water, air, fire), mizaj (temperament), akhlat (four humours: dam/blood, balgham/phlegm, safra/yellow bile, sauda/black bile), aza (organs), arwah (vital spirits/pneuma), quwa (faculties), afaal (functions). Humours carry paired qualities (hot/cold, wet/dry). Tabiyat (medicatrix naturae) is the body's own healing power. Mizaj types: hot-dry/choleric, hot-wet/sanguine, cold-wet/phlegmatic, cold-dry/melancholic."
      citations:
        - {source: "Encyclopaedia Britannica, Unani medicine entry", type: reference-work, citation_strength: direct}
        - {source: "Scoping review, Journal of Innovations in Applied Pharmaceutical Science (unnamed in report)", type: tertiary-review, citation_strength: direct}
      register: emic
      notes: "The report says mizaj is 'second in importance only to arkan'."
    balance_logic:
      status: filled
      value: "Health is the balance (i'tidal) of the seven naturals, especially a person's normal mizaj; disease is their derangement. Prevention through six essential factors (asbab-e-sitta zaruriya): air/environment, food and drink, bodily activity and rest, mental activity and rest, sleep and wakefulness, retention and evacuation. Treatment aims to evacuate morbid humours and restore balance; the physician assists tabiyat."
      citations:
        - {source: "Encyclopaedia Britannica, Unani medicine entry", type: reference-work, citation_strength: direct}
      register: emic
      notes: null
    correspondence_system:
      status: filled
      value: not_applicable
      citations: []
      register: emic
      notes: "The report describes no wider cosmological or seasonal scheme beyond the element-quality-humour pairings, which are in constituents. Season appears only as a factor influencing the pulse. The report does not say explicitly that none exists."
    etiology:
      status: partial
      value: "Disease arises from derangement of the balance of the seven naturals and of mizaj; the six essential factors are the modifiable determinants; factors influencing the pulse include age, sex, temperament, season, food, sleep, exercise, emotion, pregnancy."
      citations:
        - {source: "Encyclopaedia Britannica, Unani medicine entry", type: reference-work, citation_strength: direct}
      register: emic
      notes: "No account of specific causal agents (for example humoral excess or external causes) beyond derangement of balance."
    nosology:
      status: absent
      value: null
      citations: []
      register: emic
      notes: "Missing: how Unani classifies diseases (for example categories of humoral disorder or temperament disorder) and the disease taxonomy of the Canon or Kamil al-Sina'a. Suggested query, 'Unani nosology classification of diseases amraz humoral mizaj disorders review'."
    relation_to_biomedical_anatomy:
      status: filled
      value: "Report states the humoral model has no correspondence to validated physiology and was dismantled by Vesalius (1543), Harvey (1628), microscopy and germ theory. Where Unani anatomy diverged: Ibn al-Nafis refuted Galen on the porous septum. Modern endocrinology and biochemistry replaced humoral explanations."
      citations:
        - {source: "AMA Journal of Ethics and Royal College of Physicians museum, as named in report", type: tertiary-review, citation_strength: direct}
        - {source: "West 2008 [S2]", type: tertiary-review, citation_strength: direct}
      register: biomedical-evidence
      notes: "Report describes Galenic anatomy as dominating for over a millennium; no discussion of where Unani anatomy today maps onto biomedical structures."
    translation_programs:
      status: partial
      value:
        - {attempt: "Mapping humours onto hormones, cytokines or autonomic tone", maturity: speculative, description: "Report calls these 'speculative analogies, not established science'."}
        - {attempt: "Mapping the six essential factors onto lifestyle and preventive medicine for non-communicable diseases", maturity: preliminary, description: "Report says reviews 'increasingly map' these; maturity label is the extractor's reading of 'increasingly', not stated."}
