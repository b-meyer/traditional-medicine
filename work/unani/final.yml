        The Biological Diversity (Amendment) Act 2023 (No. 10 of 2023) is reported to extend this exemption
        to registered AYUSH practitioners, and to exempt codified traditional knowledge and cultivated
        medicinal plants, subject to a certificate of origin from the Biodiversity Management Committee.'
