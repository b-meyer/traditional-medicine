    conservation_and_sourcing:
      status: partial
      value: Unani's own substitution doctrine (abdal al-adwiya) is presented in recent Unani scholarship
        as a response to scarcity. Perveen et al. (2019) state that 'Unani drugs are substituted when
        they are endangered, costly, rare, banned or the procurement cumbersome', and validate selected
        substitutes phytochemically. They give no species-level conservation data. In Pakistan, Sher et
        al. (2014, Swat District) report that hakims mostly collected medicinal and aromatic plants themselves
        or through collectors, and that 'wild collection is almost the only source of medicinal plant
        raw material in the country, with virtually no cultivation'. They also note that major domestic
        manufacturers (Hamdard, Qarshi, Ajmal and others) produce 300-400 products, and that most of the
        high-value species studied 'are now classified as endangered', with local extirpation expected
        if unsustainable collection continues.
      citations:
      - source: Perveen S, Wadud A, Ahmed Makbul SA, Sofi G, Perveen A, 'Unani concept of drug substitution
          (therapeutic interchange) and its validation on scientific parameters', Journal of Ayurveda
          and Integrative Medicine 11(3) (2020, online 2019) 301-307, doi 10.1016/j.jaim.2017.11.006
        type: primary-study
        citation_strength: direct
        claim_match: matches
      - source: 'Sher H, Aldosari A, Ali A, de Boer HJ, ''Economic benefits of high value medicinal plants
          to Pakistani communities: an analysis of current practice and potential'', Journal of Ethnobiology
          and Ethnomedicine (2014), PMC4199063'
        type: primary-study
        citation_strength: direct
        claim_match: matches
      register: historical-scholarship
      notes: Mixed register. Perveen et al. is emic Unani scholarship, and Sher et al. is ethnobotanical
        field research. Sher et al.'s endangered-species statement applies to the Swat study species,
        not to a list of Unani drugs, and the source does not label the named manufacturers as Unani.
        No Unani-specific study of CITES-listed materia medica was found. Musk (Moschus) is reported as
        used in Unani and its Himalayan populations are on CITES Appendix I, but that link was seen only
        on commercial and encyclopedia pages and is not entered. Ved & Goraya (NMPB/FRLHT 2007-08), the
        national raw-drug demand survey (960 traded species, about 319,500 MT demand in 2005-06), does
        not disaggregate by Unani.
      source_report: gap
      gap_outcome: found
      replaced_from: v2
