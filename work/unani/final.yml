    abolition_attempts:
      status: partial
      value: No formal proposal, vote or bill to ban or abolish Unani/hakim practice in British India
        or in post-independence India or Pakistan was located. What was found is exclusion from biomedical
        registration. Provincial medical registration acts set up councils to keep registers of "duly
        qualified medical practitioners", and hakims and vaids were left off them. These were the Bombay
        Medical Registration Act 1912, the Madras and Bengal acts of 1914 and the Punjab Medical Registration
        Act 1916. Nationalist leaders opposed the official refusal to include vaids and hakims. Hakim
        Ajmal Khan's All India Vedic and Unani Tibbi Conference (1910) campaigned against these acts.
        Hardiman (2009) reports that registered doctors who collaborated with indigenous practitioners
        were threatened with deregistration, citing two well-known cases from Madras and Bombay in 1915-16.
        The Indian Medical Degrees Act 1916 (Act VII of 1916) defines "western medical science" as the
        western methods of allopathic medicine, obstetrics and surgery and expressly excludes the Unani
        system. Unani therefore falls outside that Act's purview.
      citations:
      - source: The Indian Medical Degrees Act, 1916 (Act No. VII of 1916), India Code, indiacode.nic.in/bitstream/123456789/6822/1/the-indian-medical-degrees-act-1916-.pdf
        type: statute
