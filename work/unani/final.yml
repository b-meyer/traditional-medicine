    abolition_attempts:
      status: partial
      value: No formal proposal, vote or statute to ban or abolish hakim practice was located in a primary
        or scholarly source. The nearest formal instruments are the provincial medical registration acts
        of British India, passed in all provinces between 1912 and 1919 (the Madras Medical Registration
        Act 1914 is named). These 'excluded traditional medicine providers' from the medical register.
        According to Sriram et al., they excluded traditional practitioners from registers but did not
        explicitly prohibit practice, creating an official versus unofficial distinction. Representatives
        of traditional providers objected at the time that such regulation 'may be justified in countries,
        where only one system of medicine is pursued, not in India'. Sriram et al. describe the result
        as a 'regulatory bifurcation of medicine in India, which never truly reconciled'.
      citations:
      - source: 'Sriram V, Keshri VR, Kumbhar K, ''The impact of colonial-era policies on health workforce
          regulation in India: lessons for contemporary reform'', Human Resources for Health 19:100 (2021),
          doi 10.1186/s12960-021-00640-w'
        type: primary-study
        citation_strength: direct
        claim_match: matches
      register: regulatory
      notes: Registration acts are exclusion from privileges, not abolition. Practitioner and news sites
        claim that in 1910 the British government, or Viceroy Hardinge, intended to 'ban' indigenous systems,
        that the All India Ayurvedic and Unani Tibbi Conference (Ajmal Khan, 1910) opposed it, and that
        the 'ban was lifted in 1916'. No statute, bill or government record was found for this, and it
        should be treated as unverified. The individual provincial acts (Bombay Medical Act 1912; Bengal
        Medical Act 1914) were named only in search summaries and their texts were not read. No post-independence
        abolition proposal was found for India or Pakistan.
      source_report: gap
      gap_outcome: found
      replaced_from: v2
    practitioner_response:
      status: filled
      value: 'Hakim Ajmal Khan (birth year given as 1868 in most sources, 1863 by the Indian National
        Congress; d. 29 December 1927) led reform: Ayurvedic and Unani Tibbia College, Karol Bagh, Delhi
        (foundation stone laid 29 March 1916 by Viceroy Lord Hardinge; inaugurated 13 February 1921 by
        Gandhi); Hindustani Dawakhana; the Central College. He proposed absorbing Western anatomy, surgery
        and biomedical concepts. He was elected President of the Indian National Congress at the 1921
        Ahmedabad session, in place of the imprisoned C. R. Das, and was a Khilafat and Non-cooperation
