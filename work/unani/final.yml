      status: partial
      value: 'Alavi (2008) dates a reorientation of unani away from aristocratic patronage to the early
        colonial transition: by the 1830s, Company efforts and the expansion of the printing press had
        created competing medical authorities, shifting health discourse ''from individual aristocratic
        virtue to societal well-being'' and repositioning healers as public servants rather than personal
        physicians. No source located gives a dated collapse of Mughal, Awadh, Deccan or Hyderabad court
        patronage of hakims specifically.'
      citations:
      - source: 'Seema Alavi, ''Medical Culture in Transition: Mughal Gentleman Physician and the Native
          Doctor in Early Colonial India'', Modern Asian Studies 42(5) (2008) 853-897, doi 10.1017/S0026749X07002958
          (abstract)'
        type: primary-study
        citation_strength: direct
        claim_match: matches
