      source_report: v2
    transmission_mode:
      status: filled
      value: 'mixed: textual (translation movement, manuscripts, commentaries, later print) plus family/lineage-based
        practice (e.g. the Azizi family of Lucknow); colonial-era shift from family/lineage-based elite
        practice to public, print-mediated, institutional transmission.'
      citations:
      - source: 'Seema Alavi, Islam and Healing: Loss and Recovery of an Indo-Muslim Medical Tradition,
          1600-1900 (Ranikhet: Permanent Black, 2007; Basingstoke: Palgrave Macmillan, 2008)'
        type: historical-monograph
        citation_strength: direct
      register: historical-scholarship
      notes: Alavi's monograph draws on the private family papers of the Azizi family of Lucknow hakims,
        founders of the Takmil al-Tibb school (1902). It traces the colonial-era move of Unani from family-based
        elite practice to a public tradition carried by print, newspapers, textbooks and institutions.
        The textual strand (translation movement, manuscripts, commentaries) is supported by the canon
        sources cited under foundational_texts and external_dating_anchors. 'Mixed' is the codebook category
        applied to these strands. The check drew on the book's documented sources and argument as described
        in scholarly reviews, not on a reading of the full text.
      source_report: verify
      verify_outcome: confirmed
      replaced_from: v2
    redaction_history:
      status: partial
      value: Qanun manuscript transmission is 'genuinely unsettled'. Earliest extant manuscripts are fragmentary
        or late. There is no complete modern critical edition of the Arabic text, and only a 2018 critical
        edition of part of Book I. The Canon was repeatedly selected, criticised and changed by copyists,
        commentators, translators, teachers, printers and readers.
      citations:
      - source: '[S1] Canon of Medicine | Historia Medica — https://historiamedica.org/sources/canon-of-medicine/'
        type: reference-work
        citation_strength: direct
        claim_match: matches
      register: historical-scholarship
      notes: Covered for the Qanun only. No redaction history for al-Hawi, Kamil al-sina'a or the Indo-Persian
        Unani texts.
      source_report: v2
