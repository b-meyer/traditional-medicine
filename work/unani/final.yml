        annexation of Awadh 1856, integration of Hyderabad 1948) are dynastic dates, but no source read
        ties them to the loss of patronage for hakims, so they are not entered. Alavi's book (Islam and
        Healing, Palgrave 2008) is reported in secondary descriptions to argue that Mughal-era unani was
