        Per Speziale, assimilation of Indian knowledge, particularly its pharmacology, was stimulated
        mainly by practical needs such as finding local substitutes for drugs, and generated 'a sensible
        renewal of the medical and pharmacological knowledge' among Indo-Muslim physicians.
