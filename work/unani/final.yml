  disruption:
    loss_of_patronage:
      status: partial
      value: No dated, hakim-specific account of the decline of Mughal, Awadh, Deccan or Hyderabad court
        patronage was located. The principal monograph instead contests the premise. Seema Alavi (Islam
        and Healing, 2007) argues that during the Mughal period Unani medicine was "neither derived from
        the imperial court nor dependent on state support and patronage". Her evidence comes from medical
        treatises, the Oudh Akhbar, government records and the family papers of the Azizi hakims of Lucknow.
        On this reading the collapse of courts does not by itself mark a collapse of the tradition. Guy
        Attewell (Refiguring Unani Tibb, 2007) gives a chapter to Unani in Hyderabad, the largest princely
        state, as a contrast to Lucknow and Delhi, covering roughly the late 1880s to the late 1930s.
        These reviews do not give dates for the end of Hyderabad patronage.
      citations:
      - source: 'Alavi, Seema. Islam and Healing: Loss and Recovery of an Indo-Muslim Medical Tradition,
          1600-1900. Ranikhet: Permanent Black, 2007 (argument as summarized in a published book review,
          academia.edu/99821557)'
        type: historical-monograph
        citation_strength: indirect
        claim_match: matches
      - source: 'Attewell, Guy N. A. Refiguring Unani Tibb: Plural Healing in Late Colonial India. New
          Perspectives in South Asian History 17. Hyderabad: Orient Longman, 2007 (content as described
          in reviews in JRAS, AHR 115(1), Medical History / PMC2766155)'
        type: historical-monograph
        citation_strength: indirect
        claim_match: matches
      register: historical-scholarship
      notes: Both monographs were reached only through search-result summaries of their reviews, because
        full-text fetches were blocked by the egress proxy. Their arguments should be checked against
        the books. General political dates (annexation of Awadh, 7 Feb 1856; Hyderabad Police Action and
        accession, Sept 1948) turned up only in non-scholarly general sources that say nothing about hakims,
        so they are not entered as patronage-loss events for Unani. Alavi's position is a scholarly argument,
        not a consensus.
      source_report: gap
      gap_outcome: found
      replaced_from: v2
