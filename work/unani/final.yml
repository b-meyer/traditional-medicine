  literature_state:
    corpus_scale_appraisal:
      status: partial
      value: No Unani-specific evidence map, overview of reviews or bibliometric analysis of the whole
        Unani clinical literature was located. The nearest count comes from an Ayurveda-focused bibliometric
        study of the AYUSH Research Portal (ARP v1.0). Of 39,663 indexed articles as of 30 June 2020,
        it collected 6,528 clinical-trial-based articles across AYUSH systems, of which 427 were Unani.
        It gives no Unani breakdown by condition or design. A separate bibliometric analysis of ARP data
        for all AYUSH systems (1954-2020, Alternative Therapies in Health and Medicine, PubMed 40862845)
        reports rising publications and about one-third in predatory journals across systems. Unani-specific
        figures from that paper were not retrieved.
      citations:
      - source: 'Thrigulla SR et al., ''Clinical studies in Ayurveda: A bibliometric analysis of articles
          indexed in AYUSH research portal'', AYU 43(3) (2022; PMC10710232, 2023)'
        type: primary-study
        citation_strength: direct
        claim_match: matches
      - source: '''Bibliometric Analysis of India''s Ayush Systems of Medicine Using Ayush Research Portal
          Data from 1954-2020: Current Status, Challenges, and the Way Forward for Future Research'',
          Alternative Therapies in Health and Medicine (PubMed 40862845)'
        type: primary-study
        citation_strength: indirect
      register: biomedical-evidence
      notes: The 427 figure is a by-product of an Ayurveda study and counts ARP-indexed articles, not
        trials. It is not a corpus-scale appraisal of Unani. The second paper's abstract was seen only
        through a search summary, and PubMed did not load. Iranian Traditional Persian Medicine has its
        own RCT reporting-quality review (2018-2022, 139 RCTs eligible from 1,112 retrieved). It is not
        entered here because it is scoped to TPM, not Unani. Whether it counts depends on the extraction's
        system_boundary treatment of TPM, and it concerns quality (field 13) rather than volume. The absence
        of a Unani-wide corpus appraisal is itself the main finding.
      source_report: gap
      gap_outcome: found
      replaced_from: v2
