  construct_debate:
    positions:
      status: filled
      value:
      - scholar: Guy Attewell
        work: 'Refiguring Unani Tibb: Plural Healing in Late Colonial India (Hyderabad: Orient Longman,
          2007)'
        year: 2007
        position: Unani identity was reconstituted in the late colonial period through biomedical concepts,
          nationalist/communitarian politics and colonial models of legitimacy; heterogeneous rather than
          a single 'traditional Muslim system'. Reviewer summary - Unani as an Islamic-Arabic tradition
          is largely a product of late colonial classification; Unani 'did not pre-exist as a static system'.
        evidence_base: 19th-20th c. print, institutional, legal and political archives
      - scholar: Seema Alavi
        work: 'Islam and Healing: Loss and Recovery of an Indo-Muslim Medical Tradition, 1600-1900 (Ranikhet:
          Permanent Black, 2007; Basingstoke: Palgrave Macmillan, 2008); ''Unani Medicine in the Nineteenth-Century
          Public Sphere: Urdu Texts and the Oudh Akhbar'', Indian Economic and Social History Review 42(1),
          2005, pp. 101-129'
        year: 2007; 2005
        position: Unani reshaped and redefined itself as an Indian medical system in the 19th century
          through engagement with Western medicine, in the Urdu public sphere. The report's gloss ('new
          Unani and a new hakim'; emphasis shifting from theory-mastery to practice) was not confirmed
          against the article text.
        evidence_base: 19th-century Persian and Urdu treatises, regional newspapers (Oudh Akhbar), government
          records, textbooks, Azizi family papers
      - scholar: Claudia Liebeskind
        work: 'Arguing Science: Unani Tibb, Hakims and Biomedicine in India, 1900-50, in Waltraud Ernst
          (ed.), Plural Medicine, Tradition and Modernity, 1800-2000 (London: Routledge, 2002), pp. 58-75'
        year: 2002
        position: Documents the biomedicine-versus-hakim contest.
        evidence_base: Archival/historical
      - scholar: David Hardiman
        work: 'Indian Medical Indigeneity: From Nationalist Assertion to the Global Market, Social History
          34(3), 2009, pp. 263-283'
        year: 2009
        position: Treats the claims of Ayurveda and Unani Tibb as typical 'invented traditions' that sought
          to forge uniform 'systems' out of eclectic practices, with claims to antiquity and narratives
          of decline and revival. The report's attribution to Leslie and Thapar was not checked.
        evidence_base: Historical scholarship
      - scholar: Kavita Sivaramakrishnan
        work: 'Old Potions, New Bottles: Recasting Indigenous Medicine in Colonial Punjab (1850-1945)
          (Hyderabad: Orient Longman, 2006)'
        year: 2006
        position: Analogous recasting of indigenous medicine, with practitioners developing professional
          identities and institutions compatible with a nationalist frame.
        evidence_base: Historical scholarship
      - scholar: Kira Schmidt Stiedenroth
        work: 'Unani Medicine in the Making: Practices and Representations in 21st-century India (Amsterdam
          University Press, 2020)'
        year: 2020
        position: Examines what Unani is today through its multiplicity, scrutinizing tensions between
          Unani as a 'system of medicine' and its enactments as Islamic medicine, medical science or alternative
          medicine. Ethnographic; the report's phrasing 'extends the reconstruction argument' is an interpretation.
        evidence_base: Urdu sources, practitioner interviews, clinic observation
      - scholar: Unnamed critics of Iranian TPM
        work: null
        year: null
        position: Persian medicine revival since 2007 is a substantially new, nationally branded construction
          layered onto medieval texts.
        evidence_base: not stated
      - scholar: Defenders (many within CCRUM, Hamdard, TPM faculties; bio-bibliographers such as the
          late Hakim Syed Zillur Rahman)
        work: null
        year: null
        position: 'Continuity: unbroken textual lineage (Galen -> Qanun -> Indian commentaries), continuous
          family/lineage practice (e.g. Azizi family of Lucknow).'
        evidence_base: Textual/manuscript tradition and lineage practice
      - scholar: Fabrizio Speziale
        work: 'Culture persane et medecine ayurvedique en Asie du Sud (Leiden: Brill, 2018)'
        year: 2018
        position: First study of the translation of Ayurvedic sources into Persian from the 14th century
          and of the Persianization of Hindu physicians; shows pre-colonial dynamism (Persian-Ayurveda
          synthesis). The report's added claim that this complicates 'simple invention' is its own inference.
        evidence_base: Persian-language manuscripts (Perso-Indica project)
      citations:
      - source: Attewell, Refiguring Unani Tibb (Orient Longman 2007), as reviewed in Medical History
          (PMC2766155)
        type: historical-monograph
        citation_strength: direct
      - source: Alavi, Unani Medicine in the Nineteenth-Century Public Sphere, IESHR 42(1), 2005, pp.
          101-129
        type: historical-monograph
        citation_strength: direct
      - source: Liebeskind, Arguing Science, in Ernst (ed.), Plural Medicine, Tradition and Modernity,
          Routledge 2002, pp. 58-75
        type: historical-monograph
        citation_strength: direct
      - source: Hardiman, Indian Medical Indigeneity, Social History 34(3), 2009, pp. 263-283
        type: historical-monograph
        citation_strength: direct
      - source: Sivaramakrishnan, Old Potions, New Bottles, Orient Longman 2006
        type: historical-monograph
        citation_strength: direct
      - source: Schmidt-Stiedenroth, Unani Medicine in the Making, Amsterdam University Press 2020
        type: historical-monograph
        citation_strength: direct
      - source: Speziale, Culture persane et medecine ayurvedique en Asie du Sud, Brill 2018
        type: historical-monograph
        citation_strength: direct
      register: historical-scholarship
      notes: Corrected from bookseller, aggregator and profile-page citations to the works themselves.
