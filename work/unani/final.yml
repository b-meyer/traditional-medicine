      status: partial
      value: No appraisal dedicated to the whole Unani clinical literature located. The nearest is a bibliometric
        analysis of the AYUSH Research Portal (Thrigulla et al., Ayu 2023) covering 6,528 articles across
        AYUSH systems, of which 427 are Unani (Ayurveda 3,903; Yoga 950; Siddha 594; Homoeopathy 654).
        For Unani the paper reports 209 articles (48.95%) Grade A (RCT), 95 (22.25%) Grade B and 123 (28.81%)
        Grade C on its WHO-based evidence grading.
      citations:
      - source: 'Thrigulla et al., Clinical studies in Ayurveda: A bibliometric analysis of articles indexed
          in AYUSH research portal, Ayu 2023 (PMC10710232)'
        type: primary-study
        citation_strength: direct
      register: biomedical-evidence
      notes: Titled and framed around Ayurveda; Unani figures are one stratum of a multi-system portal
        analysis, not a Unani-specific appraisal. Portal-indexed articles only, not all Unani literature.
        Grade counts taken from a summary of the paper, so the figures should be checked against the full
        text. No Cochrane overview or Unani-wide evidence map found.
