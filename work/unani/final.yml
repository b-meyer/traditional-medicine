    conservation_and_sourcing:
      status: partial
      value:
      - agent: Qust / kuth (Saussurea costus, syn. S. lappa, Aucklandia costus)
        description: Used in Ayurvedic, Unani, Chinese and Tibetan medicine. It was listed on CITES Appendix
          II in 1975 and relisted on Appendix I in 1980 with India's consent. Jammu & Kashmir enacted
          the Kuth (Costus) Act in 1978. India amended the Wildlife (Protection) Act 1972 in 1991 to insert
          Schedule VI, which covers six rare medicinal plants including costus. Cultivation, possession,
          storage and trade became illegal without permission from the chief wildlife warden. The Ministry
          of Commerce prohibits export of 29 medicinal and aromatic species, costus among them, in crude
          or processed form. Reviews attribute its decline to overexploitation, unregulated trade and
          habitat loss.
      - agent: Mushk / deer musk (Moschus spp.)
        description: TRAFFIC Europe (Homes 1999) reports that the far greater consumption of musk today
          is in traditional Chinese, Ayurvedic and Unani medicines. Musk deer populations of Afghanistan,
          Bhutan, India, Myanmar, Nepal and Pakistan are on CITES Appendix I, which bars international
          commercial trade in wild-origin specimens.
      citations:
      - source: CITES Plants Committee, PC19 Inf. 7, A Review of the Status of Saussurea costus (cites.org/sites/default/files/common/com/pc/19/E19i-07.pdf)
        type: institutional
        citation_strength: direct
      - source: Journal of Threatened Taxa article on costus (threatenedtaxa.org/index.php/JoTT/article/download/3581/6511)
        type: primary-study
        citation_strength: direct
      - source: 'Homes, Volker. On the Scent: Conserving Musk Deer - The Uses of Musk and Europe''s Role
          in Its Trade. TRAFFIC Europe, 1999 (IUCN library Traf-055)'
        type: institutional
        citation_strength: direct
        claim_match: matches
      register: regulatory
      notes: The costus dates came from a search snippet that did not say which of the two costus documents
        (CITES PC19 Inf. 7 or the JoTT article) gave them. Both are listed, and neither was opened because
        of egress blocking. The Ministry of Commerce export ban was reported in secondary reviews without
        the notification number or year. None of these sources measures how much Unani demand contributes
        to pressure on the species. They show only that Unani is one of the user systems. No Unani-specific
        study of raw-drug supply chains in India or Pakistan was located. General ASU adulteration and
        scarcity literature exists but is not Unani-specific and is not entered.
      source_report: gap
      gap_outcome: found
      replaced_from: v2
    intellectual_property:
      status: partial
      value: 'Defensive database: India''s Traditional Knowledge Digital Library (TKDL, a CSIR and Ministry
        of AYUSH collaboration) had transcribed 236,399 Unani formulations as of 25 March 2022. This was
        the largest share of 418,885 formulations; the others were Ayurveda 119,269, Siddha 54,689, Yoga
        4,151 and Sowa Rigpa 4,377. The content is structured in English, Japanese, French, German and
        Spanish. TKDL prior art is used for pre-grant oppositions at patent offices. In a case that CSIR-TKDL
        described as concerning turmeric, pine bark and green tea for hair loss, used in Ayurveda and
        Unani, CSIR-TKDL filed a pre-grant opposition at the EPO. The application was deemed withdrawn
