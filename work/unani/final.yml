        presents it as vol. 1, Fi al-umur al-kulliyya, i.e. Book I (the Kulliyyat). The earlier phrase
        'part of Qanun Book I' is not supported by the edition's title and was replaced. (3) The Aga Khan
        Museum describes AKM510 as the earliest known extant manuscript of any part of the Qanun; this
