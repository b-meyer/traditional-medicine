        type: historical-monograph
        citation_strength: direct
      register: historical-scholarship
      notes: Checked against the reference works listed. Iranica gives al-Majusi's death as 384/994 with
        a question mark, so d. 994 is uncertain. Other accounts place it between 982 and 994. NLM gives
        the Gurgan-Rayy-Hamadan sequence. Masic 2012 dates the start to about 1012 and puts completion
        about twelve years later, within the 1020-1025 range. The Hippocratic dating (5th-4th c. BCE)
        is the standard dating of the corpus's treatises, e.g. Epidemics I and III c. 410 BCE and later
        treatises at the turn of the 5th to 4th century. It was checked against search-surfaced summaries,
        not a single primary reference read in full. Direct fetch of britannica.com was blocked by the
        network proxy, so the Britannica dates rest on the search-indexed article.
