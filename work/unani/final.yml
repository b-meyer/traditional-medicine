  self_reported_gaps:
    inventory:
      status: filled
      value:
      - kind: searched_not_found
        text: 'I found no rigorous inter-rater reliability study of Unani *pulse* (nabz) diagnosis specifically
          producing kappa values; the reliability literature clusters on mizaj questionnaires. (Searches
          performed: "Unani mizaj temperament inter-rater reliability kappa"; "pulse diagnosis reliability"
          within the mizaj/traditional-medicine literature. Pulse-diagnosis reliability data that do exist
          are largely from Traditional Chinese Medicine, not Unani.)'
      - kind: searched_not_found
        text: (a) I found **no rigorous kappa-based inter-rater reliability study of Unani pulse (nabz)
          diagnosis** — the reliability literature is on mizaj questionnaires.
      - kind: searched_not_found
        text: (b) Unani-*specific*, product-named hepatotoxicity case reports with RUCAM scoring appear
          **absent** in the indexed literature (the DILI literature names Ayurvedic agents; Unani appears
          only in mixed-system surveys).
      - kind: searched_not_found
        text: (c) Clinical case reports attributing an individual's lead/arsenic poisoning to a specific
          *branded* Unani kushta (with attributed blood levels) are **sparse** compared with Ayurveda;
          the strongest Unani harm evidence is product-analysis (over-limit metals) plus surma-linked
          poisoning clusters.
      - kind: searched_not_found
        text: Delayed biomedical care is a recognized systemic risk of reliance on traditional medicine,
          though hard Unani-specific outcome data are limited.
      - kind: source_caveat
        text: 'Source asymmetry: Much clinical and pharmacological literature is produced by institutions
          with an institutional stake in Unani (CCRUM, Hamdard, TPM faculties), and promotional/marketing
          sources (school and clinic websites) overstate historical continuity and efficacy. I have weighted
          peer-reviewed history, systematic reviews, primary legal texts, and regulatory documents accordingly.'
      - kind: source_caveat
        text: 'Terminology overlap: Toxicology and pharmacopoeial sources frequently aggregate "Ayurveda,
          Siddha and Unani (ASU)," so some cited limits/surveys are ASU-wide rather than Unani-only; I
          have flagged this where relevant.'
      - kind: source_caveat
        text: 'Lighter sourcing: Detail on Nizam-of-Hyderabad patronage and on COVID-era Unani specifics
          rests on thinner sourcing (searches on these were cut off by tool limits) and should be verified
          against primary sources before heavy reliance; the harms question was filled by a dedicated
          sub-investigation and is well-sourced.'
      - kind: source_caveat
        text: (This patronage detail rests on lighter sourcing — see Caveats.)
      - kind: source_caveat
        text: 'Fast-moving policy: The Indian "mixopathy" litigation, the Pakistani council merger (2024),
          and Iran''s TPM expansion are ongoing; legal specifics may have changed after the sources''
          dates.'
      - kind: source_caveat
        text: A 2026 analytical study of the classical Unani formulation **Jawarish Shahi** (*Discover
          Chemistry*) detected synthetic contaminants including an antibiotic prodrug (single-batch preliminary
          finding).
      - kind: contested
