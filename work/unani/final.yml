        seen only in a search-result summary of a review and is not verified. If it holds, it qualifies
        any framing of court collapse as the main disruption. Attewell (Refiguring Unani Tibb, 2007) has
        a chapter on Hyderabad state, but the review read (Bastos, Medical History 53(4), 2009) does not
