    dating_and_authorship_disputes:
      status: filled
      value:
      - scholar: Jules Janssens
        position: Even the 2018 critical edition of part of Book I of the Qanun leaves 'the larger unresolved
          textual problem'; no complete modern critical edition exists.
      - scholar: Fabrizio Speziale and others
        position: Documents apocryphal/pseudonymous attributions, e.g. Tuhfat al-ashiqin ascribed to Avicenna
          and texts ascribed to Ja'far al-Sadiq.
      - scholar: Historia Medica project; Nahyan Fancy
        position: The Canon's importance lies less in originality than in how 'copyists, commentators,
          translators, teachers, printers, and readers repeatedly selected, criticised, and changed' it;
          originality vs. compilation is debated.
      citations:
      - source: '[S1] Canon of Medicine | Historia Medica — https://historiamedica.org/sources/canon-of-medicine/'
        type: reference-work
        citation_strength: direct
        claim_match: matches
      register: historical-scholarship
