- path: revival_and_institutionalization.standardization_events
  source_report: v2
  value:
  - Ayurvedic and Unani Tibbia College, Delhi (foundation stone 1916, inaugurated 1921) incorporating
    anatomy and surgery
  - Drugs and Cosmetics Act 1940 Chapter IVA and Rules 1945 (Schedule T GMP; Rule 158B licensing)
  - Unani, Ayurvedic and Homoeopathic Practitioners Act 1965 (Pakistan)
  - CCRUM established 1978; National Institute of Unani Medicine, Bengaluru; Unani Pharmacopoeia of India;
    National Formulary of Unani Medicine
  - Iranian 4-year PhD in Traditional Persian Medicine approved 2007
  - NCISM Act 2020 operational 2021, common entrance (NEET) and exit (NExT)
  - WHO benchmarks for training and practice of Unani medicine, 11 February 2022 (2010 editions updated)
