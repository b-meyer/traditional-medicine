      as legitimate; indigenous systems 'actively discouraged'
    date: 1835
  - policy: Bhore Committee (Health Survey and Development Committee), dominated by the Indian Medical
      Service, dismissed indigenous medicine as 'unscientific'
    date: 1946
  - policy: Later committees (Mudaliar, Shrivastava, Udupa) oscillated between marginalization and integration
    date: not stated
