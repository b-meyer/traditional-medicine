- path: revival_and_institutionalization.revival_context
  source_report: v2
  value: Anti-colonial nationalism (Ajmal Khan, Congress, Khilafat and Non-cooperation). Survival through
    'scientization' in response to colonial delegitimization. Market/industrial development (Hamdard waqf
    pharmacy). Post-independence state-led institutionalization in India (AYUSH, CCRUM, NCISM) and Pakistan.
    In Iran, a state-led, nationally branded 'Persian medicine' revival since 2007.
  weak_citations:
