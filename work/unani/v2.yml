          type: primary-study
          citation_strength: direct
          claim_match: mismatch
        - source: "Agreement Between Clinical Judgment and Standardized Questionnaires in Temperament (Mizaj) Assessment in Persian Medicine (brieflands.com, Shiraz E-Medical Journal) https://brieflands.com/journals/semj/articles/168654"
          type: primary-study
          citation_strength: direct
          claim_match: matches
        - source: "Inter-Rater Judgement analysis for Item Selection in the Development of the Questionnaire to Determine Mizaij-i-Insani, Bangladesh Journal of Medical Science https://www.banglajol.info/index.php/BJMS/article/view/72165"
          type: primary-study
          citation_strength: direct
          claim_match: matches
      register: biomedical-evidence
      notes: "One entry per study, deliberately not averaged, ranked or collapsed; the designs differ. S2 is cited for the three-expert, 150-volunteer ICC study, but its title describes a Tibbi classification-tool (decision-tree) study, so it looks like a different work: mismatch. Authors of the Shiraz study concede 'no independent external gold standard exists for Mizaj assessment.' The first three studies are Iranian Persian-medicine work, which the report treats as the same tradition (see identification.system_boundary). The report found no inter-rater reliability study of nabz (pulse) diagnosis, nor of urine or stool examination."
    sign_vs_synthesis:
      status: partial
      value: "The report does not frame agreement as individual signs versus integrated judgment. Its data are at the level of questionnaire items (weighted κ 0.40-0.82) and whole temperament axes/categories (ICC 0.62-0.64; κ 0.08-0.51). It notes warm/cold is assessed more reliably than wet/dry. No single-sign (pulse, urine) reliability data were found."
      citations:
        - source: "Agreement Between Clinical Judgment and Standardized Questionnaires in Temperament (Mizaj) Assessment in Persian Medicine https://brieflands.com/journals/semj/articles/168654"
          type: primary-study
          citation_strength: direct
      register: biomedical-evidence
      notes: "Missing: agreement between examiners on individual Unani signs (nabz features, baul characteristics) compared with agreement on the final mizaj or diagnosis, e.g. 'Unani nabz pulse examination inter-rater kappa' and 'urine examination baul agreement'."
