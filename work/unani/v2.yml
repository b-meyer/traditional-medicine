    system_boundary:
      status: incidental
      value:
        - tradition: "Traditional Persian Medicine (TPM, Iran)"
          relation: same_system_variant
          fields_affected: [5, 9, 10, 11, 12, 13, 16]
          description: "Report presents Iran's state-backed 'Persian medicine' programme (since 2007) as a parallel revival of the Greco-Arabic tradition and includes it under Unani's legal standing. Most mizaj reliability studies in field 5 are Iranian Persian-medicine studies; Iranian TPM universities are named as major trial producers."
        - tradition: "Tibb al-Nabawi (Prophetic medicine)"
          relation: absorbed_strand
          fields_affected: [3, 15]
          description: "Partly folded into vernacular Unani in colonial India (Attewell/Alavi), though scholars treat it and academic Unani as historically distinct strands."
        - tradition: "Ayurveda, Siddha (ASU grouping) and Sowa-Rigpa"
          relation: regulatory_grouping
          fields_affected: [10, 14, 16]
          description: "Regulated together in India under NCISM (Board of Unani, Siddha and Sowa-Rigpa), Ministry of AYUSH and Drugs and Cosmetics Act Chapter IVA (ASU drugs). Toxicology/pharmacopoeial sources and heavy-metal limits cited in field 14 are ASU-wide or Ayurvedic; 'mixopathy' disputes in field 16 concern AYUSH broadly."
        - tradition: "Greek/Galenic (Latin European) medicine"
          relation: sibling
          fields_affected: [2, 15]
          description: "Common Hippocratic-Galenic humoral source; the Qanun served as a Latin-European textbook until the 17th century. Report calls this shared ancestry, not borrowing."
      citations:
        - source: "none (uncited in report)"
          type: unclear
          citation_strength: unclear
      register: historical-scholarship
      notes: "Boundaries were not asked about directly; assembled from the report's legal, borrowing and caveat sections. The report never explicitly says TPM is the same system. It calls it 'parallel' and notes critics call it a 'substantially new, nationally branded construction', so relation same_system_variant is the mapper's reading of how the report uses TPM data."
