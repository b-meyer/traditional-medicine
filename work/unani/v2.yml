    primary_regions:
      status: incidental
      value: "South and Central Asia; legally recognized and state-funded in India and Pakistan; lesser recognition in Bangladesh, Sri Lanka and South Africa; practice (often as cupping/herbal CAM) in Gulf/UK/US/EU without dedicated statutory recognition; parallel 'Persian medicine' revival in Iran."
