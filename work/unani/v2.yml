        - {source: "none given in report", type: unclear, citation_strength: unclear}
      register: emic
      notes: null
    balance_logic:
      status: filled
      value: "Health is equilibrium of humours expressed as an individual's proper mizaj (unique to each person, organ, drug and food); therapy by contraries (cold disease treated with hot-quality drugs/regimen) and by supporting tabiat; hierarchy of regimen (ilaj bil-tadbir), diet (ilaj bil-ghiza), pharmacotherapy (ilaj bil-dawa), and last surgery (ilaj bil-yad)."
      citations:
        - {source: "none given in report", type: unclear, citation_strength: unclear}
      register: emic
      notes: null
