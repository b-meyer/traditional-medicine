  construct_debate:
    positions:
      status: filled
      value:
        - scholar: "Guy Attewell"
          work: "Refiguring Unani Tibb: Plural Healing in Late Colonial India"
          year: 2007
          position: "Unani identity was 'reconstituted' around 1900 through biomedical concepts, nationalist/communitarian politics and colonial models of legitimacy; it was heterogeneous rather than a single 'traditional Muslim system'."
          evidence_base: "19th-20th c. print, institutional, legal and political archives"
        - scholar: "Seema Alavi"
          work: "Islam and Healing: Loss and Recovery of an Indo-Muslim Medical Tradition, 1600-1900 (2007); 'Unani Medicine in the Nineteenth-Century Public Sphere', IESHR (2005)"
          year: 2007
          position: "A 'new Unani and a new hakim' emerged in the 19th-century Urdu public sphere, with the emphasis shifting from mastery of theory to practice."
          evidence_base: "19th c. Urdu print and public-sphere sources"
        - scholar: "Claudia Liebeskind"
          work: "'Arguing Science: Unani Tibb, Hakims and Biomedicine in India, 1900-50', in Ernst ed."
          year: 2002
          position: "Documents the contest between biomedicine and hakims."
          evidence_base: "20th c. archival and print sources (as characterized by the report)"
        - scholar: "David Hardiman (following Charles Leslie and Romila Thapar's 'syndication' concept)"
          work: null
          year: null
          position: "Both Unani and Ayurveda were reinvented/syndicated in colonial India as a 'cogent medical system with a well-defined structure'."
          evidence_base: "Colonial-era institutional and print record"
        - scholar: "Kavita Sivaramakrishnan"
          work: "Old Potions, New Bottles: Recasting Indigenous Medicine in Colonial Punjab"
          year: 2006
          position: "Analogous recasting of indigenous medicine in colonial Punjab."
          evidence_base: "Colonial Punjab sources"
        - scholar: "Kira Schmidt Stiedenroth"
          work: "Unani Medicine in the Making"
          year: 2020
          position: "Extends the reconstruction analysis to 21st-century India."
          evidence_base: "Contemporary India (method not stated)"
        - scholar: "Unnamed critics of Iran's TPM revival"
          work: null
          year: null
          position: "The 'Persian medicine' revival since 2007 is a substantially new, nationally branded construction layered onto medieval texts."
          evidence_base: "Not stated"
        - scholar: "Continuity defenders: CCRUM, Hamdard and TPM faculty authors; Hakim Syed Zillur Rahman (bio-bibliographer)"
          work: null
          year: null
          position: "Genuinely unbroken textual lineage (Galen to Qanun to Indian commentaries) and continuous family/lineage practice."
          evidence_base: "Textual and manuscript tradition; lineage practice (e.g. the Azizi family of Lucknow)"
        - scholar: "Fabrizio Speziale"
          work: "Culture persane et medecine ayurvedique en Asie du Sud (Brill)"
          year: 2018
          position: "Complicates both sides by showing pre-colonial dynamism (Persian-Ayurveda synthesis), undercutting the idea of a static 'pure' tradition that was either simply preserved or simply invented."
          evidence_base: "Persian translations of Ayurvedic sources; Perso-Indica project"
      citations:
        - source: "Refiguring Unani Tibb (Plural Healing in Late Colonial India) | Exotic India Art https://www.exoticindiaart.com/book/details/refiguring-unani-tibb-plural-healing-in-late-colonial-india-nag813/"
