          fields_affected: [diagnostics.reliability_evidence, diagnostics.standardization_efforts, legal_status.jurisdictions, revival_and_institutionalization.state_sponsorship, construct_debate.positions, literature_state.geographic_concentration_of_trials, contemporary_controversies.politicized_episodes]
