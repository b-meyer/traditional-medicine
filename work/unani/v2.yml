  # ---------------------------------------------------------------- 1
  identification:
    system_name:
      status: filled
      value: "Unani medicine (Unani Tibb / Greco-Arabic Medicine); 'Unani' glossed as 'Ionian/Greek'; described as the South and Central Asian branch of the Greco-Arabic humoral tradition"
      citations:
        - source: "Uncited in report (title and Details section 1)"
          type: unclear
          citation_strength: unclear
      register: historical-scholarship
      notes: "No [Sn] marker attached to the naming or etymology claim."
    alternate_names:
      status: filled
      value:
        - "Unani Tibb"
        - "Greco-Arabic Medicine"
        - "Unani-Tibb (South African regulatory usage)"
        - "Tibb-e-Unani (Pakistani diploma usage)"
        - "Eastern medicine (Pakistani degree title, Bachelor of Eastern Medicine, BEMS)"
        - "Traditional Persian Medicine (TPM) / 'Persian medicine' (Iranian revival; the report treats it as a parallel revival, see system_boundary)"
      citations:
        - source: "Uncited in report (title, TL;DR, Details sections 5 and 10)"
          type: unclear
          citation_strength: unclear
      register: historical-scholarship
      notes: "The report gives no endonym beyond the Arabic/Urdu terms above. It lists 'nomenclature' as a current dispute in Key Finding 10 without saying what the dispute is."
    primary_regions:
      status: incidental
      value: "South and Central Asia, with origins in Abbasid Baghdad. Present-day recognition in India, Pakistan, Bangladesh and Sri Lanka, plus South Africa; a parallel revival in Iran; practice without dedicated recognition in the Gulf, UK, US and EU."
      citations:
        - source: "Uncited in report (Details sections 1 and 5)"
          type: unclear
          citation_strength: unclear
      register: regulatory
      notes: "The research prompt did not ask for regions as such. The report covers them in passing while answering the origin and legal-status questions. Not a gap-pass target."
    practitioner_estimate:
      status: incidental
      value:
        - count: "~60,000 registered Hakims (Pakistan), holding either a diploma in Tibb-e-Unani or a Bachelor degree in Eastern/Unani medicine"
          source: "Hamdard Foundation Pakistan (via WHO EMRO), as quoted in the report"
          year: null
        - count: "39,584 hakims (Pakistan), a lower Ministry-of-Health-linked figure"
          source: "Saeed et al. 2011, as named in the report"
          year: 2011
      citations:
        - source: "Hamdard Foundation Pakistan via WHO EMRO (named in report text; no [Sn] marker or bibliography entry)"
          type: unclear
          citation_strength: unclear
        - source: "Saeed et al. 2011 (named in report text; no bibliography entry)"
          type: unclear
          citation_strength: unclear
      register: regulatory
      notes: "Not asked by the research prompt; reported in passing in the Pakistan legal section. The report gives no figures for India, Bangladesh, Sri Lanka, Iran or South Africa. Not a gap-pass target."
    system_boundary:
      status: filled
      value:
        - tradition: "Traditional Persian Medicine (TPM, Iran)"
          relation: same_system_variant
          fields_affected: [diagnostics, legal_status, education_and_licensure, evidence_state, revival_and_institutionalization, construct_debate, contemporary_controversies]
          description: "The report calls this a 'parallel \"Persian medicine\" revival'. It lists Iran within Unani's legal standing and takes most of its mizaj reliability studies from Iranian TPM researchers. It also reports critics who call TPM a 'substantially new, nationally branded construction layered onto medieval texts'."
        - tradition: "Ayurveda, Siddha, Sowa-Rigpa, Yoga & Naturopathy, Homoeopathy (India's AYUSH / NCISM grouping; 'ASU' drug category)"
          relation: regulatory_grouping
          fields_affected: [legal_status, safety, contemporary_controversies]
          description: "In India, Unani is governed with Ayurveda, Siddha and Sowa-Rigpa under NCISM, through a Board of Unani, Siddha and Sowa-Rigpa. It sits under the Ministry of AYUSH, and its drugs are regulated as ASU drugs. The report warns that toxicology and pharmacopoeial sources often aggregate ASU, so some limits and surveys it cites are ASU-wide."
        - tradition: "Unani, Ayurvedic and Homoeopathic practitioners (Pakistan)"
          relation: regulatory_grouping
          fields_affected: [legal_status]
          description: "Pakistan's 1965 Act covers Unani, Ayurvedic and Homoeopathic practitioners. In September 2024 the government moved to merge the National Council for Tibb with the National Council for Homeopathy."
        - tradition: "Tibb al-Nabawi (Prophetic medicine)"
          relation: absorbed_strand
          fields_affected: [construct_debate, contact_and_borrowing]
          description: "Partly incorporated into vernacular Unani in colonial India (Attewell/Alavi), 'though scholars treat Tibb al-Nabawi and academic Unani as historically distinct strands'."
        - tradition: "Greek/Galenic European medicine"
          relation: sibling
          fields_affected: [canon_and_transmission, contact_and_borrowing]
          description: "Descends from the same Hippocratic-Galenic humoral source. The Qanun served as a Latin-European textbook until the 17th century. The report frames this as 'shared ancestry, not borrowing'."
      citations:
        - source: "[S8] National Commission for Indian System of Medicine (en.wikipedia.org) https://en.wikipedia.org/wiki/National_Commission_for_Indian_System_of_Medicine"
          type: open-encyclopedia
          citation_strength: indirect
        - source: "[S12] National Council for Tibb (en.wikipedia.org) https://en.wikipedia.org/wiki/National_Council_for_Tibb"
          type: open-encyclopedia
          citation_strength: indirect
        - source: "Uncited in report (Details sections 8, 9; Caveats 'Terminology overlap')"
          type: unclear
          citation_strength: unclear
      register: historical-scholarship
      notes: "The report never states outright whether TPM is the same system or a distinct one. It is mapped here as same_system_variant because the report pools Iranian TPM data into Unani's diagnostics and legal-status findings. Downstream readers should know that the reliability evidence in field 5 comes mostly from TPM. The report also mentions Sowa-Rigpa as 'administratively grouped with Unani under India's NCISM but ... a separate tradition'."

