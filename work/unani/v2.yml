          type: aggregator
          citation_strength: indirect
          claim_match: mismatch
        - source: "Fabrizio Speziale - EHESS (academia.edu profile) https://ehess.academia.edu/FabrizioSpeziale"
          type: aggregator
          citation_strength: indirect
      register: historical-scholarship
      notes: "The report's own adjudication, not a consensus: 'the weight of specialist scholarship favors a reconstruction on a real foundation position'; the TL;DR says 'most serious historians (Attewell, Alavi, Liebeskind, Speziale) agree' that the modern institutional form is substantially a late-19th/20th-century reconstruction. Attewell is sourced through a bookseller listing (S29). S30, a ResearchGate listing of a review of Attewell's book, is cited for Seema Alavi's argument: mismatch. Speziale is sourced through a profile page (S31). Liebeskind, Hardiman, Sivaramakrishnan, Schmidt Stiedenroth and the continuity side are uncited."
  theoretical_primitives:
    constituents:
      status: filled
      value: "Arkan (four elements: fire, air, water, earth); akhlat (four humours: dam/blood hot-wet, balgham/phlegm cold-wet, safra/yellow bile hot-dry, sauda/black bile cold-dry); quwa (faculties: natural, vital, psychic); arwah (pneuma/vital spirits); tabiat (innate self-regulating/healing power, equivalent to physis)."
      citations:
        - source: "none (uncited in report)"
          type: unclear
          citation_strength: unclear
      register: emic
    balance_logic:
      status: filled
      value: "Health is the equilibrium of the four humours, expressed as the individual's mizaj (temperament) on hot/cold and wet/dry axes; health means maintaining one's proper mizaj. Therapy works by contraries (a cold disease treated with hot-quality drugs/regimen) and by supporting tabiat, in a hierarchy of regimen (ilaj bil-tadbir), diet (ilaj bil-ghiza), pharmacotherapy (ilaj bil-dawa) and, last, surgery (ilaj bil-yad)."
      citations:
        - source: "none (uncited in report)"
          type: unclear
          citation_strength: unclear
      register: emic
    correspondence_system:
      status: filled
      value: "Qualities (hot/cold, wet/dry) derived from the elements underlie everything. Every person, organ, drug and food has its own mizaj, and each humour carries a pair of qualities. Patients and drugs are classified by temperament."
      citations:
        - source: "none (uncited in report)"
          type: unclear
          citation_strength: unclear
      register: emic
    etiology:
      status: filled
      value: "Disease is a disturbance of mizaj (su' al-mizaj): simple (qualitative) or material (involving a morbid humour). Health is governed by the asbab sitta daruriya (six essentials): air/environment; food and drink; movement and rest; sleep and wakefulness; retention and evacuation; psychic/emotional states."
      citations:
        - source: "none (uncited in report)"
          type: unclear
          citation_strength: unclear
      register: emic
    nosology:
      status: partial
      value: "Only the simple vs. material dystemperament division is given, plus one named disease category: Waja' al-Mafasil, roughly analogous to rheumatoid/joint disease."
      citations:
        - source: "none (uncited in report)"
          type: unclear
          citation_strength: unclear
      register: emic
      notes: "The report does not describe Unani disease classification beyond this, e.g. the ordering of diseases by organ ('head to toe') or by general vs. localized disease."
    relation_to_biomedical_anatomy:
      status: filled
      value: "Maps partially and loosely: regimen and dietetics overlap with lifestyle medicine, some materia medica is being screened pharmacologically, and some disease categories have rough biomedical analogues. Refuses mapping at the core: mizaj, the four humours, tabiat and arwah have no biomedical referents and are explicitly individual and qualitative rather than quantitative or population-based. The system classifies patients and drugs by temperament rather than by pathophysiology or molecular mechanism, which makes research standardization difficult."
      citations:
        - source: "none (uncited in report)"
          type: unclear
          citation_strength: unclear
      register: historical-scholarship
      notes: "Colonial-era reformers also incorporated anatomy, physiology, pathology and surgery into curricula (field 9)."
    translation_programs:
      status: partial
      value:
        - program: "Pharmacological screening of Unani materia medica"
          maturity: "preliminary (report: most herbal formulations at the 'preliminary/hypothesis-generating stage')"
