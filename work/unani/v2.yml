    primary_regions:
      status: filled
      value: "India, Pakistan, Bangladesh, Sri Lanka, Iran (as Persian medicine), South Africa; practised in the Gulf, UK, US and EU mostly as cupping or herbal CAM; historical centres Baghdad, Persia, Mughal and Deccan India (Hyderabad, Lucknow, Delhi)."
