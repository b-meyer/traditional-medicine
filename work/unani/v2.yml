    balance_logic:
      status: filled
      value: "Health is the equilibrium of the four humours, expressed as the maintenance of one's proper mizaj along hot/cold and wet/dry axes. Therapy proceeds by contraries (a cold disease treated with hot-quality drugs/regimen) and by supporting tabiat. Treatment hierarchy runs regimen (ilaj bil-tadbir), diet (ilaj bil-ghiza), pharmacotherapy (ilaj bil-dawa) and, last, surgery (ilaj bil-yad)."
      citations:
        - source: "uncited in report"
          type: unclear
          citation_strength: unclear
      register: emic
      notes: null
    correspondence_system:
      status: filled
      value: "Two-axis quality system (hot/cold, wet/dry) linking elements, humours (each assigned a quality pair), and the temperaments of persons, organs, drugs and foods. Patients and drugs are classified by temperament."
