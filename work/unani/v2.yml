          type: aggregator
          citation_strength: indirect
      register: historical-scholarship
      notes: "S30 is cited for Seema Alavi's argument about the 'new Unani and new hakim', but it is a review of Attewell's book, not of Alavi's work. The Attewell claim reaches the report through a bookseller listing (S29). Liebeskind, Hardiman, Sivaramakrishnan, Schmidt Stiedenroth and the continuity defenders are uncited. The report gives a shared evidence base for each side, not one per scholar; per-scholar evidence_base entries marked 'per report's general characterization' come from that shared statement."
    report_adjudication:
      status: filled
      value: "The report holds that the weight of specialist scholarship favours a 'reconstruction on a real foundation' position. The textual lineage is genuine and continuous, but the modern institutional form (colleges, standardized pharmacopoeias, scientized curricula incorporating anatomy and biomedicine) is 'substantially a late-19th/20th-century reconstruction', a point on which it says 'most serious historians (Attewell, Alavi, Liebeskind, Speziale) agree'. It recommends distinguishing 'the texts' from 'the modern system' and not accepting '1,000 years of unbroken practice exactly as today' claims uncritically."
      citations:
        - source: "none (report's own stance)"
          type: unclear
          citation_strength: unclear
      register: historical-scholarship
      notes: "This is the report's stance, not consensus. The report counts Speziale among those agreeing on reconstruction, yet also says his work 'complicates both' sides."
  theoretical_primitives:
    constituents:
      status: filled
      value: "Arkan (four elements: fire, air, water, earth); akhlat (four humours: dam/blood hot-wet, balgham/phlegm cold-wet, safra/yellow bile hot-dry, sauda/black bile cold-dry); quwa (faculties: natural, vital, psychic); arwah (pneuma/vital spirits); tabiat (innate self-regulating/healing power, equivalent to physis)."
      citations:
        - source: "none (uncited in report)"
          type: unclear
          citation_strength: unclear
      register: emic
      notes: null
    balance_logic:
      status: filled
      value: "Health is equilibrium of the four humours, expressed as the individual's mizaj (temperament): a balance of qualities on the hot/cold and wet/dry axes, unique to each person, organ, drug and food. Health is the maintenance of one's proper mizaj. Therapy works by contraries (a cold disease is treated with hot-quality drugs or regimen) and by supporting tabiat."
      citations:
        - source: "none (uncited in report)"
          type: unclear
          citation_strength: unclear
      register: emic
      notes: null
    correspondence_system:
      status: partial
      value: "The qualities hot/cold and wet/dry underlie everything. Elements, humours, persons, organs, drugs and foods are all classified by these qualities (each humour is assigned a quality pair)."
      citations:
        - source: "none (uncited in report)"
          type: unclear
          citation_strength: unclear
      register: emic
      notes: "No wider correspondences (seasons, ages, organs-to-humours) are described."
    etiology:
      status: filled
      value: "Disease is a disturbance of mizaj (su' al-mizaj): simple (qualitative) or material (involving a morbid humour). Health is governed by asbab sitta daruriya, the six essential causes: air/environment; food and drink; movement and rest; sleep and wakefulness; retention and evacuation; psychic/emotional states."
      citations:
        - source: "none (uncited in report)"
          type: unclear
          citation_strength: unclear
      register: emic
      notes: null
    nosology:
      status: partial
      value: "Simple vs. material su' al-mizaj. Disease categories include, e.g., Waja' al-Mafasil (roughly joint/rheumatoid disease). Patients and drugs are classified by temperament rather than by pathophysiology."
      citations:
        - source: "none (uncited in report)"
          type: unclear
          citation_strength: unclear
      register: emic
      notes: "No systematic disease classification is given beyond one example and the simple/material distinction."
    relation_to_biomedical_anatomy:
      status: filled
      value: "Maps partially and loosely. Regimen and dietetics overlap with lifestyle medicine. Some materia medica is being screened pharmacologically. Some disease categories have rough analogues (Waja' al-Mafasil roughly rheumatoid/joint disease). Refuses mapping where it matters most: mizaj, the four humours, tabiat and arwah have no biomedical referents and are explicitly individual and qualitative, not quantitative/populational. This makes standardization for research difficult."
      citations:
        - source: "none (uncited in report)"
          type: unclear
          citation_strength: unclear
      register: historical-scholarship
      notes: "Anatomy specifically is discussed only as a colonial-era curricular import (field 9), not as a doctrinal mapping."
    translation_programs:
      status: partial
      value:
