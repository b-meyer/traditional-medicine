  # ---------------------------------------------------------------- 3
  construct_debate:
    positions:
      status: filled
      value:
        - scholar: "Guy Attewell"
          work: "Refiguring Unani Tibb: Plural Healing in Late Colonial India"
          year: 2007
          position: "Reconstruction. Unani identity was 'reconstituted' around 1900 through biomedical concepts, nationalist/communitarian politics and colonial models of legitimacy. It was heterogeneous rather than a single 'traditional Muslim system'."
          evidence_base: "19th-20th-c. print, institutional, legal and political archives (the report's characterization of the reconstruction side)"
        - scholar: "Seema Alavi"
          work: "Islam and Healing: Loss and Recovery of an Indo-Muslim Medical Tradition, 1600-1900 (2007); 'Unani Medicine in the Nineteenth-Century Public Sphere', IESHR (2005)"
          year: 2007
          position: "Reconstruction. A 'new Unani and a new hakim' emerged in the 19th-century Urdu public sphere, with emphasis shifting from mastery of theory to practice."
          evidence_base: "19th-c. Urdu print and public sphere (e.g. Oudh Akhbar newspaper)"
        - scholar: "Claudia Liebeskind"
          work: "'Arguing Science: Unani Tibb, Hakims and Biomedicine in India, 1900-50', in Ernst ed."
          year: 2002
          position: "Reconstruction. Documents the contest between biomedicine and the hakims."
          evidence_base: "20th-c. archival and print sources (report's general characterization)"
        - scholar: "David Hardiman"
          work: "not named"
          year: null
          position: "Reconstruction. Frames both Unani and Ayurveda as reinvented/'syndicated' in colonial India (following Charles Leslie and Romila Thapar's 'syndication' concept), as a 'cogent medical system with a well-defined structure'."
          evidence_base: "not specified beyond the reconstruction side's archival base"
        - scholar: "Kavita Sivaramakrishnan"
          work: "Old Potions, New Bottles: Recasting Indigenous Medicine in Colonial Punjab"
          year: 2006
          position: "Analogous recasting of indigenous medicine in colonial Punjab"
          evidence_base: "colonial Punjab archives (report's general characterization)"
        - scholar: "Neshat Quaiser"
          work: "not named"
          year: null
          position: "Listed among historians documenting how colonial pressure, print and the public sphere transformed Unani"
          evidence_base: "not specified"
        - scholar: "Kira Schmidt Stiedenroth"
          work: "Unani Medicine in the Making"
          year: 2020
          position: "Extends the reconstruction analysis to 21st-century India"
          evidence_base: "not specified"
        - scholar: "Unnamed critics of Iranian TPM"
          work: "not named"
          year: null
          position: "The 'Persian medicine' revival since 2007 is a substantially new, nationally branded construction layered onto medieval texts"
          evidence_base: "not specified"
        - scholar: "Continuity defenders: many within CCRUM, Hamdard and TPM faculties; bio-bibliographer the late Hakim Syed Zillur Rahman"
          work: "not named"
          year: null
          position: "Continuity. The textual lineage is genuinely unbroken (Galen -> Qanun -> Indian commentaries), and family/lineage practice has been continuous."
          evidence_base: "Textual/manuscript tradition and lineage practice (e.g. the Azizi family of Lucknow)"
        - scholar: "Fabrizio Speziale"
          work: "Culture persane et médecine ayurvédique en Asie du Sud (Brill); Perso-Indica project"
          year: 2018
          position: "Complicates both sides. Pre-colonial dynamism (the Persian-Ayurveda synthesis) undercuts the idea of a static 'pure' tradition that was either simply preserved or simply invented."
          evidence_base: "Persian translations of Sanskrit Ayurvedic sources, 14th c. onward"
      citations:
        - source: "[S29] Refiguring Unani Tibb (Plural Healing in Late Colonial India) | Exotic India Art (bookseller page) https://www.exoticindiaart.com/book/details/refiguring-unani-tibb-plural-healing-in-late-colonial-india-nag813/"
          type: catalog-listing
          citation_strength: indirect
          claim_match: matches
        - source: "[S30] Refiguring Unani Tibb: Plural Healing in Late Colonial India. By Guy Attewell (ResearchGate listing of a review of Attewell 2007) https://www.researchgate.net/publication/248666426_Refiguring_Unani_Tibb_Plural_Healing_in_Late_Colonial_India_By_Guy_Attewell_pp_xvi_316_Hyderabad_AP_Orient_Longman_2007"
          type: unclear
          citation_strength: indirect
          claim_match: mismatch
        - source: "[S31] Fabrizio Speziale - EHESS (ehess.academia.edu profile) https://ehess.academia.edu/FabrizioSpeziale"
          type: aggregator
          citation_strength: indirect
        - source: "Uncited in report (Liebeskind, Hardiman, Sivaramakrishnan, Quaiser, Schmidt Stiedenroth, TPM critics, continuity defenders)"
          type: unclear
          citation_strength: unclear
      register: historical-scholarship
      notes: "Report's own adjudication, recorded as the report's stance and not as consensus: 'the weight of specialist scholarship favors a \"reconstruction on a real foundation\" position'. The TL;DR claims 'most serious historians (Attewell, Alavi, Liebeskind, Speziale) agree' that the modern institutional form is substantially a late-19th/20th-c. reconstruction. Attewell's claim reaches the report only through a bookseller page (S29). [S30] is cited for Alavi's argument, but its bibliography entry is a ResearchGate record of a review of Attewell's book, not Alavi's work, so claim_match is mismatch. The source type of [S30] is unclear: it is a book review, and no codebook type fits."

  # ---------------------------------------------------------------- 4
  theoretical_primitives:
    constituents:
      status: filled
      value:
        - "Arkan: four elements (fire, air, water, earth), whose qualities (hot/cold, wet/dry) underlie everything"
        - "Akhlat: four humours. Dam (blood, hot-wet), balgham (phlegm, cold-wet), safra (yellow bile, hot-dry), sauda (black bile, cold-dry)"
        - "Mizaj: temperament, the resultant balance of qualities unique to each person, organ, drug and food"
        - "Quwa: faculties/powers (natural, vital, psychic)"
        - "Arwah: pneuma/vital spirits"
        - "Tabiat: the body's innate self-regulating/healing power, equivalent to physis"
      citations:
        - source: "Uncited in report (Details section 2)"
          type: unclear
          citation_strength: unclear
      register: emic
      notes: null
    balance_logic:
      status: filled
      value: "Health is the maintenance of one's proper mizaj, an equilibrium of the four humours across the hot/cold and wet/dry axes. Therapy proceeds by contraries (a cold disease is treated with hot-quality drugs or regimen) and by supporting tabiat. Therapeutic hierarchy: regimen (ilaj bil-tadbir), diet (ilaj bil-ghiza), pharmacotherapy (ilaj bil-dawa) and, last, surgery (ilaj bil-yad)."
      citations:
        - source: "Uncited in report (Details section 2)"
          type: unclear
          citation_strength: unclear
      register: emic
      notes: null
    correspondence_system:
      status: partial
      value: "Four qualities (hot, cold, wet, dry) link the elements, the humours (each assigned a quality pair), and the temperaments of persons, organs, drugs and foods. Patients and drugs are classified by temperament."
      citations:
        - source: "Uncited in report (Details section 2)"
          type: unclear
          citation_strength: unclear
      register: emic
      notes: "Beyond the quality pairs, the report does not set out correspondences to seasons, ages, organs or tastes."
    etiology:
      status: filled
      value: "Asbab sitta daruriya, the six essential/non-natural causes governing health: (1) air/environment, (2) food and drink, (3) movement and rest, (4) sleep and wakefulness, (5) retention and evacuation, (6) psychic/emotional states. Disease is a disturbance of mizaj (su' al-mizaj)."
      citations:
        - source: "Uncited in report (Details section 2)"
          type: unclear
          citation_strength: unclear
      register: emic
      notes: null
    nosology:
      status: partial
      value: "Su' al-mizaj (distemperament) is either simple (qualitative) or material (involving a morbid humour). The Qanun organizes diseases as localized and general. Example category: Waja' al-Mafasil (joint disease)."
      citations:
        - source: "Uncited in report (Details sections 1-2)"
          type: unclear
          citation_strength: unclear
      register: emic
      notes: "No fuller disease classification is given."
    relation_to_biomedical_anatomy:
      status: filled
      value: "Maps partially and loosely. Regimen and dietetics overlap with modern lifestyle medicine; some disease categories have rough biomedical analogues (Waja' al-Mafasil ~ rheumatoid/joint disease, as Unani researchers note). Refuses mapping where it matters most: mizaj, the four humours, tabiat and arwah 'have no biomedical referents' and are explicitly individual and qualitative, not quantitative or populational. The system classifies patients and drugs by temperament rather than by pathophysiology or molecular mechanism. Separately, 20th-c. reformers deliberately incorporated Western anatomy, physiology, pathology and surgery into curricula."
      citations:
        - source: "Uncited in report (Details sections 2 and 4)"
          type: unclear
          citation_strength: unclear
      register: historical-scholarship
      notes: "The report says this non-mapping is why research standardization is so difficult."
    translation_programs:
      status: partial
      value:
        - program: "Pharmacological screening of Unani materia medica"
