          fields_affected: [legal_status.jurisdictions, safety.regulatory_actions_taken, safety.evidence_borrowed_from_other_traditions, contemporary_controversies.integration_disputes]
          description: "Unani is regulated with Ayurveda and Siddha as ASU drugs, under the Ministry of AYUSH, and with Siddha and Sowa-Rigpa under an NCISM board; report notes toxicology and pharmacopoeial sources aggregate ASU, and the mixopathy dispute examples include Ayurvedic surgery."
        - tradition: "Homoeopathy (Pakistan)"
          relation: regulatory_grouping
          fields_affected: [legal_status.jurisdictions, safety.adulteration_and_contamination]
          description: "Pakistan's 1965 Act covers Unani, Ayurvedic and Homoeopathic practitioners; 2024 move to merge NCT with the National Council for Homeopathy; the 1981 steroid study tested Unani and homeopathic samples together."
        - tradition: "Greek/Galenic European medicine"
          relation: sibling
          fields_affected: [canon_and_transmission.foundational_texts, canon_and_transmission.key_figures]
          description: "Report states demonstrated common descent from the Hippocratic-Galenic humoral source; shared ancestry, not borrowing."
        - tradition: "Prophetic medicine (Tibb al-Nabawi)"
          relation: sibling
          fields_affected: [contact_and_borrowing.relationships]
          description: "Partly incorporated into vernacular Unani in colonial India, but scholars treat it and academic Unani as historically distinct strands."
      citations:
        - source: "none (uncited in report)"
          type: unclear
          citation_strength: unclear
      register: historical-scholarship
      notes: "Relation for Tibb al-Nabawi is an imperfect fit (the report describes a distinct strand partly absorbed, not a common-origin sibling). Chinese and Tibetan medicine are treated by the report as convergent, not boundary traditions, and appear only in field 15."
