      notes: "The report describes no wider cosmological or seasonal scheme; element-quality-humour pairings sit inside the constituent scheme. The report does not state explicitly that none exists, so this is inferred from its silence; verify."
    etiology:
      status: filled
      value: "Disease is a disturbance of mizaj (su' al-mizaj), simple (qualitative) or material (involving a morbid humour); health governed by the asbab sitta daruriya (six essentials: air/environment, food and drink, movement and rest, sleep and wakefulness, retention and evacuation, psychic/emotional states)."
