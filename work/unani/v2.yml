      register: emic
      notes: null
    relation_to_biomedical_anatomy:
      status: filled
      value: "Maps partially and loosely: regimen and dietetics overlap with lifestyle medicine, some materia medica is being screened pharmacologically, some disease categories have rough analogues. Core objects (mizaj, humours, tabiat, arwah) have no biomedical referents and are explicitly qualitative and individual; the system 'refuses' mapping where it matters most. Modern curricula nevertheless incorporate anatomy and physiology (see field 9)."
