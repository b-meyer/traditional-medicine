      status: partial
      value: "Report says warm/cold is assessed more reliably than wet/dry, and that no independent gold standard exists for mizaj. It does not separate agreement on individual observable signs from agreement on the integrated judgment. It states it found no kappa-based reliability study of pulse (nabz) diagnosis."
