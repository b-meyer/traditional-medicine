  construct_debate:
    positions:
      status: filled
      value:
        - scholar: "Guy Attewell"
          work: "Refiguring Unani Tibb: Plural Healing in Late Colonial India"
          year: "2007"
          position: "Reconstruction: Unani identity was 'reconstituted' around 1900 through biomedical concepts, nationalist/communitarian politics and colonial models of legitimacy; heterogeneous rather than a single 'traditional Muslim system.'"
          evidence_base: "19th–20th c. print, institutional, legal and political archives (report's characterization of the reconstruction side)"
        - scholar: "Seema Alavi"
          work: "Islam and Healing: Loss and Recovery of an Indo-Muslim Medical Tradition, 1600–1900; and 'Unani Medicine in the Nineteenth-Century Public Sphere' (IESHR)"
          year: "2007; 2005"
          position: "Reconstruction: a 'new Unani and a new hakim' emerged in the 19th-century Urdu public sphere, with emphasis shifting from theory-mastery to practice."
          evidence_base: "19th-c. Urdu print/public sphere (e.g., Oudh Akhbar)"
        - scholar: "Claudia Liebeskind"
          work: "'Arguing Science: Unani Tibb, Hakims and Biomedicine in India, 1900–50,' in Ernst ed."
          year: "2002"
          position: "Reconstruction side: documents the biomedicine-vs-hakim contest."
          evidence_base: "not specified beyond the reconstruction side's archival base"
        - scholar: "David Hardiman"
          work: "not named in report"
          year: "not given"
          position: "Unani and Ayurveda were reinvented/'syndicated' in colonial India into a 'cogent medical system with a well-defined structure' (following Charles Leslie and Romila Thapar's 'syndication' concept)."
          evidence_base: "not specified"
        - scholar: "Kavita Sivaramakrishnan"
          work: "Old Potions, New Bottles: Recasting Indigenous Medicine in Colonial Punjab"
          year: "2006"
          position: "Analogous recasting of indigenous medicine in colonial Punjab."
          evidence_base: "not specified"
        - scholar: "Neshat Quaiser"
          work: "not named in report"
          year: "not given"
          position: "Among historians documenting the transformation of Unani from lineage-based elite practice into a public, professionalized 'modern' system under colonial pressure."
          evidence_base: "not specified"
        - scholar: "Kira Schmidt Stiedenroth"
          work: "Unani Medicine in the Making"
          year: "2020"
          position: "Extends the reconstruction analysis to 21st-century India."
          evidence_base: "not specified"
        - scholar: "Unnamed critics of the Iranian TPM revival"
          work: "not named"
          year: "not given"
          position: "The 'Persian medicine' revival since 2007 is a substantially new, nationally branded construction layered onto medieval texts."
          evidence_base: "not specified"
        - scholar: "Continuity defenders — many within CCRUM, Hamdard, TPM faculties; bio-bibliographers such as the late Hakim Syed Zillur Rahman"
          work: "not named"
          year: "not given"
          position: "Continuity: a genuinely unbroken textual lineage (Galen→Qanun→Indian commentaries) and continuous family/lineage practice."
          evidence_base: "Textual/manuscript tradition and lineage practice (e.g., Azizi family of Lucknow)"
        - scholar: "Fabrizio Speziale"
          work: "Culture persane et médecine ayurvédique en Asie du Sud (Brill); Perso-Indica project"
          year: "2018"
          position: "Complicates both sides: pre-colonial dynamism (Persian-Ayurveda synthesis) undercuts the idea of a static 'pure' tradition that was either simply preserved or simply invented."
          evidence_base: "Persian translations of Sanskrit/Ayurvedic sources from the 14th century onward"
      citations:
        - source: "[S29] Refiguring Unani Tibb (Plural Healing in Late Colonial India) | Exotic India Art (https://www.exoticindiaart.com/book/details/refiguring-unani-tibb-plural-healing-in-late-colonial-india-nag813/)"
          type: catalog-listing
          citation_strength: indirect
        - source: "[S30] Refiguring Unani Tibb: Plural Healing in Late Colonial India. By Guy Attewell (ResearchGate) (https://www.researchgate.net/publication/248666426_Refiguring_Unani_Tibb_Plural_Healing_in_Late_Colonial_India_By_Guy_Attewell_pp_xvi_316_Hyderabad_AP_Orient_Longman_2007)"
          type: tertiary-review
          citation_strength: unclear
        - source: "[S31] Fabrizio Speziale - EHESS (academia.edu profile) (https://ehess.academia.edu/FabrizioSpeziale)"
          type: aggregator
          citation_strength: indirect
        - source: "uncited in report (Liebeskind, Hardiman, Sivaramakrishnan, Quaiser, Schmidt Stiedenroth, TPM critics, continuity defenders)"
          type: unclear
          citation_strength: unclear
      register: historical-scholarship
      notes: "Report's own adjudication, not consensus: 'the weight of specialist scholarship favors a \"reconstruction on a real foundation\" position.' The TL;DR says 'most serious historians (Attewell, Alavi, Liebeskind, Speziale) agree' the modern institutional form is substantially a late-19th/20th-c. reconstruction. Section 8 instead places Speziale as complicating both sides, so the report is internally inconsistent. Citation problems: Attewell's argument is reached only through a bookseller listing (S29). S30 is a ResearchGate entry for a review of Attewell's book, but the report attaches it to Seema Alavi's claims, so the source-claim match is doubtful. Speziale is cited through an academia.edu profile page (S31)."
