    practitioner_response:
      status: partial
      value: "Hakim Ajmal Khan (1868-1927) led reform: Ayurvedic and Unani Tibbia College, Karol Bagh, Delhi (foundation stone 1916 by Lord Hardinge; inaugurated 1921 by Gandhi); Hindustani Dawakhana; the Central College. He proposed absorbing Western anatomy, surgery and biomedical concepts. He was President of the Indian National Congress (1921) and a Khilafat and Non-cooperation leader. Hamdard was founded by Hakim Hafiz Abdul Majeed as a Delhi clinic in 1906, and Rooh Afza launched in 1907. Hakims Nasiruddin Ahmed Khan and Hassan Qarshi sat on the Chopra Committee (1948). Vernacular (Urdu) print and newspapers (e.g. Oudh Akhbar) were used in the public sphere."
      citations:
        - source: "[S5] History | A & U Tibbia College & Hospital — https://autch.delhi.gov.in/autch/history"
