        - audience: "researchers/clinicians evaluating Unani claims"
          text: "Treat the history as solid but distinguish 'the texts' from 'the modern system'. Cite Attewell (2007), Alavi (2007), Liebeskind (2002) and Speziale (2018) for the reconstruction thesis, and Hunayn's Risala (Lamoreaux 2016) and the Qanun manuscript scholarship (Historia Medica; Janssens) for the textual lineage. Do not accept '1,000 years of unbroken practice exactly as today' claims uncritically."
        - audience: "researchers/clinicians evaluating Unani claims"
          text: "When assessing diagnostic reliability, cite the actual kappa/ICC values (mizaj ICC ~0.62-0.64; kappa ranges 0.08-0.82). State plainly that agreement is slight-to-moderate and that no gold standard exists. Flag the absence of Unani pulse-diagnosis reliability data."
        - audience: "researchers/clinicians evaluating Unani claims"
          text: "For efficacy, default to systematic reviews, not individual CCRUM/college trials. Rate cupping-for-musculoskeletal-pain as the least-weak case (short-term only) and treat herbal formulations as preliminary. Demand independent replication, adequate blinding and pre-registration before upgrading any recommendation."
        - audience: "clinicians (and patients via counselling)"
          text: "On safety, insist on heavy-metal certificates for any kushta/mineral/surma preparation and screen for undeclared steroids in 'fast-acting' anti-inflammatory Unani products. Counsel patients about hijama infection risk and about delayed care."
      citations: []
