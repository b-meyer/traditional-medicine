  construct_debate:
    positions:
      status: filled
      value:
        - scholar: "Guy Attewell"
          work: "Refiguring Unani Tibb: Plural Healing in Late Colonial India"
          year: 2007
          position: "Unani identity was reconstituted around 1900 through biomedical concepts, nationalist and communitarian politics, and colonial models of legitimacy; it was heterogeneous, not a single traditional Muslim system."
          evidence_base: "19th-20th c. print, institutional, legal and political archives (as characterized by the report)"
        - scholar: "Seema Alavi"
          work: "Islam and Healing: Loss and Recovery of an Indo-Muslim Medical Tradition, 1600-1900; 'Unani Medicine in the Nineteenth-Century Public Sphere' (IESHR)"
          year: "2007; 2005"
          position: "A new Unani and a new hakim emerged in the 19th-century Urdu public sphere, with emphasis shifting from theory-mastery to practice."
          evidence_base: "Archival and print-culture sources (as characterized by the report)"
        - scholar: "Claudia Liebeskind"
          work: "Arguing Science: Unani Tibb, Hakims and Biomedicine in India, 1900-50 (in Ernst ed.)"
          year: 2002
          position: "Documents the biomedicine-versus-hakim contest."
          evidence_base: "Historical archival (not detailed)"
        - scholar: "David Hardiman"
          work: "Not named in the report"
          year: null
          position: "Frames Unani and Ayurveda as reinvented or 'syndicated' in colonial India (following Charles Leslie and Romila Thapar); a 'cogent medical system with a well-defined structure' was made."
          evidence_base: "Not detailed"
        - scholar: "Kavita Sivaramakrishnan"
          work: "Old Potions, New Bottles: Recasting Indigenous Medicine in Colonial Punjab"
          year: 2006
          position: "Shows analogous recasting of indigenous medicine."
          evidence_base: "Colonial Punjab (not detailed)"
        - scholar: "Kira Schmidt Stiedenroth"
          work: "Unani Medicine in the Making"
          year: 2020
          position: "Extends the reconstruction analysis to 21st-century India."
          evidence_base: "Not detailed"
        - scholar: "Fabrizio Speziale"
          work: "Culture persane et médecine ayurvédique en Asie du Sud (Brill)"
          year: 2018
          position: "Shows pre-colonial dynamism (Persian-Ayurveda synthesis), complicating both the 'simply preserved' and the 'simply invented' views."
          evidence_base: "Persian translations of Sanskrit medical texts (Perso-Indica project)"
        - scholar: "Continuity side: defenders within CCRUM, Hamdard, TPM faculties, and bio-bibliographers such as the late Hakim Syed Zillur Rahman"
          work: "Not named"
          year: null
          position: "Genuine unbroken textual lineage (Galen to Qanun to Indian commentaries) and continuous family or lineage practice."
          evidence_base: "Textual and manuscript tradition; lineage practice (e.g. the Azizi family of Lucknow)"
        - scholar: "Unnamed critics of the Iranian revival"
          work: "Not named"
          year: null
          position: "The Persian medicine (TPM) revival since 2007 is a substantially new, nationally branded construction layered onto medieval texts."
          evidence_base: "Not stated"
      citations:
        - source: "Refiguring Unani Tibb | Exotic India Art (bookseller listing) [S29]"
          type: catalog-listing
          citation_strength: indirect
        - source: "Refiguring Unani Tibb by Guy Attewell (ResearchGate) [S30], cited in the report for the Alavi claim"
          type: unclear
          citation_strength: indirect
          claim_match: mismatch
        - source: "Fabrizio Speziale, EHESS profile (Academia.edu) [S31]"
          type: aggregator
          citation_strength: indirect
        - source: "Report text for the remaining scholars (no citation marker)"
          type: unclear
          citation_strength: unclear
      register: historical-scholarship
      notes: "S30 is an Attewell review or record but the report cites it for Alavi's argument, so it is flagged mismatch. Continuity-side defenders are described generically, not by named works. The Hardiman and Zillur Rahman citations are absent."
    report_adjudication:
      status: filled
      value: "The report says the weight of specialist scholarship favors 'reconstruction on a real foundation': a genuine textual lineage from Galen to the Qanun, with a modern institutional form (colleges, standardized pharmacopoeias, scientized curricula) that is substantially a late-19th/20th-century reconstruction. It advises separating 'the texts' from 'the modern system' and not accepting '1,000 years of unbroken practice exactly as today' uncritically."
      citations:
        - source: "Report's own synthesis (no citation)"
          type: unclear
          citation_strength: unclear
      register: historical-scholarship
      notes: "This is the report's stance, not consensus."
  theoretical_primitives:
    constituents:
      status: filled
      value: "Arkan (four elements: fire, air, water, earth); akhlat (four humours: dam/blood, balgham/phlegm, safra/yellow bile, sauda/black bile); mizaj (temperament); quwa (natural, vital, psychic faculties); arwah (pneuma/spirits); tabiat (innate self-regulating/healing power, equivalent to physis)."
      citations:
        - source: "Report text (no citation)"
          type: unclear
          citation_strength: unclear
      register: emic
      notes: null
    balance_logic:
      status: filled
      value: "Health is maintenance of one's proper mizaj (equilibrium of qualities across hot/cold and wet/dry axes), unique to each person, organ, drug and food. Therapy is by contraries (a cold disease is treated with hot-quality drugs or regimen) and by supporting tabiat."
      citations:
        - source: "Report text (no citation)"
          type: unclear
          citation_strength: unclear
      register: emic
      notes: null
    correspondence_system:
      status: partial
      value: "Elements and humours map to quality pairs: blood hot-wet, phlegm cold-wet, yellow bile hot-dry, black bile cold-dry. Qualities also apply to drugs and foods. The report describes no wider correspondence system (seasons, organs, planets)."
      citations:
        - source: "Report text (no citation)"
          type: unclear
          citation_strength: unclear
      register: emic
      notes: "The codebook's correspondence framing (as in five-phase systems) fits only loosely."
    etiology:
      status: filled
      value: "Disease is a disturbance of mizaj (su' al-mizaj), simple (qualitative) or material (involving a morbid humour). Health is governed by the asbab sitta daruriya: air/environment, food and drink, movement and rest, sleep and wakefulness, retention and evacuation, psychic and emotional states."
      citations:
        - source: "Report text (no citation)"
          type: unclear
          citation_strength: unclear
      register: emic
      notes: null
    nosology:
      status: partial
      value: "Two broad classes (simple/qualitative and material disease). Some categories have rough biomedical analogues, for example Waja' al-Mafasil approximately rheumatoid or joint disease, as Unani researchers themselves note."
      citations:
        - source: "Report text (no citation)"
          type: unclear
          citation_strength: unclear
      register: emic
      notes: "The report gives no full nosological scheme."
    relation_to_biomedical_anatomy:
      status: filled
      value: "Maps partially and loosely (regimen and dietetics overlap with lifestyle medicine; some disease categories and materia medica have analogues). Refuses mapping for mizaj, the four humours, tabiat and arwah, which have no biomedical referents and are explicitly individual and qualitative. Unani classifies patients and drugs by temperament, not pathophysiology or molecular mechanism."
      citations:
        - source: "Report text (no citation)"
          type: unclear
          citation_strength: unclear
      register: historical-scholarship
      notes: "The report says this refusal makes standardization for research difficult. Late-19th/20th-century reformers nevertheless added anatomy and surgery to curricula (see field 9)."
    translation_programs:
      status: partial
      value: "Materia medica is 'being screened pharmacologically'; Unani researchers propose biomedical analogues for disease categories. Salimuzzaman Siddiqi's chemical research on Unani medicinal plants gave the system a laboratory-science direction. No stated maturity level (established, preliminary or speculative) except that most herbal formulations are described elsewhere as preliminary or hypothesis-generating."
      citations:
        - source: "Report text (no citation)"
          type: unclear
          citation_strength: unclear
      register: biomedical-evidence
      notes: "The maturity rating is inferred only from the report's evidence bottom line; the report does not label translation programs."
