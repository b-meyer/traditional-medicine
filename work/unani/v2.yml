    system_boundary:
      status: filled
      value:
        - tradition: "Ayurveda and Siddha (ASU grouping)"
          relation: regulatory_grouping
          fields_affected: [legal_status.jurisdictions, safety.regulatory_actions_taken, safety.evidence_borrowed_from_other_traditions, safety.adulteration_and_contamination]
          description: "Drugs and Cosmetics Act Chapter IVA, pharmacovigilance and heavy-metal limits regulate Ayurvedic, Siddha and Unani drugs together. The report says some cited limits and surveys are ASU-wide, not Unani-only."
        - tradition: "Sowa-Rigpa (Tibetan)"
          relation: regulatory_grouping
          fields_affected: [legal_status.jurisdictions]
          description: "Administratively grouped with Unani under India's NCISM (Board of Unani, Siddha and Sowa-Rigpa); the report says it is a separate tradition."
        - tradition: "Traditional Persian Medicine (Iran)"
          relation: same_system_variant
          fields_affected: [diagnostics.reliability_evidence, diagnostics.standardization_efforts, legal_status.jurisdictions, education_and_licensure.degree_programs, contemporary_controversies.politicized_episodes, construct_debate.positions]
          description: "Most mizaj reliability studies are Iranian Persian-medicine studies. The report presents them as evidence for Unani and treats the Iranian revival as a parallel Persian-medicine branch."
        - tradition: "Tibb al-Nabawi (Prophetic medicine)"
          relation: absorbed_strand
          fields_affected: [contact_and_borrowing.relationships]
          description: "Partly incorporated into vernacular Unani in colonial India (Sufi and Prophetic healing practices), but scholars treat it as a historically distinct strand from academic Unani."
        - tradition: "Premodern Greco-Arabic and Indo-Muslim practice (Galen to Qanun to Indian commentaries)"
          relation: premodern_predecessor
          fields_affected: [construct_debate.positions, construct_debate.report_adjudication, revival_and_institutionalization.standardization_events]
          description: "The report separates 'the texts' from 'the modern system' (colleges, pharmacopoeias, scientized curricula), which it calls a late-19th/20th-century reconstruction on a real textual foundation."
      citations:
        - source: "National Commission for Indian System of Medicine (Wikipedia) [S8]"
