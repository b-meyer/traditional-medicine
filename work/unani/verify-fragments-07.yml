  - path: safety.regulatory_actions_taken
    outcome: corrected
    field:
      status: filled
      value:
        - action: "Central Government order (Department of AYUSH, F. No. K-11020/5/97-DCC) under Section 33EEB of the Drugs and Cosmetics Act 1940 mandating heavy-metal testing (As, Pb, Hg, Cd) of every batch of purely herbal ASU drugs for export, with 'Heavy Metals within Permissible Limits' displayed on the container; limits for As, Pb and Cd as per WHO guidelines, mercury 1 ppm"
          date: issued 2005-10-14; effective 2006-01-01
        - action: "Permissible limits for herbal products: lead 10 ppm, arsenic 3 ppm, mercury 1 ppm, cadmium 0.3 ppm (Ayurvedic Pharmacopoeia of India Part-I Vol-VII)"
          date: 2008
        - action: "Intentionally metallic preparations (rasa-shastra bhasmas and, by analogy, Unani kushtas) assessed under separate criteria rather than failed against the 10 ppm herbal ceiling ('critical loophole')"
          date: not stated
        - action: National Pharmacovigilance Programme for ASU drugs launched; lapsed for lack of support; later reconstituted
          date: 2008 (reconstitution date not stated)
      citations:
        - source: "Government of India, Ministry of Health and Family Welfare. Lok Sabha Starred Question No. 15, answer on heavy metals in ASU drugs (Digital Sansad eparlib item 123456789/519511)"
          type: institutional
          citation_strength: direct
        - source: "Press Information Bureau, Ministry of AYUSH. Ministry of AYUSH introduced new Central Sector scheme for promoting Pharmacovigilance of AYUSH Drugs (PIB relid 181886)"
          type: institutional
          citation_strength: direct
      register: regulatory
      notes: "Corrected item 1. The ministry's parliamentary answer describes the 14 October 2005 order as issued under Section 33EEB of the Drugs and Cosmetics Act, effective 1 January 2006, applying to purely herbal ASU drugs for export (the report said ASU drugs generally). It also gives the order's own limits: WHO guidelines for arsenic, lead and cadmium, and 1 ppm for mercury. The answer was read through its indexed text because eparlib.sansad.in was blocked for direct fetch. Items 2-4 are carried over but not verified directly. Item 2: the 10/3/1/0.3 ppm figures are widely attributed to the API, but the Part-I Vol-VII text could not be opened and that volume attribution is unconfirmed. Item 3: the carve-out and the 'critical loophole' wording are the report's characterization, with no primary source checked. Item 4: the 29 September 2008 launch is attested, and the PIB release confirms a new Central Sector pharmacovigilance scheme for ASU&H drugs approved on 1 November 2017 and rolled out at the end of FY 2017-18. No primary source was found for the claim that the 2008 programme lapsed for lack of support. The Scribd and Auriga Research citations are dropped."
    searches:
      - "AYUSH order K-11020/5/97-DCC heavy metals export 14 October 2005"
