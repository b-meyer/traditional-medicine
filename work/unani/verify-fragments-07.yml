system: unani
pass: verify
updates:
  - path: safety.intrinsic_toxicity
    outcome: confirmed
    field:
      status: filled
      value:
        - agent: Lead compounds formularized as Unani ingredients (Usrub, Isfidaj, Suranj, Murdar sang, Ithmid), given orally as kushtas
          mechanism_class: heavy metal
          detail: "Authors acknowledge toxicity (Ithmid 'not recommended for oral use due to toxic effects'; Murdar sang oral intake 'is harmful and can cause dysuria'). Lead distributes to liver, kidney and brain, causing encephalopathy, neuropathy and nephropathy."
        - agent: Kushta Sammulfar (arsenic trioxide)
          mechanism_class: heavy metal
          detail: Formularized Unani ingredient.
        - agent: Surma/kohl (ithmid/galena)
          mechanism_class: heavy metal
          detail: "Lead 'as high as 86%' (Aslam, Davis & Healy, Public Health 1979); 0.03%-81.37% lead in 40 Rawalpindi/Islamabad samples (Haq & Khan, JPMA 1982). Enough to cause chronic lead poisoning with regular use."
        - agent: Hijama (wet cupping)
          mechanism_class: procedural
          detail: Infections attributed to non-sterile technique and untrained practitioners.
        - agent: Undeclared corticosteroids in products
          mechanism_class: pharmaceutical adulterant
          detail: "Explains dramatic 'cures' in arthritis/asthma."
        - agent: Reliance on traditional medicine
          mechanism_class: indirect
          detail: Delayed biomedical care is a recognized systemic risk; hard Unani-specific outcome data are limited.
      citations:
        - source: "Mustehasan; Azhar M (CCRUM / RRIUM Aligarh). Usrub (lead) and its compounds used in Unani Medicine: Overview. Asian Journal of Research in Chemistry 2022;15(5):358-366. doi:10.52711/0974-4150.2022.00064"
          type: primary-study
          citation_strength: direct
        - source: "Aslam M, Davis SS, Healy MA. Heavy metals in some Asian medicines and cosmetics. Public Health 1979;93(5):274-284. doi:10.1016/S0033-3506(79)80078-5"
          type: primary-study
          citation_strength: direct
        - source: "Haq I, Khan C. Lead content of surma (Drugs Control and Research Division, NIH Islamabad). Journal of the Pakistan Medical Association 1982;32(7)"
          type: primary-study
          citation_strength: direct
      register: biomedical-evidence
      notes: "Verified the two worklisted inline citations plus Haq & Khan. Mustehasan & Azhar 2022 exists as cited (AJRC 15(5):358-366, CCRUM/RRIUM authors); its abstract lists Usrub, Aabar, Isfidaj, Suranj, Murdar sang and Ithmid, says lead is recommended mainly for external use because of its toxicity and that the calx (kushta) form is recommended for oral use. The two verbatim quotes (Ithmid, Murdar sang/dysuria) and the organ-distribution sentence could not be checked against full text (publisher, ResearchGate and ProQuest pages blocked); they are carried over from the report. Aslam, Davis & Healy 1979 confirmed: abstract reports surma samples with lead 'as high as 86%' and mercury, lead and arsenic in kushtay. One index gives pages 274-278 rather than 274-284; 274-284 retained. Haq & Khan JPMA 1982;32(7) confirmed: 40 samples from Rawalpindi/Islamabad, half contained lead, range 0.03%-81.37%. Kushta Sammulfar as a formulary preparation is consistent with the National Formulary of Unani Medicine method cited in Ansari & Wadud's chronic-toxicity study. Items 4-6 (hijama, corticosteroids, reliance) were not on the worklist citation and keep the report's own sourcing; they were not re-verified here."
    searches:
      - "Mustehasan Azhar lead Unani medicine Asian Journal of Research in Chemistry 2022"
      - "Usrub lead Unani Ithmid \"not recommended for oral use\" Murdar sang dysuria"
      - "Mustehasan Azhar Usrub lead Unani DOI 10.52711 ajrc 2022 abstract Ithmid toxic effects encephalopathy nephropathy"
      - "Aslam Davis Healy 1979 Public Health heavy metals surma lead 86%"
      - "\"Heavy metals in some Asian medicines and cosmetics\" Aslam Davis Healy Public Health 1979 93"
      - "Haq Khan 1982 JPMA surma lead content Rawalpindi Islamabad"
      - "Unani kushta Sammulfar arsenic trioxide formulary"
  - path: safety.documented_adverse_events
    outcome: confirmed
    field:
      status: filled
      value:
        - event: Disseminated Staphylococcus aureus with multi-organ injury after scarification cupping
          type: case report
          citation: "Wang YY, Fan HW, Huang XM, Jiao Y. BMC Complement Med Ther 2023;23:94 (PMC10061885)"
        - event: Sacroiliac joint abscess and osteomyelitis after wet cupping
          type: case report
          citation: S24
        - event: Necrotizing fasciitis after cupping
          type: case report
          citation: "Alajmi T, Aljulaihim A, Alzahrani M, Aljuhayyiam S. Cureus 2021 (PMC8059418; PMID 33898125)"
        - event: Death after consecutive-day hijama by an unlicensed practitioner
          type: case report
          citation: "Emiral E, Demir ES, Değirmenci B, Dinçer B, Doğan M, Üzün İ. J Forensic Leg Med 2025"
        - event: South Asian immigrant lead-poisoning clusters in the UK traced to surma
          type: clusters (design not stated)
          citation: S22 (sentence-level)
      citations:
        - source: "Wang YY, Fan HW, Huang XM, Jiao Y. Disseminated Staphylococcus aureus infection after scarification wet cupping therapy: a case report and literature review. BMC Complementary Medicine and Therapies 2023;23:94. doi:10.1186/s12906-023-03932-x"
          type: primary-study
          citation_strength: direct
        - source: "Alajmi T, Aljulaihim A, Alzahrani M, Aljuhayyiam S. Necrotizing Fasciitis Following Wet Cupping: A Case Report. Cureus 2021. PMID 33898125; PMC8059418"
          type: primary-study
          citation_strength: direct
        - source: "Emiral E, Demir ES, Değirmenci B, Dinçer B, Doğan M, Üzün İ. Death associated with wet cupping therapy (hijama): A case report. Journal of Forensic and Legal Medicine 2025 (online 28 June 2025; ScienceDirect PII S1752928X25001234)"
          type: primary-study
          citation_strength: direct
      register: biomedical-evidence
      notes: "Three inline identifiers resolved to their articles. PMC10061885: 33-year-old immunocompetent woman with disseminated S. aureus, acute liver and kidney injury, iliopsoas abscess and GI bleeding after wet cupping. PMC8059418: 35-year-old man with Pseudomonas-positive necrotizing fasciitis after wet cupping who refused surgery and died. JFLM 2025: 40-year-old man, sudden cardiac death after hijama on consecutive days by an unlicensed practitioner; authors state a direct causal link cannot be definitively proven. S24 and S22 were not on the worklist and keep the report's citations."
    searches:
      - "PMC10061885 cupping Staphylococcus aureus"
