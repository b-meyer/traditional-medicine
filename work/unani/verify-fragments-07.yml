      - "PMC8059418 necrotizing fasciitis cupping"
      - "\"Necrotizing Fasciitis Following Wet Cupping: A Case Report\" Cureus 2021 authors"
      - "Journal of Forensic and Legal Medicine 2025 death hijama wet cupping unlicensed practitioner consecutive days"
