          type: primary-study
          citation_strength: direct
          claim_match: matches
        - source: "Alajmi T, Aljulaihim A, Alzahrani M, Aljuhayyiam S. Necrotizing fasciitis following wet cupping: a case report. Cureus 2021. doi:10.7759/cureus.14039 (PMC8059418)"
          type: primary-study
          citation_strength: direct
          claim_match: matches
        - source: "Emiral E, Demir ES, Değirmenci B, Dinçer B, Doğan M, Üzün İ. Death associated with wet cupping therapy (hijama): a case report. Journal of Forensic and Legal Medicine 2025;114:102922. doi:10.1016/j.jflm.2025.102922"
          type: primary-study
          citation_strength: direct
          claim_match: matches
      register: biomedical-evidence
      notes: "The three inline identifiers now resolve to full citations. PMC10061885: a 33-year-old immunocompetent woman had MSSA infection with acute liver and kidney injury, iliopsoas abscess and GI bleeding after scarification wet cupping, and recovered. The case is from China and involves generic wet cupping, not Unani-labelled hijama. PMC8059418: Pseudomonas necrotizing fasciitis in a 35-year-old man after wet cupping, with death from pulmonary embolism. J Forensic Leg Med 2025: sudden cardiac death of a 40-year-old man after hijama on consecutive days by an unlicensed practitioner; the authors say causality is plausible but not proven. The S24 and S22 items were not among the flagged citations and keep the report's original bibliography references."
    searches:
      - PMC10061885 (direct fetch)
      - PMC8059418 (direct fetch)
      - Journal of Forensic and Legal Medicine 2025 death hijama wet cupping consecutive days unlicensed practitioner
      - Crossref bibliographic query for the three case reports
  - path: safety.regulatory_actions_taken
    outcome: corrected
    field:
      status: filled
      value:
        - action: "Central Government order F. No. K-11020/5/97-DCC (Department of AYUSH), under section 33EEB of the Drugs and Cosmetics Act 1940, mandating heavy-metal testing (As, Pb, Hg, Cd) of every batch of purely herbal ASU drugs for export, with containers labelled 'Heavy Metals within permissible limits'. Limits for As, Pb and Cd follow WHO guidelines; mercury is 1 ppm."
          date: issued 2005-10-14; effective 2006-01-01
        - action: "Permissible limits for herbal products: lead 10 ppm, arsenic 3 ppm, mercury 1 ppm, cadmium 0.3 ppm (the report attributes these to Ayurvedic Pharmacopoeia of India Part-I Vol-VII; not located in that volume's text)"
          date: not confirmed
        - action: "Ayurvedic Pharmacopoeia of India Part-I Vol-VII (Minerals and Metals, 21 monographs) sets substance-specific heavy-metal limits in each mineral/metal monograph (e.g. Abhraka: lead 45 ppm, arsenic 3 ppm, cadmium 2 ppm) rather than the herbal ceiling. The report extends this to Unani kushtas by analogy and calls it a 'critical loophole'."
          date: 2008 (effective 2009-01-01)
        - action: "National Pharmacovigilance Programme for ASU drugs launched (national resource centre at IPGT&RA Jamnagar); reintroduced, with Homoeopathy added, as a Central Sector Scheme for pharmacovigilance of ASU&H drugs"
          date: 2008; reintroduced 2017-18 (scheme approved 2017-11-01; rolled out FY 2017-18)
      citations:
        - source: "Government of India, Ministry of Health and Family Welfare, Department of AYUSH. Order F. No. K-11020/5/97-DCC, 14 October 2005 (cited in Saper RB et al. Lead, mercury, and arsenic in US- and Indian-manufactured Ayurvedic medicines sold via the Internet. JAMA 2008; PMC2755247)"
          type: statute
          citation_strength: direct
        - source: "Press Information Bureau, Government of India. Testing of heavy metals in herbal medicines must (2005), https://www.pib.gov.in/newsite/PrintRelease.aspx?relid=12851"
          type: institutional
          citation_strength: direct
        - source: "Government of India, Ministry of Health and Family Welfare, Department of AYUSH. The Ayurvedic Pharmacopoeia of India, Part I, Volume VII (Minerals and Metals), 1st ed., 2008"
          type: institutional
          citation_strength: direct
        - source: "Acharya R, Naik R, Rang S, Jani CA, Galib R. Knowledge, attitude and practice towards pharmacovigilance among ayurveda physicians and teachers of Gujarat State. Journal of Family Medicine and Primary Care 2022 (PMC8963644)"
          type: primary-study
          citation_strength: direct
      register: regulatory
      notes: "Changes: (1) The 2005 order applies only to purely herbal ASU drugs for export. Its limits are WHO-based for As/Pb/Cd plus 1 ppm for Hg, and it was issued under s.33EEB of the D&C Act. File number and date come from Saper et al. 2008. Content and effective date come from the PIB release, which returned HTTP 403 when fetched and was read through its indexed text. The order text itself (a Scribd upload) could not be retrieved. (2) The herbal limits of 10/3/1/0.3 ppm were NOT found in the text of API Part-I Vol-VII, which has only per-monograph limits for minerals and metals. Their source in the API is unconfirmed, and this item is left flagged. (3) The metallic carve-out is supported: Vol-VII (2008) sets its own limits per monograph, some above 10 ppm lead. 'By analogy' for Unani kushtas and 'critical loophole' are the report's own characterizations. (4) Pharmacovigilance: the 2008 launch is confirmed, and reintroduction under a Central Sector Scheme is dated 2017-18 (Acharya et al. say 2018). The report's claim that the programme 'lapsed for lack of support' could not be confirmed and is dropped from the value. The Lok Sabha answer (eparlib 20006.pdf) was unavailable (HTTP 503)."
    searches:
      - "\"K-11020/5/97-DCC\" heavy metals Ayurveda Siddha Unani export"
      - Ayurvedic Pharmacopoeia of India Part I Volume VII 2008 heavy metals limits lead 10 ppm arsenic 3 ppm mercury 1 ppm cadmium 0.3 ppm
      - "ayush.gov.in order 14 October 2005 heavy metals testing export Ayurvedic Siddha Unani drugs \"within permissible limits\""
      - "\"33EEB\" heavy metals order 2005 Ayurveda Siddha Unani export cdsco OR ayush pdf"
      - pib.gov.in heavy metals testing Ayurveda Siddha Unani drugs export mandatory 2005 Rajya Sabha answer
      - "\"Testing of heavy metals in herbal medicines must\" PIB"
      - "Ayurvedic Pharmacopoeia of India appendix 2.3.7 \"limits of heavy metals\" lead 10 ppm arsenic 3 ppm cadmium 0.3 ppm mercury 1 ppm"
      - archive.org full text b32220522_0007 (API Part I Vol VII) and b32220522_0006 (Vol VI)
      - National Pharmacovigilance Programme for Ayurveda Siddha Unani drugs launched 2008 Department of AYUSH discontinued 2017 ASU&H pharmacovigilance scheme
      - 2008 National Pharmacovigilance Programme ASU drugs non-functional OR discontinued funding
