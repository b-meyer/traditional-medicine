system: unani
pass: verify
updates:
  - path: safety.intrinsic_toxicity
    outcome: confirmed
    field:
      status: filled
      value:
        - agent: Lead compounds formularized as Unani ingredients (Usrub, Isfidaj, Suranj, Murdar sang, Ithmid), given orally as kushtas
          mechanism_class: heavy metal
          detail: "Authors acknowledge toxicity (Ithmid 'not recommended for oral use due to toxic effects'; Murdar sang oral intake 'is harmful and can cause dysuria'). Lead distributes to liver, kidney and brain, causing encephalopathy, neuropathy and nephropathy."
        - agent: Kushta Sammulfar (arsenic trioxide)
          mechanism_class: heavy metal
          detail: Formularized Unani ingredient.
        - agent: Surma/kohl (ithmid/galena)
          mechanism_class: heavy metal
          detail: "Lead 'as high as 86%' (Aslam, Davis & Healy, Public Health 1979); 0.03%-81.37% lead in 40 Rawalpindi/Islamabad samples (Haq & Khan, JPMA 1982). Enough to cause chronic lead poisoning with regular use."
        - agent: Hijama (wet cupping)
          mechanism_class: procedural
          detail: Infections attributed to non-sterile technique and untrained practitioners.
        - agent: Undeclared corticosteroids in products
          mechanism_class: pharmaceutical adulterant
          detail: "Explains dramatic 'cures' in arthritis/asthma."
        - agent: Reliance on traditional medicine
          mechanism_class: indirect
          detail: Delayed biomedical care is a recognized systemic risk; hard Unani-specific outcome data are limited.
      citations:
        - source: "Mustehasan; Azhar M. Usrub (lead) and its compounds used in Unani Medicine: Overview. Asian Journal of Research in Chemistry 2022;15(5):358-366. doi:10.52711/0974-4150.2022.00064"
          type: tertiary-review
          citation_strength: direct
          claim_match: matches
        - source: "Aslam M, Davis SS, Healy MA. Heavy metals in some Asian medicines and cosmetics. Public Health 1979;93(5):274-284. doi:10.1016/s0033-3506(79)80078-5"
          type: primary-study
          citation_strength: direct
          claim_match: matches
        - source: "Haq I, Khan C. Hazards of a traditional eye-cosmetic - SURMA. Journal of the Pakistan Medical Association 1982;32(1):7"
          type: primary-study
          citation_strength: direct
          claim_match: matches
      register: biomedical-evidence
      notes: "Verified against the full text of Mustehasan & Azhar 2022 (authors at CCRUM New Delhi and RRIUM Aligarh). Ithmid: 'Not recommended for oral use due to toxic effects. The white variety of surma is used orally in the form of Kushta (calx).' Murdar sang: 'According to Ibn Sina, the oral intake of litharge is harmful and can cause dysuria'; calx of litharge is given orally up to 125 mg. The paper lists lead distribution to soft tissue (liver, kidneys, lungs, brain and others) and health risks including encephalopathy, neuropathy and nephropathy. The paper's abstract notes that most lead compounds are used externally and that the calx form is recommended for oral use, so 'given orally as kushtas' applies to the calcined forms. Aslam et al. 1979 confirmed via Crossref metadata and abstract, pages 274-284 (one index gives 274-278; Crossref gives 274-284). Haq & Khan 1982 confirmed from the JPMA abstract: 40 samples, 0.03% to 81.37% lead. The Kushta Sammulfar, hijama, corticosteroid and delayed-care items were not among the flagged citations and were not re-verified in this pass."
    searches:
      - Mustehasan Azhar lead compounds Unani medicine Asian Journal of Research in Chemistry 2022
      - Aslam Davis Healy 1979 Public Health heavy metals surma lead 86%
      - "\"Ithmid\" \"not recommended for oral use\" toxic effects Unani"
      - "\"Heavy metals in some Asian medicines and cosmetics\" Public Health 1979 93 274"
      - Kushta Sammulfar arsenic trioxide National Formulary of Unani Medicine
