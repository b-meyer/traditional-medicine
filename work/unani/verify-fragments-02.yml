  - path: canon_and_transmission.dated_events
    outcome: corrected
    field:
      status: filled
      value:
        - label: Hippocratic corpus composed
          date: 5th-4th c. BCE
          description: Theoretical base of the humoral tradition.
        - label: Galen's systematization
          date: 129-c.216 CE
          description: Galen's systematizing work.
        - label: Abbasid translation movement
          date: 8th-10th c.
          description: "Greek material translated into Syriac and Arabic, centred on Baghdad. Traditional accounts derive it from an earlier Sassanid medical academy at Gondishapur/Jundishapur, but modern historians dispute that such a school existed or played that role (Dols 1987)."
        - label: Mankah al-Hindi at Abbasid court
          date: 8th c.
          description: Indian physicians translating Sanskrit medical texts.
        - label: Hunayn ibn Ishaq's Galen translations
          date: 9th c. (808-873)
          description: "Hunayn's Risala (c. 850) lists 129 Galenic works translated into Syriac and/or Arabic by him and his collaborators; about 100 of them were his own."
        - label: Composition of the Qanun
          date: c. 1012-1025
          description: "Ibn Sina's Canon was begun c. 1012-13 (403 AH, Jurjan), Book 1 was finished before 405/1015, and the whole was completed by 1025, having been written across Jurjan, Rayy and Hamadan."
        - label: Aga Khan Museum Qanun Book 5 manuscript
          date: 1052 CE
          description: "Manuscript AKM510, dated 444 AH/1052 CE, which the museum describes as probably the earliest extant manuscript of volume 5 of the Canon."
        - label: Arabic commentaries on the Qanun
          date: 12th-14th c.
          description: More than two dozen Arabic commentaries.
        - label: Persian translation of Ayurvedic sources
          date: 14th c. onward
          description: Large movement translating Sanskrit Ayurvedic sources into Persian (Speziale).
        - label: Qanun as Latin-European textbook
          date: until the early 17th c.
          description: "The Canon remained a principal text in European, especially Italian, university medical teaching through the 16th and early 17th centuries."
      citations:
        - source: "Encyclopaedia Iranica, 'JALINUS' (Hunayn's account of 129 works of Galen translated by him and his collaborators into Syriac and/or Arabic)"
          type: reference-work
          citation_strength: direct
        - source: "Encyclopaedia Britannica, 'Hunayn ibn Ishaq' and 'Galen' (annotated list of 129 works c. 850; Hunayn's own translations number about 100)"
          type: reference-work
          citation_strength: direct
        - source: "Dimitri Gutas, Greek Thought, Arabic Culture. Routledge, 1998"
          type: historical-monograph
          citation_strength: direct
        - source: "Michael W. Dols, 'The Origins of the Islamic Hospital: Myth and Reality', Bulletin of the History of Medicine 61, 1987"
          type: historical-monograph
          citation_strength: direct
        - source: "Why Translate Science? (Brill, 2022), ch. 5 (Ibn al-Nadim on Mankah al-Hindi)"
          type: historical-monograph
          citation_strength: direct
        - source: "Encyclopaedia Iranica, 'AVICENNA ii. Biography' (Jorjan 403/1013; Book 1 of the Qanun before 405/1015; Ray; Hamadan 405/1015-c.415/1024)"
          type: reference-work
          citation_strength: direct
        - source: "Encyclopaedia Britannica, 'The Canon of Medicine' (completed 1025)"
          type: reference-work
          citation_strength: direct
        - source: "Aga Khan Museum, collection record AKM510, Qanun fi'l-Tibb, Volume 5 (dated AH 444/1052 CE)"
          type: institutional
          citation_strength: direct
        - source: "Nahyan Fancy, 'Verification and Utility in the Arabic Commentaries on the Canon of Medicine', Journal of the History of Medicine and Allied Sciences 75(4), 2020"
          type: historical-monograph
          citation_strength: direct
        - source: "Fabrizio Speziale, Culture persane et medecine ayurvedique en Asie du Sud. Leiden/Boston: Brill, 2018 (Islamic Philosophy, Theology and Science 102)"
          type: historical-monograph
          citation_strength: direct
        - source: "Nancy G. Siraisi, Avicenna in Renaissance Italy: The Canon and Medical Teaching in Italian Universities after 1500. Princeton University Press, 1987"
          type: historical-monograph
          citation_strength: direct
      register: historical-scholarship
      notes: "Four changes. (1) Gondishapur: the report stated as fact that the translation movement drew on a Sassanid academy at Gondishapur. Dols 1987 and later historians dispute that a medical school existed there, so the claim is now given as the traditional account and marked contested. (2) Hunayn: the 129 are the titles listed in his Risala, translated by him and his collaborators; about 100 were his own translations. (3) AKM510: the museum describes it as 'probably the earliest extant manuscript of volume 5', which is narrower than 'earliest dated extant manuscript copy'. (4) Latin textbook: Siraisi documents the Canon's central teaching role into the early 17th century, chiefly in Italy, which is narrower than 'dominated Latin-European medical education until the 17th c.' The Speziale entry is now sourced to the Brill 2018 monograph, which dates the translation of Ayurvedic sources into Persian from the 14th century onward. It replaces the academia.edu profile [S31]. The Qanun composition dates are kept, since 403 AH falls in 1012-13 CE."
