  - path: theoretical_primitives.etiology
    outcome: corrected
    field:
      status: filled
      value: "Disease is a disturbance of mizaj (su' al-mizaj): simple (qualitative, su'-i-mizaj sada) or material (involving a morbid humour, su'-i-mizaj maddi). Health is governed by asbab sitta daruriya, the six essential causes: air/environment; food and drink; bodily movement and rest; psychic movement and rest (emotional states); sleep and wakefulness; retention and evacuation."
      citations:
        - source: "CCRUM, Standard Unani Medical Terminology (New Delhi: CCRUM, Dept of AYUSH, 2012) - entries Su'-i-Mizaj Sada ('abnormal temperament which is not associated with the substance or matter'), Su'-i-Mizaj Maddi ('associated with the substance or matter'), Asbab Sitta Daruriyya (Hawa'; Ma'kul-o-Mashrub; Harakat-o-Sukun Badani; Harakat-o-Sukun Nafsani; Nawm-o-Yaqza; Istifragh wa Ihtibas)"
          type: institutional
          citation_strength: direct
        - source: "Ibn Sina, al-Qanun fi al-Tibb, Book I, tr. O. Cameron Gruner (London: Luzac, 1930)"
          type: reference-work
          citation_strength: direct
      register: emic
      notes: "Changed: the six essentials now use CCRUM's own terms. The report's 'movement and rest' is bodily movement and rest (harakat-o-sukun badani), and its 'psychic/emotional states' is psychic movement and rest (harakat-o-sukun nafsani), which is how the tradition pairs them. The Unani terms for simple and material distemper are added. The substance is unchanged."
    searches:
      - "CCRUM Standard Unani Medical Terminology su-e-mizaj sada maddi asbab-e-sitta zarooriya"
