          year: 2018
          position: "Complicates both sides: pre-colonial dynamism (Persian-Ayurveda synthesis) undercuts the idea of a static 'pure' tradition that was either simply preserved or simply invented."
          evidence_base: pre-colonial Persian translations of Sanskrit Ayurvedic sources
      citations:
