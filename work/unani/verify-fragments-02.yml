      - "Hunayn ibn Ishaq Risala 129 works of Galen translated Syriac Arabic number"
      - "Avicenna Canon of Medicine composed Gurgan Rayy Hamadan begun 1012 completed 1025 Encyclopaedia Iranica"
      - "Qanun Ibn Sina commentaries twelfth fourteenth centuries more than two dozen Arabic commentaries Fancy"
      - "Siraisi Avicenna in Renaissance Italy Canon university curriculum until seventeenth century"
      - "Speziale Culture persane et medecine ayurvedique en Asie du Sud Brill 2018"
