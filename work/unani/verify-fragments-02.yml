  - path: theoretical_primitives.constituents
    outcome: confirmed
    field:
      status: filled
      value: "Arkan (four elements: fire, air, water, earth); akhlat (four humours: dam/blood hot-wet, balgham/phlegm cold-wet, safra/yellow bile hot-dry, sauda/black bile cold-dry); quwa (faculties: natural, vital, psychic); arwah (pneuma/vital spirits); tabiat (innate self-regulating/healing power, equivalent to physis)."
      citations:
        - source: "Central Council for Research in Unani Medicine (CCRUM), Standard Unani Medical Terminology (New Delhi: CCRUM, Dept of AYUSH, 2012) - entries Umur Tabi'iyya, Arkan, Akhlat (Dam, Balgham, Safra', Sawda'), Arwah, Quwa, Tabi'at - https://ccrum.res.in/writereaddata/UploadFile/Standard%20Unani%20Medical%20Terminology_1430.pdf"
          type: institutional
          citation_strength: direct
        - source: "Ibn Sina, al-Qanun fi al-Tibb, Book I, tr. O. Cameron Gruner, A Treatise on the Canon of Medicine of Avicenna, Incorporating a Translation of the First Book (London: Luzac, 1930) - elements, humours, faculties (natural, vital, animal/psychic), spirits"
          type: reference-work
          citation_strength: direct
      register: emic
      notes: "Uncited in the report; now tied to CCRUM's 2012 standard terminology and to Book I of the Canon. CCRUM gives the humour temperaments as stated (dam hot-wet, balgham cold-wet, safra hot-dry, sawda cold-dry) and defines Tabi'at as 'a power endowed by nature to every individual for self preservation ... administrator, protector and healer of the body'. CCRUM lists seven umur tabi'iyya (arkan, mizaj, akhlat, a'da, arwah, quwa, af'al); this leaf gives a subset plus tabiat, as the report did. The three-fold division of quwa is from Canon Book I; the retrieved CCRUM text did not show the faculty subdivisions."
    searches:
      - "WHO Benchmarks for training in Unani medicine 2010 umoor tabiya arkan mizaj akhlat arwah quwa asbab sitta zarooriya"
      - "CCRUM Standard Unani Medical Terminology su-e-mizaj sada maddi asbab-e-sitta zarooriya"
      - "Gruner 1930 Treatise on the Canon of Medicine of Avicenna faculties natural vital animal by contraries treatment"

  - path: theoretical_primitives.balance_logic
    outcome: confirmed
    field:
      status: filled
      value: "Health is equilibrium of the four humours, expressed as the individual's mizaj (temperament): a balance of qualities on the hot/cold and wet/dry axes, unique to each person, organ, drug and food. Health is the maintenance of one's proper mizaj. Therapy works by contraries (a cold disease is treated with hot-quality drugs or regimen) and by supporting tabiat."
      citations:
        - source: "Ibn Sina, al-Qanun fi al-Tibb, Book I, tr. O. Cameron Gruner (London: Luzac, 1930) - temperaments of persons and organs; general principles of treatment by contraries"
          type: reference-work
          citation_strength: direct
        - source: "CCRUM, Standard Unani Medical Terminology (2012) - Mizaj defined as the quality produced by action and reaction of the opposite qualities of the elements; Mizaj Mu'tadil; Tabi'at as protector and healer of the body"
          type: institutional
          citation_strength: direct
      register: emic
      notes: "Uncited in the report; confirmed against Book I of the Canon and CCRUM's 2012 standard terminology. CCRUM's own definition of health (Sihhat) is phrased functionally ('structure and functions of the body are in normal state'), not in humoral terms. The humoral-equilibrium phrasing follows the classical account. The treatment-by-contraries passage was located in Canon Book I from its contents; its full text was not retrieved in this pass."
    searches:
      - "CCRUM Standard Unani Medical Terminology su-e-mizaj sada maddi asbab-e-sitta zarooriya"
      - "Gruner 1930 Treatise on the Canon of Medicine of Avicenna faculties natural vital animal by contraries treatment"

