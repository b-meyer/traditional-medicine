  - path: canon_and_transmission.dated_events
    outcome: corrected
    field:
      status: filled
      value:
        - label: Hippocratic corpus composed
          date: 5th-4th c. BCE
          description: Theoretical base of the humoral tradition.
        - label: Galen's systematization
          date: 129-c.216 CE
          description: Galen's systematizing work.
        - label: Abbasid translation movement
          date: 8th-10th c.
          description: "Greek material translated into Syriac and Arabic, centred on Baghdad and drawing on earlier Syriac and Sasanian learning. The report's 'Sassanid academy at Gondishapur/Jundishapur' is contested: Dols (1987) calls the Gondishapur medical school and hospital a myth."
        - label: Mankah al-Hindi at Abbasid court
          date: 8th c.
          description: Indian physicians translating Sanskrit medical texts.
        - label: Hunayn ibn Ishaq's Galen translations
          date: 9th c. (808-873)
          description: "Hunayn's Risala lists 129 Galenic works translated into Syriac and/or Arabic, about 100 of them by Hunayn himself. Encyclopaedia Iranica gives 95 into Syriac and 34 into Arabic."
        - label: Composition of the Qanun
          date: c. 1012-1025
          description: Ibn Sina's Canon begun c. 1012 and completed 1020-1025 across Gurgan, Rayy and Hamadan.
        - label: Aga Khan Museum Qanun Book 5 manuscript
          date: 1052 CE
          description: "Earliest dated extant manuscript copy cited (AKM510, dated AH 444 / 1052 CE)."
        - label: Arabic commentaries on the Qanun
          date: 12th-14th c.
          description: More than two dozen Arabic commentaries.
        - label: Persian translation of Ayurvedic sources
          date: 14th c. onward
          description: Large movement translating Sanskrit Ayurvedic sources into Persian (Speziale).
        - label: Qanun as Latin-European textbook
          date: until the 17th c.
          description: Qanun dominated Latin-European medical education.
      citations:
        - source: "Vivian Nutton, Ancient Medicine (Routledge, 2004; 2nd ed. 2013)"
          type: historical-monograph
          citation_strength: direct
        - source: "Dimitri Gutas, Greek Thought, Arabic Culture (Routledge, 1998)"
          type: historical-monograph
          citation_strength: direct
        - source: "Michael W. Dols, 'The origins of the Islamic hospital: myth and reality', Bulletin of the History of Medicine 61(3), 1987, pp. 367-390 - https://pubmed.ncbi.nlm.nih.gov/3311248/"
          type: primary-study
          citation_strength: direct
        - source: "Hunayn ibn Ishaq, Risala on his Galen translations, ed. and tr. J. C. Lamoreaux, Hunayn ibn Ishaq on His Galen Translations (Brigham Young University Press, 2016); Encyclopaedia Iranica, 'GREECE x. Greek Medicine in Persia' - https://www.iranicaonline.org/articles/greece-x/"
          type: reference-work
          citation_strength: direct
        - source: "W. E. Gohlman, The Life of Ibn Sina: A Critical Edition and Annotated Translation (SUNY Press, 1974) - Juzjani's account of the Qanun begun in Jurjan, continued at Rayy, completed at Hamadan"
          type: historical-monograph
          citation_strength: direct
        - source: "Aga Khan Museum, collection record AKM510, 'Qanun fi'l-Tibb (Canon of Medicine), Volume 5', Iran or Iraq, dated 1052 - https://www.agakhanmuseum.org/collection/artifact/qanun-fi-l-tibb-canon-medicine-volume-5-akm510"
          type: institutional
          citation_strength: direct
        - source: "Nahyan Fancy, 'Verification and Utility in the Arabic Commentaries on the Canon of Medicine', Journal of the History of Medicine and Allied Sciences 75(4), 2020 - abstract: 'over two dozen Arabic commentaries on the Canon of Medicine were composed between the twelfth and fourteenth centuries'"
          type: primary-study
          citation_strength: direct
        - source: "Fabrizio Speziale, Culture persane et medecine ayurvedique en Asie du Sud (Leiden: Brill, 2018; Islamic Philosophy, Theology and Science 102)"
          type: historical-monograph
          citation_strength: direct
        - source: "Nancy G. Siraisi, Avicenna in Renaissance Italy: The Canon and Medical Teaching in Italian Universities after 1500 (Princeton University Press, 1987)"
          type: historical-monograph
          citation_strength: direct
      register: historical-scholarship
      notes: "Changed: the translation-movement entry no longer states flatly that it drew on a 'Sassanid academy at Gondishapur'. Dols (1987) treats that academy and hospital as a myth, though he does find evidence of Sasanian hospitals, so the entry now flags the claim as contested. The Hunayn description now names the Risala as the source of the 129/about-100 figures and adds Encyclopaedia Iranica's Syriac/Arabic split. The Aga Khan manuscript entry gains its accession number. Everything else is confirmed. The 1012 and 1020-1025 dates for the Qanun are modern estimates; Juzjani's biography gives the places, not exact years. Siraisi documents university teaching of the Canon into the early 17th century (Padua, Santorio's lectures 1611-1624). 'Dominated' is the report's wording and is kept. The old citation, Speziale's academia.edu profile, is replaced with his Brill monograph."
    searches:
