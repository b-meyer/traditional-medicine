  - path: construct_debate.positions
    outcome: corrected
    field:
      status: filled
      value:
        - scholar: Guy Attewell
          work: "Refiguring Unani Tibb: Plural Healing in Late Colonial India"
          year: 2007
          position: "Unani identity was 'reconstituted' around 1900 through biomedical concepts, nationalist/communitarian politics and colonial models of legitimacy; heterogeneous rather than a single 'traditional Muslim system'."
          evidence_base: 19th-20th c. print, institutional, legal and political archives
        - scholar: Seema Alavi
          work: "Islam and Healing: Loss and Recovery of an Indo-Muslim Medical Tradition, 1600-1900; 'Unani Medicine in the Nineteenth-Century Public Sphere: Urdu Texts and the Oudh Akhbar' (IESHR 42)"
          year: 2007; 2005
          position: "A 'new Unani and a new hakim' emerged in the 19th-century Urdu public sphere, with emphasis shifting from theory-mastery to practice."
          evidence_base: 19th c. Urdu print/public-sphere archives
        - scholar: Claudia Liebeskind
          work: "'Arguing Science: Unani Tibb, Hakims and Biomedicine in India, 1900-50', in Waltraud Ernst (ed.), Plural Medicine, Tradition and Modernity, 1800-2000, pp. 58-75"
          year: 2002
          position: Documents the biomedicine-vs-hakim contest.
          evidence_base: 20th c. archives (per report's general characterization of the reconstruction side)
        - scholar: "David Hardiman (following Romila Thapar's 'syndication' concept; the Charles Leslie link is not confirmed)"
          work: "'Indian medical indigeneity: from nationalist assertion to the global market', Social History 34(3), pp. 263-283"
          year: 2009
          position: "Unani and Ayurveda were reinvented/syndicated in colonial India as a 'cogent medical system with a well-defined structure'."
          evidence_base: colonial-era archives (per report's general characterization)
        - scholar: Kavita Sivaramakrishnan
          work: "Old Potions, New Bottles: Recasting Indigenous Medicine in Colonial Punjab (1850-1945)"
          year: 2006
          position: Analogous recasting of indigenous medicine in colonial Punjab.
          evidence_base: colonial Punjab archives (per report's general characterization)
        - scholar: Neshat Quaiser
          work: "'Politics, Culture and Colonialism: Unani's Debate with Doctory', in B. Pati and M. Harrison (eds), Health, Medicine and Empire: Perspectives on Colonial India"
          year: 2001
          position: Listed among historians documenting colonial transformation of Unani into a public, professionalized system.
          evidence_base: not stated
        - scholar: Kira Schmidt Stiedenroth
          work: "Unani Medicine in the Making: Practices and Representations in 21st-Century India"
