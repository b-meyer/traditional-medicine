      notes: "Corrections: (1) Hamdard Bangladesh: Hamdard's own chronology dates the start of activity in East Pakistan to 1953 (two sales centres), with Hamdard Laboratories (Waqf) Bangladesh formally established in 1972. 'Founded 1953' was imprecise. (2) WHO 2010: WHO's pages document a 2010 predecessor only for the training benchmarks. The practice benchmarks page mentions no earlier edition, so 'first editions' (plural) is corrected. (3) NCISM operational date made precise: 11 June 2021, not 'June/July 2021'. (4) South Africa: the 2001 register rests on Regulations R.127 of 12 February 2001, and the September 2007 step is GN 848 of 14 September 2007. The '11th modality' wording is dropped because it was found only on a practitioner-institute site. Still unverified from a primary source: the September 2024 Pakistan merger. It is found only on Wikipedia, and the only official-adjacent item located is state-media coverage (Radio Pakistan, 27 August 2024) of cabinet approval of the rightsizing committee's recommendations for 82 bodies, which does not name the councils. The item is kept as the report stated it but should be treated as indirect. Several official pages (AHPCSA, Hamdard Bangladesh, Tibbia College) returned server errors, and their content was read from search-index excerpts. The PIB, S9 mismatch, Wikipedia and Expat Focus citations are replaced."
