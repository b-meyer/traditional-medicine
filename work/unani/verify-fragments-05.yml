      notes: "Corrections: (1) the phrase 'along scientific lines' for Hamdard's 1906 founding is not on Hamdard's own legacy page, which says the clinic aimed at 'reviving, invigorating and improving' Unani medicine; the quote is replaced. (2) Tibbia College: the Delhi government pages give the exact dates and say modern medicine and science were part of the syllabus. They do not itemize anatomy or surgery, so that wording is dropped from this item. (3) NCISM operational date made precise: the Act came into force and the Commission and four autonomous boards were constituted on 11 June 2021 (NCISM site), not 'June/July 2021'. (4) CCRUM: established 1978 and functioning from 10 January 1979. The NCISM Act and Delhi college pages were read through search-index excerpts and a verbatim reproduction because the official servers returned errors. The final 'general change' item is kept as the report's summary; the current NCISM BUMS curricula confirm anatomy, physiology, pathology and surgery (see education_and_licensure.biomedical_content_in_curriculum), but the historical timing was not checked against a scholarly work. The S9 CCRUM cupping PDF (mismatch) is dropped."
