  - path: canon_and_transmission.foundational_texts
    outcome: confirmed
    field:
      status: filled
      value:
        - title: Hippocratic corpus
          date: 5th-4th c. BCE
          author: Hippocratic authors
        - title: Galenic corpus
          date: Galen 129-c.216 CE
          author: Galen
        - title: al-Hawi (Liber Continens)
          date: al-Razi 865-925
          author: al-Razi (Rhazes)
        - title: Kamil al-sina'a al-tibbiyya (Kitab al-Maliki)
          date: al-Majusi d. 994
          author: Ali ibn al-Abbas al-Majusi (Haly Abbas)
        - title: al-Qanun fi al-Tibb (The Canon of Medicine)
          date: begun c. 1012; completed 1020-1025 (Gurgan, Rayy, Hamadan)
          author: Ibn Sina (Avicenna, 980-1037)
      citations:
        - source: "Encyclopaedia Britannica, 'Galen' (biography; 129-c. 216 CE)"
          type: reference-work
          citation_strength: direct
        - source: "Encyclopaedia Iranica, 'ḤĀWI, AL-' (al-Razi's dates on al-Biruni's authority, 865-925)"
          type: reference-work
          citation_strength: direct
        - source: "Lutz Richter-Bernburg, 'ʿALĪ B. ʿABBĀS MAJŪSĪ', Encyclopaedia Iranica I/8, pp. 837-838 (d. 384/994 [?]; al-Kamel/al-Maleki composed for ʿAżod-al-Dawla)"
          type: reference-work
          citation_strength: direct
        - source: "US National Library of Medicine, Islamic Medical Manuscripts at the NLM, catalogue 'Encyclopedias 8' (Ibn Sina, al-Qanun; begun in Gurgan, continued in Rayy, completed in Hamadan)"
          type: institutional
          citation_strength: direct
        - source: "Masic I., 'Thousand-year anniversary of the historical book: Kitab al-Qanun fit-Tibb - The Canon of Medicine', Materia Socio-Medica 2012 (PMC3702097) (composition begun c. 1012 and worked on for about twelve years)"
          type: historical-monograph
          citation_strength: direct
      register: historical-scholarship
      notes: "Checked against the reference works listed. Iranica gives al-Majusi's death as 384/994 with a question mark, so d. 994 is uncertain. Other accounts place it between 982 and 994. NLM gives the Gurgan-Rayy-Hamadan sequence. Masic 2012 dates the start to about 1012 and puts completion about twelve years later, within the 1020-1025 range. The Hippocratic dating (5th-4th c. BCE) is the standard dating of the corpus's treatises, e.g. Epidemics I and III c. 410 BCE and later treatises at the turn of the 5th to 4th century. It was checked against search-surfaced summaries, not a single primary reference read in full. Direct fetch of britannica.com was blocked by the network proxy, so the Britannica dates rest on the search-indexed article."
    searches:
