  - path: canon_and_transmission.foundational_texts
    outcome: corrected
    field:
      status: filled
      value:
        - title: Hippocratic corpus
          date: 5th-4th c. BCE
          author: Hippocratic authors
        - title: Galenic corpus
          date: Galen 129-c.216 CE
          author: Galen
        - title: al-Hawi (Liber Continens)
          date: "al-Razi c. 865-925 (dates disputed; Britannica gives c. 854-925/935)"
          author: al-Razi (Rhazes)
        - title: Kamil al-sina'a al-tibbiyya (Kitab al-Maliki)
          date: "al-Majusi d. 384/994 (uncertain)"
          author: Ali ibn al-Abbas al-Majusi (Haly Abbas)
        - title: al-Qanun fi al-Tibb (The Canon of Medicine)
          date: "begun in Jurjan (Gurgan) c. 1012; continued in Rayy; completed in Hamadan, where Ibn Sina lived c. 1015-1024"
          author: "Ibn Sina (Avicenna, 980-1037; Gutas dates his birth ca. 970)"
      citations:
        - source: "Encyclopaedia Britannica, 'Hippocrates' (works of the Classical period assembled as the Corpus Hippocraticum; 'most of which were not written by him')"
          type: reference-work
          citation_strength: direct
        - source: "Encyclopaedia Britannica, 'Galen' ('born 129 ce ... died c. 216')"
          type: reference-work
          citation_strength: direct
        - source: "Encyclopaedia Britannica, 'al-Razi' ('born c. 854 ... died 925/935'; Kitab al-hawi)"
          type: reference-work
          citation_strength: direct
        - source: "Encyclopaedia Iranica, 'ʿAlī b. ʿAbbās Majūsī' ('died in 384/994 [?]')"
          type: reference-work
          citation_strength: direct
        - source: "US National Library of Medicine, Islamic Medical Manuscripts catalogue, 'Encyclopaedias 8' (Ibn Sina, al-Qanun fi al-tibb): begun in Gurgan, continued in Rayy, completed in Hamadan; Ibn Sina d. 1037/428 H"
          type: institutional
          citation_strength: direct
        - source: "Gutas, D., 'Ibn Sina [Avicenna]', Stanford Encyclopedia of Philosophy (rev. 31 Oct 2025): ca. 970-1037; Jurjan 1012-1014?, Rayy 1014?-1015, Hamadhan 1015-1024?"
          type: reference-work
          citation_strength: direct
        - source: "Encyclopaedia Britannica, 'Avicenna' ('born 980 ... died 1037, Hamadan')"
          type: reference-work
          citation_strength: direct
      register: historical-scholarship
      notes: "Changed: (1) the Qanun's completion window '1020-1025' has no direct source. NLM and Gutas (SEP) support only 'begun in Jurjan c. 1012, continued in Rayy, completed in Hamadan', and Gutas has Ibn Sina in Hamadhan c. 1015-1024?, so the date is now the place sequence plus the Hamadan residence window. (2) al-Razi's dates are disputed: 865-925 is the common dating, while Britannica gives c. 854-925/935, now noted. (3) al-Majusi's death date is flagged as uncertain, following Iranica's '[?]'. (4) Ibn Sina's 980 birth year is kept (Britannica), with Gutas's earlier dating (ca. 970) noted. Hippocratic and Galen dates confirmed. Britannica adds that works kept being added to the Hippocratic corpus up to its first scholarly edition around the 2nd c. CE. The Iranica Majusi page returned 403 when fetched, so its wording was checked through a search excerpt of that page."
