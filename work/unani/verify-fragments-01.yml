  - path: canon_and_transmission.transmission_mode
    outcome: confirmed
    field:
      status: filled
      value: "mixed: textual (translation movement, manuscripts, commentaries, later print) plus family/lineage-based practice (e.g. the Azizi family of Lucknow); colonial-era shift from family/lineage-based elite practice to public, print-mediated, institutional transmission."
      citations:
        - source: "Alavi, Seema. 'Medical Culture in Transition: Mughal Gentleman Physician and the Native Doctor in Early Colonial India', Modern Asian Studies 42(5), 2008, 853-897 (abstract: printing press and Company added new contenders for medical authority; by the 1830s health shifted from individual aristocratic virtue to societal well-being)"
          type: historical-monograph
          citation_strength: direct
          claim_match: matches
        - source: "Alavi, Seema. Islam and Healing: Loss and Recovery of an Indo-Muslim Medical Tradition, 1600-1900. Basingstoke: Palgrave Macmillan, 2008 (draws on the private papers of the Azizi family of Lucknow hakims; the Azizi family founded Takmil-ut-Tibb College, Lucknow, 1902)"
          type: historical-monograph
          citation_strength: direct
          claim_match: matches
        - source: "Ansari, A.P., Anwar, N., Ahmed, K.K. 'Current status of Unani medicine in India', Journal of Ayurvedic and Herbal Medicine 10(3), 2024, 70-72 (families such as the Sharifi of Delhi and the Azizi of Lucknow; college foundations 1872-1938)"
          type: tertiary-review
          citation_strength: direct
          claim_match: matches
      register: historical-scholarship
      notes: "The family-based to public, print-mediated shift is Alavi's argument (MAS 2008 abstract; Islam and Healing 2008). The Azizi-family and institutional (college) transmission is confirmed by Ansari et al. 2024. The 'textual' strand (translation movement, commentaries) is general framing and is backed by the canon_and_transmission anchors, not by these sources. The book's content was checked through its catalogue description and summaries, not the full text."
    searches:
      - "Seema Alavi Islam and Healing 2008 Azizi family Lucknow Unani print public transmission"
      - "Alavi \"Islam and Healing\" review family hakims print Urdu public sphere Takmil-ut-Tibb Lucknow colonial transformation"
      - "Alavi Islam and Healing Palgrave description \"family\" \"print\" Unani \"public\" hakims colonial"
      - "Alavi \"Medical Culture in Transition\" Modern Asian Studies 2008 abstract Unani family print"
