  - path: canon_and_transmission.transmission_mode
    outcome: confirmed
    field:
      status: filled
      value: "mixed: textual (translation movement, manuscripts, commentaries, later print) plus family/lineage-based practice (e.g. the Azizi family of Lucknow); colonial-era shift from family/lineage-based elite practice to public, print-mediated, institutional transmission."
      citations:
        - source: "Seema Alavi, Islam and Healing: Loss and Recovery of an Indo-Muslim Medical Tradition, 1600-1900 (Ranikhet: Permanent Black, 2007; Basingstoke: Palgrave Macmillan, 2008)"
          type: historical-monograph
          citation_strength: direct
      register: historical-scholarship
      notes: "Alavi's monograph draws on the private family papers of the Azizi family of Lucknow hakims, founders of the Takmil al-Tibb school (1902). It traces the colonial-era move of Unani from family-based elite practice to a public tradition carried by print, newspapers, textbooks and institutions. The textual strand (translation movement, manuscripts, commentaries) is supported by the canon sources cited under foundational_texts and external_dating_anchors. 'Mixed' is the codebook category applied to these strands. The check drew on the book's documented sources and argument as described in scholarly reviews, not on a reading of the full text."
    searches:
      - "Azizi family Lucknow Unani hakims lineage Liebeskind OR Alavi \"Islam and Healing\" print public institutions"
  - path: canon_and_transmission.external_dating_anchors
    outcome: corrected
    field:
      status: filled
      value:
        - anchor: Aga Khan Museum manuscript of Qanun Book 5 (AKM510), the earliest known extant manuscript of any part of the Qanun
          date: 444 H / 1052 CE
        - anchor: US National Library of Medicine MS A 53 (complete Qanun)
          date: undated; probably early 15th c., Timurid workshop in Iran
        - anchor: Hunayn ibn Ishaq's Risala enumerating 129 Galenic titles (about 100 personally translated into Syriac and/or Arabic)
          date: 9th c.; edited Bergsträsser 1925; re-edited and translated Lamoreaux 2016
        - anchor: 2018 critical edition of Qanun Book I (vol. 1, Fi al-umur al-kulliyya min ʿilm al-tibb), ed. Najafgholi Habibi
          date: '2018'
        - anchor: Qanun used as Latin-European textbook
          date: until the 17th century
      citations:
        - source: "Aga Khan Museum, Toronto, collection record AKM510, 'Qanun fi'l-Tibb (Canon of Medicine), Volume 5', dated 444 H / 1052 CE"
          type: institutional
          citation_strength: direct
          claim_match: matches
        - source: "US National Library of Medicine, Islamic Medical Manuscripts at the NLM, catalogue 'Encyclopedias 8' (MS A 53)"
          type: institutional
          citation_strength: direct
          claim_match: matches
        - source: "John C. Lamoreaux (ed. and trans.), Hunayn ibn Ishaq on His Galen Translations: A Parallel English-Arabic Text (Provo: Brigham Young University Press, 2016), with an appendix by Grigory Kessel"
          type: historical-monograph
          citation_strength: direct
        - source: "G. Bergsträsser, 'Hunain ibn Ishaq über die syrischen und arabischen Galen-Übersetzungen', Abhandlungen für die Kunde des Morgenlandes 17 (1925): 1-48"
          type: historical-monograph
          citation_strength: direct
        - source: "Encyclopaedia of Islam, 'Hunayn b. Ishak' (129 titles, about 100 translated by Hunayn into Syriac, Arabic or both)"
          type: reference-work
          citation_strength: direct
        - source: "Avicenna, al-Qanun fi al-tibb, vol. 1, Fi al-umur al-kulliyya min ʿilm al-tibb, critical edition by Najafgholi Habibi (Hamadan: International Avicenna Scientific and Cultural Foundation, 2018); reviewed in Arabic Sciences and Philosophy (Cambridge UP), doi 10.1017/S0957423921000102"
          type: historical-monograph
          citation_strength: direct
        - source: "Ursula Weisser, 'AVICENNA xiii. The influence of Avicenna on medical studies in the West', Encyclopaedia Iranica; and NLM catalogue 'Encyclopedias 8' (Canon in use in European medical schools, e.g. Louvain and Montpellier, until the 17th century)"
          type: reference-work
          citation_strength: direct
      register: historical-scholarship
      notes: "Most anchors were confirmed. Three were made more precise. (1) NLM MS A 53 is 'undated' but NLM itself dates it to probably the beginning of the 15th century, in a Timurid workshop in Iran, so the value now says so. (2) The 2018 critical edition is Najafgholi Habibi's, and its title presents it as vol. 1, Fi al-umur al-kulliyya, i.e. Book I (the Kulliyyat). The earlier phrase 'part of Qanun Book I' is not supported by the edition's title and was replaced. (3) The Aga Khan Museum describes AKM510 as the earliest known extant manuscript of any part of the Qanun; this is recorded as a description of the anchor, not as a new claim. Hunayn's 129 titles, about 100 by Hunayn himself, match the Encyclopaedia of Islam account. The Bergsträsser 1925 and Lamoreaux 2016 editions are confirmed. The end-date of the 17th century for Latin textbook use is confirmed by NLM and Iranica."
    searches:
      - "Aga Khan Museum Canon of Medicine Book 5 manuscript 1052 AKM510"
      - "NLM \"MS A 53\" Qanun Ibn Sina complete Timurid"
      - "Lamoreaux 2016 Hunayn ibn Ishaq on His Galen Translations 129 works Bergsträsser 1925"
      - "Hunayn Risala 129 Galen works listed translated into Syriac Arabic Hunayn himself"
      - "2018 critical edition Avicenna Canon of Medicine Book I part"
      - "\"critical edition\" Qanun Ibn Sina 2018 first book kulliyat edited manuscripts"
      - "Canon of Medicine Latin translation Gerard of Cremona university textbook until 17th century"
