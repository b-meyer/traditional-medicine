- path: modalities.items
  source_report: v1
  value:
  - name: Ilaj bil tadbeer (regimenal therapy)
    native_category: ilaj bil tadbeer
    tags:
    - procedural
    - manual
    - thermal
    - regimenal
    description: 'Nearly 30 regimens in classical literature: fasd (venesection), hijama (cupping, wet
      and dry), ta''liq al-''alaq (leech therapy), ishal (purgation), qay'' (emesis), idrar (diuresis),
      huqna (enema), ta''riq (diaphoresis), riyazat (exercise), dalk (massage), hammam (bath), natul (irrigation),
      inkibab (steam), takmid (fomentation). Aim is to evacuate morbid humours and restore balance.'
  - name: Ilaj bil ghiza (dietotherapy)
    native_category: ilaj bil ghiza
    tags:
    - dietary
    description: Diet adjusted in quantity and quality by temperament and illness; Britannica cites a
      low-roughage, nutrient-rich diet for fever.
  - name: Ilaj bil dawa (pharmacotherapy)
    native_category: ilaj bil dawa
    tags:
    - herbal
    - animal-derived
    - mineral-metal
    description: More than 2,000 medicines of herbal, mineral and animal origin, single (mufradat) or
      compound (murakkabat), graded by temperament (mizaj-e-advia) and four degrees of potency. Includes
      kushta, incinerated powders of mercury, arsenic, mercuric chloride and iron.
  - name: Ilaj bil yad (surgery)
    native_category: ilaj bil yad
    tags:
    - surgical
    description: Historically a last resort and generally outside the hakim's routine practice; medieval
      surgical heritage of al-Zahrawi.
  weak_citations:
