  - study: Agreement between clinical judgment and standardized questionnaires (SMQ, MMQ) in mizaj assessment,
      Shiraz E-Medical Journal
    statistic: Cohen κ (reported as kappa)
    value: highest 0.512 for hotness (clinical vs SMQ; 95% CI 0.422-0.602) and for coldness (clinical
      vs MMQ; 95% CI 0.368-0.656); lowest 0.081 for balance in dryness/wetness (95% CI -0.023 to 0.185);
