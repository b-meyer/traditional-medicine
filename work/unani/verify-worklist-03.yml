- path: theoretical_primitives.nosology
  source_report: v2
  value: Simple vs. material su' al-mizaj. Disease categories include, e.g., Waja' al-Mafasil (roughly
    joint/rheumatoid disease). Patients and drugs are classified by temperament rather than by pathophysiology.
  weak_citations:
  - source: none (uncited in report)
    type: unclear
    citation_strength: unclear
- path: theoretical_primitives.relation_to_biomedical_anatomy
  source_report: v2
  value: 'Maps partially and loosely. Regimen and dietetics overlap with lifestyle medicine. Some materia
    medica is being screened pharmacologically. Some disease categories have rough analogues (Waja'' al-Mafasil
    roughly rheumatoid/joint disease). Refuses mapping where it matters most: mizaj, the four humours,
    tabiat and arwah have no biomedical referents and are explicitly individual and qualitative, not quantitative/populational.
    This makes standardization for research difficult.'
  weak_citations:
  - source: none (uncited in report)
    type: unclear
    citation_strength: unclear
