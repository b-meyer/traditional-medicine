- path: materia_medica.pharmacological_framework
  source_report: v2
  value: Drugs are classified by temperament (mizaj/qualities), and therapy proceeds by contraries (hot-quality
    drugs for cold disease). Simple drugs and compound remedies are separate books of the Qanun. Pharmacology
    was 'the field in which the contacts with the local tradition determined the most sensible renewal'
    as Indian materia medica was incorporated.
  weak_citations:
  - source: '[S31] Fabrizio Speziale - EHESS (academia.edu profile) — https://ehess.academia.edu/FabrizioSpeziale'
    type: aggregator
    citation_strength: indirect
