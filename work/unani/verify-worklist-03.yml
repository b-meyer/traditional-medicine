- path: modalities.items
  source_report: v1
  value:
  - name: Ilaj bil tadbeer (regimenal therapy)
    native_category: ilaj bil tadbeer
    tags:
    - regimenal
    - procedural
    - manual
    - thermal
    description: About 30 regimens in classical literature, including fasd (venesection), hijama (wet
      and dry cupping), ta'liq al-'alaq (leech therapy), ishal (purgation), qay' (emesis), idrar (diuresis),
      huqna (enema), ta'riq (diaphoresis), riyazat (exercise), dalk (massage), hammam (bath), natul (irrigation),
      inkibab (steam) and takmid (fomentation). The aim is to evacuate morbid humours and restore balance.
  - name: Ilaj bil ghiza (dietotherapy)
    native_category: ilaj bil ghiza
    tags:
    - dietary
    description: Considered the simplest and most natural approach. Diet is adjusted in quantity and quality
      to temperament and illness (e.g. a low-roughage, nutrient-rich diet for fever).
  - name: Ilaj bil dawa (pharmacotherapy)
    native_category: ilaj bil dawa
    tags:
    - herbal
    - mineral-metal
    - animal-derived
    description: Over 2,000 medicines of herbal, mineral and animal origin, used singly (mufradat) or
      compounded (murakkabat). Graded by temperament and four degrees of potency. Includes kushta, incinerated
      metal powders.
  - name: Ilaj bil yad (surgery)
    native_category: ilaj bil yad
    tags:
    - surgical
    description: Historically a last resort and generally outside the hakim's routine practice. The medieval
      surgical heritage runs through al-Zahrawi.
  weak_citations:
