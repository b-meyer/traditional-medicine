  - path: disruption.practitioner_response
    outcome: corrected
    field:
      status: filled
      value: "Hakim Ajmal Khan (1868-1927) led reform: the Ayurvedic and Unani Tibbia College, Karol Bagh, Delhi (foundation stone laid by Viceroy Lord Hardinge on 29 March 1916; inaugurated by Gandhi on 13 February 1921); the Hindustani Dawakhana. He was acting President of the Indian National Congress at the 1921 Ahmedabad session (standing in for the imprisoned C. R. Das) and a Khilafat and Non-cooperation leader. Hamdard was founded by Hakim Hafiz Abdul Majeed as a Delhi clinic in 1906, and Rooh Afza launched in 1907. Hakims Nasiruddin Ahmed Khan and Hassan Qarshi sat on the Chopra Committee (1948). Vernacular (Urdu) print and newspapers (e.g. Oudh Akhbar) were used in the public sphere."
      citations:
        - source: "Ayurvedic and Unani Tibbia College and Hospital, Govt of NCT of Delhi, About Us, https://autch.delhi.gov.in/autch/about-us"
          type: institutional
          citation_strength: direct
          claim_match: matches
        - source: "Indian National Congress, Past Party Presidents: Hakim Ajmal Khan (Acting President for C.R. Das), https://inc.in/leadership/past-party-presidents/hakim-ajmal-khan-acting-president-for-c-r-das"
          type: institutional
          citation_strength: direct
          claim_match: matches
        - source: "B. D. Metcalf, 'Nationalist Muslims in British India: The Case of Hakim Ajmal Khan', Modern Asian Studies 19 (1985)"
          type: historical-monograph
          citation_strength: direct
          claim_match: matches
        - source: "Hamdard Laboratories (India), 'Meet Hakim Hafiz Abdul Majeed, the man behind Rooh Afza', https://www.hamdard.com/Happening/news_detail?news=33"
          type: practitioner-site
          citation_strength: indirect
        - source: "Government of India, Ministry of Health, Report of the Committee on Indigenous Systems of Medicine (R. N. Chopra, Chairman), 1948 (membership list incl. Hakim Nasiruddin Ahmed Khan and Hassan Qarshy)"
          type: institutional
          citation_strength: direct
          claim_match: matches
        - source: "S. Alavi, 'Unani Medicine in the Nineteenth-Century Public Sphere: Urdu Texts and the Oudh Akhbar', Indian Economic and Social History Review (2005)"
          type: historical-monograph
          citation_strength: direct
          claim_match: matches
      register: historical-scholarship
      notes: "Corrected in three ways. (1) Ajmal Khan presided over the 1921 Ahmedabad Congress session as acting President for the imprisoned C. R. Das, per the INC's own page; the old value said simply 'President'. (2) Exact dates added for the Tibbia College foundation stone (29 March 1916) and inauguration (13 February 1921), from the college's own government page. (3) Two sub-claims were removed because no primary source could be found: 'the Central College' (not identified) and the statement that he proposed absorbing Western anatomy, surgery and biomedical concepts (found only in open-encyclopedia and popular sources). Hamdard's 1906/1907 dates rest on the manufacturer's own page (indirect). The Chopra membership comes from the report's catalogue listing, because the full text could not be fetched. Page fetches were blocked by the egress proxy, so all checks used search-result excerpts."
    searches:
      - "Tibbia College Karol Bagh foundation stone 1916 Lord Hardinge inaugurated 1921 Gandhi Ajmal Khan"
      - "Hakim Ajmal Khan president Indian National Congress 1921 Ahmedabad session Khilafat"
      - "Hindustani Dawakhana Ajmal Khan founded 1910 All India Ayurvedic and Unani Tibbi Conference Western anatomy surgery"
      - "Hakim Ajmal Khan Tibbia College syllabus anatomy surgery Western medicine integration Unani reform scholarly article"
