  - path: revival_and_institutionalization.revival_context
    outcome: confirmed
    field:
      status: filled
      value: "Anti-colonial nationalism (Ajmal Khan, Congress, Khilafat and Non-cooperation). Survival through 'scientization' in response to colonial delegitimization. Market/industrial development (Hamdard waqf pharmacy). Post-independence state-led institutionalization in India (AYUSH, CCRUM, NCISM) and Pakistan. In Iran, a state-led, nationally branded 'Persian medicine' revival since 2007."
      citations:
        - source: "Indian National Congress, Past Party Presidents: Hakim Ajmal Khan (inc.in) — 1921 presidency; address on non-cooperation and Khilafat"
          type: institutional
          citation_strength: direct
        - source: "Guy N. A. Attewell, Refiguring Unani Tibb: Plural Healing in Late Colonial India, Orient Longman, 2007 — practitioners reconfigured unani through biomedical concepts, nationalist politics and colonial-inspired models of legitimacy"
          type: historical-monograph
          citation_strength: direct
        - source: "Jamia Hamdard, About Jamia Hamdard (jamiahamdard.ac.in)"
          type: institutional
          citation_strength: direct
        - source: "Central Council for Research in Unani Medicine, Ministry of Ayush InfoHub (infohub.ayush.gov.in) — established 1978"
          type: institutional
          citation_strength: direct
        - source: "National Commission for Indian System of Medicine Act, 2020 (India Code) — covers Unani"
          type: statute
          citation_strength: direct
        - source: "Evaluation of Traditional Persian Medicine curriculum and educational environment at Shiraz University of Medical Sciences: A CIPP model report (PMC12668346) — TPM academic training approved by Iran's Ministry of Health in 2007"
          type: primary-study
          citation_strength: direct
      register: historical-scholarship
      notes: "Verified component by component. The 'scientization' framing matches Attewell's thesis, taken from the book's published description and reviews. The Iranian 2007 start date is supported by the Ministry of Health's approval of formal TPM training, and Tehran University of Medical Sciences' Department of Persian Medicine was founded in 2007. The Pakistan state-institutionalization element was not separately checked against a primary source."
    searches:
      - "Iran Persian medicine revival 2007 PhD programme Ministry of Health traditional Persian medicine faculties established"
      - "National Commission for Indian System of Medicine Act 2020 Unani; CCRUM established 1978 ccrum.res.in about"
      - "Attewell \"Refiguring Unani Tibb\" Ajmal Khan Hindustani Dawakhana anatomy surgery reform"

