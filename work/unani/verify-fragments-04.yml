  - path: disruption.suppression_or_marginalization
    outcome: corrected
    field:
      status: filled
      value:
        - policy: "Macaulay's Minute on Education argued for public funding of English/European learning over Oriental learning, disparaging indigenous 'medical doctrines which would disgrace an English farrier'"
          date: "1835 (2 February)"
        - policy: "Bhore Committee (Health Survey and Development Committee) did not go into the medical relief the indigenous systems could provide and left the matter to the Provincial Governments; its plan was built on Western medicine"
          date: "1946"
        - policy: "Later committees (Udupa, Mudaliar, Shrivastava) addressed indigenous systems; the report characterizes them as oscillating between marginalization and integration"
          date: "Udupa appointed 1958 (report 1959); Mudaliar report 1961; Shrivastava 1975"
      citations:
        - source: "T. B. Macaulay, Minute on Education, 2 February 1835 (text at franpritchett.com)"
          type: historical-monograph
          citation_strength: direct
        - source: "Report of the Committee on Indigenous Systems of Medicine (Chopra Committee), Vol. II, Government of India, 1948 (archive.org in.ernet.dli.2015.143922) — inaugural address: 'the Bhore Committee did not go into the matter of medical relief which could be provided by the Indigenous Systems of Medicine and left it to the Provincial Governments to decide'"
          type: institutional
          citation_strength: direct
        - source: "Report of the Health Survey and Development Committee (Bhore Committee), Government of India, 1946 (archive.org dli.csl.2486)"
          type: institutional
          citation_strength: direct
        - source: "Report of the Committee on the Reform of Education, Practice and Research in Indigenous Systems of Medicine (Udupa Committee), Government of India, 1959 (PARI library)"
          type: institutional
          citation_strength: direct
        - source: "Report of the Health Survey and Planning Committee (Mudaliar Committee), Vol. I, Government of India, 1961 (PARI library)"
          type: institutional
          citation_strength: direct
      register: historical-scholarship
      notes: "Corrected. (1) The Minute itself supports 'privileging Western learning' and its disparagement of indigenous medicine. The primary text does not support the earlier gloss that only Western medicine was recognized as legitimate, or the quoted 'actively discouraged', so both are dropped. (2) The earlier value said the Bhore Committee was IMS-dominated and dismissed indigenous medicine as 'unscientific'. The Chopra Committee's own 1948 report records instead that Bhore did not examine indigenous systems and left them to the provinces. That is exclusion by omission, not an explicit verdict. The IMS-domination claim could not be verified; the Bhore member list on archive.org is mostly civil servants and public figures, so it was dropped. (3) Committee dates were added from the reports: Udupa appointed July 1958, report 1959; Mudaliar report 1961. Shrivastava 1975 rests on secondary citation only because the report was not opened. The 'oscillated' characterization is the source report's own synthesis and was not verified."
    searches:
      - "Macaulay \"Minute on Education\" 2 February 1835 \"medical doctrines which would disgrace an English farrier\""
      - "Bhore Committee report 1946 indigenous systems of medicine \"not in a position\" Ayurveda Unani"
      - "\"Health Survey and Development Committee\" 1946 report volume indigenous systems full text"
      - "Udupa committee 1958 Mudaliar committee 1961 Srivastava committee 1975 indigenous systems of medicine Unani"

  - path: disruption.practitioner_response
    outcome: corrected
    field:
      status: filled
      value: "Hakim Ajmal Khan (birth year given as 1868 in most sources, 1863 by the Indian National Congress; d. 29 December 1927) led reform: Ayurvedic and Unani Tibbia College, Karol Bagh, Delhi (foundation stone laid 29 March 1916 by Viceroy Lord Hardinge; inaugurated 13 February 1921 by Gandhi); Hindustani Dawakhana; the Central College. He proposed absorbing Western anatomy, surgery and biomedical concepts. He was elected President of the Indian National Congress at the 1921 Ahmedabad session, in place of the imprisoned C. R. Das, and was a Khilafat and Non-cooperation leader. Hamdard was founded by Hakim Hafiz Abdul Majeed as a Delhi Unani clinic in 1906, and Rooh Afza launched in 1907. Hakims Nasiruddin Ahmed Khan and Hassan Qarshi sat on the Chopra Committee (1948). Vernacular (Urdu) print and newspapers (e.g. Oudh Akhbar) were used in the public sphere."
      citations:
        - source: "Government of NCT of Delhi, Ayurvedic and Unani Tibbia College and Hospital, About Us (app.delhi.gov.in/about-us) — foundation stone by Lord Hardinge 29 March 1916; inaugurated by Mahatma Gandhi 13 February 1921"
          type: institutional
          citation_strength: direct
        - source: "Indian National Congress, Past Party Presidents: Hakim Ajmal Khan (Acting President for C. R. Das) (inc.in) — elected President in 1921 in place of C. R. Das; 1921 address on non-cooperation and Khilafat; gives birth year 1863, death 29 December 1927"
          type: institutional
          citation_strength: direct
        - source: "Report of the Committee on Indigenous Systems of Medicine (R. N. Chopra, Chairman), Government of India, 1948, Vol. II — members include Hakim Naseeruddin Ahmed Khan and Shifa ul Mulk Hakim Mohd Hassan Qarshy"
          type: institutional
          citation_strength: direct
        - source: "Jamia Hamdard, About Jamia Hamdard (jamiahamdard.ac.in) — small Unani clinic established 1906 by Hakeem Hafiz Abdul Majeed"
          type: institutional
          citation_strength: direct
        - source: "Hamdard Laboratories (India), Legacy page (hamdard.com) — 1906 clinic; Rooh Afza developed 1907"
          type: practitioner-site
          citation_strength: indirect
        - source: "Seema Alavi, Islam and Healing: Loss and Recovery of an Indo-Muslim Medical Tradition, 1600-1900, Permanent Black, 2007 — draws on the Urdu Oudh Akhbar for the Unani public sphere"
          type: historical-monograph
          citation_strength: direct
      register: historical-scholarship
      notes: "Corrected. (1) Ajmal Khan's birth year is disputed. The INC's official page gives 1863; the 1868 date (11 February, marked by the Ministry of Ayush as Unani Day) is the more common one. The dispute is now recorded in the value. (2) The INC presidency is made precise: he was elected at the Ahmedabad session in December 1921 as acting President in place of the imprisoned C. R. Das. (3) Confirmed from primary sources: the Tibbia College dates, now with exact days; the Chopra Committee membership; and the Hamdard 1906 founding. Rooh Afza 1907 rests only on the manufacturer's own page (indirect). The Alavi 2007 Oudh Akhbar point is taken from the book's description; the text itself was not read. Not verified against a primary source, and carried unchanged: the 'Central College', the Hindustani Dawakhana (secondary sources date it 1910/1911), and Ajmal Khan's proposal to absorb Western anatomy and surgery. The Delhi government site returned 503 at fetch time and is cited from its search listing."
    searches:
      - "Tibbia College Karol Bagh foundation stone 1916 Lord Hardinge inaugurated 1921 Gandhi"
      - "Hakim Ajmal Khan president Indian National Congress 1921 Ahmedabad session inc.in"
      - "Hamdard founded 1906 Hakim Hafiz Abdul Majeed Rooh Afza 1907 history"
      - "Chopra Committee 1948 indigenous systems of medicine members Hakim Qarshi Nasiruddin Ahmed"
      - "Attewell \"Refiguring Unani Tibb\" Ajmal Khan Hindustani Dawakhana anatomy surgery reform"
      - "Hakim Ajmal Khan \"Central College\" Unani"
      - "Seema Alavi \"Islam and Healing\" Ajmal Khan Tibbia College Hindustani Dawakhana Oudh Akhbar Unani"
      - "Ajmal Khan unani reform \"anatomy\" \"surgery\" Tibbiya College curriculum Western Attewell OR Quaiser OR Liebeskind"

