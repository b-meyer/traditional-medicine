  - path: disruption.period
    outcome: corrected
    field:
      status: filled
      value: "British colonial rule: East India Company rule and, from 1858, the British Raj. The report's dated span runs from Macaulay's Minute on Education (2 February 1835) to the Bhore Committee report (1946), Partition (1947) and the Chopra Committee report (1948)."
      citations:
        - source: "T. B. Macaulay, Minute on Education, 2 February 1835 (text at franpritchett.com, Columbia University)"
          type: historical-monograph
          citation_strength: direct
        - source: "Government of India Act 1858 (21 & 22 Vict. c. 106) — transfer of government of India from the East India Company to the Crown"
          type: statute
          citation_strength: direct
        - source: "Report of the Health Survey and Development Committee (Bhore Committee), Government of India, 1946, Vols I-IV (archive.org dli.csl.2486; NIHFW)"
          type: institutional
          citation_strength: direct
        - source: "Report of the Committee on Indigenous Systems of Medicine (R. N. Chopra, Chairman), Ministry of Health, Government of India Press, New Delhi, 1948 (archive.org dli.csl.2160)"
          type: institutional
          citation_strength: direct
        - source: "Indian Independence Act 1947 (10 & 11 Geo. 6 c. 30)"
          type: statute
          citation_strength: direct
      register: historical-scholarship
      notes: "Corrected. The earlier value labelled the whole period 'British Raj', but the 1835 starting point falls under East India Company rule; Crown rule (the Raj) began with the Government of India Act 1858. The dated endpoints (Macaulay 1835, Bhore 1946, Chopra 1948) check out against the primary documents. Partition is now dated 1947 from the Indian Independence Act."
    searches:
