- path: legal_status.jurisdictions
  source_report: v2
  value:
  - jurisdiction: India
    regulator: National Commission for Indian System of Medicine (Board of Unani, Siddha and Sowa-Rigpa);
      Ministry of AYUSH; CCRUM (research)
    statute: NCISM Act 2020 (repealing Indian Medicine Central Council Act 1970; NCISM operational June/July
      2021); Drugs and Cosmetics Act 1940 Chapter IVA and Rules 1945 (Schedule T GMP; Rule 158B licensing)
    year: 2020
    scope_of_practice: Not specified. Disputes over surgery, modern-drug prescribing and the 'Dr' prefix
      for AYUSH graduates are ongoing (field 16).
    prescribing_rights: not stated; contested (IMA opposes AYUSH prescribing of modern drugs)
    integration_with_public_health_system: Umbrella ministry (AYUSH); state research council and apex
      teaching institute (NIUM Bengaluru); Unani Pharmacopoeia of India and National Formulary; state
      schemes (e.g. Maharashtra CCMP) pushing integration
    recognition_tier: full medical system
  - jurisdiction: Pakistan
    regulator: National Council for Tibb (NCT); September 2024 move to merge with National Council for
      Homeopathy into a National Council of Traditional, Alternative and Complementary Medicine
    statute: Unani, Ayurvedic and Homoeopathic Practitioners Act 1965
    year: 1965
    scope_of_practice: not stated
    prescribing_rights: not stated
    integration_with_public_health_system: not stated; NCT registers hakims and accredits BEMS and diploma
      programmes
    recognition_tier: statutory registration
  - jurisdiction: Bangladesh
    regulator: government Unani boards (unnamed)
    statute: not stated
    year: null
    scope_of_practice: not stated
    prescribing_rights: not stated
    integration_with_public_health_system: not stated
    recognition_tier: not determinable from report (described as 'recognized and taught')
  - jurisdiction: Sri Lanka
    regulator: not named
    statute: indigenous-medicine framework (not named)
    year: null
    scope_of_practice: not stated
    prescribing_rights: not stated
    integration_with_public_health_system: not stated
    recognition_tier: not determinable from report (described as regulated)
  - jurisdiction: Iran
    regulator: Ministry of Health (approved TPM training 2007); Supreme Council of Cultural Revolution
      (national document)
    statute: not named (ministerial approval 2007)
    year: 2007
    scope_of_practice: TPM health centres/polyclinics offering cupping etc.
    prescribing_rights: not stated
    integration_with_public_health_system: some TPM services insurance-covered; integration into insurance
      and health system debated
    recognition_tier: not determinable from report (state-backed academic track; applies to 'Persian medicine')
  - jurisdiction: South Africa
    regulator: Allied Health Professions Council of South Africa (AHPCSA); SAHPRA (products)
    statute: Allied Health Professions Act 63 of 1982
    year: 2001
    scope_of_practice: not stated
    prescribing_rights: not stated
    integration_with_public_health_system: not stated; SAHPRA recognizes Unani-Tibb as a complementary-medicine
      discipline for product regulation
    recognition_tier: statutory registration
