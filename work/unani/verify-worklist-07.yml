- path: safety.evidence_borrowed_from_other_traditions
  source_report: v2
  value:
  - claim: Heavy-metal limits and the metallic-preparation carve-out come from the Ayurvedic Pharmacopoeia
      of India and are applied to Unani kushtas 'by analogy' with rasa-shastra bhasmas.
    source_tradition: Ayurveda / ASU-wide
  - claim: The DILI literature names Ayurvedic agents; Unani appears only in mixed-system surveys as a
      regulated-but-under-monitored category.
    source_tradition: Ayurveda / mixed-system
  - claim: The ASU pharmacovigilance programme history is sourced from a paper on heavy-metal poisoning
      from Ayurvedic medicines (S27).
    source_tradition: Ayurveda
  - claim: Delayed biomedical care is a recognized risk of reliance on traditional medicine generally.
