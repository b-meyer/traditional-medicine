- path: report_conclusions.revision_thresholds
  source_report: v2
  value:
  - domain: Textual history
    threshold: A complete critical edition of the Qanun
    would_change: Would sharpen textual debates
  - domain: Diagnostic reliability
    threshold: A large multi-center inter-rater study showing mizaj kappa above 0.6 consistently
    would_change: Would strengthen diagnostic credibility
  - domain: Clinical efficacy
    threshold: Adequately powered, pre-registered, independently replicated double-blind RCTs with low
      risk of bias showing clinically meaningful benefit
    would_change: Would justify specific clinical recommendations
  - domain: Safety
    threshold: Enforced, loophole-free heavy-metal limits with post-market surveillance data
    would_change: Would materially reduce the documented harm profile
