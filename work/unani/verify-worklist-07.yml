- path: report_conclusions.recommendations
  source_report: v2
  value:
  - audience: Researcher/clinician
    text: Treat the history as solid but distinguish 'the texts' from 'the modern system'; cite Attewell,
      Alavi, Liebeskind and Speziale for the reconstruction thesis and Hunayn's Risala and Qanun manuscript
      scholarship for textual lineage.
  - audience: Researcher/clinician
    text: When assessing diagnostic reliability, cite actual kappa/ICC values, state that agreement is
      slight-to-moderate and no gold standard exists, and flag the absence of Unani pulse-diagnosis reliability
      data.
  - audience: Researcher/clinician
    text: For efficacy, default to systematic reviews rather than individual CCRUM/college trials; rate
      cupping for musculoskeletal pain as the least-weak case (short-term only); treat herbal formulations
      as preliminary; demand independent replication, adequate blinding and pre-registration.
  - audience: Clinician/patient
    text: Insist on heavy-metal certificates for any kushta/mineral/surma preparation, screen for undeclared
      steroids in fast-acting anti-inflammatory Unani products, and counsel patients about hijama infection
      risk and delayed care.
