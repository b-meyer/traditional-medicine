- path: contemporary_controversies.integration_disputes
  source_report: v2
  value: Indian Medical Association has repeatedly protested NCISM/IMCC moves allowing AYUSH (including
    Unani) graduates to perform surgery, prescribe modern drugs, or train in integrated MBBS-BAMS-type
    courses ('mixopathy' or 'crosspathy'); Maharashtra's CCMP scheme; Andhra Pradesh's December 2025 approval
    of 58 surgical procedures for PG Ayurvedic doctors; litigation pending before the Bombay High Court
    and Supreme Court; parallel dispute over the 'Dr' prefix. In Iran, debate over integrating TPM into
    insurance and the health system.
  weak_citations:
