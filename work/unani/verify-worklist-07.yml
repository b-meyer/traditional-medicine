entries:
- path: safety.intrinsic_toxicity
  source_report: v2
  value:
  - agent: Lead compounds formularized as Unani ingredients (Usrub, Isfidaj, Suranj, Murdar sang, Ithmid),
      given orally as kushtas
    mechanism_class: heavy metal
    detail: Authors acknowledge toxicity (Ithmid 'not recommended for oral use due to toxic effects';
      Murdar sang oral intake 'is harmful and can cause dysuria'). Lead distributes to liver, kidney and
      brain, causing encephalopathy, neuropathy and nephropathy.
  - agent: Kushta Sammulfar (arsenic trioxide)
    mechanism_class: heavy metal
    detail: Formularized Unani ingredient.
  - agent: Surma/kohl (ithmid/galena)
    mechanism_class: heavy metal
    detail: Lead 'as high as 86%' (Aslam, Davis & Healy, Public Health 1979); 0.03%-81.37% lead in 40
      Rawalpindi/Islamabad samples (Haq & Khan, JPMA 1982). Enough to cause chronic lead poisoning with
      regular use.
  - agent: Hijama (wet cupping)
    mechanism_class: procedural
    detail: Infections attributed to non-sterile technique and untrained practitioners.
  - agent: Undeclared corticosteroids in products
    mechanism_class: pharmaceutical adulterant
    detail: Explains dramatic 'cures' in arthritis/asthma.
  - agent: Reliance on traditional medicine
    mechanism_class: indirect
    detail: Delayed biomedical care is a recognized systemic risk; hard Unani-specific outcome data are
      limited.
