- path: self_reported_gaps.inventory
  source_report: v2
  value:
  - kind: searched_not_found
    text: I found no rigorous kappa-based inter-rater reliability study of Unani pulse (nabz) diagnosis
      -- the reliability literature is on mizaj questionnaires.
  - kind: searched_not_found
    text: Unani-specific, product-named hepatotoxicity case reports with RUCAM scoring appear absent in
      the indexed literature (the DILI literature names Ayurvedic agents; Unani appears only in mixed-system
      surveys).
  - kind: searched_not_found
    text: Clinical case reports attributing an individual's lead/arsenic poisoning to a specific branded
      Unani kushta (with attributed blood levels) are sparse compared with Ayurveda.
  - kind: source_caveat
    text: Much clinical and pharmacological literature is produced by institutions with an institutional
      stake in Unani (CCRUM, Hamdard, TPM faculties), and promotional sources (school and clinic websites)
      overstate historical continuity and efficacy.
  - kind: source_caveat
    text: Toxicology and pharmacopoeial sources frequently aggregate Ayurveda, Siddha and Unani (ASU),
      so some cited limits and surveys are ASU-wide rather than Unani-only.
  - kind: source_caveat
    text: Detail on Nizam-of-Hyderabad patronage and on COVID-era Unani specifics rests on thinner sourcing
      (searches were cut off by tool limits) and should be verified against primary sources.
  - kind: source_caveat
    text: 'Fast-moving policy: the Indian mixopathy litigation, the Pakistani council merger (2024), and
      Iran''s TPM expansion are ongoing; legal specifics may have changed after the sources'' dates.'
  - kind: contested
    text: Genuine scholarly uncertainty concentrates on manuscript transmission and the lack of a complete
      critical edition of the Qanun, apocryphal/pseudonymous attributions, and originality versus compilation.
  - kind: contested
    text: '''Invented tradition'' versus continuity is the central historiographic debate.'
  - kind: contested
    text: 'Pakistan practitioner counts: ~60,000 (Hamdard Foundation via WHO EMRO) versus 39,584 (Saeed
      et al. 2011).'
  - kind: contested
    text: 'Evidence standards: whether Unani should be validated by RCT at all; the Persian medicine revival
      as legitimate revival or nationalist invention.'
