- path: contemporary_controversies.integration_disputes
  source_report: v2
  value: 'India, AYUSH ''mixopathy''/''crosspathy''. The Indian Medical Association has repeatedly protested
    NCISM/IMCC moves allowing AYUSH (including Unani) graduates to perform surgery, prescribe modern drugs,
    or train in integrated MBBS-BAMS-type courses. State governments have pushed integration (Maharashtra''s
    CCMP scheme; Andhra Pradesh''s December 2025 approval of 58 surgical procedures for PG Ayurvedic doctors).
    Litigation is pending before the Bombay High Court and the Supreme Court. There is a parallel dispute
    over the ''Dr'' prefix. Also unresolved: whether Unani should be validated by RCT/biomedical standards
    at all. Iran: debate over integrating TPM into insurance and the health system.'
  weak_citations:
  - source: none (uncited in report)
    type: unclear
    citation_strength: unclear
