  value:
  - tradition: Premodern Greco-Arabic (Hippocratic-Galenic-Avicennan) medicine
    relation: premodern_predecessor
    fields_affected:
    - canon_and_transmission
    - construct_debate
    description: Report treats the modern institutional Unani as a substantially 19th-20th c. reconstruction
      built on this textual lineage ('reconstruction on a real foundation').
  - tradition: Traditional Persian Medicine (Iran)
    relation: same_system_variant
    fields_affected:
    - diagnostics
    - legal_status
    - education_and_licensure
    - construct_debate
    - contemporary_controversies
    description: Iranian mizaj reliability studies, the 2007 PhD track and TPM clinics are recorded as
      this tradition's own; report also says critics see TPM as a nationally branded new construction.
  - tradition: Ayurveda and Siddha (ASU grouping)
    relation: regulatory_grouping
    fields_affected:
    - safety
    - legal_status
    description: Toxicology and pharmacopoeial sources aggregate Ayurveda, Siddha and Unani, so some cited
      limits and surveys are ASU-wide; Drugs and Cosmetics Act Chapter IVA regulates ASU drugs together.
  - tradition: Sowa-Rigpa (Tibetan)
    relation: regulatory_grouping
    fields_affected:
    - legal_status
    description: Administratively grouped with Unani under India's NCISM but described as a separate tradition.
  - tradition: Tibb al-Nabawi (Prophetic medicine)
    relation: absorbed_strand
    fields_affected:
    - contact_and_borrowing
    description: Sufi and Prophetic healing practices partly folded into vernacular Unani in colonial
      India, though scholars treat Tibb al-Nabawi and academic Unani as distinct strands.
