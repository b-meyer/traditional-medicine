- path: canon_and_transmission.transmission_mode
  source_report: v2
  value: 'Mixed: textual/manuscript transmission (translation, commentary, print) plus family/lineage-based
    practice (e.g. Azizi family of Lucknow); colonial-era print and Urdu vernacular publishing shifted
    Unani from a family/lineage-based elite practice to a public, professionalized one.'
  weak_citations:
  - source: none given in report
    type: unclear
    citation_strength: unclear
- path: construct_debate.positions
  source_report: v2
  value:
  - scholar: Guy Attewell
    work: 'Refiguring Unani Tibb: Plural Healing in Late Colonial India'
    year: 2007
    position: Unani identity was reconstituted around 1900 through biomedical concepts, nationalist/communitarian
      politics and colonial models of legitimacy; heterogeneous rather than a single 'traditional Muslim
      system'.
    evidence_base: 19th-20th c. print, institutional, legal and political archives
  - scholar: Seema Alavi
    work: 'Islam and Healing: Loss and Recovery of an Indo-Muslim Medical Tradition, 1600-1900; ''Unani
      Medicine in the Nineteenth-Century Public Sphere'' (IESHR)'
    year: 2007; 2005
    position: A 'new Unani and a new hakim' emerged in the 19th-century Urdu public sphere, emphasis shifting
      from theory-mastery to practice.
    evidence_base: 19th-century archives and print sources
  - scholar: Claudia Liebeskind
    work: 'Arguing Science: Unani Tibb, Hakims and Biomedicine in India, 1900-50'
    year: 2002
    position: Documents the biomedicine-versus-hakim contest.
    evidence_base: Archival/historical
  - scholar: David Hardiman
    work: not specified in report
    year: null
    position: Frames Unani and Ayurveda as reinvented/'syndicated' (following Charles Leslie and Romila
      Thapar) into a 'cogent medical system with a well-defined structure'.
    evidence_base: Historical scholarship
  - scholar: Kavita Sivaramakrishnan
    work: 'Old Potions, New Bottles: Recasting Indigenous Medicine in Colonial Punjab'
    year: 2006
    position: Analogous recasting of indigenous medicine.
    evidence_base: Historical scholarship
  - scholar: Kira Schmidt Stiedenroth
    work: Unani Medicine in the Making
    year: 2020
    position: Extends the reconstruction argument to 21st-century India.
    evidence_base: Historical/ethnographic scholarship
  - scholar: Unnamed critics of Iranian TPM
    work: null
    year: null
    position: Persian medicine revival since 2007 is a substantially new, nationally branded construction
      layered onto medieval texts.
    evidence_base: not stated
  - scholar: Defenders (many within CCRUM, Hamdard, TPM faculties; bio-bibliographers such as the late
      Hakim Syed Zillur Rahman)
    work: null
    year: null
    position: 'Continuity: unbroken textual lineage (Galen -> Qanun -> Indian commentaries), continuous
      family/lineage practice (e.g. Azizi family of Lucknow).'
    evidence_base: Textual/manuscript tradition and lineage practice
  - scholar: Fabrizio Speziale
    work: Culture persane et medecine ayurvedique en Asie du Sud
    year: 2018
    position: Shows pre-colonial dynamism (Persian-Ayurveda synthesis), complicating both a static 'pure'
      tradition and simple invention.
    evidence_base: Persian-language manuscripts (Perso-Indica project)
