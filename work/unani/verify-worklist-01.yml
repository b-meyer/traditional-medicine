- path: construct_debate.report_adjudication
  source_report: v2
  value: 'Report says the weight of specialist scholarship favors ''reconstruction on a real foundation'':
    textual lineage is real but the modern institutional form is substantially a late-19th/20th-century
    reconstruction; advises distinguishing ''the texts'' from ''the modern system'' and not accepting
    ''1,000 years of unbroken practice exactly as today'' claims uncritically.'
  weak_citations:
  - source: none given in report
    type: unclear
    citation_strength: unclear
