- path: identification.system_boundary
  source_report: v1
  value:
  - tradition: Traditional Persian Medicine (TPM/ITM, Iranian traditional medicine)
    relation: same_system_variant
    fields_affected:
    - identification
    - theoretical_primitives
    - legal_status
    - revival_and_institutionalization
    - contemporary_controversies
    - contact_and_borrowing
    description: The report calls it 'essentially the same humoral system, drawing on al-Razi and Ibn
      Sina', quotes literature treating 'Persian medicine (also known as Islamic medicine, Unani, and
      Iranian traditional medicine)' as one tradition, and discusses Iran's academic revival and its implementation
      challenges under Unani's current status.
  - tradition: Ayurveda
    relation: regulatory_grouping
    fields_affected:
    - legal_status
    - safety
    - education_and_licensure
    - revival_and_institutionalization
    description: Regulated together with Unani under India's Ministry of AYUSH, the CCIM/NCISM and the
      Ayurvedic and Unani Tibbia College. The report calls it 'an independent Indian system' that cross-fertilized
      with Unani, and it applies Ayurvedic heavy-metal data (Saper 2004, 2008) to Unani.
  - tradition: Hippocratic-Galenic humoral medicine / modern European (biomedical) medicine
    relation: sibling
    fields_affected:
    - canon_and_transmission
    - theoretical_primitives
    - contact_and_borrowing
    description: The report says Unani and biomedicine are 'historical siblings that diverged around the
      17th century', both descending from Hippocratic-Galenic humoralism. The Greek authors (Hippocrates,
      Galen) are treated as Unani's own foundations.
