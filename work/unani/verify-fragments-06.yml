updates:
  - path: literature_state.trial_counts
    outcome: corrected
    field:
      status: partial
      value: "No overall count. Cupping meta-analysis restricted to low back pain (Zhang et al. 2024): 11 RCTs, 921 participants. Post-COVID Unani evidence-mapping review (2025): 10 studies met inclusion (the report calls this 'only a handful'), many with samples of n=60-100. Example trials named: non-inferiority RCT of a Unani formulation vs PUVA sol for chronic plaque psoriasis (IJMR 2018); 33-patient open-label single-arm psoriasis trial at CRIUM Hyderabad (Aug 2018 - May 2019); rheumatoid-arthritis non-inferiority RCT of Qurs-e-Mafasil vs celecoxib. The report describes volume as 'substantial'/'abundant'."
      citations:
        - source: "Zhang Z, Pasapula M, Wang Z, Edwards K, Norrish A. The effectiveness of cupping therapy on low back pain: a systematic review and meta-analysis of randomized control trials. Complementary Therapies in Medicine 2024;80:103013. doi:10.1016/j.ctim.2024.103013 (PMID 38184285)"
          type: meta-analysis
          citation_strength: direct
        - source: "Unani medicine in post-COVID-19 recovery: integrative perspectives and evidence mapping for symptom management. ScienceDirect, published online 27 Oct 2025 (pii S3050787125001088)"
          type: systematic-review
          citation_strength: direct
        - source: "A non-inferiority randomized controlled clinical trial comparing Unani formulation & psoralen plus ultraviolet A sol in chronic plaque psoriasis. Indian Journal of Medical Research 2018;147(1) (PMID 29749363)"
          type: primary-study
          citation_strength: direct
        - source: "The Efficacy and Safety of Herbal Unani Formulations in Chronic Plaque Psoriasis: A Single-arm Clinical Trial (CRIUM Hyderabad, 1 Aug 2018 - 25 May 2019; PMID 35951063)"
          type: primary-study
          citation_strength: direct
        - source: "Evaluation of the efficacy and safety of a herbal formulation for rheumatoid arthritis - a non-inferiority randomized controlled trial. Journal of Ethnopharmacology 2024 (PMID 38316221)"
          type: primary-study
          citation_strength: direct
      register: biomedical-evidence
      notes: "Corrected: the Zhang et al. 2024 meta-analysis is restricted to low back pain, not cupping in general, and its included trials are not identified as Unani. The post-COVID review's primary source reports 10 included studies (of 150 records screened), which the report glossed as 'only a handful'. The psoriasis single-arm trial was open-label, 33 enrolled and 30 completed. The 'substantial'/'abundant' volume characterization is the report's own and has no source."
