  - path: evidence_state.evidence_borrowed_from_other_traditions
    outcome: corrected
    field:
      status: filled
      value:
        - item: "Cupping systematic reviews: AlBedah et al. 2011; Kim et al.; Choi et al. evidence map 2021"
          conclusion_as_reported: some low-to-moderate-quality positive signals for pain (low back pain, neck pain, knee osteoarthritis)
          why_borrowed: Reviews of cupping in general, not Unani hijama specifically. The report notes geographic clustering of cupping research in China.
        - item: "Zhang, Pasapula, Wang, Edwards & Norrish, Complementary Therapies in Medicine 2024;80:103013 (systematic review and meta-analysis of RCTs of cupping for low back pain; 11 trials, 921 participants)"
          conclusion_as_reported: "'high-quality evidence demonstrated cupping significantly improves pain at 2-8 weeks endpoint intervention (d=1.09, 95% CI: 0.35-1.83, p=0.004)'; no continuous pain improvement at 1 month (d=0.11) or 3-6 months (d=0.39); reviewers uniformly note small trials, weak blinding (sham-cupping is hard) and heterogeneity"
          why_borrowed: Cupping meta-analysis for low back pain, not restricted to Unani practice; tradition of included trials not stated.
      citations:
        - source: "Zhang Z, Pasapula M, Wang Z, Edwards K, Norrish A. The effectiveness of cupping therapy on low back pain: a systematic review and meta-analysis of randomized control trials. Complementary Therapies in Medicine 2024;80:103013. doi:10.1016/j.ctim.2024.103013"
          type: meta-analysis
          citation_strength: direct
        - source: "AlBedah A, Khalil M, Elolemy A, Elsubai I, Khalil A. Hijama (cupping): a review of the evidence. Focus on Alternative and Complementary Therapies 2011;16(1):12-16. doi:10.1111/j.2042-7166.2010.01060.x"
          type: tertiary-review
          citation_strength: direct
        - source: "Choi TY, Ang L, Ku B, Jun JH, Lee MS. Evidence Map of Cupping Therapy. Journal of Clinical Medicine 2021;10(8):1750"
          type: systematic-review
          citation_strength: direct
        - source: "Kim et al. (named inline in report; not identified)"
          type: unclear
          citation_strength: unclear
      register: biomedical-evidence
      notes: "Corrected: the 2021 evidence map is by Choi et al. (Korea Institute of Oriental Medicine), not 'Cha et al.'. Its bubble-plot ratings are low confidence for low back pain and moderate for neck pain and knee OA, and 9 of its 13 included reviews came from China. Zhang et al. 2024 covers low back pain only, which the earlier value left out. Its effect sizes and 'high-quality evidence' wording match the abstract. The 'small trials, weak blinding, heterogeneity' gloss is the report's own. AlBedah et al. 2011 is a narrative overview of three systematic reviews, two finding some evidence for pain. 'Kim et al.' cannot be pinned to one publication and is left unclear."
    searches: ["Zhang Pasapula Wang Edwards Norrish cupping meta-analysis Complementary Therapies in Medicine 2024 103013", "cupping low back pain Zhang 2024 meta-analysis 921 participants 1.09", "Cha cupping evidence map 2021 systematic reviews", "AlBedah Hijama cupping a review of the evidence 2011 Focus on Alternative and Complementary Therapies"]
  - path: safety.adulteration_and_contamination
    outcome: corrected
    field:
      status: filled
      value:
        - product: Kushtae Sadaf (National Institute of Unani Medicine, Bengaluru analysis)
          finding: "lead 28.7 ppm in the sample prepared by the modern furnace method, above the WHO permissible limit; the classically prepared sample and the one market sample were within limits (variability by preparation method)"
        - product: Unani and homeopathic samples (JPMA 1981)
          finding: 80% of 29 samples contained corticosteroids (cortisone, hydrocortisone, dexamethasone, prednisolone)
        - product: Jawarish Shahi (Discover Chemistry, 2026)
          finding: "synthetic contaminants detected by HR-LCMS, including the semisynthetic antibiotic bacampicillin (an ampicillin prodrug), etodolac glucuronide, agrochemicals and industrial chemicals; single marketed batch, preliminary finding; arsenic and mercury negligible"
      citations:
        - source: "Shamsi S. Comparative elemental analysis of Kushtae Sadaf, a Unani formulation. International Journal of Green Pharmacy 2016;10(3)"
          type: primary-study
          citation_strength: direct
        - source: "Din NM, Khan C, Burney MI. Abuse of steroidal drugs by homoeopaths and hakims. Journal of the Pakistan Medical Association 1981;31(9):204"
          type: primary-study
          citation_strength: direct
        - source: "Dash et al. Phytochemical profiling and heavy metal safety assessment of classical Unani formulation Jawarish Shahi using advanced analytical techniques. Discover Chemistry 2026;3:153. doi:10.1007/s44371-026-00622-8"
          type: primary-study
          citation_strength: direct
      register: biomedical-evidence
      notes: "Jawarish Shahi claim confirmed from the article: 'a single marketed batch' was analysed, and the authors flag 'potential adulteration, environmental contamination, or cross-contamination' and call for a multi-batch survey. Kushtae Sadaf corrected: the 28.7 ppm lead reading was in the in-house furnace-method preparation, not a marketed sample, and the market sample was within limits. The variability is therefore by preparation method, not batch or manufacturer. The paper cites WHO limits; the '10 ppm WHO/India' figure in the earlier value was not checked against the paper and has been dropped. JPMA 1981 confirmed from the journal archive."
    searches: ["Jawarish Shahi synthetic contaminants antibiotic prodrug Discover Chemistry 2026", "Kushta Sadaf lead 28.7 ppm National Institute of Unani Medicine Bengaluru heavy metal analysis", "JPMA 1981 corticosteroids Unani homeopathic medicines samples Pakistan"]
