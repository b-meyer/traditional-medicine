  - path: evidence_state.reviews
    outcome: corrected
    field:
      status: filled
      value:
        - modality: Unani interventions for post-COVID-19 symptom management
          best_available_review: "Unani medicine in post-COVID-19 recovery: integrative perspectives and evidence mapping for symptom management"
          type: systematic review / evidence mapping
          year: 2025
          size: 10 included studies (from 150 records); many with samples of n=60-100
          conclusion: Evidence 'promising' but insufficient.
          certainty_rating: not reported
          methodological_limitations_noted: "small samples, observational designs, few RCTs, 'high risk in allocation' bias on the Cochrane tool (as the report states)"
        - modality: Wet cupping (al-hijama) for mental health
          best_available_review: "Ucun Y. Wet Cupping (al-hijama) for Mental Health: A Systematic Review"
          type: systematic review
          year: 2022
          size: 9 studies, 1,124 participants
          conclusion: "Few RCTs, 'and most are of poor quality'; 'more rigorous studies are required before the effectiveness of wet cupping for the treatment of mental illness can be determined.'"
          certainty_rating: not reported (no formal quality-assessment tool used)
          methodological_limitations_noted: poor trial quality; inadequate randomization and blinding; small samples; lack of standardized protocols
        - modality: Unani interventions overall (report's bottom line)
          best_available_review: report synthesis, no single review
          type: report synthesis
          year: null
          size: null
          conclusion: "No Unani intervention currently rests on high-certainty, independently replicated evidence of clinically meaningful efficacy. Cupping for musculoskeletal pain is the 'least-weak case', and even there the benefit 'appears short-lived'. Most herbal formulations remain at the preliminary/hypothesis-generating stage."
          certainty_rating: not a reviewer rating
          methodological_limitations_noted: frequent single-arm, open-label or small non-inferiority designs; small samples; high/unclear risk of bias; weak blinding; heterogeneity; weak independent replication
      citations:
        - source: "Ucun Y. Wet Cupping (al-hijama) for Mental Health: A Systematic Review. Journal of Acupuncture Research 2022;39(2):89-95. doi:10.13045/jar.2022.00031"
          type: systematic-review
          citation_strength: direct
          claim_match: matches
        - source: "Unani medicine in post-COVID-19 recovery: integrative perspectives and evidence mapping for symptom management. ScienceDirect, published online 27 Oct 2025 (pii S3050787125001088)"
          type: systematic-review
          citation_strength: direct
      register: biomedical-evidence
      notes: "Corrected: the wet-cupping review's year (2022), author (Ucun) and size (9 studies, 1,124 participants) were filled from the journal article, replacing the catalog record. Its text reads 'most are of poor quality' and 'the quality of the studies in this review is poor'. It used no formal quality-assessment tool. The post-COVID review's year (2025) and count (10 studies) come from its abstract. Its 'high risk in allocation' wording could not be checked against the full text (paywalled) and stays as the report's. The third item is the report's own synthesis, not a review."
    searches: ["\"Wet Cupping (al-hijama) for Mental Health: A Systematic Review\"", "Unani medicine in post-COVID-19 recovery integrative perspectives evidence mapping authors journal"]
