updates:
  - path: literature_state.trial_counts
    outcome: confirmed
    field:
      status: filled
      value: "No overall count. Cupping meta-analysis (Zhang et al. 2024): 11 trials, 921 participants. Post-COVID Unani review: 'only a handful of studies' met inclusion, with samples of n=60-100. Example trials named: non-inferiority RCT of a Unani formulation vs PUVA for chronic plaque psoriasis (IJMR 2018); 33-patient single-arm psoriasis trial at CRIUM Hyderabad (2018-19); rheumatoid-arthritis non-inferiority RCT vs celecoxib. The report describes volume as 'substantial'/'abundant'."
      citations:
        - source: "Zhang Z, Pasapula M, Wang Z, Edwards K, Norrish A. The effectiveness of cupping therapy on low back pain: a systematic review and meta-analysis of randomized control trials. Complementary Therapies in Medicine 2024;80:103013 (PMID 38184285)"
          type: meta-analysis
          citation_strength: direct
        - source: "Unani medicine in post-COVID-19 recovery: integrative perspectives and evidence mapping for symptom management. Elsevier (ScienceDirect PII S3050787125001088), published online 27 Oct 2025"
          type: systematic-review
          citation_strength: direct
        - source: "A non-inferiority randomized controlled clinical trial comparing Unani formulation & psoralen plus ultraviolet A sol in chronic plaque psoriasis. Indian Journal of Medical Research 2018;147(1) (PMID 29749363)"
          type: primary-study
          citation_strength: direct
        - source: "The Efficacy and Safety of Herbal Unani Formulations in Chronic Plaque Psoriasis: A Single-arm Clinical Trial (PMID 35951063); CRIUM Hyderabad, 1 Aug 2018 to 25 May 2019, n=33 enrolled"
          type: primary-study
          citation_strength: direct
        - source: "Evaluation of the efficacy and safety of a herbal formulation for rheumatoid arthritis - A non-inferiority randomized controlled trial. Journal of Ethnopharmacology 2024 (PMID 38316221)"
          type: primary-study
          citation_strength: direct
      register: biomedical-evidence
      notes: "Zhang 2024 abstract confirms 11 trials and 921 participants. The post-COVID review reports 10 studies meeting inclusion out of 150 records screened, which fits 'a handful'; the n=60-100 sample range was not checkable from the abstract. The IJMR 2018 trial compared topical UNIM-403 with PUVA sol (147 vs 140 randomized). The CRIUM single-arm trial enrolled 33, of whom 30 completed. The RA trial compared Qurs-e-Mafasil with celecoxib 100 mg (n=70, 42 vs 28). The 'substantial'/'abundant' wording is the report's own characterization. It is not a sourced count."
