  - path: evidence_state.evidence_borrowed_from_other_traditions
    outcome: confirmed
    field:
      status: filled
      value:
        - item: "Cupping systematic reviews: AlBedah 2011; Kim et al.; Cha et al. evidence map 2021"
          conclusion_as_reported: some low-to-moderate-quality positive signals for pain (low back pain, neck pain, knee osteoarthritis)
          why_borrowed: Reviews of cupping in general, not Unani hijama specifically. The report notes geographic clustering of cupping research in China.
        - item: "Zhang, Pasapula, Wang, Edwards & Norrish, Complementary Therapies in Medicine 2024;80:103013 (meta-analysis; 11 trials, 921 participants)"
          conclusion_as_reported: "'high-quality evidence demonstrated cupping significantly improves pain at 2-8 weeks endpoint intervention (d=1.09, 95% CI: 0.35-1.83, p=0.004)'; no significant improvement at 1 month (d=0.11) or 3-6 months (d=0.39); reviewers uniformly note small trials, weak blinding (sham-cupping is hard) and heterogeneity"
          why_borrowed: Cupping meta-analysis not restricted to Unani practice; tradition of included trials not stated.
      citations:
        - source: "Zhang Z, Pasapula M, Wang Z, Edwards K, Norrish A. The effectiveness of cupping therapy on low back pain: a systematic review and meta-analysis of randomized control trials. Complementary Therapies in Medicine 2024;80:103013 (PMID 38184285)"
          type: meta-analysis
          citation_strength: direct
        - source: "AlBedah A, Khalil M, Elolemy A, Elsubai I, Khalil A. Hijama (cupping): a review of the evidence. Focus on Alternative and Complementary Therapies 2011;16:12-16; doi 10.1111/j.2042-7166.2010.01060.x"
          type: tertiary-review
          citation_strength: direct
        - source: "Kim JI, Lee MS, Lee DH, Boddy K, Ernst E. Cupping for treating pain: a systematic review. Evidence-Based Complementary and Alternative Medicine 2011; doi 10.1093/ecam/nep035"
          type: systematic-review
          citation_strength: direct
        - source: "Evidence Map of Cupping Therapy. Journal of Clinical Medicine 2021;10(8):1750 (PMC8073851)"
          type: systematic-review
          citation_strength: direct
      register: biomedical-evidence
      notes: "Zhang 2024 abstract confirms the quoted figures verbatim: 11 trials, 921 participants, d=1.09 (95% CI 0.35-1.83, p=0.004) at 2-8 weeks, d=0.11 at 1 month (p=0.85), d=0.39 at 3-6 months (p=0.11). It is a low back pain review, not general cupping. 'Reviewers uniformly note...' is the report's gloss across reviews. The report names 'Kim et al.' without a date. It is identified here as Kim et al. 2011 (cupping for pain), the review that fits the context, and that identification is an inference. The 2021 evidence map was confirmed by title and journal. Its first author was not checked against 'Cha'. It covers 13 reviews and reports potential benefit for low back pain, neck pain and knee osteoarthritis, among others. AlBedah 2011 reports that two of three systematic reviews found some evidence for cupping and pain."
    searches:
      - "Zhang Pasapula Wang Edwards Norrish cupping meta-analysis Complementary Therapies in Medicine 2024 103013"
      - "\"effectiveness of cupping therapy on low back pain\" 2024 abstract \"eleven\" participants \"2-8 weeks\" \"d = 1.09\""
      - "AlBedah \"Hijama (cupping): a review of the evidence\" Focus on Alternative and Complementary Therapies 2011"
      - "Kim JI Lee MS cupping for treating pain systematic review Evidence-Based Complementary and Alternative Medicine 2011"
      - "Cha cupping therapy evidence map systematic reviews 2021"
  - path: safety.adulteration_and_contamination
    outcome: corrected
    field:
      status: filled
      value:
        - product: Kushtae Sadaf (comparative elemental analysis, IJGP 2016)
          finding: "lead 28.7 ppm, above the permissible limit, in the in-house sample prepared by the furnace method (KSFM); lead, cadmium, mercury and arsenic within WHO limits in the sample prepared by the classical method (KSCM). A market sample (KSMS) was also analysed."
        - product: Unani and homeopathic samples (JPMA 1981)
          finding: 80% of 29 samples contained corticosteroids (cortisone, hydrocortisone, dexamethasone, prednisolone)
        - product: Jawarish Shahi (Discover Chemistry, 2026)
          finding: HR-LCMS of a marketed sample found mostly natural compounds plus 'a few synthetic or semisynthetic ingredients', including the antibiotic prodrug bacampicillin, which the authors say may indicate possible contamination; single-product preliminary finding
      citations:
        - source: "Mohammad NI, Shamsi S, Rabee K. Comparative elemental analysis of Kushtae Sadaf, a Unani formulation. International Journal of Green Pharmacy 2016;10(3)"
          type: primary-study
          citation_strength: direct
        - source: "Din NM et al. Abuse of steroidal drugs by Homoeopaths and Hakims. Journal of the Pakistan Medical Association 1981;31(9):204-5 (PMID 6798241)"
          type: primary-study
          citation_strength: direct
        - source: "Phytochemical profiling and heavy metal safety assessment of classical unani formulation Jawarish Shahi using advanced analytical techniques. Discover Chemistry 2026; doi 10.1007/s44371-026-00622-8"
          type: primary-study
          citation_strength: direct
          claim_match: matches
      register: biomedical-evidence
      notes: "Corrected the Kushtae Sadaf item. The 28.7 ppm lead figure came from an in-house sample made by the modern furnace method. It did not come from a marketed sample. The in-range sample was the classical-method preparation, so the contrast is between preparation methods, not batches or manufacturers. The abstract says 'permissible limit' and does not name a 10 ppm WHO/India figure. The NIUM Bengaluru affiliation from the report was not checked. The JPMA 1981 item was confirmed against the article record. The Jawarish Shahi item was confirmed: it is one marketed product, and the article describes bacampicillin as possible contamination. 'Single-batch' is inferred from the analysis of one marketed product. The authors of that article were not checked."
