      notes: "Replaced the S20 catalog record (oalib-perpustakaan.upi.edu) with the journal article. Changes: the wet-cupping review's year is now 2022 and its size 9 included studies. The conclusion now quotes the review's own wording ('most is of low quality') in place of 'of poor quality'. Post-COVID review: year set to 2025 and size to 10 included studies, from the published article. Its 'promising', n=60-100 and 'high risk in allocation' wording was not checkable from the abstract, so it is carried over from the report. The third item is the report's own synthesis, not a review. It has no external citation and is the report's stance."
