  - path: disruption.abolition_attempts
    outcome: found
    field:
      status: partial
      value: "No formal proposal, vote or statute to ban or abolish hakim practice was located in a primary or scholarly source. The nearest formal instruments are the provincial medical registration acts of British India, passed in all provinces between 1912 and 1919 (the Madras Medical Registration Act 1914 is named). These 'excluded traditional medicine providers' from the medical register. According to Sriram et al., they excluded traditional practitioners from registers but did not explicitly prohibit practice, creating an official versus unofficial distinction. Representatives of traditional providers objected at the time that such regulation 'may be justified in countries, where only one system of medicine is pursued, not in India'. Sriram et al. describe the result as a 'regulatory bifurcation of medicine in India, which never truly reconciled'."
      citations:
        - source: "Sriram V, Keshri VR, Kumbhar K, 'The impact of colonial-era policies on health workforce regulation in India: lessons for contemporary reform', Human Resources for Health 19:100 (2021), doi 10.1186/s12960-021-00640-w"
          type: primary-study
          citation_strength: direct
          claim_match: matches
      register: regulatory
      notes: "Registration acts are exclusion from privileges, not abolition. Practitioner and news sites claim that in 1910 the British government, or Viceroy Hardinge, intended to 'ban' indigenous systems, that the All India Ayurvedic and Unani Tibbi Conference (Ajmal Khan, 1910) opposed it, and that the 'ban was lifted in 1916'. No statute, bill or government record was found for this, and it should be treated as unverified. The individual provincial acts (Bombay Medical Act 1912; Bengal Medical Act 1914) were named only in search summaries and their texts were not read. No post-independence abolition proposal was found for India or Pakistan."
    searches:
      - "Unani Tibbi hakims medical registration act exclusion British India opposition Ajmal Khan 1910s"
      - "Bombay Medical Act 1912 Madras Medical Registration Act 1914 vaids hakims excluded register indigenous practitioners history"

  - path: literature_state.corpus_scale_appraisal
    outcome: found
    field:
      status: partial
      value: "No Unani-specific evidence map, overview of reviews or bibliometric analysis of the whole Unani clinical literature was located. The nearest count comes from an Ayurveda-focused bibliometric study of the AYUSH Research Portal (ARP v1.0). Of 39,663 indexed articles as of 30 June 2020, it collected 6,528 clinical-trial-based articles across AYUSH systems, of which 427 were Unani. It gives no Unani breakdown by condition or design. A separate bibliometric analysis of ARP data for all AYUSH systems (1954-2020, Alternative Therapies in Health and Medicine, PubMed 40862845) reports rising publications and about one-third in predatory journals across systems. Unani-specific figures from that paper were not retrieved."
      citations:
        - source: "Thrigulla SR et al., 'Clinical studies in Ayurveda: A bibliometric analysis of articles indexed in AYUSH research portal', AYU 43(3) (2022; PMC10710232, 2023)"
          type: primary-study
          citation_strength: direct
          claim_match: matches
        - source: "'Bibliometric Analysis of India's Ayush Systems of Medicine Using Ayush Research Portal Data from 1954-2020: Current Status, Challenges, and the Way Forward for Future Research', Alternative Therapies in Health and Medicine (PubMed 40862845)"
          type: primary-study
          citation_strength: indirect
      register: biomedical-evidence
      notes: "The 427 figure is a by-product of an Ayurveda study and counts ARP-indexed articles, not trials. It is not a corpus-scale appraisal of Unani. The second paper's abstract was seen only through a search summary, and PubMed did not load. Iranian Traditional Persian Medicine has its own RCT reporting-quality review (2018-2022, 139 RCTs eligible from 1,112 retrieved). It is not entered here because it is scoped to TPM, not Unani. Whether it counts depends on the extraction's system_boundary treatment of TPM, and it concerns quality (field 13) rather than volume. The absence of a Unani-wide corpus appraisal is itself the main finding."
    searches:
      - "bibliometric analysis Unani medicine clinical trials research output"
      - "evidence map Unani medicine clinical trials systematic overview all trials CCRUM"
      - "scientometric OR bibliometric \"Unani\" publications PubMed Scopus analysis clinical research trends"
      - "Iranian traditional Persian medicine clinical trials bibliometric systematic mapping all RCTs"
      - "\"Bibliometric Analysis of India's Ayush Systems of Medicine Using Ayush Research Portal Data from 1954-2020\""

  - path: contemporary_controversies.conservation_and_sourcing
    outcome: found
    field:
      status: partial
      value: "Unani's own substitution doctrine (abdal al-adwiya) is presented in recent Unani scholarship as a response to scarcity. Perveen et al. (2019) state that 'Unani drugs are substituted when they are endangered, costly, rare, banned or the procurement cumbersome', and validate selected substitutes phytochemically. They give no species-level conservation data. In Pakistan, Sher et al. (2014, Swat District) report that hakims mostly collected medicinal and aromatic plants themselves or through collectors, and that 'wild collection is almost the only source of medicinal plant raw material in the country, with virtually no cultivation'. They also note that major domestic manufacturers (Hamdard, Qarshi, Ajmal and others) produce 300-400 products, and that most of the high-value species studied 'are now classified as endangered', with local extirpation expected if unsustainable collection continues."
      citations:
        - source: "Perveen S, Wadud A, Ahmed Makbul SA, Sofi G, Perveen A, 'Unani concept of drug substitution (therapeutic interchange) and its validation on scientific parameters', Journal of Ayurveda and Integrative Medicine 11(3) (2020, online 2019) 301-307, doi 10.1016/j.jaim.2017.11.006"
          type: primary-study
          citation_strength: direct
          claim_match: matches
        - source: "Sher H, Aldosari A, Ali A, de Boer HJ, 'Economic benefits of high value medicinal plants to Pakistani communities: an analysis of current practice and potential', Journal of Ethnobiology and Ethnomedicine (2014), PMC4199063"
          type: primary-study
          citation_strength: direct
          claim_match: matches
      register: historical-scholarship
      notes: "Mixed register. Perveen et al. is emic Unani scholarship, and Sher et al. is ethnobotanical field research. Sher et al.'s endangered-species statement applies to the Swat study species, not to a list of Unani drugs, and the source does not label the named manufacturers as Unani. No Unani-specific study of CITES-listed materia medica was found. Musk (Moschus) is reported as used in Unani and its Himalayan populations are on CITES Appendix I, but that link was seen only on commercial and encyclopedia pages and is not entered. Ved & Goraya (NMPB/FRLHT 2007-08), the national raw-drug demand survey (960 traded species, about 319,500 MT demand in 2005-06), does not disaggregate by Unani."
    searches:
      - "Unani medicinal plants raw drugs conservation threatened species trade CITES Unani formulations"
      - "Unani medicine musk deer Moschus CITES Appendix I Unani formulations substitute kasturi conservation"
      - "Pakistan medicinal plant trade herbal markets Unani Tibb industry over-harvesting study raw drugs dawakhana"
      - "Unani abdal substitute drugs conservation endangered medicinal plants scarcity Unani pharmacopoeia raw drug availability"
      - "Ved Goraya demand and supply of medicinal plants in India ASU industry Unani consumption species wild collected NMPB FRLHT"

  - path: contemporary_controversies.intellectual_property
    outcome: found
    field:
      status: partial
      value:
        - "Defensive database: India's Traditional Knowledge Digital Library (CSIR and Ministry of AYUSH, established 2001) had transcribed 236,399 Unani formulations as of 25 March 2022. That is the largest single-system share of 418,885 total (Ayurveda 119,269; Siddha 54,689; Yoga 4,151; Sowa Rigpa 4,377), drawn from texts in Arabic, Persian and Urdu among other languages. Across all systems, 265 patent applications had been withdrawn, deemed withdrawn, amended or set aside on TKDL evidence by that date. Fourteen patent offices had access. In 2022 the Union Cabinet approved widening access beyond patent offices."
        - "Access and benefit sharing: under India's Biological Diversity Act 2002 (Act 18 of 2003), section 7 requires Indian citizens and bodies to give prior intimation to the State Biodiversity Board before obtaining biological resources for commercial utilisation. The original proviso exempts 'vaids and hakims, who have been practicing indigenous medicine' (s.7 in force 1 July 2004). The Biological Diversity (Amendment) Act 2023 (No. 10 of 2023) is reported to extend this exemption to registered AYUSH practitioners, and to exempt codified traditional knowledge and cultivated medicinal plants, subject to a certificate of origin from the Biodiversity Management Committee."
        - "No Unani-specific biopiracy case or patent opposition was located. Published TKDL case lists (e.g. Kumar & Sharma 2024) do not break outcomes down by system."
      citations:
        - source: "Press Information Bureau (Research Unit), 'Traditional Knowledge Digital Library (Ministry of AYUSH)' factsheet RU-30-02-0175-010922, 1 September 2022, citing PIB PRID 1809661"
          type: institutional
          citation_strength: direct
          claim_match: matches
        - source: "The Biological Diversity Act, 2002 (Act No. 18 of 2003), section 7 and proviso, consolidated text published by the Ministry of Environment, Forest and Climate Change"
          type: statute
          citation_strength: direct
          claim_match: matches
        - source: "The Biological Diversity (Amendment) Act, 2023 (No. 10 of 2023), Gazette of India (egazette.gov.in/WriteReadData/2023/247815.pdf)"
          type: statute
          citation_strength: unclear
        - source: "Kumar P, Sharma A, 'Impact of TKDL on Patent Applications in the Field of Bio-resources and the Associated TK', Journal of Intellectual Property Rights 29 (March 2024) 133-140, doi 10.56042/jipr.v29i1.3373"
          type: primary-study
          citation_strength: direct
          claim_match: matches
      register: regulatory
      notes: "The 2023 amendment text could not be retrieved (the gazette returned 503). Its content is taken from search-result reproductions of the gazette and law-firm summaries, so verify it against the gazette. The 2002 text was read directly. India's Nagoya Protocol ratification was not researched. The hakim exemption is a domestic-access carve-out and has been critiqued as weakening benefit sharing (critiques seen only in exam-prep and commentary pages, not entered). TKDL outcome counts are for all systems. No Unani-attributed patent case was found, and Pakistan-side TK or IP measures were not found."
    searches:
      - "Traditional Knowledge Digital Library Unani formulations number transcribed Qarabadeen"
      - "TKDL Unani prior art patent application withdrawn Unani formulation biopiracy case"
