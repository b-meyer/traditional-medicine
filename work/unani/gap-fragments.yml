  - path: disruption.loss_of_patronage
    outcome: found
    field:
      status: partial
      value: "Alavi (2008) dates a reorientation of unani away from aristocratic patronage to the early colonial transition: by the 1830s, Company efforts and the expansion of the printing press had created competing medical authorities, shifting health discourse 'from individual aristocratic virtue to societal well-being' and repositioning healers as public servants rather than personal physicians. No source located gives a dated collapse of Mughal, Awadh, Deccan or Hyderabad court patronage of hakims specifically."
      citations:
        - source: "Seema Alavi, 'Medical Culture in Transition: Mughal Gentleman Physician and the Native Doctor in Early Colonial India', Modern Asian Studies 42(5) (2008) 853-897, doi 10.1017/S0026749X07002958 (abstract)"
          type: primary-study
          citation_strength: direct
          claim_match: matches
      register: historical-scholarship
      notes: "Only the abstract was read. The worklist's dated targets (end of Mughal court at Delhi 1857, annexation of Awadh 1856, integration of Hyderabad 1948) are dynastic dates, but no source read ties them to the loss of patronage for hakims, so they are not entered. Alavi's book (Islam and Healing, Palgrave 2008) is reported in secondary descriptions to argue that Mughal-era unani was 'neither derived from the imperial court nor dependent on state support and patronage'. That was seen only in a search-result summary of a review and is not verified. If it holds, it qualifies any framing of court collapse as the main disruption. Attewell (Refiguring Unani Tibb, 2007) has a chapter on Hyderabad state, but the review read (Bastos, Medical History 53(4), 2009) does not discuss patronage."
