  source_report: v2
  value: Nationalist-tinged revival to modernize, systematize and defend Ayurveda against colonial delegitimization
    and internal decay (stagnant knowledge, poorly trained practitioners, unavailable quality medicines);
    later state-led institutionalization and pharmaceutical growth.
