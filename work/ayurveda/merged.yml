    dating_and_authorship_disputes:
      status: filled
      value:
      - scholar: G. Jan Meulenbeld
        position: Many problems about the texts and their authors are 'far from even approaching a solution'
          (HIML Ia, 656). Gives the most detailed discussion of Suśruta dating and sets aside Hoernle's
          old 600 BCE date.
      - scholar: Kenneth Zysk
        position: 'Classical Ayurveda''s empirico-rational character emerged from heterodox wandering
          ascetics and Buddhist monastic communities from about the 4th century BCE, not from Brahmanic
          Vedic religion; early Buddhist medicine was ''fundamental to the formation of ayurvedic medical
          thinking''. Work: Asceticism and Healing in Ancient India, 1991.'
      - scholar: Zimmermann (as quoted)
        position: Called Zysk's account 'a missing link between the hymns and charms of the Vedic period
          and the treatises of classical Ayurveda'.
      - scholar: Nationalist and traditionalist accounts (unnamed)
        position: Emphasize unbroken Vedic descent.
      - scholar: Historians (unnamed)
        position: No firm authorial identity for Suśruta, Caraka or the two Vāgbhaṭas; dates rest on internal
          layering, cross-references and the Bower Manuscript, not external documentary anchors; uncertainty
          is irreducible with current evidence.
      citations:
      - source: G. Jan Meulenbeld, HIML (named in text, no bibliography entry)
        type: historical-monograph
        citation_strength: unclear
      - source: Asceticism Healing Ancient India Medicine by Kenneth Zysk (AbeBooks)
        type: catalog-listing
        citation_strength: indirect
      - source: Asceticism and Healing in Ancient India (Motilal Banarsidass listing)
        type: catalog-listing
        citation_strength: indirect
      register: historical-scholarship
      notes: S1 and S2 are bookseller and publisher listings, not the work. Report itself notes Zysk's
        view is a scholarly position, not unanimous doctrine.
      source_report: v2
    transmission_mode:
      status: partial
      value: Textual, with lineage attributions (Ātreya to Agniveśa for the Caraka tradition) and, per
        the continuity camp, transmission through commentaries and lineages to the present. Zysk locates
        early transmission in Buddhist monastic communities.
      citations:
      - source: none (uncited in report)
        type: unclear
        citation_strength: unclear
      register: historical-scholarship
      notes: Report never states a transmission mode explicitly; this is assembled from scattered statements.
        Oral versus textual balance is not discussed.
      source_report: v2
    redaction_history:
      status: filled
      value: 'Caraka: earlier treatise (Agniveśa, Ātreya lineage), redacted by Caraka, then Dṛḍhabala
        restored missing portions (traditionally roughly one-third of the text). Suśruta: multi-layered,
        begun possibly in last centuries BCE, completed by a later redactor who added the sixth section
        (Uttaratantra).'
      citations:
      - source: G. Jan Meulenbeld, HIML (named in text, no bibliography entry)
