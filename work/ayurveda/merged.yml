        citation_strength: unclear
      - source: AyuSoft (C-DAC Pune) validation (no author or journal given)
        type: unclear
        citation_strength: unclear
      - source: Wrist-pulse piezoelectric sensor study (no author or journal given)
        type: unclear
        citation_strength: unclear
      register: biomedical-evidence
      notes: Entries are kept separate; designs are not comparable and the report's 'poor-to-fair' summary
