  canon_and_transmission:
    foundational_texts:
      status: filled
      value:
      - title: Caraka Saṃhitā
        date: early centuries CE
        author: Descends from a treatise attributed to Agniveśa (lineage of Ātreya); redacted by Caraka;
          partly reconstructed or completed by Dṛḍhabala
      - title: Suśruta Saṃhitā
        date: composition may have begun in the last centuries BCE; completed by a later redactor
        author: Suśruta (no firm authorial identity); later redactor added the Uttaratantra
      - title: Aṣṭāṅgahṛdaya and Aṣṭāṅgasaṃgraha
        date: c. 7th century CE
        author: Vāgbhaṭa (two Vāgbhaṭas, identity uncertain)
      citations:
      - source: G. Jan Meulenbeld, A History of Indian Medical Literature (HIML), 1999-2002 (named in
          text, no bibliography entry)
        type: historical-monograph
        citation_strength: unclear
      register: historical-scholarship
      notes: The three works form the Bṛhattrayī (Great Triad).
      source_report: v2
    secondary_canon:
      status: filled
      value: 'Laghutrayī (Lesser Triad): Mādhavanidāna, Śārṅgadharasaṃhitā, Bhāvaprakāśa'
      citations:
      - source: G. Jan Meulenbeld, HIML (named in text, no bibliography entry)
