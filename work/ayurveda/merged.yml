      source_report: v2
    sign_vs_synthesis:
      status: filled
      value: In the knee OA study, agreement on the final overall diagnosis (95% consensus) exceeded agreement
        on constitutional entities such as prakṛti and agni (κ 0-0.4). The report states agreement on
        disease entities exceeded agreement on constitutional entities. Kurande found lowest agreement
        on pulse and prakṛti.
      citations:
      - source: none (uncited in report)
        type: unclear
        citation_strength: unclear
      register: biomedical-evidence
      notes: The comparison is across different measures within one study; the report does not offer a
        sign-level versus synthesis-level test.
      source_report: v2
    standardization_efforts:
      status: filled
      value: CCRAS (Ministry of AYUSH) developed and reliability-tested a standardized Prakriti Assessment
        Scale (PAS) and an AYUR Prakriti web portal, targeting agreement of κ≈0.65. AyuSoft (C-DAC Pune)
        software and a piezoelectric wrist-pulse instrument are also reported.
      citations:
      - source: none (uncited in report)
        type: unclear
        citation_strength: unclear
      register: regulatory
      notes: Report says CCRAS sources are advocacy-oriented in general.
      source_report: v2
