      value:
      - domain: Clinical efficacy of Ayurveda in general
        threshold: Publication of adequately powered, independently replicated, low-risk-of-bias RCTs
          (ideally not India-only)
        would_change: Advice against relying on Ayurveda for disease-modifying benefit
      - domain: Product safety
        threshold: Enforceable, verified heavy-metal/GMP certification
        would_change: Advice to avoid rasaśāstra/bhasma and untested imported products
      - domain: Ashwagandha for stress/anxiety
        threshold: Larger high-certainty trials with standardized extracts confirming the pooled effect
          and resolving the hepatotoxicity signal
        would_change: Moves ashwagandha from 'promising' to 'recommended for stress/anxiety'
      citations: []
      register: biomedical-evidence
      notes: Report author's stance, not findings.
      source_report: v2
    recommendations:
      status: filled
      value:
      - audience: patient/consumer
        text: Treat Ayurvedic diagnosis as non-reproducible; do not rely on prakṛti/pulse readings for
          consequential decisions; obtain independent biomedical diagnosis for serious conditions.
      - audience: patient/consumer
        text: Avoid rasaśāstra/bhasma products and any imported product lacking third-party heavy-metal
          testing or a Certificate of Analysis.
      - audience: patient/consumer
        text: Be cautious with ashwagandha if you have liver disease, are pregnant, or intend long-term/high-dose
          use.
      - audience: patient/consumer
        text: Do not substitute Ayurveda for evidence-based treatment of cancer, diabetes, rheumatoid
          arthritis, or infections; if using adjunctively, tell your physician.
      - audience: researcher/policymaker
        text: Prioritize independent replication outside India; fund and mandate standardization of prakṛti
          assessment; enforce pharmacovigilance and heavy-metal limits; keep 'recognized medical system'
          claims proportionate to the evidence, distinguishing product safety from clinical efficacy.
      citations: []
      register: biomedical-evidence
      notes: Report author's stance, not findings.
