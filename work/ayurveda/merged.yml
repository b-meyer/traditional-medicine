  construct_debate:
    positions:
      status: filled
      value:
      - scholar: Frederick Smith and Dagmar Wujastyk (as the report names them)
        work: 'Modern and Global Ayurveda: Pluralism and Paradigms'
        year: 2008
        position: Today's Ayurveda (colleges, standardized pharmacopeia, branded drugs, globalized wellness
          and New Age forms) is substantially a modern construction.
        evidence_base: Historical and ethnographic scholarship on modern institutional and global forms.
      - scholar: Jean Langford
        work: Fluent Bodies
        year: 2002
        position: 'Reinvention camp: modern Ayurveda substantially a modern construction.'
        evidence_base: Not detailed in report.
      - scholar: Joseph Alter
        work: null
        year: null
        position: Reinvention camp.
        evidence_base: Not detailed in report.
      - scholar: Projit Mukharji
        work: Doctoring Traditions
        year: null
        position: Reinvention camp.
        evidence_base: Not detailed in report.
      - scholar: Maharishi Ayur-Ved case (Maharishi Mahesh Yogi, Deepak Chopra; analyzed by Jeannotat
          per report)
        work: null
        year: null
        position: Clearest example of a spiritualized consumer product only loosely tied to classical
          texts, launched mid-1980s.
        evidence_base: Case analysis; yoga-Ayurveda association said to be largely absent from the pre-modern
          ayurvedic record.
      - scholar: Indian government / Ministry of AYUSH, practitioner-scholars, some Indologists
        work: null
        year: null
        position: Unbroken living tradition descending from the classical saṃhitās through commentaries
          and lineages.
        evidence_base: Demonstrable persistence of texts, concepts and materia medica over roughly two
          millennia.
      - scholar: Dominik Wujastyk
        work: null
        year: null
        position: Continuity of texts, discontinuity of much practice (the report's 'nuanced middle').
        evidence_base: Historical scholarship; also served as expert witness in the 1991 UK 'Maharishi
          Ayurveda'/AIDS GMC case.
      - scholar: Sivaramakrishnan, Mukharji, Berger, Leslie, Langford, Banerjee, Bode, Bala (group, as
          listed by report)
        work: Doctoring Traditions and others
        year: null
        position: To survive, Ayurveda adopted college curricula, printed standardized textbooks, factory-manufactured
          branded drugs, professional registration (which marginalized folk and lay healers), anatomy
          and laboratory science, and the vocabulary of 'science'. The report calls this the empirical
          core of the reinvention thesis.
        evidence_base: Historical scholarship on colonial-era and later institutional change.
      citations:
      - source: About Us - Maharishi Ayurveda (maharishiayurvedaindia.com)
        type: practitioner-site
        citation_strength: indirect
      - source: Warrier 2011, Modern Ayurveda in Transnational Context, Religion Compass
        type: tertiary-review
        citation_strength: direct
        claim_match: mismatch
      - source: Named works (Smith and Wujastyk 2008; Langford 2002; Mukharji; Alter) with no bibliography
          entries
        type: historical-monograph
        citation_strength: unclear
      register: historical-scholarship
      notes: S24 is cited for Jeannotat's analysis of Maharishi Ayurveda as 'a controversial model of
        global Ayurveda', but the bibliography entry is by Warrier (2011), not Jeannotat; flagged as mismatch.
        The report names the volume's editor as 'Dagmar Wujastyk' while separately discussing Dominik
        Wujastyk. Report's own labelling of the two camps is kept.
      source_report: v2
    report_adjudication:
      status: filled
      value: 'Both camps are partly right and largely argue about different objects: the textual/conceptual
        core has real continuity, while the institutional, pharmaceutical and popular-wellness superstructure
        is demonstrably modern. The TL;DR states both continuity and reinvention are true at once.'
      citations:
      - source: none (uncited in report)
        type: unclear
        citation_strength: unclear
      register: historical-scholarship
      notes: The report's stance, not consensus.
      source_report: v2
  theoretical_primitives:
    constituents:
      status: filled
      value: Tridoṣa (vāta, pitta, kapha); dhātu (seven bodily tissues); mala (waste products); agni (digestive/metabolic
        fire); āma (undigested toxic residue from weak agni); srotas (channels of circulation/transport);
        prakṛti (individual constitutional type, held to be fixed at birth).
      citations:
      - source: none (uncited in report)
        type: unclear
        citation_strength: unclear
      register: emic
      notes: ''
      source_report: v2
    balance_logic:
      status: filled
      value: Health is balance of the three doṣas; imbalance (vikṛti) causes disease. Treatment aims to
        restore doṣic balance, kindle agni, clear āma, and maintain the healthy through regimen.
      citations:
      - source: none (uncited in report)
        type: unclear
        citation_strength: unclear
      register: emic
      notes: ''
      source_report: v2
    correspondence_system:
      status: absent
      value: null
      citations: []
      register: emic
      notes: 'Report describes no wider cosmological or seasonal scheme mapped onto doṣa. Search target:
        cosmological/elemental or seasonal correspondence scheme linked to tridoṣa in Ayurveda. The report
        also does not state that no such scheme exists, so not_applicable is not warranted. Report does
        note the humoral analogy to Greek four-humor theory (contact_and_borrowing).'
      source_report: v2
    etiology:
      status: partial
      value: Imbalance of doṣas (vikṛti) causes disease; weak agni produces āma, an undigested toxic residue.
      citations:
      - source: none (uncited in report)
        type: unclear
        citation_strength: unclear
      register: emic
      notes: Report gives no fuller aetiological classification.
      source_report: v2
    nosology:
      status: partial
      value: Diagnostic categories are frequently constitutional/whole-person rather than disease-oriented,
        so they resist one-to-one translation into ICD-style nosology; report mentions roga (disease)
        and rogī (patient) examination but lists no disease classification.
      citations:
      - source: none (uncited in report)
        type: unclear
        citation_strength: unclear
      register: historical-scholarship
      notes: ''
      source_report: v2
    relation_to_biomedical_anatomy:
      status: filled
      value: 'Doṣa, dhātu and srotas are functional and relational categories that do not correspond to
        discrete anatomical structures or measurable analytes; āma and agni have no validated biochemical
        referent. Mapping works loosely for lifestyle/metabolic stratification but fails at specific disease
        entities. Historical note: anatomy and laboratory science were adopted during modernization.'
      citations:
      - source: none (uncited in report)
        type: unclear
        citation_strength: unclear
      register: historical-scholarship
      notes: ''
      source_report: v2
    translation_programs:
      status: filled
      value:
      - program: Ayurgenomics (Bhavana Prasher, Mitali Mukerji and colleagues, CSIR-IGIB) and TRISUTRA
          consortium
        findings: Prasher et al. 2008 (J Transl Med) reported whole-genome expression and biochemical
          differences between extreme prakṛti types; later work reported EGLN1/VWF variants (hypoxia/thrombotic
          adaptation), HLA polymorphism links, CYP2C19 associations, distinct gut-microbiome signatures.
        maturity: preliminary
        limits: Small cohorts, heterogeneous prakṛti-assessment tools, incomplete biomarker validation;
          'suggestive analogy, not demonstrated equivalence'.
      - program: Claim that prakṛti stratification prefigures P4/precision medicine
        findings: Claimed analogy only.
        maturity: speculative
      citations:
      - source: Prasher et al. 2008, Journal of Translational Medicine (named in text, no bibliography
          entry)
        type: primary-study
        citation_strength: unclear
      - source: 2026 Frontiers in Medicine scoping review and 'Epigenomics and Ayurgenomics' review (named
          in text, no bibliography entry)
        type: systematic-review
        citation_strength: unclear
      register: biomedical-evidence
      notes: Maturity labels 'preliminary' comes from the report; 'speculative' for the P4 claim is the
        extractor's reading of 'has been claimed to prefigure'.
      source_report: v2
