- path: safety.intrinsic_toxicity
  source_report: v2
  value:
  - agent: Bhasma / rasaśāstra metal-mineral preparations
    mechanism_class: heavy metal
    note: Deliberately used metals; toxicity contested between defenders (Mao and Desai) and Saper
  - agent: Ashwagandha (Withania somnifera)
    mechanism_class: plant toxin
    note: Cholestatic hepatitis, sometimes acute-on-chronic liver failure with high mortality in pre-existing
      liver disease; Danish assessment also cited thyroid/hormonal effects and possible abortifacient
      action
  - agent: Undeclared corticosteroids and NSAIDs
    mechanism_class: pharmaceutical adulterant
    note: Recognized risk; no figures
  - agent: Delayed presentation to effective care
    mechanism_class: indirect
    note: Recognized risk
  - agent: Ayurvedic use alongside conventional treatment
    mechanism_class: interaction
    note: Report advises telling one's physician because of interaction and hepatotoxicity risk; no interaction
      data given
  weak_citations:
