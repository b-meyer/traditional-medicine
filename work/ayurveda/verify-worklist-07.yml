- path: safety.adulteration_and_contamination
  source_report: v2
  value:
  - study: Saper et al., JAMA 2004
    finding: 70 Ayurvedic products from 30 Boston-area stores; 20% (14/70) contained lead, mercury and/or
      arsenic; up to 37,000 µg/g lead in some
  - study: Saper et al., JAMA 27 August 2008
    finding: 193 US- and Indian-made products sold online; 20.7% contained detectable lead, mercury and/or
      arsenic; rasa śāstra products 40% versus 17% of herbal-only products (more than twice as likely)
  - study: CDC MMWR 2004
    finding: Lead-poisoning cases across five states linked to Ayurvedic medicines
  - study: Mikulski et al. 2017
    finding: Further lead-poisoning clusters
  - study: Mao and Desai (rebuttal)
    finding: Properly prepared bhasmas convert metals to non-toxic mixed oxides; Saper's rejoinder is
      that measured levels exceeded safety limits regardless of traditional processing
  - study: Pharmaceutical adulteration (unnamed)
    finding: Undeclared corticosteroids and NSAIDs recognized as a risk
  weak_citations:
  - source: Heavy Metals Found in Ayurvedic Medicines (staff.washington.edu)
    type: unclear
