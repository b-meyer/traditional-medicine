- path: evidence_state.reviews
  source_report: v2
  value:
  - modality: Whole-system individualized Ayurveda for rheumatoid arthritis
    best_available_review: Furst et al. 2011, J Clin Rheumatol 17:185-192, double-blind double-dummy RCT
      (pilot)
    type: primary-study
    year: 2011
    size: n=43 seropositive RA patients; 36 weeks; Ayurveda vs methotrexate vs combination; 148 formulations
    conclusion: No statistically significant differences between groups; Ayurveda neither demonstrably
      superior nor clearly inferior to methotrexate; fewer adverse events in the Ayurveda arm
    certainty_rating: null
    methodological_limitations_noted: Underpowered pilot
  - modality: Plant-derived formulation for rheumatoid arthritis
    best_available_review: Chopra et al. 2000, J Rheumatol
    type: primary-study
    year: 2000
    size: null
    conclusion: null
    certainty_rating: null
    methodological_limitations_noted: Only named as an earlier trial; no results stated
  - modality: Ayurvedic trial literature in RA (general)
    best_available_review: Park and Ernst 2005 systematic review
    type: systematic-review
    year: 2005
    size: null
    conclusion: Trial literature generally low quality
    certainty_rating: null
    methodological_limitations_noted: null
  - modality: Ashwagandha for stress and anxiety
    best_available_review: Della Porta et al. 2024, Explore, PMID 39348746
    type: meta-analysis
    year: 2024
    size: 9 RCTs, n=558
    conclusion: 'Significant effects: Perceived Stress Scale MD -4.72 (95% CI -8.45 to -0.99); Hamilton
      Anxiety Scale MD -2.19 (95% CI -3.83 to -0.55); serum cortisol MD -2.58 (95% CI -4.99 to -0.16)'
    certainty_rating: low-to-moderate
    methodological_limitations_noted: Substantial heterogeneity in formulation and dose; small samples.
      Report calls it arguably the strongest single-herb signal, tempered by safety concerns.
  - modality: Curcuma longa/curcumin, Boswellia, Triphala
    best_available_review: null
    type: null
    year: null
    size: null
    conclusion: Supportive but heterogeneous evidence
    certainty_rating: null
    methodological_limitations_noted: Bioavailability and standardization are recurring problems
  - modality: Kshar sutra for fistula-in-ano
    best_available_review: ICMR multicentric trials
    type: primary-study
    year: null
    size: null
    conclusion: One of the better-supported Ayurvedic surgical techniques; some evidence of lower recurrence
      but slower healing versus conventional surgery
    certainty_rating: null
    methodological_limitations_noted: null
  - modality: Type 2 diabetes and irritable bowel syndrome
    best_available_review: null
    type: null
    year: null
    size: null
    conclusion: Reviews find weak or insufficient high-quality evidence
    certainty_rating: null
    methodological_limitations_noted: null
  - modality: Whole-system Ayurvedic treatment of major diseases (general)
    best_available_review: Cochrane and other rigorous reviews (unnamed)
    type: null
    year: null
    size: null
    conclusion: Evidence 'insufficient, low-quality, or preliminary'; reviews call for larger, better-designed
      trials; report summary 'a few promising signals, no robustly established disease-modifying superiority'
    certainty_rating: null
    methodological_limitations_noted: Whole-system evaluation is hard to blind (better external validity);
      single-herb evaluation is easier to blind but loses individualization. Small samples, inadequate
      blinding, weak randomization, risk of bias in trials from India. Report found no high-certainty
      Cochrane-level positive conclusions.
