- path: construct_debate.positions
  source_report: v2
  value:
  - scholar: Frederick Smith and Dagmar Wujastyk (as the report names them)
    work: 'Modern and Global Ayurveda: Pluralism and Paradigms'
    year: 2008
    position: Today's Ayurveda (colleges, standardized pharmacopeia, branded drugs, globalized wellness
      and New Age forms) is substantially a modern construction.
    evidence_base: Historical and ethnographic scholarship on modern institutional and global forms.
  - scholar: Jean Langford
    work: Fluent Bodies
    year: 2002
    position: 'Reinvention camp: modern Ayurveda substantially a modern construction.'
    evidence_base: Not detailed in report.
  - scholar: Joseph Alter
    work: null
    year: null
    position: Reinvention camp.
    evidence_base: Not detailed in report.
  - scholar: Projit Mukharji
    work: Doctoring Traditions
    year: null
    position: Reinvention camp.
    evidence_base: Not detailed in report.
  - scholar: Maharishi Ayur-Ved case (Maharishi Mahesh Yogi, Deepak Chopra; analyzed by Jeannotat per
      report)
    work: null
    year: null
    position: Clearest example of a spiritualized consumer product only loosely tied to classical texts,
      launched mid-1980s.
    evidence_base: Case analysis; yoga-Ayurveda association said to be largely absent from the pre-modern
      ayurvedic record.
  - scholar: Indian government / Ministry of AYUSH, practitioner-scholars, some Indologists
    work: null
    year: null
    position: Unbroken living tradition descending from the classical saṃhitās through commentaries and
      lineages.
    evidence_base: Demonstrable persistence of texts, concepts and materia medica over roughly two millennia.
  - scholar: Dominik Wujastyk
    work: null
    year: null
    position: Continuity of texts, discontinuity of much practice (the report's 'nuanced middle').
    evidence_base: Historical scholarship; also served as expert witness in the 1991 UK 'Maharishi Ayurveda'/AIDS
      GMC case.
  - scholar: Sivaramakrishnan, Mukharji, Berger, Leslie, Langford, Banerjee, Bode, Bala (group, as listed
      by report)
    work: Doctoring Traditions and others
    year: null
    position: To survive, Ayurveda adopted college curricula, printed standardized textbooks, factory-manufactured
      branded drugs, professional registration (which marginalized folk and lay healers), anatomy and
      laboratory science, and the vocabulary of 'science'. The report calls this the empirical core of
      the reinvention thesis.
    evidence_base: Historical scholarship on colonial-era and later institutional change.
