- path: canon_and_transmission.dated_events
  source_report: v2
  value:
  - label: Buddhist monastic medicine formative period (Zysk thesis)
    date: from c. 4th century BCE
    description: Zysk's dating for the emergence of empirico-rational medicine in Buddhist monastic communities.
  - label: Suśruta Saṃhitā composition begins
    date: last centuries BCE (possible)
    description: Completed later with the Uttaratantra.
  - label: Caraka Saṃhitā dated
    date: early centuries CE
    description: General dating.
  - label: Bower Manuscript
    date: c. 4th-6th century CE
    description: Central Asian manuscript overlapping classical material.
  - label: Vāgbhaṭa works
    date: c. 7th century CE
    description: Aṣṭāṅgahṛdaya and Aṣṭāṅgasaṃgraha; post-classical literary expansion from about 600 CE.
  - label: Sanskrit medical texts translated at Baghdad
    date: 786-809
    description: Under Harun al-Rashid and the Barmakids; Caraka and Suśruta rendered into Persian and
      Arabic.
  - label: Rgyud bzhi compiled in written form
    date: c. 12th century CE
    description: Tibetan Four Medical Tantras integrating Ayurvedic principles.
  - label: Bower Manuscript discovered
    date: '1890'
    description: Brought to the Asiatic Society, Calcutta.
