- path: construct_debate.report_adjudication
  source_report: v2
  value: 'Both camps are partly right and largely argue about different objects: the textual/conceptual
    core has real continuity, while the institutional, pharmaceutical and popular-wellness superstructure
    is demonstrably modern. The TL;DR states both continuity and reinvention are true at once.'
  weak_citations:
  - source: none (uncited in report)
    type: unclear
    citation_strength: unclear
- path: theoretical_primitives.constituents
  source_report: v2
  value: Tridoṣa (vāta, pitta, kapha); dhātu (seven bodily tissues); mala (waste products); agni (digestive/metabolic
    fire); āma (undigested toxic residue from weak agni); srotas (channels of circulation/transport);
    prakṛti (individual constitutional type, held to be fixed at birth).
  weak_citations:
  - source: none (uncited in report)
    type: unclear
    citation_strength: unclear
- path: theoretical_primitives.balance_logic
  source_report: v2
  value: Health is balance of the three doṣas; imbalance (vikṛti) causes disease. Treatment aims to restore
    doṣic balance, kindle agni, clear āma, and maintain the healthy through regimen.
  weak_citations:
  - source: none (uncited in report)
    type: unclear
    citation_strength: unclear
- path: theoretical_primitives.etiology
  source_report: v2
  value: Imbalance of doṣas (vikṛti) causes disease; weak agni produces āma, an undigested toxic residue.
  weak_citations:
  - source: none (uncited in report)
    type: unclear
    citation_strength: unclear
- path: theoretical_primitives.nosology
  source_report: v2
  value: Diagnostic categories are frequently constitutional/whole-person rather than disease-oriented,
    so they resist one-to-one translation into ICD-style nosology; report mentions roga (disease) and
    rogī (patient) examination but lists no disease classification.
  weak_citations:
  - source: none (uncited in report)
    type: unclear
    citation_strength: unclear
- path: theoretical_primitives.relation_to_biomedical_anatomy
  source_report: v2
  value: 'Doṣa, dhātu and srotas are functional and relational categories that do not correspond to discrete
    anatomical structures or measurable analytes; āma and agni have no validated biochemical referent.
    Mapping works loosely for lifestyle/metabolic stratification but fails at specific disease entities.
    Historical note: anatomy and laboratory science were adopted during modernization.'
  weak_citations:
  - source: none (uncited in report)
    type: unclear
    citation_strength: unclear
