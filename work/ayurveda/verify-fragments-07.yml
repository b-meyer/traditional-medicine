  - path: evidence_state.preclinical_and_constituent_evidence
    outcome: corrected
    field:
      status: filled
      value:
        - agent: Boswellic acids (notably AKBA) from Boswellia serrata
          finding: Inhibit 5-lipoxygenase
          type: constituent pharmacology
          year: 1992
          citation: Safayhi et al. 1992, J Pharmacol Exp Ther 261(3):1143-6
        - agent: Arogyavardhini Vati (classically prepared) versus mercuric chloride
          finding: Rat studies showed normal tissue architecture with the Ayurvedic preparation versus significant organ damage from mercuric chloride; the report presents these as Ayurvedic researchers' arguments
          type: animal study
          year: 2012
          citation: Safety evaluation of an Ayurvedic medicine, Arogyavardhini vati on brain, liver and kidney in rats, J Ethnopharmacol 2012 (PMID 22265750)
      citations:
        - source: Safayhi H et al. 1992, Boswellic acids, novel, specific, nonredox inhibitors of 5-lipoxygenase, J Pharmacol Exp Ther 261(3):1143-1146 (PMID 1602379)
          type: primary-study
          citation_strength: direct
          claim_match: matches
        - source: Safety evaluation of an Ayurvedic medicine, Arogyavardhini vati on brain, liver and kidney in rats, J Ethnopharmacol 2012 (PMID 22265750)
          type: primary-study
          citation_strength: direct
          claim_match: matches
      register: biomedical-evidence
      notes: "Changed. The original cite for the Boswellia claim (S11, an Aflapin osteoarthritis efficacy/meta-analysis paper) does not report 5-LOX inhibition by AKBA; replaced with Safayhi 1992 (acetyl-11-keto-beta-boswellic acid most potent, IC50 1.5 uM, rat neutrophils; in vitro). Arogyavardhini entry is supported by the 2012 J Ethnopharmacol rat study (Wistar, 28 days, HgCl2 1 mg/kg; normal cytoarchitecture at up to 10x human-equivalent dose vs significant changes with HgCl2); authors not recorded. Preclinical only; not a clinical review."
