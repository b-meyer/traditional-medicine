  - path: safety.adulteration_and_contamination
    outcome: confirmed
    field:
      status: filled
      value:
        - study: Saper et al., JAMA 2004
          finding: 70 Ayurvedic products from 30 Boston-area stores; 20% (14/70) contained lead, mercury and/or arsenic; up to 37,000 µg/g lead in some
        - study: Saper et al., JAMA 27 August 2008
          finding: 193 US- and Indian-made products sold online; 20.7% contained detectable lead, mercury and/or arsenic; rasa śāstra products 40% versus 17% of herbal-only products (more than twice as likely)
        - study: CDC MMWR 2004
          finding: Lead-poisoning cases across five states linked to Ayurvedic medicines
        - study: Mikulski et al. 2017
          finding: Further lead-poisoning clusters
        - study: Mao and Desai (rebuttal)
          finding: Properly prepared bhasmas convert metals to non-toxic mixed oxides; Saper's rejoinder is that measured levels exceeded safety limits regardless of traditional processing
        - study: Pharmaceutical adulteration (unnamed)
          finding: Undeclared corticosteroids and NSAIDs recognized as a risk
      citations:
        - source: Saper RB et al. 2004, Heavy metal content of ayurvedic herbal medicine products, JAMA 292(23):2868-73 (PMID 15598918)
          type: primary-study
          citation_strength: direct
        - source: Saper RB et al. 2008, Lead, mercury, and arsenic in US- and Indian-manufactured Ayurvedic medicines sold via the Internet, JAMA 300(8):915-923
          type: primary-study
          citation_strength: direct
        - source: CDC 2004, Lead poisoning associated with Ayurvedic medications, five states, 2000-2003, MMWR 53(26):582-584
          type: institutional
          citation_strength: direct
        - source: Mikulski MA et al. 2017, Toxic metals in ayurvedic preparations from a public health lead poisoning cluster investigation, Int J Occup Environ Health
          type: primary-study
          citation_strength: direct
        - source: Mao J, Desai K and Saper RB reply, Metal content in Ayurvedic medicines (letters), JAMA 2009 (PMID 19155449)
          type: primary-study
          citation_strength: direct
      register: biomedical-evidence
      notes: "Confirmed against abstracts: 2004 study 70 products bought Apr-Oct 2003 within 20 miles of Boston, 14 (20%) contained metals, max lead 37,000 ug/g; 2008 study 193 products, 40 (20.7%); MMWR reported 12 adult cases in five states. The 30-store count, the 40% vs 17% split and Mikulski's 'clusters' were taken from secondary descriptions of the papers (2008 rasa shastra about 40% vs 17% herbal-only; Mikulski 65% of 252 samples contained lead) and not checked in full text. The 'undeclared corticosteroids and NSAIDs' entry has no primary source here and is unchanged. The Mao/Desai versus Saper exchange is the JAMA 2009 letter and reply. Original indirect sources (staff.washington.edu, Medical Xpress, supplysidesj) replaced."
    searches:
      - "Saper 2008 JAMA lead mercury arsenic Ayurvedic medicines sold on the Internet 193 products"
      - "Saper 2004 JAMA Heavy metal content of ayurvedic herbal medicine products 70 products"
      - "MMWR 2004 Lead poisoning associated with Ayurvedic medications five states 2000-2003"
      - "Mikulski 2017 lead poisoning Ayurvedic medicines"
      - "Mao Desai bhasma heavy metals Saper JAMA 2008 letter reply"
  - path: safety.intrinsic_toxicity
    outcome: confirmed
    field:
      status: filled
      value:
        - agent: Bhasma / rasaśāstra metal-mineral preparations
          mechanism_class: heavy metal
          note: Deliberately used metals; toxicity contested between defenders (Mao and Desai) and Saper
        - agent: Ashwagandha (Withania somnifera)
          mechanism_class: plant toxin
          note: Cholestatic hepatitis, sometimes acute-on-chronic liver failure with high mortality in pre-existing liver disease; Danish assessment also cited thyroid/hormonal effects and possible abortifacient action
        - agent: Undeclared corticosteroids and NSAIDs
          mechanism_class: pharmaceutical adulterant
          note: Recognized risk; no figures
        - agent: Delayed presentation to effective care
          mechanism_class: indirect
          note: Recognized risk
        - agent: Ayurvedic use alongside conventional treatment
          mechanism_class: interaction
          note: Report advises telling one's physician because of interaction and hepatotoxicity risk; no interaction data given
      citations:
        - source: Philips CA et al. 2023, Ashwagandha-induced liver injury, a case series from India and literature review (PMC10531359)
          type: primary-study
          citation_strength: direct
        - source: Saper RB et al. 2008, JAMA 300(8):915-923 and Mao J, Desai K, JAMA 2009 letter exchange (PMID 19155449)
          type: primary-study
          citation_strength: direct
        - source: DTU National Food Institute 2020, risk assessment of ashwagandha for the Danish Veterinary and Food Administration
          type: institutional
          citation_strength: direct
      register: biomedical-evidence
      notes: "Ashwagandha entry confirmed by Philips 2023 (predominantly cholestatic hepatitis; 3 patients with pre-existing liver disease and acute-on-chronic liver failure died). Danish assessment content (abortifacient traditional use, sex and thyroid hormones, five liver cases; no safe intake limit established) was confirmed only through secondary descriptions of the DTU 2020 report, not the report itself. The metal-toxicity dispute is confirmed by the JAMA 2009 exchange. The pharmaceutical-adulterant, indirect-harm and interaction entries are general statements by the report with no primary source located; they are unchanged and not independently verified."
    searches:
      - "Danish Technical University National Food Institute ashwagandha risk assessment thyroid abortifacient 2020"
      - "PMC10531359 ashwagandha liver injury case series"
  - path: safety.documented_adverse_events
    outcome: corrected
    field:
      status: filled
      value:
        - Ashwagandha-induced liver injury case series reported in Japan, the USA and Iceland, India, Germany and Poland (single cases) and elsewhere; an Indian series (8 patients) found injury with single-ingredient formulations, and chemical analysis of five formulations found no hepatotoxic contaminants or synthetic adulterants
        - CDC MMWR 2004 lead-poisoning cases (12 adults) across five states linked to Ayurvedic medicines
        - Further lead clusters (Mikulski et al. 2017)
      citations:
        - source: Philips CA et al. 2023, Ashwagandha-induced liver injury, a case series from India and literature review (PMC10531359)
          type: primary-study
          citation_strength: direct
        - source: CDC 2004, MMWR 53(26):582-584
          type: institutional
          citation_strength: direct
        - source: Mikulski MA et al. 2017, Int J Occup Environ Health
          type: primary-study
          citation_strength: direct
      register: biomedical-evidence
      notes: "Changed. The Netherlands is removed: the Philips 2023 literature review lists Japan (2017), US and Iceland (series), Germany, Poland and India, and no Dutch case. 'Unadulterated' clarified to the paper's finding that tested formulations had no hepatotoxic contaminants (one product had trace lead 0.21 mg/kg, cadmium, arsenic). Case count for MMWR added from the report's abstract. Any Dutch report may exist in other literature but was not located."
    searches:
      - "PMC10531359 ashwagandha liver injury case series countries"
      - "MMWR 2004 Lead poisoning associated with Ayurvedic medications five states 2000-2003"
