  - path: evidence_state.reviews
    outcome: corrected
    field:
      status: filled
      value:
        - modality: Whole-system individualized Ayurveda for rheumatoid arthritis
          best_available_review: Furst et al. 2011, J Clin Rheumatol 17:185-192, double-blind double-dummy RCT (pilot)
          type: primary-study
          year: 2011
          size: n=43 seropositive RA patients; 36 weeks; Ayurveda vs methotrexate vs combination; 148 formulations
          conclusion: Authors concluded all 3 treatments were approximately equivalent in efficacy within the limits of a pilot study; Ayurveda neither demonstrably superior nor clearly inferior to methotrexate; numerically fewer adverse events in the Ayurveda-only arm, but differences in adverse events were not statistically significant
          certainty_rating: null
          methodological_limitations_noted: Underpowered pilot
        - modality: Plant-derived formulation for rheumatoid arthritis
          best_available_review: Chopra et al. 2000, J Rheumatol 27:1365-72
          type: primary-study
          year: 2000
          size: null
          conclusion: null
          certainty_rating: null
          methodological_limitations_noted: Only named as an earlier trial; no results stated
        - modality: Ayurvedic trial literature in RA (general)
          best_available_review: Park and Ernst 2005 systematic review, Semin Arthritis Rheum
          type: systematic-review
          year: 2005
          size: null
          conclusion: Existing RCTs fail to show convincingly that Ayurvedic treatments are effective options for RA; paucity of RCTs
          certainty_rating: null
          methodological_limitations_noted: null
        - modality: Ashwagandha for stress and anxiety
          best_available_review: Arumugam et al. 2024, Explore, PMID 39348746
          type: meta-analysis
          year: 2024
          size: 9 RCTs, n=558
          conclusion: 'Significant effects: Perceived Stress Scale MD -4.72 (95% CI -8.45 to -0.99); Hamilton Anxiety Scale MD -2.19 (95% CI -3.83 to -0.55); serum cortisol MD -2.58 (95% CI -4.99 to -0.16)'
          certainty_rating: low-to-moderate
          methodological_limitations_noted: Substantial heterogeneity in formulation and dose; small samples. Report calls it arguably the strongest single-herb signal, tempered by safety concerns.
        - modality: Curcuma longa/curcumin, Boswellia, Triphala
          best_available_review: null
          type: null
          year: null
          size: null
          conclusion: Supportive but heterogeneous evidence
          certainty_rating: null
          methodological_limitations_noted: Bioavailability and standardization are recurring problems
        - modality: Kshar sutra for fistula-in-ano
          best_available_review: ICMR multicentric trials
          type: primary-study
          year: null
          size: null
          conclusion: One of the better-supported Ayurvedic surgical techniques; some evidence of lower recurrence but slower healing versus conventional surgery
          certainty_rating: null
          methodological_limitations_noted: null
        - modality: Type 2 diabetes and irritable bowel syndrome
          best_available_review: null
          type: null
          year: null
          size: null
          conclusion: Reviews find weak or insufficient high-quality evidence
          certainty_rating: null
          methodological_limitations_noted: null
        - modality: Whole-system Ayurvedic treatment of major diseases (general)
          best_available_review: Cochrane and other rigorous reviews (unnamed)
          type: null
          year: null
          size: null
          conclusion: Evidence 'insufficient, low-quality, or preliminary'; reviews call for larger, better-designed trials; report summary 'a few promising signals, no robustly established disease-modifying superiority'
          certainty_rating: null
          methodological_limitations_noted: Whole-system evaluation is hard to blind (better external validity); single-herb evaluation is easier to blind but loses individualization. Small samples, inadequate blinding, weak randomization, risk of bias in trials from India. Report found no high-certainty Cochrane-level positive conclusions.
      citations:
        - source: Furst DE et al. 2011, Double-blind, randomized, controlled, pilot study comparing classic Ayurvedic medicine, methotrexate, and their combination in rheumatoid arthritis, J Clin Rheumatol 17(4):185-192 (PMID 21617554)
          type: primary-study
          citation_strength: direct
        - source: Chopra A et al. 2000, Randomized double blind trial of an ayurvedic plant derived formulation for treatment of rheumatoid arthritis, J Rheumatol 27(6):1365-72 (PMID 10852255)
          type: primary-study
          citation_strength: direct
        - source: Park J, Ernst E 2005, Ayurvedic medicine for rheumatoid arthritis, a systematic review, Semin Arthritis Rheum (PMID 15846585)
          type: systematic-review
          citation_strength: direct
        - source: Arumugam V et al. 2024, Effects of Ashwagandha (Withania somnifera) on stress and anxiety, a systematic review and meta-analysis, Explore (NY) (PMID 39348746)
          type: meta-analysis
          citation_strength: direct
      register: biomedical-evidence
      notes: "Corrections. (1) The ashwagandha meta-analysis PMID 39348746 is by Arumugam et al. (Explore 2024); the report's attribution to Della Porta et al. is wrong. Design, n=9 RCTs/558 and the PSS MD -4.72 (95% CI -8.45 to -0.99) were confirmed against the abstract; the abstract gives HAM-A -2.19 and cortisol -2.58 but the CIs for those two and the 'low-to-moderate' certainty rating were not checked against the full text. (2) Furst 2011: the paper reports numerically fewer adverse events in the Ayurveda-only arm (112 vs 174 MTX, 176 combination) but states the differences were not statistically significant; wording adjusted. The 148-formulation figure was not checked. (3) Park and Ernst conclusion replaced with the authors' own wording; 7 RCTs, searched 1969-2003. Chopra 2000 (RA-1, n=182, 16 weeks, placebo-controlled) was left as 'named only' per the original scope. Not verified, remain uncited: curcumin/Boswellia/Triphala, ICMR kshar sutra trials, T2DM/IBS reviews, and the unnamed Cochrane verdict."
    searches:
      - "Furst 2011 Journal of Clinical Rheumatology Ayurvedic methotrexate rheumatoid arthritis double-blind double-dummy pilot"
      - "Della Porta 2024 Explore ashwagandha stress anxiety meta-analysis randomized controlled trials cortisol Perceived Stress Scale"
