  - path: disruption.suppression_or_marginalization
    outcome: corrected
    field:
      status: filled
      value:
        - "Grant Committee report, 20 October 1834, recommended replacing the NMI with a medical college teaching European medicine in English"
        - "Government order of 28 January 1835 abolished the NMI and discontinued the Ayurvedic (Sanskrit College) and Unani (Calcutta Madrasa) classes"
        - "Macaulay's Minute of 2 February 1835 (general education) and Bentinck's resolution of 7 March 1835 withdrew state funding from instruction in the Oriental languages and learning, a wider policy that followed the medical abolition"
        - "Calcutta Medical College: established by the order of 28 January 1835; student admissions began 20 February 1835; teaching Western medicine in English"
        - "Professional registration (undated) marginalized folk and lay healers"
      citations:
        - source: "Medical College Bengal - A Pioneer Over the Eras (PMC3824763)"
          type: tertiary-review
          citation_strength: direct
        - source: "Mehta R, Pandya B, Dasgupta S. Colonial India - Health care lessons. Sushruta Journal of Health Policy & Opinion 13(3), 2020"
          type: tertiary-review
          citation_strength: direct
        - source: "Macaulay, Minute on Indian Education, 2 February 1835 (text)"
          type: historical-monograph
          citation_strength: direct
        - source: "Lexicon, History Revisited: The Origins of Medical Education in India (Grant Committee report 20 Oct 1834; admissions 20 Feb 1835)"
          type: practitioner-site
          citation_strength: indirect
      register: historical-scholarship
      notes: "Changes: (1) the original tied the end of state medical patronage to Macaulay's Minute and Bentinck's resolution. The medical classes were abolished by the order of 28 January 1835, before the Minute (2 Feb 1835), and Bentinck's resolution on the Minute is dated 7 March 1835, not February. The Minute concerns education generally, not medicine specifically. (2) 'Opened 20 February 1835' reworded: the college was established by the 28 January order and admissions began 20 February; other sources say classes began 1 June 1835. (3) The Grant Committee date of 20 Oct 1834 and the 20 Feb admissions date rest on the Lexicon article only (indirect). (4) The 'professional registration (undated)' item could not be sourced and is carried unchanged; treat as unverified. Sources searched did not name the Grant Committee report's author precisely (Sushruta article calls him 'Lord John Grant'; not adopted)."
    searches: ["Native Medical Institution Calcutta 1822 Tytler abolished 28 January 1835 Medical College Bengal 20 February 1835", "Macaulay Minute on Education 2 February 1835 Bentinck resolution 7 March 1835", "Calcutta Medical College 20 February 1835 students admitted Bramley opened"]
