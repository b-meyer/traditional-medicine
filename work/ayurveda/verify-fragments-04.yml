  - path: disruption.practitioner_response
    outcome: confirmed
    field:
      status: filled
      value: "Nationalist-tinged revival c. 1900-1947. P. S. Varier founded Arya Vaidya Sala, Kottakkal (1902) and Arya Vaidya Patasala (1917); Gananath Sen presided over the All India Ayurvedic Congress (1911, 1920, 1931) and advocated samanvaya; the All India Ayurvedic Congress (Akhil Bharatiya Ayurveda Mahasammelan) formed as umbrella professional body, organized nationally around 1907."
      citations:
        - source: "Arya Vaidya Sala Kottakkal, About us (official history): Sala founded by P.S. Varier 1902; Aryavaidya Pathasala 1917"
          type: institutional
          citation_strength: direct
        - source: "The legacy of Kaviraj Gananath Sen: Bridging traditions in Ayurveda. Journal of Research in Ayurvedic Sciences, 2024 (LWW)"
          type: primary-study
          citation_strength: direct
        - source: "Akhil Bhartiya Ayurved Mahasammelan, About AICC: Ayurvedic Congress established 1907 in Nasik"
          type: institutional
          citation_strength: direct
      register: historical-scholarship
      notes: "Dates confirmed. Sen's presidencies (Allahabad 1911, Indore 1920, Mysore 1931) come from the LWW article as seen in a search summary; the full text was paywalled (HTTP 402). 'Samanvaya' is not confirmed verbatim, though the article title concerns bridging traditions. The AICC site does not name a founder; a different source attributes the 24 May 1907 founding to Shankar Daji Pade Shastri. Institutional sites are self-descriptions."
    searches: ["Arya Vaidya Sala Kottakkal founded 1902 Arya Vaidya Pathasala 1917 P. S. Varier", "Gananath Sen All India Ayurvedic Congress president 1911 1920 1931 samanvaya", "All India Ayurvedic Congress founded 1907"]
