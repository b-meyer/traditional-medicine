          type: tertiary-review
          citation_strength: direct
      register: emic
      notes: "Shodhana, marana/puta, gandhaka (sulfur) and herbal media, and amla pariksha as one of the bhasma quality tests are described in the Rasashastra review literature. The gloss 'acid-stability test' for amla pariksha is the report's paraphrase; the Rohra review calls it an acid dissolution test. Full text of Rohra was only retrieved as a machine summary. Replaces the Grokipedia citation."
