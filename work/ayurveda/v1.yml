  construct_debate:
    positions:
      status: incidental
      value:
        - {scholar: "Kenneth Zysk", work: "Asceticism and Healing in Ancient India (OUP 1991); Mythology and the Brahmanization of Indian medicine (1999)", year: "1991; 1999", position: "Rational-empirical Ayurveda evolved from itinerant ascetic (sramana) healers around Buddhist monasteries, later Brahmanized; report says influential and broadly accepted, though critics say it underplays the living tradition and treats magico-religious antecedents too narrowly", evidence_base: "Textual analysis of Buddhist monastic and Ayurvedic sources (as described by the report)"}
        - {scholar: "Francis Zimmermann", work: "Review in Journal of the American Oriental Society", year: null, position: "Praised Zysk's thesis as a 'missing link'", evidence_base: "Book review"}
        - {scholar: "Dominik Wujastyk; Madhulika Banerjee; contributors to Modern and Global Ayurveda (SUNY)", work: "20th-century policy; 'Standardization and Pharmaceuticalization'; Modern and Global Ayurveda (Wujastyk and Smith eds.)", year: null, position: "Document the biomedicalization and pharmaceuticalization of Ayurveda and critique a 'neo-Ayurveda' that repackages classical practice in biomedical and market terms, sometimes at odds with classical individualized practice", evidence_base: "Historical and social-science scholarship (not detailed)"}
      citations:
        - {source: "Zysk 1991 (OUP); Zimmermann in JAOS; Wujastyk/Banerjee/Modern and Global Ayurveda, named in text without [Sn]", type: historical-monograph, citation_strength: unclear}
      register: historical-scholarship
      notes: "The continuity-versus-construction question was not asked. Zysk's thesis concerns origins (Vedic versus ascetic), not 19th-20th century construction; the neo-Ayurveda critique is the closest the report comes to it. Covered in passing only."
    report_adjudication:
      status: not_requested
      value: null
      citations: []
      register: historical-scholarship
      notes: "The report does not judge between continuity and construction. Its only related verdict is that Zysk's thesis is influential and broadly accepted as illuminating."
  theoretical_primitives:
    constituents:
      status: filled
      value: "Pancha mahabhuta (akasa, vayu, tejas/agni, ap/jala, prithvi). Tridosha  Vata (space+air), Pitta (fire+water), Kapha (water+earth), each with five subtypes and sites (Kapha above chest, Pitta chest to navel, Vata below navel, Ashtanga Hridaya Sutrasthana 1). Seven dhatus (rasa, rakta, mamsa, meda, asthi, majja, shukra) formed sequentially; three malas (feces, urine, sweat); agni, ama, ojas, srotas; prakriti and vikriti."
      citations:
        - {source: "Report text, no [Sn] marker", type: unclear, citation_strength: unclear}
      register: emic
      notes: "Qualities per dosha are listed in the report (e.g., Vata cold, light, dry, mobile, rough, subtle). Modern 'energy' readings of doshas are flagged by the report as modern glosses."
    balance_logic:
      status: filled
      value: "Health is doshic equilibrium; disease arises from doshic disturbance (vaisamya). Svastha (Sushruta's definition)  doshas and agni balanced, dhatus and malas functioning normally, senses, mind and self content. Vikriti is the current imbalanced state relative to inborn prakriti. Therapy is Shodhana (purification) or Shamana (palliation)."
      citations:
        - {source: "Report text, no [Sn] marker", type: unclear, citation_strength: unclear}
      register: emic
      notes: null
    correspondence_system:
      status: partial
      value: "Samkhya cosmology (purusha/consciousness and prakriti/primordial matter and evolutes) plus Nyaya-Vaisesika categorial analysis and Yoga are named as the darsana roots. Seasonal regimen (ritucarya) is listed as a preventive practice."
      citations:
        - {source: "Report text, no [Sn] marker", type: unclear, citation_strength: unclear}
      register: emic
      notes: "The report does not describe how the constituents map onto a cosmological or seasonal scheme, only that these philosophies underlie the system."
    etiology:
      status: filled
      value: "Impaired agni (mandagni) produces ama (undigested toxic residue), said to be the root of disease; disease as doshic disturbance. Nidana (etiology) is the first element of the Nidana Panchaka."
      citations:
        - {source: "Interrater Reliability of Diagnostic Methods in Traditional Indian Ayurvedic Medicine (PMC) (S3)", type: primary-study, citation_strength: direct, claim_match: mismatch}
      register: emic
      notes: "S3 is a reliability study and does not appear to be about agni or ama, the claim it is cited for in the report. Verification target."
    nosology:
      status: absent
      value: null
      citations: []
      register: emic
      notes: "The report names Madhava Nidana as the diagnostic text and the Nidana Panchaka framework but gives no disease classification. Missing: how classical Ayurvedic nosology classes diseases (categories, counts) and how they relate to dosha types."
    relation_to_biomedical_anatomy:
      status: partial
      value: "The report says the theory does not map onto modern biochemistry. Modern glosses render doshas as kinetic/thermal/mechanical energy or homeostatic principles (Hankey), which the report calls modern, non-classical and contested. Prakriti is called arguably too broad for gene-association studies (Analabha Basu). Critics say doshic theory does not correspond to physiology."
      citations:
        - {source: "Hankey; Analabha Basu; David Gorski, named in text without [Sn]", type: unclear, citation_strength: unclear}
      register: historical-scholarship
      notes: "No account of where classical anatomy (srotas, dhatus, marmas) does or does not match biomedical anatomy; no explicit refusal by the tradition is reported."
    translation_programs:
      status: filled
      value:
        - {program: "Ayurgenomics (Mukerji and Prasher, CSIR-IGIB)", maturity: "preliminary", description: "2008 report of differential gene expression among 'extreme' prakriti types; 2010 PNAS report linking a high-altitude-sickness gene variant to kapha prakriti; TRISUTRA consortium output (Prasher et al., J Ethnopharmacol 2017;197:274-293). Report says molecular grounding remains exploratory and unreplicated; 2024-2025 reviews concede lack of standardized prakriti assessment limits translation."}
        - {program: "Hankey and others  reading doshas as energy or homeostatic principles", maturity: "speculative", description: "Called modern glosses, contested, by the report"}
        - {program: "Golden Triangle Partnership (Mashelkar, CSIR, Chitrakoot 2003)", maturity: "preliminary", description: "State-driven project linking traditional medicine, modern medicine and modern science"}
        - {program: "Sensor-based Nadi instruments and AI", maturity: "preliminary", description: "Being developed to reduce pulse-diagnosis subjectivity; unvalidated for routine clinical use"}
        - {program: "Nano-particulate descriptions of bhasmas", maturity: "speculative", description: "Increasingly used in Indian-journal reviews; report calls the safety claims not established"}
      citations:
        - {source: "Prasher et al., Journal of Ethnopharmacology 2017 (named, no [Sn]); 2024-2025 PMC scoping and multi-omics reviews (unnamed)", type: unclear, citation_strength: unclear}
        - {source: "From desired futures to market realities  Frontiers (S2)", type: tertiary-review, citation_strength: direct}
        - {source: "Rasashastra  Grokipedia (S13)", type: open-encyclopedia, citation_strength: indirect}
      register: biomedical-evidence
      notes: "Maturity labels are the report's wording ('exploratory and unreplicated', 'unvalidated') mapped to the codebook scale. The bhasma nano-particulate claim is sourced to S13, an encyclopedia."
  diagnostics:
