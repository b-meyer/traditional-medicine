  self_reported_gaps:
    inventory:
      status: filled
      value:
        - kind: source-caveat
          text: |-
            Dating and authorship of the classical texts remain genuinely uncertain; the ranges given follow Meulenbeld/Wujastyk but are debated.
        - kind: contested-item
          text: |-
            Distinguish claims from evidence: doshic/prakriti theory is presented here as the tradition's internal logic, not as validated physiology; "energy" reinterpretations of the doshas are modern and contested.
        - kind: source-caveat
          text: |-
            Positive-result bias in the Ayurvedic clinical literature is well documented; single positive trials (especially from non-independent sources) should be treated cautiously.
        - kind: gap
          text: |-
            Several therapeutic areas (Panchakarma efficacy, rasayana, bhutavidya) have little rigorous evidence.
        - kind: source-caveat
          text: |-
            Some contamination/case data are drawn from specific geographic samples (Boston, NYC, Wisconsin) and product batches and should not be read as characterizing every product or manufacturer.
        - kind: gap
          text: |-
            High-quality independent tertiary sources were scarce for Panchakarma efficacy, for rasashastra safety (the review literature there is dominated by advocacy-leaning Indian-journal sources), and for validating prakriti/pulse diagnosis, where the best available evidence is a small number of reliability studies.
        - kind: source-caveat
          text: |-
            Several searches surfaced non-scholarly commercial/wellness pages and news aggregators; these were used only for the factual chronology of contemporary controversies (Coronil, mixopathy) and cross-checked against peer-reviewed or governmental sources.
        - kind: source-caveat
          text: |-
            Where primary studies (individual RCTs, the JAMA contamination surveys, CDC MMWR case reports) are cited, they are flagged as primary and, where possible, reached through reviews.
        - kind: contested-item
          text: |-
            Zysk's thesis ... critics note it can underplay the living tradition and treat magico-religious antecedents too narrowly.
        - kind: contested-item
          text: |-
            Some modern review literature reinterprets the doshas as "kinetic/thermal/mechanical energy" or homeostatic principles ... these are modern glosses, not classical statements, and are contested.
        - kind: contested-item
          text: |-
            The claim that processing eliminates toxicity is not established and is contradicted by toxicological case evidence ... This is the single most scientifically contested therapeutic area of Ayurveda.
