      notes: null
    dating_and_authorship_disputes:
      status: partial
      value:
        - "Meulenbeld dates the redaction of core texts across a broad window and discusses layered authorship and the authorship and dating debates exhaustively; the report does not give his individual conclusions beyond those in foundational_texts."
        - "Wujastyk (2003) is cited for the Sushruta pre-~500 CE compilation."
        - "The report says popular precise dates such as 'Sushruta 600 BCE' are less secure and often overstated."
        - "Caveats  'Dating and authorship of the classical texts remain genuinely uncertain; the ranges given follow Meulenbeld/Wujastyk but are debated.'"
      citations:
        - {source: "Meulenbeld (1999-2002); Wujastyk (2003), named in text without [Sn]", type: reference-work, citation_strength: unclear}
      register: historical-scholarship
      notes: "Partial because named scholars are given but not their competing date ranges or the counter-positions."
    transmission_mode:
      status: partial
      value: "Textual (compendia and commentarial tradition); a Brahmanized mythological lineage is claimed (Brahma via the Asvins and Indra), which Zysk treats as a later retrofit; Zysk places early transmission among itinerant ascetic healers in Buddhist monastic settings; hereditary practitioner families kept forehead-flap rhinoplasty in practice into the modern era."
      citations:
        - {source: "Zysk, Asceticism and Healing in Ancient India (OUP 1991); Zysk 1999 essay on Brahmanization, named in text without [Sn]", type: historical-monograph, citation_strength: unclear}
      register: historical-scholarship
      notes: "The report never states a transmission mode as such; this entry is assembled from its statements on lineage and practice."
    redaction_history:
      status: partial
      value: "Charaka Samhita is a redaction of the earlier Agnivesha tantra with layered authorship (Meulenbeld). Ashtanga Sangraha is regarded as later than the Ashtanga Hridaya. Zysk describes a later Brahmanization that retrofitted Vedic mythological lineages."
      citations:
