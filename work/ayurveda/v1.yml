    reliability_evidence:
      status: filled
      value:
        - statistic: "weighted kappa (average pairwise)"
          value: "pulse 0.07; tongue 0.17; prakriti 0.28 (confidence interval not given by the report). Report reads these as poor to at best fair on the Landis-Koch scale."
          design: clinician-vs-clinician
          population: "healthy volunteers"
          n_raters: 15
          n_subjects: 20
          target: "three separate items  pulse finding, tongue finding, prakriti (constitutional type)"
          citation: "Kurande et al., Interrater Reliability of Diagnostic Methods in Traditional Indian Ayurvedic Medicine, Evid Based Complement Alternat Med 2013 (S5, S3). Raters were registered Ayurvedic doctors with 3-15 years' experience."
        - statistic: null
          value: "Reliability 'ranged from poor to moderate'; experienced physicians showed statistically better agreement (p = 0.04); doctors more often diagnosed dual-dosha combinations than single doshas. No coefficient is reported by the report."
          design: null
          population: null
          n_raters: null
          n_subjects: null
          target: "pulse diagnosis and body constitution (prakriti) diagnosis"
          citation: "Kurande et al., Repeatability of Pulse Diagnosis and Body Constitution Diagnosis, Global Advances in Health and Medicine 2012 (S4)"
      citations:
        - {source: "Interrater reliability of diagnostic methods in traditional Indian ayurvedic medicine  PubMed (S5)", type: primary-study, citation_strength: direct}
        - {source: "Interrater Reliability of Diagnostic Methods in Traditional Indian Ayurvedic Medicine (PMC) (S3)", type: primary-study, citation_strength: direct}
        - {source: "Repeatability of Pulse Diagnosis and Body Constitution Diagnosis in Traditional Indian Ayurveda Medicine (ResearchGate) (S4)", type: primary-study, citation_strength: direct}
      register: biomedical-evidence
      notes: "The second study's statistic, design (the report calls it a 'repeatability' study, so possibly intra-rater), population and counts are not given by the report; left null rather than guessed. Values are not comparable and are not combined. The report's own summary  'diagnostic reliability generally low to moderate'  is not a verdict entered here."
    sign_vs_synthesis:
      status: not_requested
      value: null
      citations: []
      register: biomedical-evidence
      notes: "The report does not separate agreement on single signs from agreement on an integrated judgment. Pulse and tongue findings and prakriti are reported side by side, but not framed in that way."
    standardization_efforts:
      status: partial
      value: "Prakriti questionnaires are named in the TL;DR as a validation effort with poor reproducibility. Sensor-based Nadi instruments and AI approaches are in development and unvalidated for routine clinical use. No agreement threshold is stated."
      citations:
        - {source: "Report text, no [Sn] marker", type: unclear, citation_strength: unclear}
      register: biomedical-evidence
      notes: "No official scale, named questionnaire or target agreement threshold is given."
    evidence_borrowed_from_other_traditions:
