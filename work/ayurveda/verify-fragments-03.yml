      register: emic
      notes: Replaces the Grokipedia citation. Panchakarma components, the shodhana/marana/puta processing of Rasashastra and the Sushruta surgical repertoire were all confirmed against these works. Not separately verified beyond the report's own wording were the yoga and the ahara/dinacharya/ritucharya/sadvritta items, and the statement that detoxification framing lacks robust trial support (the Springer chapter title poses the question but its conclusions were not read).
