    outcome: confirmed
    field:
      status: filled
      value:
        - name: Roga parīkṣā and rogī parīkṣā
          examines: Disease and patient respectively
        - name: Aṣṭavidha parīkṣā (eightfold examination)
          examines: Pulse/nāḍī, urine, stool, tongue, voice/speech, skin/touch, eyes, general appearance
        - name: Nāḍī parīkṣā (pulse diagnosis)
          examines: Pulse; widely argued to be a relatively late addition
        - name: Prakṛti assessment
          examines: Constitutional type
      citations:
        - source: Charaka Samhita, Vimana Sthana ch. 4 (Trividha Roga Vishesha Vijnaniya Vimana), online edition carakasamhitaonline.com
          type: reference-work
          citation_strength: direct
        - source: Yogaratnakara, Ashtasthana pariksha (eight examinations, listed as nadi, mutra, mala, jihva, shabda, sparsha, drik, akriti), as described in Ashtasthana Pariksha review, JAIMS
          type: tertiary-review
          citation_strength: direct
      register: emic
      notes: "Roga and rogi pariksha, and trividha/shadvidha/ashtavidha/dashavidha groupings, are named in Charaka Vimana 4. The specific eightfold list of the value (nadi, mutra, mala, jihva, shabda, sparsha, drik, akriti) is the Ashtasthana pariksha of Yogaratnakara; Sharngadhara is credited with first describing nadi pariksha but not the eightfold list. Nadi is not part of the Charaka examination lists, which supports the late-addition reading, but this is a scholarly inference and no dating scholar was checked. Label 'Ashtavidha' in the value refers to the Yogaratnakara scheme, not Charaka's own eightfold grouping."
