  - path: diagnostics.sign_vs_synthesis
    outcome: corrected
    field:
      status: filled
      value: In the knee OA study (Kessler et al. 2019), agreement on the final overall diagnosis (95% consensus) exceeded chance-corrected agreement on constitutional entities such as prakṛti and agni (κ 0-0.4); the authors state that agreement on disease-related entities was better than on constitutional entities. In Kurande et al. 2013 the lowest average agreement was for pulse (κ 0.07), then tongue (0.17), with prakṛti the highest of the three (0.28).
      citations:
        - source: Kessler et al. 2019, J Altern Complement Med (PMC6748397)
          type: primary-study
          citation_strength: direct
        - source: Kurande et al. 2013, eCAM Art. ID 658275 (PMC3803118)
          type: primary-study
          citation_strength: direct
      register: biomedical-evidence
      notes: "Changed: the original said Kurande found lowest agreement on pulse and prakṛti. The article reports pulse 0.07, tongue 0.17, prakṛti 0.28, so prakṛti was not lowest. The 95% figure is percent consensus agreement; the kappas are a different statistic, so the contrast is the authors' own, not a like-for-like comparison."
    searches: ["knee osteoarthritis Ayurveda nested diagnostic study inter-rater agreement prakriti agni consensus diagnosis 2019", "Kurande Interrater Reliability of Diagnostic Methods in Traditional Indian Ayurvedic Medicine 2013 eCAM"]
  - path: diagnostics.standardization_efforts
    outcome: corrected
    field:
      status: filled
      value: CCRAS (Ministry of AYUSH) developed a standardized Prakriti Assessment Scale (PAS; 91 predictors in 30 domains, four traits) validated for face, content, construct and criterion validity and tested for intra-rater and inter-rater reliability with the kappa statistic, plus an AYUR Prakriti web portal to administer it. AyuSoft (C-DAC Pune) software and a piezoelectric wrist-pulse instrument are also reported.
      citations:
        - source: Development of a standardized assessment scale for assessing Prakriti (psychosomatic constitution), AYU 43(4):109-129, 2022, doi 10.4103/ayu.ayu_239_22
          type: primary-study
          citation_strength: direct
        - source: Rotti et al. 2014, J Ayurveda Integr Med 5(3):167-175 (AyuSoft)
          type: primary-study
          citation_strength: direct
      register: biomedical-evidence
      notes: "Changed: the original stated a target of κ≈0.65. I could not read the AYU article body (paywalled). A search excerpt said κ 0.65 was considered reasonable agreement and the expected κ was 0.75, so the 0.65 'target' is unconfirmed and imprecise, and is removed here. PAS, portal and kappa-based reliability testing are confirmed from the abstract. The wrist-pulse instrument is Rao et al. 2022, see reliability_evidence."
    searches: ["CCRAS Prakriti Assessment Scale reliability AYUR Prakriti web portal kappa 0.65", "Development of a standardized assessment scale for assessing Prakriti AYU 2022 pubmed PMC kappa"]
  - path: modalities.items
