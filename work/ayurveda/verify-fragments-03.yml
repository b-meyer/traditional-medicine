  - path: diagnostics.reliability_evidence
    outcome: corrected
    field:
      status: filled
      value:
        - study: Kurande et al. 2013, 'Interrater Reliability of Diagnostic Methods in Traditional Indian Ayurvedic Medicine', eCAM Art. ID 658275
          statistic: weighted κ (average pairwise)
          value: pulse 0.07; tongue 0.17; prakṛti 0.28
          confidence_interval: null
          design: clinician-vs-clinician
          population: healthy volunteers
          n_raters: 15
          n_subjects: 20
          target: pulse assessment, tongue assessment, prakṛti (constitutional type), assessed separately
          citation: Kurande V, Bilgrau AE, Waagepetersen R, Toft E, Prasad R. Evid Based Complement Alternat Med 2013, Art. ID 658275
          notes: 105 pairwise comparisons; raters were registered Ayurvedic doctors with 3-15 years' experience; authors concluded 'low level of reliability for all types of assessment'. Prakṛti assessment was reported to be reliable when questionnaire and software were used.
        - study: "Kessler et al. 2019, 'Reliability of Ayurvedic Diagnosis for Knee Osteoarthritis Patients: A Nested Diagnostic Study Within a Randomized Controlled Trial', J Altern Complement Med"
          statistic: percent agreement (consensus)
          value: 95%
          confidence_interval: null
          design: clinician-vs-clinician
          population: patients
          n_raters: 4
          n_subjects: 30
          target: final overall Ayurvedic diagnosis (main diagnosis, sandhi-gata vata)
          citation: Kessler CS et al. J Altern Complement Med 2019 (PMC6748397)
          notes: Nominal group technique used as consensus procedure; 4 Ayurvedic experts (1 Indian-trained, 3 Western-trained); 120 individual ratings and 30 consensus ratings.
        - study: Kessler et al. 2019, knee osteoarthritis nested diagnostic study (same study)
          statistic: Fleiss and Cohen κ
          value: 0 to 0.4 (fair-to-poor) for central diagnostic aspects such as prakṛti and agni; individual entities ranged higher (for example κ 0.72 for a pathophysiological item, κ 0.02 for prakṛti as reported in the article)
          confidence_interval: null
          design: clinician-vs-clinician
          population: patients
          n_raters: 4
          n_subjects: 30
          target: central concepts such as prakṛti and agni
          citation: Kessler CS et al. J Altern Complement Med 2019 (PMC6748397)
          notes: Fleiss κ for the four raters and Cohen κ pairwise; Landis and Koch interpretation.
        - study: Rotti et al. 2014, 'Determinants of Prakriti, the Human Constitution Types of Indian Traditional Medicine and its Correlation with Contemporary Science', J Ayurveda Integr Med 5(3):167-175 (AyuSoft, C-DAC Pune)
          statistic: Cohen κ
          value: '0.778'
          confidence_interval: null
          design: software-vs-clinician
          population: healthy volunteers
          n_raters: null
          n_subjects: 3416
          target: prakṛti diagnosis by AyuSoft software versus Ayurvedic physician assessment
          citation: Rotti H et al. J Ayurveda Integr Med 2014;5(3):167-175 (PMC4204287)
          notes: Article text, 'Kappa value of 0.778 (P <0.001), between ayurvedic physician and AyuSoft'; approximately 80% concordance. Subjects were healthy males aged 20-30. Number of physicians not stated in the passage read; a later paper cites this study as κ = 0.7 with two physicians.
        - study: Rao et al. 2022, wrist pulse acquisition system with three piezoelectric sensors, Indian Journal of Traditional Knowledge 21(4):730-736
          statistic: Cohen κ
          value: 0.719 (basic level); 0.454 (sub-level)
          confidence_interval: null
          design: instrument-vs-expert
          population: healthy volunteers
          n_raters: 1
          n_subjects: 50
          target: pulse-derived vāta-pitta-kapha prakṛti categories versus expert nāḍī parīkṣā physician classification
          citation: Rao, Ravishankar and Rao 2022, as reported in a 2025 scoping review of prakṛti tools (PMC12269270)
          notes: The kappa values, 50 healthy participants and expert-physician comparator were read in the scoping review, not in the journal article itself, which could not be retrieved. The same review reports κ 0.476 against questionnaire-based prakṛti. The single expert is stated as 'an expert' in search excerpts, so n_raters 1 is an inference.
      citations:
        - source: Kurande et al. 2013, eCAM Art. ID 658275 (PMC3803118)
          type: primary-study
          citation_strength: direct
        - source: Kessler et al. 2019, J Altern Complement Med (PMC6748397)
          type: primary-study
          citation_strength: direct
        - source: Rotti et al. 2014, J Ayurveda Integr Med 5(3):167-175 (PMC4204287)
          type: primary-study
          citation_strength: direct
        - source: Scoping review of prakṛti assessment tools, PMC12269270 (2025), reporting Rao et al. 2022
          type: tertiary-review
          citation_strength: direct
      register: biomedical-evidence
      notes: "Corrected from named-in-text-only entries. Changes: knee OA study identified as Kessler et al. 2019 with design clinician-vs-clinician, 4 raters, 30 patients, Fleiss and Cohen kappa; AyuSoft identified as Rotti et al. 2014 (Cohen kappa 0.778, healthy volunteers); wrist-pulse study identified as Rao et al. 2022 with 50 healthy participants, instrument-vs-expert, Cohen kappa. Wrist-pulse figures rest on a review, not the article. Values from different designs are not comparable."
