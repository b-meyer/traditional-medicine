  - path: materia_medica.pharmacological_framework
    outcome: confirmed
    field:
      status: filled
      value: Dravyaguna, drug action analyzed by rasa (six tastes), guna (qualities), virya (potency, heating or cooling), vipaka (post-digestive effect) and prabhava (idiosyncratic action). All matter including drugs is built of the five great elements. Polyherbal synergy is claimed.
      citations:
        - source: Charaka Samhita, Sutra Sthana ch. 26 (Atreyabhadrakapiya Adhyaya), online edition carakasamhitaonline.com
          type: reference-work
          citation_strength: direct
      register: emic
      notes: Rasa, guna, virya, vipaka, prabhava and the panchamahabhuta composition of dravya are set out in Charaka Sutra 26. The claim of polyherbal synergy is the report's own gloss and was not sought in the classical text.
    searches: ["dravyaguna rasa guna virya vipaka prabhava pancha mahabhuta Charaka Sutrasthana 26 review"]
