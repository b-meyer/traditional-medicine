          native_category: Rasashastra (iatrochemistry)
          tags: [mineral-metal, herbal]
          description: Processed mercury, arsenic, lead, gold and others, purified (shodhana) and calcined (marana, repeated puta heating) with herbal or sulfur matrices; claimed to be rendered safe by processing
