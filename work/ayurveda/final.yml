    relation_to_biomedical_anatomy:
      status: filled
      value: 'Doṣa, dhātu and srotas are functional and relational categories that do not correspond to
        discrete anatomical structures or measurable analytes; āma and agni have no validated biochemical
        referent. Mapping works loosely for lifestyle/metabolic stratification but fails at specific disease
        entities. Historical note: anatomy and laboratory science were adopted during modernization.'
      citations:
      - source: none (uncited in report)
        type: unclear
        citation_strength: unclear
      register: historical-scholarship
      notes: 'verify pass: unverifiable. Searched: Ayurveda dosha dhatu srotas biomedical anatomy correspondence'
      source_report: v2
      verify_outcome: unverifiable
    translation_programs:
      status: filled
      value:
      - program: Ayurgenomics (Bhavana Prasher, Mitali Mukerji and colleagues, CSIR-IGIB) and TRISUTRA
          consortium
        findings: Prasher et al. 2008 (J Transl Med) reported whole-genome expression and biochemical
          differences between extreme prakṛti types; later work reported EGLN1/VWF variants (hypoxia/thrombotic
          adaptation), HLA polymorphism links, CYP2C19 associations, distinct gut-microbiome signatures.
        maturity: preliminary
        limits: Small cohorts, heterogeneous prakṛti-assessment tools, incomplete biomarker validation;
          'suggestive analogy, not demonstrated equivalence'.
      - program: Claim that prakṛti stratification prefigures P4/precision medicine
        findings: Claimed analogy only.
        maturity: speculative
      citations:
      - source: Prasher et al. 2008, Journal of Translational Medicine (named in text, no bibliography
