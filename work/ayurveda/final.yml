  self_reported_gaps:
    inventory:
      status: filled
      value:
      - kind: searched_not_found
        text: I searched specifically for inter-rater reliability/kappa studies on doṣa/vikṛti and pulse
          diagnosis and found only a handful (Kurande 2013; the 2019 knee-OA nested study; instrument-validation
          papers). Large, multi-rater, patient-population (not just healthy-subject) reliability studies
          are essentially absent, and this gap is itself an important finding.
      - kind: searched_not_found
        text: Similarly, high-certainty Cochrane-level positive conclusions for whole-system Ayurvedic
          treatment of major diseases were not found.
      - kind: gap
        text: There is no firm authorial identity for 'Suśruta,' 'Caraka,' or the two Vāgbhaṭas; dates
          rest on internal textual layering, cross-references, and the Bower Manuscript, not on external
          documentary anchors.
      - kind: source_caveat
        text: Indian-government/AYUSH and manufacturer sources are advocacy-oriented (e.g., country-recognition
          lists, '5,000-year-old' and 'world's oldest continuously practiced' claims, and Coronil promotion)
          and were treated with caution; promotional Maharishi/wellness sites likewise. Peer-reviewed
          literature, primary legislation, and reputable historians were preferred.
      - kind: contested_item
        text: dating/authorship of the saṃhitās (irreducibly uncertain per Meulenbeld)
      - kind: contested_item
        text: the Greek-Indian humoral influence (direction unresolved)
      - kind: contested_item
        text: bhasma safety (defenders vs. Saper)
      - kind: contested_item
        text: Ayurgenomics (preliminary, small cohorts)
      - kind: contested_item
        text: Slovenia's legal status (asserted by Indian sources but no specific statute verified)
      - kind: data_reconciliation
        text: Sri Lanka practitioner numbers vary by year and source (~19,754 in 2010 AMC data; ~24,000
          in 2015 AMC data reported by ADB); the higher, more recent figure is used above. The WHO GTMC
          funding is best stated as US$85 million over 2022-2032 within a broader US$250 million Indian
          commitment.
      - kind: recency
        text: developments through the Supreme Court Patanjali case (2024), the JIPMER integrated-course
          dispute (2025), and the Ayurveda-surgery litigation (Supreme Court hearing listed for January
          2026) are included as of September 2026; the surgery-rights litigation was unresolved at the
          cutoff.
      citations: []
      register: historical-scholarship
      notes: Inventory is the report's own statements; no citations apply.
      source_report: v2
