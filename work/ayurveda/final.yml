  literature_state:
    corpus_scale_appraisal:
      status: filled
      value: 'Thrigulla et al. bibliometric analysis of clinical studies indexed in the AYUSH Research
        Portal (data to 30 June 2020): 6,528 clinical-trial articles across AYUSH, of which 3,903 were
        categorized under Ayurveda. Evidence grade by WHO traditional-medicine research guideline: Grade
        A (RCTs) 144 (3.69%), Grade B 725 (18.58%), Grade C 3,034 (77.74%). Largest categories: skin 385,
        endocrine/metabolic/nutritional 378, musculoskeletal 354. The top 20 journals carried 75.56% of
        articles and only 5 of them were indexed in PubMed or Scopus.'
      citations:
      - source: 'Thrigulla SR et al. Clinical studies in Ayurveda: A bibliometric analysis of articles
          indexed in AYUSH research portal. Ayu 2022 Jul-Sep (published online 2023), PMC10710232'
        type: primary-study
        citation_strength: direct
      register: biomedical-evidence
      notes: The abstract also states 'only 4.50%' of articles are Grade A, which does not match the 3.69%
        computed from 144/3,903; the discrepancy is unresolved (possibly different denominators). Counts
        come from an institutional portal, not a systematic search of the world literature. No Cochrane
        overview of the whole Ayurvedic corpus was found.
      source_report: gap
      gap_outcome: found
      replaced_from: v2
