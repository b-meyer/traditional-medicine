    balance_logic:
      status: filled
      value: Health is a state of balance of the doṣas together with agni, dhātus and malas (Suśruta Saṃhitā
        Sūtrasthāna 15.41); the stated aim of the science is to establish and maintain equilibrium of
        the body elements (Caraka Saṃhitā Sūtrasthāna 1), with disorders treated by agents of opposing
        qualities.
      citations:
      - source: Suśruta Saṃhitā, Sūtrasthāna ch. 15 (Bhishagratna English translation, vol. 1, on wisdomlib.org)
        type: reference-work
        citation_strength: direct
        claim_match: matches
      - source: Caraka Saṃhitā, Sūtrasthāna ch. 1 (Sharma and Dash / Gulabkunverba Ayurvedic Society English
          translation, on wisdomlib.org)
        type: reference-work
        citation_strength: direct
        claim_match: matches
      register: emic
      notes: Original value also said treatment aims to kindle agni, clear āma and maintain the healthy
        through regimen. The checked passages (Su. Sū. 15, Ca. Sū. 1) support balance as health and restoration
        of equilibrium as treatment aim, but I did not locate the agni-kindling, āma-clearing and regimen
        wording in them, so those elements are dropped from this leaf rather than asserted. Not a finding
        that they are absent from the tradition. Value now narrowed to what the primary texts show.
      source_report: verify
      verify_outcome: corrected
      replaced_from: v2
    correspondence_system:
      status: partial
      value: 'Caraka Samhita Sutrasthana 6 (and 7) maps the doshas onto a solar-seasonal scheme. The year
        is divided into the northward course of the sun (uttarayana or adana kala, dehydrating, three
        seasons from late winter to summer) and the southward course (dakshinayana or visarga kala, hydrating,
        rainy season to early winter). Doshas accumulate (caya), aggravate (prakopa) and subside (prasama)
        in a fixed seasonal sequence, and seasonal regimens (ritucarya) and evacuative therapies are timed
        to it (Cha. Sa. Su. 6/4; Su. 7/45 for seasonal purification: winter accumulation cleared in spring,
        summer accumulation in the rains, rains accumulation in autumn).'
      citations:
      - source: Caraka Samhita, Sutrasthana ch. 6 (Tasyasitiya) and ch. 7, as presented on carakasamhitaonline.com
          (Ritucharya page)
        type: reference-work
        citation_strength: indirect
      register: emic
      notes: 'Checked only through a web presentation of the Caraka text, so strength is indirect; the
        primary text should be verified in an edition or translation. Not verified here: any wider cosmological
        correspondence (for example dosha to direction, planet or deity). Only the seasonal and solar
        scheme was confirmed. Pancamahabhuta pairings inside the dosha scheme belong under constituents.'
      source_report: gap
      gap_outcome: found
      replaced_from: v2
    etiology:
      status: filled
      value: Disease arises from imbalance of the doṣas (vāta, pitta, kapha), which Caraka Saṃhitā Sūtrasthāna
        1 treats as the primary disease-causing factors; Suśruta Saṃhitā Sūtrasthāna 15 frames the body
        as constituted of doṣas, malas and dhātus, whose disturbance produces disease.
      citations:
      - source: Caraka Saṃhitā, Sūtrasthāna ch. 1 (English translation, on wisdomlib.org)
        type: reference-work
        citation_strength: direct
        claim_match: matches
      - source: Suśruta Saṃhitā, Sūtrasthāna ch. 15 (Bhishagratna English translation, on wisdomlib.org)
        type: reference-work
        citation_strength: direct
        claim_match: matches
      register: emic
      notes: Original value also said weak agni produces āma, an undigested toxic residue. The Suśruta
        ch. 15 translation does not mention āma and I did not locate the agni-to-āma claim in the Caraka
        passages read, so it is dropped here, not refuted. The term vikṛti was likewise not confirmed
        in the passages read.
      source_report: verify
      verify_outcome: corrected
      replaced_from: v2
