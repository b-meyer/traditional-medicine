- path: disruption.practitioner_response
  source_report: v2
  value: Nationalist-tinged revival c. 1900-1947. P. S. Varier founded Arya Vaidya Sala, Kottakkal (1902)
    and Arya Vaidya Patasala (1917); Gananath Sen presided over the All India Ayurvedic Congress (1911,
    1920, 1931) and advocated samanvaya; the All India Ayurvedic Congress (Akhil Bharatiya Ayurveda Mahasammelan)
    formed as umbrella professional body, organized nationally around 1907.
  weak_citations:
