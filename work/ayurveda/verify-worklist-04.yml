- path: disruption.suppression_or_marginalization
  source_report: v2
  value:
  - Grant Committee report, 20 October 1834
  - Macaulay's Minute, February 1835, and Bentinck's resolution ended state patronage of indigenous medical
    teaching
  - Government order of 28 January 1835 abolished the NMI and discontinued Ayurvedic/Unani classes
  - Calcutta Medical College opened 20 February 1835 teaching Western medicine in English
  - Professional registration (undated) marginalized folk and lay healers
