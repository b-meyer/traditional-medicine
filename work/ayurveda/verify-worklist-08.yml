- path: contact_and_borrowing.relationships
  source_report: v2
  value:
  - other_tradition: Arabic/Persian medicine (Abbasid Baghdad)
    kind: exchange
    direction: Sanskrit to Arabic/Persian
    period: 786-809 (Harun al-Rashid, Barmakids)
    evidence_type: documented translation
    status: demonstrated
    note: Caraka and Suśruta rendered into Persian and Arabic; Mankah/Kankah al-Hindi; al-Razi's Kitāb
      al-Ḥāwī
  - other_tradition: Tibetan medicine (Sowa-Rigpa)
    kind: exchange
    direction: Sanskrit/Ayurveda to Tibetan
    period: c. 12th century CE (Rgyud bzhi)
    evidence_type: documented translation
    status: demonstrated
    note: Report calls it documented transmission; degree of influence still debated; Rgyud bzhi also
      integrates Chinese, Persian-humoral and Greco-Roman elements
  - other_tradition: Greek humoral medicine (Hippocratic-Galenic)
    kind: parallel
    direction: null
    period: null
    evidence_type: structural parallel
    status: contested
    note: Report says direction or existence of influence is unresolved; Filliozat argued early contact
      and shared ideas; Zysk sees largely independent development; may be partial convergence
  - other_tradition: Islamic and/or Chinese medicine (pulse diagnosis)
    kind: exchange
    direction: Islamic and/or Chinese to Ayurveda
    period: late
    evidence_type: textual attestation
    status: contested
    note: Nāḍī parīkṣā widely argued to be a relatively late addition because it is not prominent in the
      earliest saṃhitās
  - other_tradition: Islamic and Chinese alchemy (rasaśāstra)
    kind: exchange
    direction: null
    period: null
    evidence_type: structural parallel
    status: contested
    note: Report says rasaśāstra/alchemy 'links connect' Indian, Islamic and 'possibly Chinese' traditions
  - other_tradition: Buddhist monastic medicine / śramaṇa ascetics
    kind: descent
    direction: Buddhist monastic medicine to classical Ayurveda
    period: from c. 4th century BCE
    evidence_type: textual attestation
    status: contested
    note: Zysk 1991 position; report calls it influential but not unanimous
  - other_tradition: Vedic healing (Atharvaveda, Ṛgveda)
    kind: descent
    direction: Vedic to Ayurveda
    period: Vedic period
    evidence_type: textual attestation
    status: contested
    note: Recognized antecedent; the emphasis (sole source versus one strand) is what is contested
