- path: contemporary_controversies.research_methodology_disputes
  source_report: v2
  value: Report frames a trade-off between whole-system evaluation (hard to blind, better external validity)
    and single-herb evaluation (easier to blind but loses the individualization Ayurveda says is essential).
    The Furst trial used 148 formulations to allow individualization while preserving blinding. 'Standardization
    vs. individualization' is listed as a continuing controversy. Named parties on each side are not given.
  weak_citations:
