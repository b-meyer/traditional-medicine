- path: contemporary_controversies.politicized_episodes
  source_report: v2
  value:
  - AYUSH-64 (CCRAS polyherbal originally for malaria) repurposed and studied for mild/moderate COVID-19
  - Patanjali's Coronil launched June 2020 with cure claims; restricted by AYUSH to 'immunity booster';
    re-promoted 19 February 2021 as a 'supporting measure' with a claimed WHO/CoPP certification at an
    event attended by Union ministers; WHO denied it, and the CoPP was issued by India's DCGI
  - 'IMA v. Patanjali, Supreme Court, 2022-2024: restraint orders, contempt notices to Baba Ramdev and
    Acharya Balkrishna under the Drugs and Magic Remedies (Objectionable Advertisements) Act 1954, public
    apologies; contempt charges dropped August 2024'
