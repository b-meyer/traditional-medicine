- path: contemporary_controversies.integration_disputes
  source_report: v2
  value:
  - CCIM notification of 20 November 2020 allowing PG Ayurveda practitioners to perform 58 surgeries;
    opposed by the IMA, which calls it 'mixopathy' or 'khichdification'; IMA nationwide strikes December
    2020 and February 2021
  - 'Litigation: a 2020 PIL challenging the notification remains sub judice in the Supreme Court; hearing
    listed for 8 January 2026; outcome unresolved at report cutoff'
  - Andhra Pradesh moved to permit such surgeries (December 2025); IMA president Dilip Bhanushali said
    the association wants 'Ayurveda to be promoted in its original and pure form'
  - Proposed integrated MBBS-BAMS course at JIPMER Puducherry (announced May 2025)
  - '''One Nation One Health System'', National Education Policy 2020 and NITI Aayog push toward integrative
    medicine, welcomed by AYUSH and opposed by the IMA as diluting standards and accountability'
  weak_citations:
