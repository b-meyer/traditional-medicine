entries:
- path: safety.regulatory_actions_taken
  source_report: v2
  value:
  - FDA Import Alert 66-41 (heavy metals) and Import Alert 99-42 (detention without physical examination
    of Ayurvedic supplements found injurious from mercury/lead)
  - Denmark ban on ashwagandha in food/supplements, 2023, after a 2020 Technical University of Denmark
    risk assessment
  - Netherlands RIVM warning, March 2024
  - France ANSES warning, 2024
  - EU Heads of Food Safety Agencies working group recommended prioritizing ashwagandha for an Article
    8 procedure, June 2024
  - UK Food Standards Agency public consultation (undated)
  - India mandatory heavy-metal testing for exported ASU products, 2005; national pharmacovigilance programme
    for ASU&H drugs from 2017
  - Health Canada and TGA advisories on contaminated products
