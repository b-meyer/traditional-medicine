- path: canon_and_transmission.dating_and_authorship_disputes
  source_report: v2
  value:
  - scholar: G. Jan Meulenbeld
    position: Many problems about the texts and their authors are 'far from even approaching a solution'
      (HIML Ia, 656). Gives the most detailed discussion of Suśruta dating and sets aside Hoernle's old
      600 BCE date.
  - scholar: Kenneth Zysk
    position: 'Classical Ayurveda''s empirico-rational character emerged from heterodox wandering ascetics
      and Buddhist monastic communities from about the 4th century BCE, not from Brahmanic Vedic religion;
      early Buddhist medicine was ''fundamental to the formation of ayurvedic medical thinking''. Work:
      Asceticism and Healing in Ancient India, 1991.'
  - scholar: Zimmermann (as quoted)
    position: Called Zysk's account 'a missing link between the hymns and charms of the Vedic period and
      the treatises of classical Ayurveda'.
  - scholar: Nationalist and traditionalist accounts (unnamed)
    position: Emphasize unbroken Vedic descent.
  - scholar: Historians (unnamed)
    position: No firm authorial identity for Suśruta, Caraka or the two Vāgbhaṭas; dates rest on internal
      layering, cross-references and the Bower Manuscript, not external documentary anchors; uncertainty
      is irreducible with current evidence.
  weak_citations:
  - source: Asceticism Healing Ancient India Medicine by Kenneth Zysk (AbeBooks)
    type: catalog-listing
    citation_strength: indirect
  - source: Asceticism and Healing in Ancient India (Motilal Banarsidass listing)
    type: catalog-listing
    citation_strength: indirect
- path: canon_and_transmission.transmission_mode
  source_report: v2
  value: Textual, with lineage attributions (Ātreya to Agniveśa for the Caraka tradition) and, per the
    continuity camp, transmission through commentaries and lineages to the present. Zysk locates early
    transmission in Buddhist monastic communities.
  weak_citations:
  - source: none (uncited in report)
    type: unclear
    citation_strength: unclear
- path: canon_and_transmission.external_dating_anchors
  source_report: v2
  value: Bower Manuscript (c. 4th-6th century CE), found in Chinese Turkestan/Central Asia, brought to
    the Asiatic Society, Calcutta after its 1890 discovery; contains material overlapping the classical
    tradition, including quotations echoing Caraka. Report states dates otherwise rest on internal evidence
    rather than external documentary anchors.
  weak_citations:
  - source: none (uncited in report)
    type: unclear
    citation_strength: unclear
