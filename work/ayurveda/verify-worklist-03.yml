  value: Dravyaguna  drug action analyzed by rasa (six tastes), guna (qualities), virya (potency, heating
    or cooling), vipaka (post-digestive effect) and prabhava (idiosyncratic action). All matter including
    drugs is built of the five great elements. Polyherbal synergy is claimed.
