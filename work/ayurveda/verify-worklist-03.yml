- path: diagnostics.sign_vs_synthesis
  source_report: v2
  value: In the knee OA study, agreement on the final overall diagnosis (95% consensus) exceeded agreement
    on constitutional entities such as prakṛti and agni (κ 0-0.4). The report states agreement on disease
    entities exceeded agreement on constitutional entities. Kurande found lowest agreement on pulse and
    prakṛti.
  weak_citations:
  - source: none (uncited in report)
    type: unclear
    citation_strength: unclear
- path: diagnostics.standardization_efforts
  source_report: v2
  value: CCRAS (Ministry of AYUSH) developed and reliability-tested a standardized Prakriti Assessment
    Scale (PAS) and an AYUR Prakriti web portal, targeting agreement of κ≈0.65. AyuSoft (C-DAC Pune) software
    and a piezoelectric wrist-pulse instrument are also reported.
  weak_citations:
  - source: none (uncited in report)
    type: unclear
    citation_strength: unclear
- path: modalities.items
  source_report: v1
  value:
  - name: Panchakarma (Vamana, Virechana, Basti, Nasya, Raktamokshana)
    native_category: Shodhana (purification/elimination)
    tags:
    - procedural
    description: Therapeutic emesis, purgation, medicated enema (foremost for Vata), nasal administration,
      bloodletting; preceded by purvakarma and followed by pashchatkarma diet and regimen. Report says
      the detoxification framing lacks robust trial support.
  - name: Purvakarma (Snehana oleation and Svedana sudation)
    native_category: Shodhana preparation
    tags:
    - procedural
    - thermal
    description: Preparation before Panchakarma
  - name: Herbal formulations and single herbs (Shamana therapy, dravyaguna)
    native_category: Shamana (palliation)
    tags:
    - herbal
    description: Polyherbal formulations justified by claimed synergy; herbs with research literature
      listed under materia_medica
  - name: Rasashastra (bhasmas)
    native_category: Rasashastra (iatrochemistry)
    tags:
    - mineral-metal
    - herbal
    description: Processed mercury, arsenic, lead, gold and others, purified (shodhana) and calcined (marana,
      repeated puta heating) with herbal or sulfur matrices; claimed to be rendered safe by processing
  - name: Shalya tantra (surgery)
    native_category: Shalya tantra (one of eight branches)
    tags:
    - surgical
    description: Rhinoplasty, cataract couching, lithotomy, fracture management, yantra and shastra instruments
      (Sushruta Samhita)
  - name: Diet, daily and seasonal regimen, ethical code
    native_category: Ahara, dinacharya, ritucharya, sadvritta
    tags:
    - dietary
    - regimenal
    description: Central to prevention
  - name: Yoga
    native_category: Darshana / prevention
    tags:
