  - path: revival_and_institutionalization.dated_events
    outcome: corrected
    field:
      status: filled
      value:
        - label: Arya Vaidya Sala, Kottakkal founded
          date: '1902'
          description: P. S. Varier; founded at Kottakkal on Vijayadashami, 12 October 1902; mass production of standardized medicines.
        - label: All India Ayurvedic Congress organized nationally
          date: '1907'
          description: Umbrella professional body; established 1907 at Nasik.
        - label: Gananath Sen presidencies of All-India Ayurvedic Congress
          date: 1911, 1920, 1931
          description: Presided at Allahabad (1911), Indore (1920), Mysore (1931); advocate of samanvaya (integration of Ayurveda with modern medicine).
        - label: Arya Vaidya Patasala
          date: '1917'
          description: School founded by Varier at Calicut with a four-year syllabus.
        - label: Bhore Committee
          date: '1946'
          description: Prioritized Western scientific medicine.
        - label: Chopra Committee
          date: '1948'
          description: Report of the Committee on Indigenous Systems of Medicine; recommended developing indigenous systems, with a synthesis approach.
        - label: Central Council of Indian Medicine established
          date: '1970'
          description: Indian Medicine Central Council Act 1970 (the Act is dated 1970; the Council was constituted under it).
        - label: Maharishi Ayur-Ved launched
          date: mid-1980s
          description: Global variant. Date not confirmed against a primary source in this pass.
        - label: National Ayurvedic Medical Association founded
          date: '1998'
          description: US voluntary professional body (incorporated 2000).
        - label: Ministry of AYUSH created
          date: '2014'
          description: Union ministry; formed 9 November 2014.
        - label: NAMA certification board (NAMACB) founded
          date: '2017'
          description: US voluntary credentials; founded March 2017.
