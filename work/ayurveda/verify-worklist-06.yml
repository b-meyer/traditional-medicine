    description: P. S. Varier; mass production of standardized medicines.
  - label: All India Ayurvedic Congress organized nationally
    date: c. 1907
    description: Umbrella professional body.
  - label: Gananath Sen presidencies of All-India Ayurvedic Congress
    date: 1911, 1920, 1931
    description: Advocate of samanvaya.
  - label: Arya Vaidya Patasala
    date: '1917'
    description: School founded by Varier.
  - label: Bhore Committee
    date: '1946'
    description: Prioritized Western scientific medicine.
  - label: Chopra Committee
    date: '1948'
    description: Recommended developing indigenous systems.
  - label: Central Council of Indian Medicine established
    date: '1970'
    description: Indian Medicine Central Council Act 1970.
  - label: Maharishi Ayur-Ved launched
    date: mid-1980s
    description: Global variant.
  - label: National Ayurvedic Medical Association founded
    date: '1998'
    description: US voluntary professional body.
  - label: Ministry of AYUSH created
    date: '2014'
    description: Union ministry.
  - label: NAMA certification board (NAMACB) founded
    date: '2017'
    description: US voluntary credentials.
