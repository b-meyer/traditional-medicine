  - jurisdiction: United Kingdom/EU
    regulator: MHRA; Complementary and Natural Healthcare Council (voluntary, PSA-accredited)
    statute: Directive 2004/24/EC; SI 2005/2750
    year: 2004/2005 (UK in force 30 April 2011)
    scope_of_practice: Practitioners not statutorily regulated; Walker report (26 March 2015) recommended
      against statutory regulation; Traditional Herbal Registration requires about 30 years' use (15 in
      EU) plus quality and safety, not efficacy
    prescribing_rights: null
    integration_with_public_health_system: null
    recognition_tier: unregulated
  - jurisdiction: Switzerland
    regulator: OdA AM (Ayurveda medicine), OdA KT (complementary therapist)
