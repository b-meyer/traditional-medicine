- path: legal_status.jurisdictions
  source_report: v2
  value:
  - jurisdiction: India
    regulator: CCIM (Indian Medicine Central Council Act 1970), replaced by NCISM (Act 2020); Ministry
      of AYUSH (2014); drugs under Drugs and Cosmetics Act 1940
    statute: Drugs and Cosmetics Act 1940 and Rules (Schedule E(1), Schedule T); Indian Medicine Central
      Council Act 1970; NCISM Act 2020; Drugs and Magic Remedies (Objectionable Advertisements) Act 1954
    year: 1940, 1954, 1970, 2020
    scope_of_practice: Recognized system of medicine
    prescribing_rights: CCIM notification of 20 Nov 2020 authorizes PG Shalya/Shalakya trainees to perform
      58 listed surgical procedures (39 general surgery, 19 ENT/eye/dental); sub judice in Supreme Court
    integration_with_public_health_system: Push toward 'One Nation One Health System'; disputed
    recognition_tier: full medical system
  - jurisdiction: Sri Lanka
    regulator: Department of Ayurveda; Ayurvedic Medical Council (mandatory registration)
    statute: Ayurveda Act No. 31 of 1961
    year: 1961
    scope_of_practice: Covers Ayurveda, Siddha, Unani and Sri Lankan traditional medicine; Ayurvedic Code
    prescribing_rights: null
    integration_with_public_health_system: null
    recognition_tier: full medical system
