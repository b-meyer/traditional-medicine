          type: reference-work
          citation_strength: direct
          claim_match: matches
      register: emic
      notes: "Original value also said weak agni produces āma, an undigested toxic residue. The Suśruta ch. 15 translation does not mention āma and I did not locate the agni-to-āma claim in the Caraka passages read, so it is dropped here, not refuted. The term vikṛti was likewise not confirmed in the passages read."
