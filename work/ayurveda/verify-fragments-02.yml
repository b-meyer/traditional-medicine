          type: reference-work
          citation_strength: direct
          claim_match: matches
      register: emic
      notes: "Original value also said treatment aims to kindle agni, clear āma and maintain the healthy through regimen. The checked passages (Su. Sū. 15, Ca. Sū. 1) support balance as health and restoration of equilibrium as treatment aim, but I did not locate the agni-kindling, āma-clearing and regimen wording in them, so those elements are dropped from this leaf rather than asserted. Not a finding that they are absent from the tradition. Value now narrowed to what the primary texts show."
