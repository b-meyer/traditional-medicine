      value: "Health is a state of balance of the doṣas together with agni, dhātus and malas (Suśruta Saṃhitā Sūtrasthāna 15.41); the stated aim of the science is to establish and maintain equilibrium of the body elements (Caraka Saṃhitā Sūtrasthāna 1), with disorders treated by agents of opposing qualities."
      citations:
