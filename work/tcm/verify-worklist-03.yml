- path: theoretical_primitives.nosology
  source_report: v2
  value: Unit is the zheng (pattern/syndrome) via bian zheng lunzhi; a disease (bing) may correspond to
    several patterns and one pattern to several diseases. ICD-11 Chapter 26 lists 150 TM disorders and
    196 patterns, distinguishing disorders from patterns; optional subclassification, not for mortality
    reporting, paired with Chapters 1-24 codes.
  weak_citations:
  - source: Neither Donkey nor Horse - Lei (University of Chicago Press) [S8]
    type: catalog-listing
    citation_strength: indirect
- path: theoretical_primitives.relation_to_biomedical_anatomy
  source_report: v2
  value: Zang-fu are functional not anatomical; Kidney maps onto no single organ. Early-20th-century reformers
    argued jingluo are not identical to blood vessels or nerves (Lei). Cheng Dan'an later relocated acupuncture
    points to correspond with nerve pathways.
  weak_citations:
  - source: Neither Donkey nor Horse (BiblioVault) [S7]
    type: catalog-listing
    citation_strength: indirect
- path: theoretical_primitives.translation_programs
  source_report: v2
  value: Cheng Dan'an's nerve-pathway relocation of points (1930s) and ICD-11 Chapter 26 coding are the
    attempts described; report gives no stated maturity level. Artemisinin is described as a drug derived
    from the herbal corpus, not validation of TCM theory.
  weak_citations:
  - source: none given in report
    type: unclear
    citation_strength: unclear
