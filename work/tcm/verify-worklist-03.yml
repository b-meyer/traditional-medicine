- path: diagnostics.reliability_evidence
  source_report: v2
  value:
  - statistic: percent agreement and Cohen kappa (pooled descriptive across studies)
    value: Pairwise agreement mean 57% (median 65, range 19-96) across 9 studies; mean kappa 0.34 (median
      0.34, range 0.07-0.59) across 7 studies
    design: clinician-vs-clinician
    population: not stated
    n_raters: not given (raters were TCM college students or graduates with at least 3 years' experience
      and licensure)
    n_subjects: not given (21 studies in review)
    target: TCM diagnoses and patterns across heterogeneous studies
    citation: Jacobson et al. 2019, J Altern Complement Med, systematic review of 21 studies
  - statistic: 'not named (qualitative: ''poor to no agreement'' on point selection; ''moderate to fair''
      on excess/deficiency patterns)'
    value: 39 different patterns and 36 different acupuncture points used
    design: clinician-vs-clinician
    population: mixed (30 infertile women and 24 previously pregnant women)
    n_raters: 2
    n_subjects: 54
    target: acupuncture point selection and excess/deficiency pattern
    citation: Birkeflet, Laake and Vollestad 2011, Acupuncture in Medicine
  - statistic: Cohen kappa (report says kappa < 0.20)
    value: kappa < 0.20 ('poor')
    design: clinician-vs-clinician
    population: patients (written case histories, Maciocia style)
    n_raters: 8
    n_subjects: 25
    target: TCM patterns, e.g. Liver Qi Stagnation
    citation: Birkeflet et al. 2014, Acupuncture in Medicine
  weak_citations:
  - source: Poor Multi-Rater Reliability in TCM Pattern Diagnoses (ResearchGate PDF) [S9] cited for Jacobson
      2019
