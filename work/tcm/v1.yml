    relation_to_biomedical_anatomy:
      status: filled
      value: "Zang-fu 'organs' are defined by dynamic function rather than by the anatomical organs of biomedicine, which is an explicit refusal of anatomical mapping. The constructs predate and do not map onto modern anatomy, physiology or biochemistry. There is no demonstrated physical basis for qi or meridians. Charles Leslie describes such correspondence systems as classificatory and mnemonic devices that also lent themselves to 'stultifying theoretical elaboration, self-deception, and dogmatism.'"
      citations:
        - source: "S6 — Traditional Chinese medicine (Wikipedia) — https://en.wikipedia.org/wiki/Traditional_Chinese_medicine"
          type: open-encyclopedia
          citation_strength: indirect
          claim_match: matches
        - source: "Uncited in report (no physical basis, zang-fu functional definition)"
          type: unclear
          citation_strength: unclear
      register: biomedical-evidence
      notes: "The Leslie quotation reaches the report through Wikipedia, not through Leslie's own work."
