  revival_and_institutionalization:
    revival_context:
      status: filled
      value: "Two phases. (1) Republican era: anti-imperialist nationalism, with practitioners rebranding their field as 'national medicine' (guoyi) after the 1929 abolition attempt. (2) Post-1949 state-led policy: the PRC revived, standardized and integrated Chinese medicine, which Mao promoted as inexpensive and abundant, within a Marxist-scientific framing. More recently China has elevated TCM to a national strategy and soft-power asset."
      citations:
        - source: "Uncited in report"
          type: unclear
          citation_strength: unclear
        - source: "S4 — The History of Chinese Medicine in the People's Republic of China and Its Globalization (Taylor & Francis) — https://www.tandfonline.com/doi/full/10.1215/s12280-009-9072-y"
          type: historical-monograph
          citation_strength: direct
      register: historical-scholarship
      notes: "The report also describes uptake in the West after 1971, driven by the Reston column and Nixon's 1972 visit. That is diffusion abroad rather than revival in the country of origin, and the field fits it imperfectly; it is recorded under dated_events."
