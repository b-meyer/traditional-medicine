          type: unclear
          citation_strength: unclear
      register: historical-scholarship
      notes: "The report states that recorded materia medica reached about 12,800 entries by the late 20th century. It names no specific compilation."
    dating_and_authorship_disputes:
      status: absent
      value: null
      citations: []
      register: historical-scholarship
      notes: "The report gives consensus-style dates only: the Neijing was 'compiled... from earlier texts' and the Shanghan Lun was 'collated by' Zhang Zhongjing. It names no scholars and no positions on dating or authorship. Search target: named scholarly positions on the dating and compilation of the Huangdi Neijing, the Shanghan Lun/Jingui Yaolue and Zhang Zhongjing's authorship, the Nanjing, and the Shennong Bencao Jing. The only attribution dispute in the report concerns the English term 'traditional Chinese medicine' (Kan-Wen Ma versus party propagandists); it is recorded in field 1 alternate_names."
    transmission_mode:
      status: partial
      value: "mixed. Premodern transmission was through a textual canon and doctrinal schools (Jin-Yuan). The modern system was transmitted through standardized textbooks and colleges (1956-1964). The 2016 Law keeps an apprenticeship route to registration, which requires recommendations from two qualified practitioners."
      citations:
        - source: "Uncited in report"
          type: unclear
          citation_strength: unclear
