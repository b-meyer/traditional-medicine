        - scholar: "Kim Taylor"
          work: "Chinese Medicine in Early Communist China"
          year: null
          position: "The PRC government initiated the establishment of TCM in the 1950s. Taylor identifies phases of cooperation (1945-1950), unification (1950-1958) and integration (1958-today), and dates the 'standardisation of TCM' (colleges, textbooks) to roughly 1956-1964. The first textbook, Zhongyixue gailun, was composed in Nanjing in 1958."
