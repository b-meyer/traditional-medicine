      status: filled
      value: "Traditional Chinese Medicine (TCM)"
      citations:
        - source: "Uncited in report"
          type: unclear
          citation_strength: unclear
      register: historical-scholarship
      notes: "The report treats TCM as 'two distinct things': a heterogeneous body of premodern Chinese healing practices, and a standardized 20th-century system largely constructed in the PRC in the 1950s-60s. The name here refers to the modern standardized system."
    alternate_names:
      status: incidental
      value:
        - "traditional Chinese medicine (English term; origin variously attributed to the work of Kan-Wen Ma or to party propagandists in the mid-1950s)"
        - "Chinese medicine"
        - "guoyi, 'national medicine' (Republican-era rebranding after the 1929 abolition attempt)"
        - "CTM (Unschuld's term for the entirety of pre-20th-century Chinese health knowledge, contrasted with TCM)"
      citations:
        - source: "Uncited in report (term attribution, guoyi)"
          type: unclear
          citation_strength: unclear
        - source: "S3 — An Interview With Dr. Paul Unschuld, Part Two | Acupuncture Today — https://acupuncturetoday.com/article/28498-an-interview-with-dr-paul-unschuld-part-two"
          type: news
          citation_strength: indirect
          claim_match: matches
      register: historical-scholarship
      notes: "The source prompt did not ask for names; covered in passing. No Chinese-language endonym for the modern system is given other than guoyi; 'Zhongyi' appears only inside the textbook title Zhongyixue gailun. Not a gap-pass search target."
    primary_regions:
      status: partial
      value: "China (origin; PRC institutionalization). Taiwan and Hong Kong appear in the epidemiology and trial-origin data; the report describes spread to the United States and the West after 1971 and regulation in the US, EU and Australia."
      citations:
        - source: "Uncited in report"
          type: unclear
          citation_strength: unclear
      register: historical-scholarship
      notes: "The report gives no systematic account of where TCM is practised today. Missing: a statement of the countries and regions where TCM is practised, with any indication of scale."
    practitioner_estimate:
      status: absent
      value: null
      citations: []
      register: regulatory
      notes: "The report addressed current institutional status but gives no current practitioner count. Its only headcount is historical: about 1.5 million barefoot doctors trained from 1968 (Hu et al. 2017). They were trained in a blend of simplified Western medicine and TCM, so that is not a TCM practitioner count. Search target: the number of licensed TCM practitioners in China, and of registered Chinese medicine practitioners in Australia and other jurisdictions, with source and year."
    system_boundary:
      status: partial
      value:
        - tradition: "Premodern Chinese medical traditions (Unschuld's 'CTM')"
          relation: absorbed_strand
          fields_affected:
            - canon_and_transmission
            - theoretical_primitives
            - modalities
          description: "The report treats the modern standardized TCM as distinct from the diverse premodern Chinese traditions. TCM selectively drew on these traditions and stripped out 'superstitious' and religious elements in 1956-1964. Canon, theory and much modality content in this extraction describes the premodern traditions."
        - tradition: "Japanese traditional medicine"
          relation: regulatory_grouping
          fields_affected:
            - contemporary_controversies.who_engagement
          description: "ICD-11 Chapter 26 is described as 'a union set of harmonized traditional medicine conditions of the Chinese, Japanese, and Korean classifications.'"
        - tradition: "Korean traditional medicine"
          relation: regulatory_grouping
          fields_affected:
            - contemporary_controversies.who_engagement
            - diagnostics.evidence_borrowed_from_other_traditions
          description: "Grouped with TCM in the ICD-11 Chapter 26 union set. A Traditional Korean Medicine reliability study (S9) is cited for a general conclusion about TCM diagnosis."
      citations:
        - source: "S1 — Traditional Medicine Diagnostic Codes in ICD-11 and Alternative Diagnostic Classifications in the Mainstream Healthcare (PDF, ResearchGate) — https://www.researchgate.net/publication/352875192_Traditional_Medicine_Diagnostic_Codes_in_ICD-11_and_Alternative_Diagnostic_Classifications_in_the_Mainstream_Healthcare"
          type: tertiary-review
          citation_strength: direct
          claim_match: matches
        - source: "S3 — An Interview With Dr. Paul Unschuld, Part Two | Acupuncture Today — https://acupuncturetoday.com/article/28498-an-interview-with-dr-paul-unschuld-part-two"
          type: news
          citation_strength: indirect
          claim_match: matches
        - source: "S9 — Interobserver Reliability of Four Diagnostic Methods Using Traditional Korean Medicine for Stroke Patients (Lee, 2014) — https://onlinelibrary.wiley.com/doi/10.1155/2014/465471"
          type: primary-study
          citation_strength: direct
      register: historical-scholarship
      notes: "The report does not discuss system boundaries explicitly; these entries come from its content. absorbed_strand is an imperfect fit for the premodern traditions. The report frames the relation as modern reconstruction or selective descent, which the relation enum does not offer, and treats the premodern practices as plural rather than as one tradition. The relation to tai chi and qigong is not discussed; the report treats them as TCM-associated. Missing: the report does not discuss neighbouring traditions such as Kampo or Korean medicine as variants or siblings of TCM."
  canon_and_transmission:
    foundational_texts:
      status: filled
      value:
        - title: "Huangdi Neijing (Inner Canon of the Yellow Emperor)"
          approximate_date: "Han dynasty, around the 1st century BCE (compiled from earlier texts)"
          attributed_author: "Not stated in report"
        - title: "Shanghan Lun (Treatise on Cold Damage)"
          approximate_date: "c. 196-220 CE"
          attributed_author: "Zhang Zhongjing (collator)"
        - title: "Nanjing (Classic of Difficult Issues)"
          approximate_date: "Not stated (report says it 'followed' the Shanghan Lun)"
          attributed_author: "Not stated in report"
        - title: "Shennong Bencao Jing"
          approximate_date: "Eastern Han"
          attributed_author: "Not stated in report"
      citations:
        - source: "Uncited in report"
          type: unclear
          citation_strength: unclear
      register: historical-scholarship
      notes: "Neijing is described as the oldest received work of Chinese medical theory. It rejected spirits and magic and synthesized yin-yang and the Five Phases. The Shanghan Lun is described as the first work to combine yin-yang and the Five Phases with drug therapy and to group symptoms into patterns (zheng). The Shennong Bencao Jing is described as the earliest systematic materia medica."
    secondary_canon:
      status: filled
      value:
        - "Bencao Gangmu (Compendium of Materia Medica), Li Shizhen, 16th century; close to 1,900 drugs"
        - "Jingui Yaolue (survives with the Shanghan Lun as part of Zhang Zhongjing's work)"
        - "Ge Hong, Handbook of Prescriptions for Emergencies, 4th century (source of the artemisinin insight)"
        - "Mawangdui manuscripts, Recipes for Fifty-Two Ailments (earlier than the Neijing)"
        - "Works of the Jin-Yuan 'four great masters', 12th-14th century (not named individually)"
        - "Warm-disease (wenbing) literature, Ming-Qing (no texts named)"
      citations:
