      value:
        - audience: "patients/consumers"
          text: "For chronic low-back/neck pain, knee osteoarthritis, tension headache or migraine, a time-limited trial of acupuncture from a licensed practitioner using single-use sterile needles is reasonable as an adjunct, with the understanding that benefit over sham is modest (~0.15-0.23 SD in the best meta-analysis). Reassess after ~6-8 sessions and stop if there is no meaningful improvement."
        - audience: "patients/consumers"
          text: "For balance, falls prevention, and fibromyalgia, tai chi/qigong are low-risk and supported by reasonable evidence; these are among the safest and best-evidenced TCM-associated practices."
        - audience: "patients/consumers"
          text: "Treat Chinese herbal products with caution: avoid any product containing aristolochic acid (Aristolochia, 'Fangchi,' 'Mu Tong,' 'Guang Fang Ji') or ephedra; buy only from regulated sources; disclose all herbal use to physicians because of interaction, hepatotoxicity, and contamination risks; and avoid animal-derived products (conservation and safety)."
        - audience: "clinicians and health systems"
          text: "Frame acupuncture and tai chi within evidence-based, non-pharmacological pain and mobility pathways where appropriate, not as validation of qi/meridian theory. Screen for and counsel against unregulated herbal products, especially in patients with renal or hepatic disease."
        - audience: "researchers/regulators"
          text: "Prioritize large, pre-registered, adequately blinded, adequately powered trials with published protocols; enforce trial registration and outcome-reporting standards; and apply pharmacovigilance and contaminant testing to herbal products."
      citations: []
      register: biomedical-evidence
      notes: "This is the report author's stance, not evidence. Section 9 ('Balanced assessment') also sets out the proponents' and critics' cases and a three-way distinction of claim types (descriptive/theoretical, historical-anthropological, biomedical efficacy). Those summarize content extracted elsewhere and are not recommendations."
