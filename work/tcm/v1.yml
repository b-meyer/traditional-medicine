  contemporary_controversies:
    who_engagement:
      status: incidental
      value: "WHO Traditional Medicine Strategy 2014-2023, developed with substantial technical, logistical and financial support from China and Hong Kong bodies. In 2019 WHO incorporated traditional-medicine diagnostic categories into ICD-11 (Chapter 26), 'a union set of harmonized traditional medicine conditions of the Chinese, Japanese, and Korean classifications'; WHO stresses the chapter is optional, for epidemiological data, not mortality reporting. Nature editorial (5 June 2019): the chapter 'is likely to backfire... risks legitimizing an unfounded underlying philosophy and some unscientific practice'; critics flagged conflicts of interest in China-linked funding. WHO later held up the barefoot doctor model as an influence on Alma-Ata."
      citations:
        - {source: "Traditional Medicine Diagnostic Codes in ICD-11 and Alternative Diagnostic Classifications in the Mainstream Healthcare (ResearchGate PDF) [S1]", type: unclear, citation_strength: indirect}
        - {source: "The World Health Organization: Embracing traditional Chinese medicine pseudoscience in ICD-11, Respectful Insolence blog [S2]", type: unclear, citation_strength: indirect}
        - {source: "Nature editorial, 5 June 2019, named in report text", type: unclear, citation_strength: unclear}
      register: regulatory
      notes: "S2 is a skeptic blog cited for WHO's own statement that the chapter is optional, so the claim about WHO's position rests on a secondary blog. Not a search target (incidental)."
