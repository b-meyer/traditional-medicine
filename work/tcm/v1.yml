  construct_debate:
    positions:
      status: incidental
      value:
        - scholar: "Paul Unschuld"
          work: "Interview in Acupuncture Today (S3); no monograph named"
          year: null
          position: "Distinguishes 'TCM' from 'CTM' (the entirety of pre-20th-century Chinese health knowledge). Argues TCM 'is a product... of Communist China' and criticizes selective, decontextualized use of classical sources."
