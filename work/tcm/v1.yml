      notes: "The report says these correspondence systems are 'shared in structure with other premodern traditions.' S5 is cited only for the count of 12 principal meridians. It is a review about the anatomical basis of meridians, so it is on topic but was not written to establish the emic count."
    etiology:
      status: filled
      value: "Six excesses (external climatic factors: wind, cold, heat, dampness, dryness, fire) and seven emotions (internal causes). Historically, the Shang attributed illness largely to ancestral curses."
