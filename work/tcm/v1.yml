    relation_to_biomedical_anatomy:
      status: filled
      value: "Constructs predate and do not map onto modern anatomy, physiology or biochemistry; the report states there is no demonstrated physical basis for qi or meridians and that scientific reviews find no evidence that meridians or vital energy exist. Zang-fu are defined by dynamic function rather than anatomical organs. Charles Leslie is quoted describing correspondence systems as classificatory/mnemonic devices that lent themselves to 'stultifying theoretical elaboration, self-deception, and dogmatism'. Reviews conclude the anatomical basis of meridians 'has not been resolved'."
      citations:
        - {source: "Traditional Chinese medicine (Wikipedia) [S6]", type: open-encyclopedia, citation_strength: indirect}
        - {source: "Anatomical Evidence of Acupuncture Meridians in the Human Extracellular Matrix [S7]", type: primary-study, citation_strength: direct}
      register: biomedical-evidence
      notes: "S6 is used for the Leslie quotation (Wikipedia, not the original). S7's title asserts anatomical evidence, while the report cites it for the conclusion that the basis 'has not been resolved'; not flagged as mismatch because the source may discuss the question."
    translation_programs:
      status: partial
      value: "Fascia/connective-tissue network hypotheses for meridians (work by Langevin and by Bai et al.) 'remain hypotheses' that most anatomists do not accept as validating the classical meridian map. Emerging interest in network pharmacology and systems biology for multi-component formulas (listed as a proponents' argument). Artemisinin from Artemisia annua is a drug-discovery success the report says is separate from validation of TCM theory."
