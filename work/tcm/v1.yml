    nosology:
      status: filled
      value: "Pattern differentiation (bianzheng lunzhi): diagnosis identifies a 'pattern' (syndrome, zheng) rather than a disease, which guides individualized therapy. Patterns are organized by the eight principles. Grouping symptoms into patterns is traced to the Shanghan Lun. ICD-11 Chapter 26 codes harmonized traditional-medicine conditions."
