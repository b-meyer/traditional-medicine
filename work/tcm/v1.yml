      notes: "The source prompt did not ask about the invented-tradition debate; the report covers it in passing, prominently. Not a gap-pass search target. S4 is a journal article (DOI 10.1215/s12280-009-9072-y), not Taylor's monograph named in the text, and the bibliography does not identify its author. Its type is recorded as historical-monograph because the enum has no historical journal-article type. The report presents only the construction side; no scholar defending continuity is named. The report does not characterize any scholar's evidence base."
    report_adjudication:
      status: incidental
      value: "The report states that modern 'TCM' is partly a modern construct, 'systematized and textbook-codified in Communist China roughly between 1956 and 1964, deliberately stripped of \"superstitious\"/religious elements to fit a Marxist-scientific framing.' It calls this 'a point on which serious historians (Unschuld, Taylor, Scheid, Sivin, Andrews, Lei) broadly agree' and scholarship that is 'robust and largely consensual that modern \"TCM\" is a 20th-century standardization of diverse older traditions.'"
      citations:
        - source: "Uncited in report (TL;DR, Key Finding 1, section 9)"
          type: unclear
          citation_strength: unclear
      register: historical-scholarship
      notes: "This is the report's own stance, not established consensus. Incidental because the debate was not requested. The report presents no opposing position, so its adjudication is a statement of consensus rather than a weighing of sides."
