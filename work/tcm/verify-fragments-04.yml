  - path: disruption.loss_of_patronage
    outcome: corrected
    field:
      status: filled
      value: "Daoguang Emperor decree of 1822 banned acupuncture and moxibustion from the Imperial Medical Academy (Taiyiyuan), on the stated ground that they were unsuitable to be applied to the Emperor."
      citations:
        - source: "Nguyen, 'L'interdiction de l'acupuncture en 1822 par l'empereur', 2018, 17(1):5 (GERA PDF, gera.fr)"
          type: historical-monograph
          citation_strength: direct
      register: historical-scholarship
      notes: "Corrected. The 1822 decree and its scope are supported. The original framing (rise of Western medicine and acupuncture or yin-yang theory increasingly seen as superstitious as the cause) was not found in the source; the source describes the ban as a local event limited to the Imperial Academy, with no proven effect on wider practice in China, and reasons for it debated. Claim narrowed to the decree itself. The PDF was binary and could not be read directly; content was checked through search-result excerpts of the article, so re-check the wording against the PDF. Listing this under loss_of_patronage is a loose fit (institutional exclusion, not collapse of a court)."
    searches:
      - "Daoguang 1822 acupuncture moxibustion abolished Imperial Medical Academy decree"
  - path: disruption.post_colonial_disruption
    outcome: confirmed
    field:
      status: filled
      value:
        - label: Maoist systematization of Chinese medicine
          date: 1950s
          description: "Diverse styles systematized into a standardized curriculum; 'Traditional' applied mid-1950s; the report frames this as transformation and reinvention rather than institutional split or relocation."
      citations:
        - source: "Taylor, Kim. Chinese Medicine in Early Communist China, 1945-63: A Medicine of Revolution. RoutledgeCurzon, 2005 (publisher page and chapter list: 'The Creation of a Traditional Chinese Medicine, 1953-1956'; 'The Standardisation of Chinese Medicine, 1957-1963')"
          type: historical-monograph
          citation_strength: direct
          claim_match: matches
      register: historical-scholarship
      notes: "Publisher description and chapter titles confirm the 1953-56 creation of a 'Traditional' Chinese medicine and the 1957-63 standardisation; the book's own description says the term 'Traditional' was not formally used in China until the mid-1950s and that the textbooks were a large systematization of theory and practice modeled on Western medical textbooks. Book text itself not read; the 'transformation and reinvention' framing is the report's, consistent with Taylor's argument."
    searches:
      - "Taylor Chinese Medicine in Early Communist China 1945-63 systematization standardized curriculum traditional"
