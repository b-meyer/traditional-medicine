  - path: revival_and_institutionalization.state_sponsorship
    outcome: corrected
    field:
      status: filled
      value: "PRC systematization and institution-building from the 1950s; 2016 TCM Law (adopted 25 December 2016 by the NPC Standing Committee, effective 1 July 2017) whose Article 3 makes TCM an important component of the medical and health system and sets the policy of equal importance of Chinese and Western medicine (zhongxiyi bingzhong); domestic promotion during COVID-19; Belt and Road promotion abroad (Belt and Road TCM Development Plan 2016-2020)."
      citations:
        - source: "Law of the PRC on Traditional Chinese Medicine (中华人民共和国中医药法), NPC Standing Committee, 25 Dec 2016, in force 1 Jul 2017, Article 3 (text as published on Beijing municipal government portal, beijing.gov.cn, 2017-08-16)"
          type: statute
          citation_strength: direct
        - source: "Wang W-Y et al., 'Current policies and measures on the development of traditional Chinese medicine in China', Pharmacological Research, 2020 (PMC7480280)"
          type: tertiary-review
          citation_strength: direct
        - source: "Taylor, Kim. Chinese Medicine in Early Communist China, 1945-63, RoutledgeCurzon, 2005"
          type: historical-monograph
          citation_strength: direct
      register: regulatory
      notes: "Corrected wording. Original said the law gave TCM 'equal legal footing with biomedicine'. Article 3 states a state policy of equal importance (中西医并重), not legal equivalence in status; adoption and effective dates are correct. Wang et al. 2020 describe the law as clarifying TCM's 'important status' and record the Belt and Road TCM plan (2016-2020) and broad TCM involvement in COVID-19 treatment. 1950s institution-building is supported at book level by Taylor (1945-63). The statute text was read on a government portal republication, not npc.gov.cn itself."
    searches:
      - "Traditional Chinese Medicine Law 2016 effective July 1 2017 npc.gov.cn"
      - "中华人民共和国中医药法 第三条 中西医并重"
