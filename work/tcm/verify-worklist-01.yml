- path: canon_and_transmission.dating_and_authorship_disputes
  source_report: v2
  value:
  - 'Paul Unschuld: 20th-century scholars date Suwen language and ideas to roughly 400 BCE-260 CE; only
    a small portion transmits concepts from before the 2nd century BCE.'
  - 'Du Fu (14th c.): Suwen compiled by several authors over a long period.'
  - 'Jianmin Li, Vivienne Lo, Donald Harper: Neijing systematic theory diverges significantly from Mawangdui,
    implying compilation after 168 BCE.'
  - 'Report: composite nature, Han-era dating, Wang Bing recension and Song revision are consensus; dating
    of individual layers and relation of excavated manuscripts to the received canon remain debated.'
  - 'Nathan Sivin, Yamada Keiji, Elisabeth Hsu, Vivienne Lo: channel theory has a traceable developmental
    history, not a single origin.'
  weak_citations:
