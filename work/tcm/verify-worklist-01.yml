- path: identification.system_boundary
  source_report: v2
  value:
  - tradition: Japanese kampo
    relation: sibling
    fields_affected:
    - contact_and_borrowing.relationships
    - disruption.colonial_power
    - legal_status.jurisdictions
    description: Report says kampo is 'directly derived from Chinese medicine (especially the Shanghan
      Lun tradition)' yet is regulated and practiced on its own terms (prescribed by biomedical physicians,
      insured). Meiji suppression of kampo shaped the Chinese debate.
  - tradition: Korean medicine including Sasang constitutional medicine
    relation: sibling
    fields_affected:
    - legal_status.jurisdictions
    - contact_and_borrowing.relationships
    - contemporary_controversies.politicized_episodes
    description: Built on the Chinese canon; South Korea has a parallel licensed system. Sasang is named
      but not sourced.
  - tradition: Traditional East Asian medicine (ISO/TC 249 grouping)
    relation: regulatory_grouping
    fields_affected:
    - contemporary_controversies.politicized_episodes
    - legal_status.supranational_standards
    description: ISO committee named 'Traditional Chinese Medicine' over Korean and Japanese preference
      for a neutral 'traditional East Asian medicine'.
  - tradition: Han-era and later premodern Chinese medical traditions (Neijing, Shanghan Lun, Mawangdui-era
      recipe and demonological medicine)
    relation: premodern_predecessor
    fields_affected:
    - canon_and_transmission
    - construct_debate
    description: Report treats the 1950s system as a selective reconstruction (Unschuld) or transformation
      within plural continuity (Scheid) of these traditions.
