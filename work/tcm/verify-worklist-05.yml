- path: evidence_state.reviews
  source_report: v2
  value:
  - modality: Acupuncture, chronic pain
    best_available_review: Acupuncture Trialists' Collaboration IPD meta-analysis (Vickers)
    type: meta-analysis
    year: 2012; update 2018
    size: 39 trials, 20,827 patients
    conclusion: 'Superior to sham and to no-acupuncture. Effect ~0.2 SD vs sham, ~0.5 SD vs no-acupuncture
      (2012: 0.23 back/neck, 0.16 osteoarthritis, 0.15 headache vs sham; 0.55/0.57/0.42 vs no-acupuncture).
      2018: ''acupuncture is effective for the treatment of chronic pain ... decreases in pain after acupuncture
      cannot be explained solely in terms of placebo effects ... factors in addition to the specific effects
      of needling ... are important contributors.'' Response rates about 30% no acupuncture, 42.5% sham,
      50% real.'
    certainty_rating: not given
    methodological_limitations_noted: Report notes specific effect small and contextual effects larger.
  - modality: Acupuncture, migraine prophylaxis
    best_available_review: Cochrane, Linde et al. CD001218
    type: systematic-review
    year: 2016
    size: not given
    conclusion: Adding acupuncture reduced migraine frequency; headache frequency at least halved in 57%
      with acupuncture vs 46% with prophylactic drugs (RR 1.24), fewer adverse effects.
    certainty_rating: not given
    methodological_limitations_noted: not given
  - modality: Acupuncture, tension-type headache
    best_available_review: Cochrane, Linde et al. CD007587
    type: systematic-review
    year: 2016
    size: not given
    conclusion: '''a course of acupuncture consisting of at least six treatment sessions can be a valuable
      option''; 48/100 halved headache frequency vs 17/100 with usual care only.'
    certainty_rating: not given
    methodological_limitations_noted: not given
  - modality: Acupuncture, chronic low back pain
    best_available_review: Cochrane, Mu et al. CD013814
    type: systematic-review
    year: 2020
    size: 33 studies, 8,270 participants
    conclusion: Only low-certainty evidence for pain relief vs sham in the immediate term (MD -9.22 on
      0-100 VAS); moderate-certainty benefit vs no treatment.
    certainty_rating: low (vs sham); moderate (vs no treatment)
    methodological_limitations_noted: not given
  - modality: PC6 acupressure/acupuncture, nausea and vomiting
    best_available_review: Cochrane, Lee et al. CD003281; 2025 network meta-analysis update CD003281.pub5
    type: systematic-review
    year: 2015; 2025
    size: 59 trials, 7,667 participants (2015)
    conclusion: NNT about 5 for nausea, about 4 for vomiting; 'no further PC6 ... versus sham trials are
      needed'. 2025 NMA reaffirms benefit combined with antiemetics.
    certainty_rating: not given
    methodological_limitations_noted: not given
  - modality: Moxibustion, breech presentation
    best_available_review: Cochrane, Coyle, Smith and Peat CD003928
    type: systematic-review
    year: 2012 (report) / 2023 update
    size: not given
    conclusion: '2012: ''no conclusive evidence''. 2023: moderate-certainty evidence that moxibustion
      plus usual care ''probably reduces the chance of non-cephalic presentation at birth''.'
    certainty_rating: moderate (2023)
    methodological_limitations_noted: not given
  - modality: Lianhua Qingwen, COVID-19
    best_available_review: Updated meta-analysis of efficacy and safety
    type: meta-analysis
    year: null
    size: not given
    conclusion: Symptom improvement reported when added to standard care, but evidence 'lacks strong evidence'.
    certainty_rating: not given
    methodological_limitations_noted: Evidence base dominated by low-quality Chinese trials.
  - modality: Tai chi
    best_available_review: NCCIH summaries; Natural Therapies Review 2024 (Cochrane Australia evidence)
    type: tertiary-review
    year: 2024 (published 2025)
    size: not given
    conclusion: 'NCCIH: ''may improve balance and stability in older people and reduce the risk of falls'',
      may help knee-osteoarthritis pain and fibromyalgia sleep/coping; research ''preliminary''. Natural
      Therapies Review 2024: moderate-certainty evidence for tai chi (recommended for re-inclusion).'
    certainty_rating: moderate (Natural Therapies Review 2024)
    methodological_limitations_noted: 'Report: research remains ''preliminary''. Tai chi reviews cover
      the modality in general and are treated by the report as TCM''s own.'
  - modality: Natural therapies incl. acupuncture and other TCM modalities (insurance review)
    best_available_review: 2015 Australian Government Review of natural therapies for private health insurance
    type: institutional
    year: 2015
    size: 17 therapies
    conclusion: No clear evidence of clinical effectiveness across therapies assessed.
    certainty_rating: not given
    methodological_limitations_noted: not given; report notes the McDonald and Janz 2017 Acupuncture Evidence
      Project is an industry-body publication, not a government review, and should not be conflated.
  - modality: Cupping, qigong
    best_available_review: none identified
    type: null
    year: null
    size: null
    conclusion: '''largely low-quality/inconclusive''.'
    certainty_rating: not given
    methodological_limitations_noted: not given
  - modality: Most herbal formulas
    best_available_review: none identified
    type: null
    year: null
    size: null
    conclusion: Report classes them as inconclusive/low-quality.
    certainty_rating: not given
    methodological_limitations_noted: Overwhelmingly positive Chinese trials of low quality; publication
