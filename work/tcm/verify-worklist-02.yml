entries:
- path: canon_and_transmission.redaction_history
  source_report: v2
  value: 'Wang Bing''s Tang recension (762 CE): collected fragments, reorganized Suwen into 81 treatises
    in 24 juan, added two ''lost'' discourses and seven wuyun liuqi discourses, inserted over 5,000 commentaries;
    treatises 72 and 73 survive only as titles; built on Quan Yuanqi''s early-6th-century commented version.
    Song imperial editorial office produced the received Chong Guang Bu Zhu Huangdi Neijing Suwen; sources
    date the start to 1053 CE and cite the Bureau for Revising Medical Texts of 1057; editors Lin Yi,
    Sun Qi, Gao Baoheng.'
