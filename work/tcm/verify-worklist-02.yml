- path: construct_debate.positions
  source_report: v2
  value:
  - scholar: Kim Taylor
    work: Chinese Medicine in Early Communist China, 1945-63
    year: 2005
    position: TCM as a standardized entity was invented in the 1950s PRC nation-building project; adjective
      'traditional' is a mid-1950s coinage.
    evidence_base: Archival evidence of 1950s institution-building and terminology.
  - scholar: Paul Unschuld
    work: not named in this context
    year: null
    position: Stresses textual layering and that modern practice is a selective reconstruction.
    evidence_base: Textual history.
  - scholar: Sean Hsiang-lin Lei
    work: Neither Donkey nor Horse
    year: null
    position: Decisive transformations in the Republican era; 'mongrel medicine'.
    evidence_base: Historical study of Republican- and Communist-era reconciliation of pattern and disease.
  - scholar: Bridie Andrews
    work: The Making of Modern Chinese Medicine, 1850-1960
    year: null
    position: Decisive transformations in the Republican era via scientization.
    evidence_base: Historical study.
  - scholar: Eric Karchmer and Edzard Ernst
    work: not named
    year: null
    position: Frame today's system through Hobsbawm's 'invented tradition'.
    evidence_base: Anthropology of PRC TCM education (Karchmer); critique (Ernst).
  - scholar: Volker Scheid
    work: not named
    year: null
    position: '''Plurality within continuity'': Chinese medicine always internally diverse and continuously
      reinvented, so 1950s systematization is a transformation, not fabrication.'
    evidence_base: Argument that 'invention' mischaracterizes normal traditional change.
  - scholar: PRC official narratives and some practitioner-scholars and textual historians
    work: n/a
    year: null
    position: Unbroken transmission; continuity of Shanghan Lun formula tradition and materia medica.
    evidence_base: Persistence of canonical texts, formulas, lineages.
  - scholar: Li Zhisui
    work: memoir
    year: null
    position: Alleges Mao privately did not believe in Chinese medicine while promoting it for the masses.
    evidence_base: Memoir testimony.
  weak_citations:
  - source: Chinese Medicine in Early Communist China - Taylor (Google Books) [S14]
    type: catalog-listing
    citation_strength: indirect
- path: construct_debate.report_adjudication
  source_report: v2
  value: 'TL;DR: a ''scholarly near-consensus'' that the standardized system marketed as TCM is ''substantially
    a mid-20th-century construct'', while textual roots are genuinely ancient. In the caveats: the debate
    is ''genuinely unsettled at the level of interpretation, even though the underlying facts (1950s institution-building,
    1822 acupuncture decree, Cheng Dan''an''s reforms) are agreed''. Scheid is called ''the most cited
    middle position''.'
  weak_citations:
  - source: none given in report
    type: unclear
    citation_strength: unclear
- path: theoretical_primitives.constituents
  source_report: v2
  value: 'Qi (vital energy/vapor); yin and yang; wuxing (five phases: wood, fire, earth, metal, water);
    zang-fu organ systems as functional-cosmological categories (e.g. Kidney governs water metabolism,
    reproduction, bone, jing); jingluo channels and collaterals along which qi and blood circulate.'
