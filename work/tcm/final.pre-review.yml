          primary sources and should be treated as slightly less firmly sourced.
      - kind: caveat
        text: Reliability literature is modest in size (Jacobson's review covered 21 heterogeneous studies)
          and methods varied; the poor-reliability conclusion is robust in direction but imprecise in
          magnitude.
      - kind: caveat
        text: 'Publication bias cuts both ways in interpretation: the Vickers 1998 finding is old (Medline
          to 1995); the pattern persists in later analyses but registration has improved since ~2005-2010.'
