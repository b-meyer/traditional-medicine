        Creation of a Traditional Chinese Medicine, 1953-1956'' is suggestive but not the work itself)'
      source_report: v2
      verify_outcome: unverifiable
    report_adjudication:
      status: filled
      value: 'TL;DR: a ''scholarly near-consensus'' that the standardized system marketed as TCM is ''substantially
        a mid-20th-century construct'', while textual roots are genuinely ancient. In the caveats: the
        debate is ''genuinely unsettled at the level of interpretation, even though the underlying facts
        (1950s institution-building, 1822 acupuncture decree, Cheng Dan''an''s reforms) are agreed''.
        Scheid is called ''the most cited middle position''.'
      citations:
