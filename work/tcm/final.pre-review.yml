  evidence_state:
    reviews:
      status: filled
      value:
      - modality: Acupuncture, chronic pain
        best_available_review: Acupuncture Trialists' Collaboration IPD meta-analysis (Vickers)
        type: meta-analysis
        year: 2012; update 2018
        size: '2012: 29 of 31 eligible trials, 17,922 patients; 2018 update: 39 trials, 20,827 patients'
        conclusion: 'Superior to sham and to no-acupuncture. Effect ~0.2 SD vs sham, ~0.5 SD vs no-acupuncture
          (2012: 0.23 to 0.16 SD vs sham and 0.55 to 0.42 vs no-acupuncture depending on condition). 2018:
          acupuncture superior to sham and to no acupuncture for each pain condition (all P<.001); effects
          persist over time with about a 15% decrease at 1 year; authors conclude acupuncture is effective
          for chronic pain. Response rates about 30% no acupuncture, 42.5% sham, 50% real (not checked
          against the full text).'
        certainty_rating: not given
        methodological_limitations_noted: Report notes specific effect small and contextual effects larger.
          2012 abstract likewise says true-vs-sham differences were modest and additional factors contribute
          substantially.
      - modality: Acupuncture, migraine prophylaxis
        best_available_review: Cochrane, Linde et al. CD001218
        type: systematic-review
        year: 2016
        size: 22 trials, 4985 participants
        conclusion: Adding acupuncture to symptomatic treatment reduced headache frequency; a small effect
          over sham was also found. Headache frequency at least halved in 57% with acupuncture vs 46%
          with prophylactic drugs at three months (RR 1.24, 95% CI 1.08 to 1.44), with fewer adverse effects
          than drugs.
        certainty_rating: 'moderate overall (authors: overall quality of the evidence was moderate)'
        methodological_limitations_noted: Risk of performance and detection bias in comparisons with no-acupuncture
          and drug controls because blinding not possible; long-term studies over one year lacking.
      - modality: Acupuncture, tension-type headache
        best_available_review: Cochrane, Linde et al. CD007587
        type: systematic-review
        year: 2016
        size: 12 trials, 2349 participants
        conclusion: '''a course of acupuncture consisting of at least six treatment sessions can be a
          valuable option''; in two large trials 48/100 halved headache frequency vs 17/100 with usual
          care only.'
        certainty_rating: not given
        methodological_limitations_noted: not given
      - modality: Acupuncture, chronic low back pain
        best_available_review: Cochrane, Mu et al. CD013814
        type: systematic-review
