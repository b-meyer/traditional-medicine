    recommendations:
      status: filled
      value:
      - audience: Readers weighing TCM
        text: 'Treat TCM as two separable things: a materia medica that is a legitimate source of drug
          leads (artemisinin as proof of concept) and a theoretical/diagnostic system with weak empirical
          support and poor reliability (kappa about 0.34); do not treat its categories as validated biology.'
      - audience: Patients
        text: Acupuncture is a defensible option for chronic pain, migraine/tension headache and nausea;
          specific effect small but real, adverse events low; set expectations that much benefit is contextual.
      - audience: Patients
        text: Avoid Aristolochia/aristolochic acid products, ephedra, He Shou Wu without hepatic monitoring,
          and products with endangered-species animal parts; prefer products from jurisdictions with statutory
          quality control (Australia TGA/AHPRA, EU THMPD) over US DSHEA supplements.
      - audience: Readers and evaluators
        text: Discount efficacy claims resting solely on Chinese-language trials given near-universal
          positivity; require independent non-Chinese replication or Cochrane-grade evidence.
      - audience: Policymakers
        text: Keep ICD-11 Chapter 26 coding strictly optional and never for mortality; prioritize pharmacovigilance,
          adulteration testing and species protection.
      citations:
      - source: none given in report
        type: unclear
        citation_strength: unclear
      register: biomedical-evidence
      notes: 'Report author''s stance, not evidence.

        verify pass: unverifiable. Searched: Leaf records the report author''s own stance; embedded figures
