- path: report_conclusions.revision_thresholds
  source_report: v2
  value:
  - domain: Acupuncture for chronic pain, migraine/tension headache, nausea
    threshold: High-quality, pre-registered, adequately blinded sham-controlled trials
    would_change: Effects collapsing to sham would downgrade the recommendation; consistent replication
      of specific effects would upgrade it.
  - domain: Efficacy claims resting on Chinese-language trials
    threshold: Independent, non-Chinese replication or Cochrane-grade evidence
    would_change: Such claims would be credited rather than discounted.
  weak_citations:
  - source: none given in report
    type: unclear
    citation_strength: unclear
- path: report_conclusions.recommendations
  source_report: v2
  value:
  - audience: Readers weighing TCM
    text: 'Treat TCM as two separable things: a materia medica that is a legitimate source of drug leads
      (artemisinin as proof of concept) and a theoretical/diagnostic system with weak empirical support
      and poor reliability (kappa about 0.34); do not treat its categories as validated biology.'
  - audience: Patients
    text: Acupuncture is a defensible option for chronic pain, migraine/tension headache and nausea; specific
      effect small but real, adverse events low; set expectations that much benefit is contextual.
  - audience: Patients
    text: Avoid Aristolochia/aristolochic acid products, ephedra, He Shou Wu without hepatic monitoring,
      and products with endangered-species animal parts; prefer products from jurisdictions with statutory
      quality control (Australia TGA/AHPRA, EU THMPD) over US DSHEA supplements.
  - audience: Readers and evaluators
    text: Discount efficacy claims resting solely on Chinese-language trials given near-universal positivity;
      require independent non-Chinese replication or Cochrane-grade evidence.
  - audience: Policymakers
    text: Keep ICD-11 Chapter 26 coding strictly optional and never for mortality; prioritize pharmacovigilance,
      adulteration testing and species protection.
