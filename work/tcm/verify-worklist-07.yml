- path: contemporary_controversies.research_methodology_disputes
  source_report: v2
  value: Dispute over whether sham acupuncture (which may be physiologically active) is a valid placebo,
    and how to design trials around patterns. The Vickers small-but-real specific effect is read by advocates
    as vindication and by critics (Ernst) as consistent with elaborate placebo. TCM advocates say low
    diagnostic reliability reflects individualization; critics say unreliable diagnosis undermines clinical
    validity and trial design.
  weak_citations:
  - source: none given in report
    type: unclear
    citation_strength: unclear
- path: self_reported_gaps.inventory
  source_report: v2
  value:
  - kind: gap
    text: My web-search budget was exhausted before I could run dedicated searches on three sub-topics
      (Japanese Meiji-era kampo suppression specifics; Korean Sasang medicine; and the precise wording
      of TCM theory primary texts on bian zheng vs bian bing); I flag those as partially sourced.
  - kind: caveat
    text: These sections rest on strong secondary syntheses (Andrews, Lei, Scheid) rather than topic-specific
      primary sources and should be treated as slightly less firmly sourced.
  - kind: caveat
    text: Reliability literature is modest in size (Jacobson's review covered 21 heterogeneous studies)
      and methods varied; the poor-reliability conclusion is robust in direction but imprecise in magnitude.
  - kind: caveat
    text: 'Publication bias cuts both ways in interpretation: the Vickers 1998 finding is old (Medline
      to 1995); the pattern persists in later analyses but registration has improved since ~2005-2010.'
  - kind: contested
    text: The invention-vs-continuity debate is genuinely unsettled at the level of interpretation, even
      though the underlying facts (1950s institution-building, 1822 acupuncture decree, Cheng Dan'an's
      reforms) are agreed.
  - kind: caveat
    text: Wildlife-trafficking and bear-farm figures vary by source (e.g., bear-bile farm estimates range
      from ~10,000-12,000 to over 20,000 bears; pangolin totals differ between IUCN and WWF). These are
      indicative, not precise, and some derive from NGO rather than primary-literature sources.
  - kind: gap
    text: 'Evidence note (Q2): I was unable to run a dedicated search on primary-text formulations of
      bian zheng vs bian bing.'
  - kind: gap
    text: 'Evidence note (Q4): I could not run a dedicated search on the precise mechanics of Meiji kampo
      suppression and its effect on Taiwan/Korea.'
  - kind: gap
    text: 'Evidence note (Q9): Korean Sasang constitutional medicine and Vietnamese/Mongolian specifics
      are the thinnest-sourced part of this answer.'
  - kind: caveat
    text: A research subagent supplied the authoritative-body evidence assessments (NCCIH, WHO strategy,
      Cochrane verbatim conclusions, Vickers effect sizes).
  - kind: contested
    text: The McDonald and Janz 2017 Acupuncture Evidence Project is an industry-body publication, not
      a government review, and should not be conflated with the government assessment.
  weak_citations:
