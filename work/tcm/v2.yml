schema_version: "1.4"
system: tcm
source_report: v2
fields:
  identification:
    system_name:
      status: filled
      value: "Traditional Chinese Medicine (TCM)"
      citations:
        - source: "No citation in report"
          type: unclear
          citation_strength: unclear
      register: historical-scholarship
      notes: "The report distinguishes the textually ancient literate Chinese medical tradition from the standardized system 'marketed today as TCM', which it calls substantially a mid-20th-century construct. It reports (via Kim Taylor, S14/S15) that the adjective 'Traditional' was not formally applied until the mid-1950s, initially only in English-language PRC press literature; see field 3 and field 9."
    alternate_names:
      status: incidental
      value:
        - "Chinese medicine (used throughout the report for the premodern and Republican-era tradition)"
        - "guoyi ('national medicine'), the Republican-era rebranding adopted by practitioners after the 1929 abolition proposal"
        - "'traditional East Asian medicine', a neutral term preferred by objectors (notably South Korea and Japan) in the ISO TC 249 naming dispute; the report gives it as a proposed committee name, not as a name for TCM itself"
      citations:
        - source: "S13 — Review: Andrews, The Making of Modern Chinese Medicine; Lei, Neither Donkey nor Horse - PMC — https://pmc.ncbi.nlm.nih.gov/articles/PMC4986214/"
          type: tertiary-review
          citation_strength: direct
        - source: "S47 — ISO/TC 249 - Traditional Chinese medicine (iTech) — https://standards.iteh.ai/catalog/tc/iso/1afeaecd-3813-46a1-b6e4-0260afe9aec3/iso-tc-249"
          type: catalog-listing
          citation_strength: indirect
      register: historical-scholarship
      notes: "Not asked by the source prompt; covered in passing. The report gives no Chinese-language endonym (e.g. a pinyin name for Chinese medicine or TCM). Not a gap-pass search target."
    primary_regions:
      status: incidental
      value: "People's Republic of China (origin and primary institutional base), with statutory presence in Hong Kong, Taiwan and Singapore; practised internationally (Australia, Canada, United States, United Kingdom, Switzerland, Germany, Malaysia per the legal-status survey). Related traditions in Japan (kampo) and South Korea (Korean medicine)."
      citations:
        - source: "No citation in report"
          type: unclear
          citation_strength: unclear
      register: regulatory
      notes: "Inferred from the report's legal-status and history sections; the report does not state primary regions as such. Not asked; not a search target."
    practitioner_estimate:
      status: not_requested
      value: null
      citations: []
      register: regulatory
      notes: "Not asked by the source prompt. The report gives no practitioner count; it gives only PRC TCM hospital-bed figures (84,625 in 1949 to 2,412,362 in 1984) and college counts, recorded in field 9. Not a gap-pass search target."
    system_boundary:
      status: incidental
      value:
        - tradition: "Japanese kampo"
          relation: sibling
          fields_affected: ["disruption", "legal_status", "contact_and_borrowing"]
          description: "The report says kampo is directly derived from Chinese medicine (especially the Shanghan Lun tradition). Meiji-era kampo suppression appears in the TCM disruption narrative, and Japan's kampo regime (physician-prescribed, insurance-covered) is listed in the TCM legal-status survey."
        - tradition: "Korean medicine (including Sasang constitutional medicine)"
          relation: sibling
          fields_affected: ["legal_status", "contact_and_borrowing", "contemporary_controversies"]
          description: "The report says Korean medicine built on the Chinese canon; South Korea's 'parallel, fully licensed system of Korean medicine doctors' is listed in the TCM legal-status survey, and China–Korea heritage disputes appear under controversies."
        - tradition: "Indian/Buddhist medicine"
          relation: absorbed_strand
          fields_affected: ["contact_and_borrowing"]
          description: "The report documents the transmission of Indian/Buddhist medical concepts (including Indian ophthalmology and cataract couching) into China via Buddhist networks."
        - tradition: "Traditional and complementary medicine (T&CM) as a WHO category"
          relation: regulatory_grouping
          fields_affected: ["contemporary_controversies"]
          description: "WHO strategy figures (countries with T&CM regulation, policy, acknowledged use) and ICD-11 Chapter 26 cover traditional medicine generally, not TCM alone."
        - tradition: "Natural therapies (Australian Government review grouping)"
          relation: regulatory_grouping
          fields_affected: ["evidence_state"]
          description: "The 2015 Australian review and the Natural Therapies Review 2024 assessed natural therapies as a group for private health insurance; the report applies their findings (e.g. tai chi) to TCM."
        - tradition: "Dietary supplements (US DSHEA) / traditional herbal medicinal products (EU THMPD)"
          relation: regulatory_grouping
          fields_affected: ["legal_status", "safety"]
          description: "In the US, TCM herbs are regulated as dietary supplements; in the EU/UK, manufactured herbal products fall under the traditional-use directive. The ephedra ban applied to dietary supplements generally."
      citations:
        - source: "No citation in report"
          type: unclear
          citation_strength: unclear
      register: historical-scholarship
      notes: "The report does not discuss system boundaries explicitly; these entries are assembled from passages where content on other traditions or regulatory groupings enters the TCM account. Kampo and Korean medicine are coded 'sibling' because they descend from the same classical Chinese canon; field 15 records the relationship itself as descent. Not asked; not a search target."
