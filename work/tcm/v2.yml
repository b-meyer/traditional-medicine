        - {scholar: "Sean Hsiang-lin Lei", work: "Neither Donkey nor Horse", year: null, position: "Decisive transformations in the Republican era; 'mongrel medicine'.", evidence_base: "Historical study of Republican- and Communist-era reconciliation of pattern and disease."}
        - {scholar: "Bridie Andrews", work: "The Making of Modern Chinese Medicine, 1850-1960", year: null, position: "Decisive transformations in the Republican era via scientization.", evidence_base: "Historical study."}
