      register: historical-scholarship
      notes: "The Kim Taylor quotation on 'Traditional' reaches the report through a Google Books catalog entry (S14) and a Science-Based Medicine commentary blog (S15; 'news' is the nearest source type). Scheid's position, the most cited middle position, carries no citation. The TL;DR lists Scheid among the near-consensus 'construct' scholars, but Q8 presents him as the middle position; see report_adjudication. Many positions lack year and work."
    report_adjudication:
      status: filled
      value: "The report leans toward the construction thesis. TL;DR: 'the standardized system marketed today as TCM is substantially a mid-20th-century construct — a scholarly near-consensus'. Q8 labels the 'recent invention' thesis the 'scholarly majority' and treats acupuncture as 'the sharpest illustration of discontinuity'. It also hedges: its caveats say the debate 'is genuinely unsettled at the level of interpretation, even though the underlying facts (1950s institution-building, 1822 acupuncture decree, Cheng Dan'an's reforms) are agreed', and Q10 calls it 'a live scholarly fight'."
      citations: []
      register: historical-scholarship
      notes: "This is the report's own stance, not a consensus finding, and it has no external citation. The report is internally inconsistent: the TL;DR 'near-consensus' list includes Scheid, whom Q8 places in the middle position."
