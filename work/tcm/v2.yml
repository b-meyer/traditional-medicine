      value:
        - audience: "Readers deciding how to weigh or use TCM"
          text: "Treat 'TCM' as two separable things: (a) a materia medica that is a legitimate source of drug leads, to be pursued with standard pharmacology and rigorous trials (artemisinin as proof of concept); (b) a theoretical/diagnostic system (qi, meridians, pattern differentiation) whose empirical support is weak and diagnostic reliability poor (kappa ~0.34); do not treat its categories as validated biology."
        - audience: "Patients / clinicians"
          text: "For chronic pain, migraine/tension headache and nausea, acupuncture is a defensible option; the specific effect is small but real, adverse events are low; set expectations that much of the benefit is contextual."
        - audience: "Patients / consumers"
          text: "Avoid anything containing Aristolochia/aristolochic acid, ephedra, and He Shou Wu taken without hepatic monitoring; avoid products with animal parts from endangered species. Prefer products from jurisdictions with statutory quality control (e.g. Australia's TGA/AHPRA regime, EU THMPD registration) over US DSHEA-regulated supplements."
        - audience: "Readers evaluating evidence"
          text: "Discount efficacy claims resting solely on Chinese-language trials given the near-universal positivity rate; require independent, non-Chinese replication or Cochrane-grade evidence."
        - audience: "Policymakers"
          text: "ICD-11 Chapter 26 coding should remain strictly optional and never used for mortality; regulation should prioritize pharmacovigilance, adulteration testing, and species protection."
      citations: []
