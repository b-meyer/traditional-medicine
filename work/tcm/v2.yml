    positions:
      status: filled
      value:
        - scholar: "Kim Taylor"
          work: "Chinese Medicine in Early Communist China, 1945-63: A Medicine of Revolution"
          year: 2005
          position: "'TCM' as a standardized entity was invented in the 1950s PRC nation-building project; the adjective 'traditional' is a mid-1950s coinage, first used only in English-language PRC press literature"
          evidence_base: "Archival evidence of 1950s institution-building and terminology"
        - scholar: "Paul Unschuld"
          work: null
          year: null
          position: "Emphasizes textual layering and the degree to which modern practice is a selective reconstruction"
          evidence_base: "Textual history of the canon"
        - scholar: "Sean Hsiang-lin Lei"
          work: "Neither Donkey nor Horse: Medicine in the Struggle over China's Modernity"
          year: null
          position: "Locates the decisive transformations in the Republican era; 'mongrel medicine' as a double betrayal of both parent traditions; the bian bing/bian zheng tension is a modern historical product"
          evidence_base: "Republican-era reform debates and institutional history"
        - scholar: "Bridie Andrews"
          work: "The Making of Modern Chinese Medicine, 1850–1960"
          year: null
          position: "Locates the decisive transformations in the Republican era; Japanese scientization and kanpō preservation shaped Chinese debates"
          evidence_base: "History of Republican and Japan-trained reformers"
        - scholar: "Eric Karchmer"
