    nosology:
      status: filled
      value: "The diagnostic-therapeutic unit is the zheng (pattern/syndrome), reached through bian zheng lunzhi (pattern differentiation and treatment determination). A biomedical disease (bing) may correspond to several patterns, and one pattern may span several diseases. Lei traces the bian bing/bian zheng construction to Republican- and Communist-era reconciliation. ICD-11 Chapter 26 codes 150 TM disorders and 196 patterns, distinguishing disorders from patterns, as an optional subclassification paired with a Chapters 1–24 code."
      citations:
        - source: "S8 — Neither Donkey nor Horse, Lei (University of Chicago Press) — https://press.uchicago.edu/ucp/books/book/chicago/N/bo18610904.html"
          type: catalog-listing
