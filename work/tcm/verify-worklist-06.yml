- path: safety.adulteration_and_contamination
  source_report: v2
  value: TCM products repeatedly found adulterated with lead, arsenic, mercury and undeclared pharmaceuticals
    (corticosteroids, sildenafil, etc.). Balkan endemic nephropathy linked to Aristolochia clematitis
    seeds in wheat (contamination outside TCM use).
  weak_citations:
  - source: none given in report for the adulteration claim
    type: unclear
    citation_strength: unclear
- path: safety.intrinsic_toxicity
  source_report: v2
  value:
  - agent: Aristolochia / aristolochic acid
    mechanism_class: plant toxin
    description: Aristolochic acid nephropathy and urothelial cancer; aristolactam-DNA adducts producing
      A:T to T:A TP53 transversion signature (COSMIC signature 22); 40-46% of Belgian cohort later developed
      urinary tract carcinoma.
  - agent: Ephedra (ma huang)
    mechanism_class: plant toxin
    description: Strokes, myocardial infarction, sudden death, liver injury.
  - agent: He Shou Wu (Polygonum multiflorum) and others (Ba Jiao Lian, Chi R Yun, Jin Bu Huan)
    mechanism_class: plant toxin
    description: Herb-induced liver injury, hepatocellular and cholestatic.
  - agent: Acupuncture needling
    mechanism_class: procedural
    description: Pneumothorax, nerve injury, infections including hepatitis and bacterial infections from
      non-sterile needling; serious events relatively rare.
  - agent: Undeclared corticosteroids, sildenafil in products
    mechanism_class: pharmaceutical adulterant
    description: See adulteration leaf.
  weak_citations:
  - source: ma-huang_ephedra TUSOM Pharmwiki [S43]
    type: open-encyclopedia
    citation_strength: indirect
- path: safety.documented_adverse_events
  source_report: v2
  value:
  - 'Belgian slimming-clinic cohort, early 1990s: rapidly progressive interstitial nephritis; 40-46% later
    urinary tract carcinoma'
  - 'Taiwan: about one-third of population prescribed Aristolochia-containing remedies; highest incidence
    of upper-urinary-tract urothelial carcinoma in the world; PNAS 2012, 151 patients, adducts in 83%
    of those with signature mutations'
  - Ephedra poisonings fell after FDA ban (NEJM 2015)
  - He Shou Wu liver injury (NIH LiverTox; case reports)
  weak_citations:
  - source: 'aristolochic acid nephropathy: Topics by Science.gov [S41]'
    type: aggregator
    citation_strength: indirect
- path: safety.regulatory_actions_taken
  source_report: v2
  value:
  - FDA ban on ephedrine-alkaloid dietary supplements effective April 2004, upheld by US Court of Appeals
    2006
  - Aristolochia bans 'in many countries' (dates not given)
  - World Federation of Chinese Medicine Societies removed tiger bone and rhino horn from its pharmacopeia
    (tiger removed 1993)
  - China banned tiger-bone and rhino-horn trade in mid-1990s
  - CITES Appendix I listing of pangolins; pangolin scales remained in the official state Pharmacopoeia
  weak_citations:
  - source: ma-huang_ephedra TUSOM Pharmwiki [S43]
    type: open-encyclopedia
    citation_strength: indirect
