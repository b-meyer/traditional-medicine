- path: contemporary_controversies.who_engagement
  source_report: v2
  value: 'WHO Traditional Medicine Strategy 2014-2023: countries with T&CM legal/regulatory framework
    rose from 79 (2012) to 109 (2018); 98 with national T&CM policy; 170 acknowledged T&CM use. WHO Global
    Traditional Medicine Strategy 2025-2034 adopted by 78th World Health Assembly, May 2025 (vision: universal
    access to safe, effective, people-centred traditional, complementary and integrative medicine). ICD-11
    Chapter 26 approved at WHA 2019 (150 disorders, 196 patterns, optional). Nature 5 June 2019 editorial
    and Scientific American ''Bad Idea'' 2019 opposed it; defenders said opposition ''lacked peer review''
    and was a ''slandering campaign''. WHO ICD chapter and conservationist pressure on WHO over animal
    products.'
  weak_citations:
  - source: 'Overview: WHO Traditional Medicine Strategy 2014-2023 (Modern Ghana) [S19]'
    type: news
    citation_strength: indirect
    claim_match: mismatch
