- path: contemporary_controversies.conservation_and_sourcing
  source_report: v2
  value: 'Demand for pangolin scales, rhino horn, tiger bone, bear bile drives illegal wildlife trade.
    Pangolins: IUCN estimates over 1 million illegally traded 2000-2013; WWF estimates 195,000 trafficked
    in 2019 for scales (Challender et al. 2020); CITES Appendix I. Bear bile: World Animal Protection
    states over 20,000 bears on licensed farms in China; Cambridge Animal Welfare study estimates 10,000-12,000,
    mainly Asiatic black bears. Post-COVID debate; pangolin a candidate intermediate host; some in TCM
    promote herbal substitutes.'
  weak_citations:
  - source: none given in report
    type: unclear
    citation_strength: unclear
