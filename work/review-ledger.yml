- id: U09
  system: unani
  path: diagnostics.reliability_evidence
  claim: 'Mojahedi 2014: weighted kappa 0.40 to 0.83 across 39 items (a verify-pass ''correction'' from 0.82)'
  verdict: unresolved
  finding: 'The abstract of Mojahedi et al. (Iran Red Crescent Med J 2014; PMC4005447) says 0.40 to 0.82. The verify
    pass changed it to 0.83 on the strength of something I could not see (full text was blocked by reCAPTCHA). Revert
    to 0.82 unless the results table shows 0.83. Everything else in the entry checks out: 52 items to 47 after content
    validity, 35 volunteers test-retest, 52 volunteers for validity, alpha 0.71, sensitivity/specificity 65/93 warm,
    52/97 cold, 53/67 dry, 53/76 wet.'
  sources:
  - https://pmc.ncbi.nlm.nih.gov/articles/PMC4005447
  action: review_flag added; value not changed.
- id: U10
  system: unani
  path: diagnostics.reliability_evidence
  claim: '2026 kappa study: 350 healthy healthcare workers, kappa 0.512 max and 0.081 min'
  verdict: confirmed
  finding: 'Pirooz, Ghods, Saberi Isfeedvajani (Brieflands, issued 2026-04-30): clinical assessment vs SMQ hotness
    0.512 (CI 0.422-0.602); vs MMQ coldness 0.512 (CI 0.368-0.656); lowest 0.081 (CI -0.023 to 0.185) for dryness/wetness
    balance; questionnaire vs questionnaire 0.132-0.366. Design is one specialist''s judgment against questionnaires,
    not clinician against clinician.'
  sources:
  - https://repository.brieflands.com/items/6b6fbf6e-9b86-4646-b23c-944f803ee9a7
  action: null
