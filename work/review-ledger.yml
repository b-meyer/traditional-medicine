- id: U04
  system: unani
  path: revival_and_institutionalization.dated_events
  claim: 'Tibbia College: foundation stone 1916 (Lord Hardinge), inaugurated 1921 by Gandhi'
  verdict: confirmed
  finding: Foundation stone 29 March 1916 by Viceroy Hardinge; inaugurated 13 February 1921 by Gandhi. Institution's
    own site and the Delhi Directorate of AYUSH agree. The madrasa it grew from dates to 1883 (formally opened 1889)
    under Hakim Abdul Majeed Khan.
  sources:
  - https://autch.delhi.gov.in/autch/about-us
  - https://autch.delhi.gov.in/autch/history
  - https://ayush.delhi.gov.in/ayush/ayurvedic-and-unani-tibbia-college-and-hospital
  action: null
- id: U05
  system: unani
  path: revival_and_institutionalization.dated_events
  claim: Ajmal Khan as President of the Indian National Congress, 1921
  verdict: confirmed_with_nuance
  finding: He presided at the Ahmedabad session (Dec 1921) in place of the jailed C. R. Das. The INC's own page
    lists him as 'Acting President for C.R. Das'. The college site says 'elected President', which overstates it
    slightly.
  sources:
  - https://inc.in/leadership/past-party-presidents/hakim-ajmal-khan-acting-president-for-c-r-das
  - https://inc.in/brief-history-of-congress/1915-1925
  action: Event description set to 'acting president'.
- id: U06
  system: unani
  path: identification.practitioner_estimate
  claim: 'India: 47,683 registered Unani practitioners (Rajya Sabha reply, 2015, via press)'
  verdict: updated
  finding: 'Primary figure now available and more recent: 50,053 registered Unani practitioners as on 01.01.2022
    (State/UT Boards/Councils), Lok Sabha USQ 1240 (9 Feb 2024) and USQ 1858 (2 Aug 2024), Annexure I. Five states
    hold 79%: Uttar Pradesh 15,730; Maharashtra 7,882; Bihar 5,423; West Bengal 5,325; Telangana 5,187. The 2015
    figure was not retrieved from its primary and is kept but marked superseded.'
  sources:
  - https://eparlib.nic.in/bitstream/123456789/2974061/1/AU1240.pdf
  - https://eparlib.nic.in/bitstream/123456789/2979017/1/AU1858_XBNSfn.pdf
  action: 2022 entry added; 2015 entry flagged superseded.
- id: U07
  system: unani
  path: education_and_licensure.degree_programs
  claim: 55 Unani colleges (of 733 AYUSH institutes), no year
  verdict: updated
  finding: 57 Unani colleges (of 847 AYUSH colleges) as on 01.04.2022, Lok Sabha USQ 1858 Annexure II. The 55-of-733
    snapshot is an older undated reply. Also 1,762 Unani dispensaries (1,721 state plus 41 central) on the same
    date.
  sources:
  - https://eparlib.nic.in/bitstream/123456789/2979017/1/AU1858_XBNSfn.pdf
  action: College count replaced with dated primary figure.
