- id: T02
  system: tcm
  path: legal_status.jurisdictions
  claim: 'Australia: Health Practitioner Regulation National Law, year 2012'
  verdict: corrected
  finding: 'The National Law came into effect 1 July 2010. Chinese medicine joined the national scheme on 1 July
    2012, so the extraction''s single year conflates two dates. Before 2012 only Victoria regulated Chinese medicine.
    Registered practitioners: 3,804 at launch, 4,795 at March 2022.'
  sources:
  - https://chinesemedicineboard.gov.au/registration
  - https://www.chinesemedicineboard.gov.au/Codes-Guidelines/FAQ/Overview-National-Scheme.aspx
  - https://chinesemedicineboard.gov.au/News/2022-07-01-10-year-anniversary.aspx
  action: Year field corrected to two dates; scope note extended.
- id: T03
  system: tcm
  path: legal_status.jurisdictions
  claim: 'Malaysia: Traditional and Complementary Medicine Act 2016'
  verdict: confirmed_with_nuance
  finding: Act 775 gazetted 10 March 2016, partly in force 1 August 2016. The T&CM Council was constituted under
    section 4 and first met 16 January 2017. Practitioner registration only opened 15 March 2021. Recognised practice
    areas include Traditional Chinese Medicine and Traditional Indian Medicine (so it covers Ayurveda too), but
    not Unani.
  sources:
  - https://hq.moh.gov.my/tcm/en/index.php/akta-pt-k-2016/council
  - https://hq.moh.gov.my/tcm/en/index.php/faqregistration
  - https://hq.moh.gov.my/tcm/en/index.php/notification
  action: Regulator filled; registration date noted.
- id: T04
  system: tcm
  path: disruption.suppression_or_marginalization
  claim: '''Outlawed along with other traditional medicine under the 1929 proposals''; abolition outcome ''not stated'''
  verdict: corrected
  finding: Not outlawed. At the Nanjing government's National Public Health Conference (Feb 1929), Yu Yan (Yu Yunxiu)
    put forward a proposal to abolish 'old medicine'. Practitioners protested in Shanghai on 17 March 1929 (later
    National Medicine Day). The Nanjing government rescinded the abolition proposal in December 1929 on Chiang Kai-shek's
    order. A 2026 paper warns the episode is often misread as an effective ban. One popular Substack claims the
    proposal passed and 'severely limited' practice; better sources contradict it.
  sources:
  - https://en.apu.ac.jp/rcaps/uploads/fckeditor/publications/journal/RJAPS_V27_Fan.pdf
  - https://gera.fr/wp-content/uploads/2026/04/nguyen-100231.pdf
  - https://en.wikipedia.org/wiki/Yu_Yan_(physician)
  action: Suppression text, abolition outcome and dated events corrected.
- id: T05
  system: tcm
  path: safety.regulatory_actions_taken
  claim: Aristolochia bans 'in many countries' (dates not given)
  verdict: confirmed_with_nuance
  finding: 'Dated actions now sourced: Belgian cluster identified in Brussels in 1992; FDA warnings in 2000-2001
    plus an import alert; Canada ordered products off shelves in 2001 and reissued a warning in 2004; UK banned
    Aristolochia in 2001; the Netherlands prohibited aristolochic acid in herbal preparations in 2001; Hong Kong
    published a brand list. China''s 2003 removal of Guan mu tong rests only on an industry-association page and
    stays weakly sourced. Other items in this leaf (ephedra ban, tiger bone, CITES) were not checked.'
  sources:
  - https://www.cmaj.ca/content/cmaj/171/5/449.full.pdf
  - https://link.springer.com/article/10.1007/s00216-007-1310-3
  - https://reliasmedia.com/articles/15889-aristolochic-acid-and-renal-toxicity
  - https://www.foodnavigator.com/Article/2001/04/18/FDA-issues-warning-over-Chinese-herb
  - https://aaaomonline.org/Research/4231018
  action: Aristolochia item replaced with dated specifics.
- id: T06
  system: tcm
  path: diagnostics.reliability_evidence
  claim: 'Candidate addition: pulse diagnosis study, weighted kappa 0.370, 300 participants'
  verdict: confirmed_with_nuance
  finding: 'Real and worth adding, but with its design attached: Jagwani et al., World J Tradit Chin Med 2023;9(4):415-418.
    Two Indian TCM practitioners, 300 ''participants'' (not stated as patients), 37 distinct diagnoses, matched
    on 116 of 300, weighted kappa 0.370 (not significant), while Cronbach alpha was 0.963. Not currently in the
    TCM extraction, which uses Jacobson 2019 and two Birkeflet studies.'
  sources:
  - https://doaj.org/article/ca95dcc746ee4be490bde7f3a2b0e98d
  action: Not applied; offered as a candidate entry.
- id: A01
  system: ayurveda
  path: identification.practitioner_estimate
  claim: Only Sri Lankan counts recorded; no India figure
  verdict: updated
  finding: 'Filled from the same primary source and date as Unani: 346,240 registered Ayurveda practitioners in
    India as on 01.01.2022 (Lok Sabha USQ 1858, 2 Aug 2024). Also 453 Ayurveda colleges (01.04.2022) and 25,280
    dispensaries. On one basis, AYUSH total is 730,317: Ayurveda 47.4%, homoeopathy 43.9%, Unani 6.9%, Siddha 1.3%,
    naturopathy 0.5%, Sowa-Rigpa under 0.01%.'
  sources:
  - https://eparlib.nic.in/bitstream/123456789/2979017/1/AU1858_XBNSfn.pdf
  action: India 2022 entry added.
- id: A02
  system: ayurveda
  path: diagnostics.reliability_evidence
  claim: 'Kurande 2013: average pairwise weighted kappa 0.07 pulse, 0.17 tongue, 0.28 prakriti'
  verdict: confirmed
  finding: 'Exactly as stated (EBCAM 2013, Art. ID 658275): 15 doctors with 3-15 years'' experience, 20 healthy
    subjects, 105 pairs. Random rating was rejected for only 12 pairs on prakriti, 1 on pulse and 0 on tongue. A
    separate Kurande 2012 poster gives intra-rater pulse kappa 0.42 for one expert on 17 healthy subjects: a different
    design, not poolable with the above.'
  sources:
  - https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3803118/
  - https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3373612/
  action: null
- id: A03
  system: ayurveda
  path: safety.adulteration_and_contamination
  claim: Saper et al. 2004 and 2008 heavy-metal studies
  verdict: confirmed_with_nuance
  finding: 'JAMA 2008;300(8):915-23: 230 products ordered, 193 received, 40 (20.7%) exceeded acceptable daily-intake
    standards for lead, mercury or arsenic; rasa shastra products about twice as likely to contain metals; ''more
    than 80 cases of lead poisoning since 1978''. JAMA 2004;292(23):2868-73: 14 of 70 (20%). Confirmed through secondary
    reports and a university page, not the JAMA abstract itself. The exact 40% vs 17% rasa shastra split was not
    re-checked.'
  sources:
  - https://www.medicalnewstoday.com/articles/119225
  - https://www.nutraceuticalsworld.com/contents/view_breaking-news/2008-08-27/study-reveals-toxic-metals-in-ayurvedic-products/
  - https://staff.washington.edu/chudler/ayur2.html
  action: null
- id: A04
  system: ayurveda
  path: safety.regulatory_actions_taken
  claim: Denmark ashwagandha ban 2023 after 2020 DTU assessment; EU working group June 2024
  verdict: confirmed_with_nuance
  finding: 'Ban confirmed (April 2023, Danish Veterinary and Food Administration, after the 2020 DTU report), and
    the June 2024 EU Heads of Food Safety Agencies recommendation to prioritise an Article 8 procedure. Nuance:
    DTU''s stated concerns were sex hormones and reproduction, thyroid, immune system, metabolism and CNS; liver
    toxicity appears in the 2024 EU list rather than as DTU''s lead concern. The science is contested (Univ. of
    Mississippi NCNPR, J Ethnopharmacol). Sources are trade press; the regulator''s own page was not retrieved.
    Import alerts 66-41 and 99-42, India''s 2005 export testing rule, RIVM and ANSES were not checked.'
  sources:
  - https://www.nutritioninsight.com/key-interviews/regulatory-update-spotlight-on-international-authorities-response-to-ashwagandha-safety-concerns.html
  - https://www.nutraingredients.com/Article/2026/07/06/timeline-will-authorities-de-throne-the-king-of-herbs/
  - https://wholefoodsmagazine.com/articles/16998-researchers-clarifying-concerns-over-ashwagandha-safety
  action: null
