- id: U01
  system: unani
  path: legal_status.jurisdictions
  claim: 'Pakistan: National Council for Tibb under the Unani, Ayurvedic and Homoeopathic Practitioners Act 1965'
  verdict: confirmed
  finding: Act No. II of 1965; NCT is a body corporate under section 3 of the Act. The same Act also created the
    homoeopathy council, so the statute is not Unani-specific.
  sources:
  - http://nasirlawsite.com/laws/uahpa.htm
  - https://www.nct.gov.pk/
  - https://www.emro.who.int/images/stories/about-who/Hamdard_Foundation_Pakistan.pdf
  action: null
- id: U02
  system: unani
  path: legal_status.jurisdictions
  claim: 'Pakistan: 2024 move to merge NCT into a National Council of Traditional, Alternative and Complementary
    Medicine'
  verdict: updated
  finding: Still unresolved as of Feb 2026. Dawn (16 Feb 2026) reports a draft National Traditional and Complementary
    Medicine (NTCAM) Act 2025, colleges told not to admit new students, and practitioner claims that 70,000+ hakeems
    and all 40 tibb colleges are at risk. The Sept 2024 decision date rests on Wikipedia only.
  sources:
  - https://www.dawn.com/news/1967850/uncertainty-clouds-future-of-tibb-colleges-and-hakeems-in-pakistan
  - https://en.wikipedia.org/wiki/National_Council_for_Tibb
  action: Pakistan integration text updated with Feb 2026 status.
- id: U03
  system: unani
  path: legal_status.jurisdictions
  claim: 'South Africa: AHPCSA under Allied Health Professions Act 63 of 1982, year 2001'
  verdict: confirmed_with_nuance
  finding: 'Statute and regulator confirmed; Unani-Tibb is a named profession. The year 2001 could not be sourced
    (the Act is 1982). Registration route: three-year basic medical sciences plus two-year specialisation at the
    University of the Western Cape.'
  sources:
